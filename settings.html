<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Settings - StudentX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        html, body { background-color: #121212; color: #fff; height: 100%; width: 100%; overflow-x: hidden; }
        .header { position: sticky; top: 0; background-color: #121212; padding: 40px 15px 15px; display: flex; align-items: center; border-bottom: 1px solid #2c2c2c; z-index: 100; }
        .back-btn { color: #fff; text-decoration: none; font-size: 20px; margin-right: 15px; }
        .header-title { font-size: 20px; font-weight: bold; }
        .settings-container { padding: 20px 15px 80px; }
        .section-title { color: #8A2BE2; font-size: 14px; font-weight: bold; text-transform: uppercase; margin: 25px 5px 10px; }
        .settings-group { background-color: #1e1e1e; border-radius: 12px; overflow: hidden; border: 1px solid #2c2c2c; }
        .setting-item { display: flex; align-items: center; padding: 15px; text-decoration: none; color: #fff; border-bottom: 1px solid #2c2c2c; cursor: pointer; }
        .setting-item:last-child { border-bottom: none; }
        .setting-icon { width: 35px; height: 35px; background-color: #2c2c2c; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 15px; color: #8A2BE2; font-size: 16px; flex-shrink: 0; }
        .setting-text { flex-grow: 1; font-size: 16px; }
        .setting-arrow { color: #888; font-size: 14px; }
        .appearance-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #2c2c2c; cursor: pointer; }
        .appearance-item:last-child { border-bottom: none; }
        .appearance-left { display: flex; align-items: center; }
        .theme-radio { width: 22px; height: 22px; border: 2px solid #888; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .theme-radio.selected { border-color: #8A2BE2; }
        .theme-radio.selected::after { content: ''; width: 12px; height: 12px; background-color: #8A2BE2; border-radius: 50%; }
        .bnav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; display: flex; justify-content: space-around; align-items: center; background-color: #121212; border-top: 1px solid #2c2c2c; z-index: 2000; }
        .nb { display: flex; flex-direction: column; align-items: center; color: #888; cursor: pointer; gap: 3px; text-decoration: none; }
        .nb.on { color: #fff; }
        .nb i { font-size: 20px; }
        .nb span { font-size: 10px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="header-title">Settings</div>
    </div>

    <div class="settings-container">
        <div class="section-title">Privacy & Security</div>
        <div class="settings-group">
            <div class="setting-item" onclick="window.location.href='close-friends.html'">
                <div class="setting-icon"><i class="fas fa-user-group"></i></div>
                <div class="setting-text">Close Friends</div>
                <i class="fas fa-chevron-right setting-arrow"></i>
            </div>
            <div class="setting-item" onclick="window.location.href='blocked-users.html'">
                <div class="setting-icon"><i class="fas fa-ban"></i></div>
                <div class="setting-text">Blocked Users</div>
                <i class="fas fa-chevron-right setting-arrow"></i>
            </div>
        </div>

        <div class="section-title">Appearance</div>
        <div class="settings-group">
            <div class="appearance-item" onclick="setTheme('dark', this)">
                <div class="appearance-left">
                    <div class="setting-icon"><i class="fas fa-moon"></i></div>
                    <div class="setting-text">Dark Mode</div>
                </div>
                <div class="theme-radio" id="radio-dark"></div>
            </div>
            <div class="appearance-item" onclick="setTheme('light', this)">
                <div class="appearance-left">
                    <div class="setting-icon"><i class="fas fa-sun"></i></div>
                    <div class="setting-text">White Mode</div>
                </div>
                <div class="theme-radio" id="radio-light"></div>
            </div>
            <div class="appearance-item" onclick="setTheme('auto', this)">
                <div class="appearance-left">
                    <div class="setting-icon"><i class="fas fa-circle-half-stroke"></i></div>
                    <div class="setting-text">System Default</div>
                </div>
                <div class="theme-radio" id="radio-auto"></div>
            </div>
        </div>
    </div>

    <nav class="bnav">
        <div class="nb" onclick="window.location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></div>
        <div class="nb" onclick="window.location.href='video.html'"><i class="fas fa-video"></i><span>Video</span></div>
        <div class="nb" onclick="window.location.href='chat.html'"><i class="fas fa-comment-dots"></i><span>Chat</span></div>
        <div class="nb" onclick="window.location.href='studyhub.html'"><i class="fas fa-book-open"></i><span>StudyHub</span></div>
        <div class="nb on" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i><span>Profile</span></div>
    </nav>

    <!-- KIRA THEME.JS DON SA APPEARANCE YA KASANCE A DUKKAN SHAFUFFUKA -->
    <script src="theme.js"></script>
    <script>
        // Wannan ita ce code din da ke sa theme.js ya canja launuka
        function setTheme(theme) {
            applyTheme(theme); // Kira aikin daga theme.js
            
            // Nuna wanda aka zabi a Screen
            document.querySelectorAll('.theme-radio').forEach(r => r.classList.remove('selected'));
            
            if (theme === 'auto') {
                // Idan system default ne, duba wayar dalili ne dark ko light
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
                document.getElementById(isDark ? 'radio-light' : 'radio-dark').classList.add('selected');
            } else {
                document.getElementById('radio-' + theme).classList.add('selected');
            }
        }

        // Sanya selected a lokacin da shafi ya budu
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('studentx-theme') || 'dark';
            setTheme(savedTheme);
        });
    </script>
</body>
</html>
