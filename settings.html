<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Settings - StudentX</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS VARIABLES DON SAUYA LAUNUKA GABAƊAYA */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #fff;
            --text-muted: #888;
            --border-color: #2c2c2c;
            --primary-color: #8A2BE2;
        }

        /* Tsohuwar waya tana amfani da wannan tsari (System Default) */
        @media (prefers-color-scheme: light) {
            :root.auto-theme {
                --bg-color: #f0f2f5;
                --card-bg: #fff;
                --text-color: #050505;
                --text-muted: #65676b;
                --border-color: #e4e6eb;
            }
        }

        /* Idan aka zabi White Mode */
        :root.light-mode {
            --bg-color: #f0f2f5;
            --card-bg: #fff;
            --text-color: #050505;
            --text-muted: #65676b;
            --border-color: #e4e6eb;
        }

        /* Idan aka zabi Dark Mode */
        :root.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #fff;
            --text-muted: #888;
            --border-color: #2c2c2c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- HEADER --- */
        .header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 40px 15px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        .back-btn {
            color: var(--text-color);
            text-decoration: none;
            font-size: 20px;
            margin-right: 15px;
        }
        .header-title {
            font-size: 20px;
            font-weight: bold;
        }

        /* --- SETTINGS GROUPS --- */
        .settings-container {
            padding: 20px 15px 80px;
        }
        .section-title {
            color: var(--primary-color);
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 25px 5px 10px;
        }

        .settings-group {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .setting-item {
            display: flex;
            align-items: center;
            padding: 15px;
            text-decoration: none;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }
        .setting-item:last-child {
            border-bottom: none;
        }
        .setting-item:active {
            background-color: var(--border-color);
        }

        .setting-icon {
            width: 35px;
            height: 35px;
            background-color: var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: var(--primary-color);
            font-size: 16px;
            flex-shrink: 0;
        }

        .setting-text {
            flex-grow: 1;
            font-size: 16px;
        }

        .setting-arrow {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Appearance Radio Buttons */
        .appearance-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }
        .appearance-item:last-child {
            border-bottom: none;
        }
        .appearance-left {
            display: flex;
            align-items: center;
        }
        .theme-radio {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-radio.selected {
            border-color: var(--primary-color);
        }
        .theme-radio.selected::after {
            content: '';
            width: 12px;
            height: 12px;
            background-color: var(--primary-color);
            border-radius: 50%;
        }

        /* --- BOTTOM NAV BAR --- */
        .bnav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            z-index: 2000;
        }
        .nb {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            cursor: pointer;
            gap: 3px;
            text-decoration: none;
        }
        .nb.on { color: var(--text-color); }
        .nb i { font-size: 20px; }
        .nb span { font-size: 10px; font-weight: 500; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <a href="menu.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="header-title">Settings</div>
    </div>

    <div class="settings-container">

        <!-- PRIVACY SECTION -->
        <div class="section-title">Privacy & Security</div>
        <div class="settings-group">
            <div class="setting-item" onclick="window.location.href='close-friends.html'">
                <div class="setting-icon"><i class="fas fa-user-group"></i></div>
                <div class="setting-text">Close Friends</div>
                <i class="fas fa-chevron-right setting-arrow"></i>
            </div>
            <div class="setting-item" onclick="window.location.href='blocked-users.html'">
                <div class="setting-icon"><i class="fas fa-ban"></i></div>
                <div class="setting-text">Blocked Users</div>
                <i class="fas fa-chevron-right setting-arrow"></i>
            </div>
        </div>

        <!-- APPEARANCE SECTION -->
        <div class="section-title">Appearance</div>
        <div class="settings-group">
            <div class="appearance-item" onclick="setTheme('dark')">
                <div class="appearance-left">
                    <div class="setting-icon"><i class="fas fa-moon"></i></div>
                    <div class="setting-text">Dark Mode</div>
                </div>
                <div class="theme-radio" id="radio-dark"></div>
            </div>
            <div class="appearance-item" onclick="setTheme('light')">
                <div class="appearance-left">
                    <div class="setting-icon"><i class="fas fa-sun"></i></div>
                    <div class="setting-text">White Mode</div>
                </div>
                <div class="theme-radio" id="radio-light"></div>
            </div>
            <div class="appearance-item" onclick="setTheme('auto')">
                <div class="appearance-left">
                    <div class="setting-icon"><i class="fas fa-circle-half-stroke"></i></div>
                    <div class="setting-text">System Default</div>
                </div>
                <div class="theme-radio" id="radio-auto"></div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bnav">
        <div class="nb" onclick="window.location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></div>
        <div class="nb" onclick="window.location.href='video.html'"><i class="fas fa-video"></i><span>Video</span></div>
        <div class="nb" onclick="window.location.href='chat.html'"><i class="fas fa-comment-dots"></i><span>Chat</span></div>
        <div class="nb" onclick="window.location.href='studyhub.html'"><i class="fas fa-book-open"></i><span>StudyHub</span></div>
        <div class="nb on" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i><span>Profile</span></div>
    </nav>

    <script>
        // JavaScript don canja Tsari (Theme)

        // 1. Sanya themes akan <html> tag
        function applyTheme(theme) {
            const html = document.documentElement;
            html.classList.remove('dark-mode', 'light-mode', 'auto-theme');
            
            if (theme === 'dark') {
                html.classList.add('dark-mode');
            } else if (theme === 'light') {
                html.classList.add('light-mode');
            } else if (theme === 'auto') {
                html.classList.add('auto-theme');
            }

            // 2. Nuna wanda aka zaɓa a cikin Radio Buttons
            document.querySelectorAll('.theme-radio').forEach(r => r.classList.remove('selected'));
            document.getElementById('radio-' + theme).classList.add('selected');

            // 3. Adana zaɓin a cikin Browser don wasu shafuffuka su kasan shi
            localStorage.setItem('studentx-theme', theme);
        }

        function setTheme(theme) {
            applyTheme(theme);
        }

        // 4. Lokacin da shafi ya buɗe, sai ya duba zaɓin da aka adana
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('studentx-theme') || 'dark'; // Dark default
            applyTheme(savedTheme);
        });
    </script>
</body>
  </html>
