<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Poppins,sans-serif;
    background:#0a0a0f;
    color:#fff;
    padding-bottom:70px;
}


/* =========================
   HEADER
========================= */

.header{

    position:sticky;
    top:0;
    z-index:100;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(10,10,15,.96);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.header-title{

    font-size:24px;
    font-weight:800;
}

.menu-btn{

    width:42px;
    height:42px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.08);

    color:#aaa;

    font-size:18px;
}


/* =========================
   COVER
========================= */

.cover{

    width:100%;
    height:150px;

    background:
        linear-gradient(
            90deg,
            #008751 33.33%,
            #ffffff 33.33%,
            #ffffff 66.66%,
            #008751 66.66%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.cover span{

    color:#008751;

    font-size:30px;

    font-weight:800;

    letter-spacing:2px;
}


/* =========================
   PROFILE AREA
========================= */

.profile-info{

    padding:55px 20px 0;

    position:relative;
}


/* =========================
   AVATAR
========================= */

.avatar-box{

    position:absolute;

    top:-42px;
    left:20px;

    width:84px;
    height:84px;

    border-radius:50%;

    border:4px solid #0a0a0f;

    background:#181832;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;
}

.avatar-box img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.avatar-initials{

    color:#a855f7;

    font-size:28px;

    font-weight:800;
}


/* =========================
   PROFILE NAME
========================= */

.name-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

.profile-name{

    font-size:20px;

    font-weight:800;

    word-break:break-word;
}

.verified{

    color:#a855f7;

    font-size:14px;
}


/* =========================
   USERNAME
========================= */

.profile-username{

    margin-top:3px;

    color:rgba(255,255,255,.4);

    font-size:13px;
}


/* =========================
   BIO
========================= */

.profile-bio{

    margin-top:12px;

    color:rgba(255,255,255,.65);

    font-size:13px;

    line-height:1.6;
}


/* =========================
   STATS
========================= */

.stats{

    display:flex;

    margin-top:20px;

    padding:15px 0;

    border-top:
        1px solid rgba(255,255,255,.06);

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.stat{

    flex:1;

    text-align:center;
}

.stat:not(:last-child){

    border-right:
        1px solid rgba(255,255,255,.06);
}

.stat-number{

    font-size:17px;

    font-weight:800;
}

.stat-label{

    margin-top:2px;

    font-size:10px;

    color:rgba(255,255,255,.35);

    text-transform:uppercase;
}


/* =========================
   EDIT BUTTON
========================= */

.edit-btn{

    width:100%;

    margin-top:15px;

    padding:13px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7
        );

    color:#fff;

    font-family:Poppins,sans-serif;

    font-size:14px;

    font-weight:700;
}


/* =========================
   TABS
========================= */

.tabs{

    display:flex;

    margin-top:18px;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.tab{

    flex:1;

    padding:13px;

    text-align:center;

    color:rgba(255,255,255,.35);

    font-size:13px;

    font-weight:600;
}

.tab.active{

    color:#a855f7;

    border-bottom:
        2px solid #a855f7;
}


/* =========================
   POSTS
========================= */

.posts-container{

    padding:16px;
}

.loading{

    padding:40px 20px;

    text-align:center;

    color:rgba(255,255,255,.4);

    font-size:13px;
}

.empty-posts{

    color:rgba(255,255,255,.3);
}

.empty-posts i{

    margin-bottom:10px;

}


/* =========================

========================= */

.bnav{

    left:0;

    height:64px;

    display:flex;

    align-items:center;
    justify-content:space-around;

.nb{

}

}

========================= */

}

.p-hdr{

}

.p-av{

}

.p-meta{

}

.p-body{

    font-size:13px;

    word-break:break-word;
}

.p-acts{

    display:flex;

    align-items:center;

    border-top:

.p-a{

    align-items:center;

.profile-loading{

/* =========================
   IMAGE VIEW
========================= */

.view-ov{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.95);

.view-ov img{

.view-close{

    height:42px;

    display:flex;
    align-items:center;

}

<script>

const SUPABASE_URL =
    "https://acragelglvdnqhvbjcgx.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_O2kgvCZ8CxPKghH7MJn7nw_R-l61YuH";

<script>

/* =========================================================
   STUDENTX PROFILE — PART 3
   LOAD CURRENT USER PROFILE
========================================================= */

let currentUser = null;
let currentProfile = null;


/* =========================================================
   GET CURRENT USER
========================================================= */

async function getCurrentUser() {

    try {

        const {
            data: {
                user
            },
            error
        } = await supabaseClient.auth.getUser();

        if (error) {
            console.error("Auth error:", error);
            return null;
        }

        if (!user) {
            console.log("No logged-in user");
            return null;
        }

        currentUser = user;

        return user;

    } catch (error) {

        console.error(
            "Failed to get current user:",
            error
        );

        return null;
    }
}


/* =========================================================
   LOAD PROFILE FROM SUPABASE
========================================================= */

async function loadProfile() {

    try {

        const user = await getCurrentUser();

        if (!user) {

            setProfileLoadingState(
                "Please login first"
            );

            return;
        }


        /* -----------------------------------------
           GET PROFILE
        ----------------------------------------- */

        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select(`
                id,
                username,
                avatar_url,
                full_name,
                bio,
                university,
                department,
                verified,
                created_at,
                email,
                account_type,
                country,
                state,
                city,
                profile_visibility,
                premium_plan,
                cover_url,
                faculty,
                level,
                graduation_year
            `)
            .eq("id", user.id)
            .maybeSingle();


        /* -----------------------------------------
           ERROR
        ----------------------------------------- */

        if (error) {

            console.error(
                "Profile loading error:",
                error
            );

            setProfileLoadingState(
                "Unable to load profile"
            );

            return;
        }


        /* -----------------------------------------
           PROFILE NOT FOUND
        ----------------------------------------- */

        if (!data) {

            console.log(
                "Profile does not exist for this user."
            );

            setProfileLoadingState(
                "Profile not found"
            );

            return;
        }


        /* -----------------------------------------
           SAVE PROFILE
        ----------------------------------------- */

        currentProfile = data;


        /* -----------------------------------------
           UPDATE PROFILE UI
        ----------------------------------------- */

        updateProfileUI(data);


        console.log(
            "StudentX profile loaded:",
            data
        );

    } catch (error) {

        console.error(
            "Unexpected profile error:",
            error
        );

        setProfileLoadingState(
            "Something went wrong"
        );
    }
}


/* =========================================================
   UPDATE PROFILE UI
========================================================= */

function updateProfileUI(profile) {


    /* -----------------------------------------
       FULL NAME
    ----------------------------------------- */

    const nameElement =
        document.getElementById("profileName");

    if (nameElement) {

        const displayName =
            profile.full_name ||
            "StudentX User";

        nameElement.innerHTML =
            escapeHTML(displayName) +
            getIdentityBadge(profile);
    }


    /* -----------------------------------------
       USERNAME
    ----------------------------------------- */

    const usernameElement =
        document.getElementById("profileUsername");

    if (usernameElement) {

        if (profile.username) {

            usernameElement.textContent =
                "@" + profile.username;

        } else {

            usernameElement.textContent =
                "@username";
        }
    }


    /* -----------------------------------------
       BIO
    ----------------------------------------- */

    const bioElement =
        document.getElementById("profileBio");

    if (bioElement) {

        bioElement.textContent =
            profile.bio ||
            "No bio yet.";
    }


    /* -----------------------------------------
       AVATAR
    ----------------------------------------- */

    updateAvatar(profile);


    /* -----------------------------------------
       COVER
    ----------------------------------------- */

    updateCover(profile);


    /* -----------------------------------------
       VERIFIED
    ----------------------------------------- */

    updateVerifiedBadge(profile);
}


/* =========================================================
   UPDATE AVATAR
========================================================= */

function updateAvatar(profile) {

    const avatarBox =
        document.getElementById("avatarBox");

    const initials =
        document.getElementById("avatarInitials");

    if (!avatarBox) {
        return;
    }


    /* -----------------------------------------
       IF AVATAR EXISTS
    ----------------------------------------- */

    if (profile.avatar_url) {

        avatarBox.style.backgroundImage =
            `url("${profile.avatar_url}")`;

        avatarBox.style.backgroundSize =
            "cover";

        avatarBox.style.backgroundPosition =
            "center";

        avatarBox.style.backgroundRepeat =
            "no-repeat";


        if (initials) {
            initials.style.display =
                "none";
        }

    } else {

        /* -------------------------------------
           NO AVATAR → INITIALS
        ------------------------------------- */

        avatarBox.style.backgroundImage =
            "none";

        if (initials) {

            initials.style.display =
                "flex";

            initials.textContent =
                getInitials(
                    profile.full_name
                );
        }
    }
}


/* =========================================================
   GET USER INITIALS
========================================================= */

function getInitials(name) {

    if (!name) {
        return "--";
    }

    const words =
        name
            .trim()
            .split(/\s+/)
            .filter(Boolean);

    if (words.length === 1) {

        return words[0]
            .substring(0, 2)
            .toUpperCase();
    }

    return (
        words[0].charAt(0) +
        words[words.length - 1].charAt(0)
    ).toUpperCase();
}


/* =========================================================
   UPDATE COVER
========================================================= */

function updateCover(profile) {

    const cover =
        document.getElementById("coverDisplay");

    const coverText =
        document.getElementById("coverText");

    if (!cover) {
        return;
    }


    if (profile.cover_url) {

        cover.style.backgroundImage =
            `url("${profile.cover_url}")`;

        cover.style.backgroundSize =
            "cover";

        cover.style.backgroundPosition =
            "center";

        cover.style.backgroundRepeat =
            "no-repeat";


        if (coverText) {
            coverText.style.display =
                "none";
        }

    } else {

        cover.style.backgroundImage =
            "none";

        if (coverText) {

            coverText.style.display =
                "block";

            coverText.textContent =
                profile.country ||
                "Nigeria";
        }
    }
}


/* =========================================================
   VERIFIED BADGE
========================================================= */

function updateVerifiedBadge(profile) {
    const nameElement = document.getElementById("profileName");
    if (!nameElement) return;

    const displayName =
        profile?.full_name ||
        "StudentX User";

    nameElement.innerHTML =
        escapeHTML(displayName) +
        getIdentityBadge(profile);
}


/* =========================================================
   LOADING / ERROR STATE
========================================================= */

function setProfileLoadingState(message) {

    const name =
        document.getElementById(
            "profileName"
        );

    const username =
        document.getElementById(
            "profileUsername"
        );

    const bio =
        document.getElementById(
            "profileBio"
        );


    if (name) {
        name.textContent = message;
    }

    if (username) {
        username.textContent = "";
    }

    if (bio) {
        bio.textContent = "";
    }
}


/* =========================================================
   START PROFILE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProfile();

    }
);

</script>

<script>

    if (!currentUser) {

    const userId = currentUser.id;


    /* =====================================================

    ===================================================== */

    try {

        const {

    async function toggleProfileLike(
    postId
) {

    if (!currentUser) {

        alert(
            "Please login first."
        );

        return;
    }


    const action =
        document.getElementById(
            "like-" + postId
        );

    const countElement =
        document.getElementById(
            "like-count-" + postId
        );

    if (!action || !countElement) {
        return;
    }


    action.style.pointerEvents =
        "none";


    try {

        /* -----------------------------------------
           CHECK EXISTING LIKE
        ----------------------------------------- */

        const {
            data: existingLike,
            error: checkError
        } = await supabaseClient
            .from("likes")
            .select("id")
            .eq(
                "post_id",
                postId
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


        if (checkError) {

            console.error(
                "Check like error:",
                checkError
            );

            alert(
                checkError.message
            );

            return;
        }


        /* -----------------------------------------
           REMOVE LIKE
        ----------------------------------------- */

        if (existingLike) {

            const {
                error
            } = await supabaseClient
                .from("likes")
                .delete()
                .eq(
                    "id",
                    existingLike.id
                );


            if (error) {

                console.error(
                    "Unlike error:",
                    error
                );

                alert(
                    error.message
                );

                return;
            }


            setProfilePostLiked(
                postId,
                false
            );


        }

        /* -----------------------------------------
           ADD LIKE
        ----------------------------------------- */

        else {

            const {
                error
            } = await supabaseClient
                .from("likes")
                .insert({

                    post_id:
                        postId,

                    user_id:
                        currentUser.id

                });


            if (error) {

                console.error(
                    "Like error:",
                    error
                );

                alert(
                    error.message
                );

                return;
            }


            setProfilePostLiked(
                postId,
                true
            );
        }


        /* -----------------------------------------
           REFRESH COUNT
        ----------------------------------------- */

        const {
            count,
            error: countError
        } = await supabaseClient
            .from("likes")
            .select("id", {
                count: "exact",
                head: true
            })
            .eq(
                "post_id",
                postId
            );


        if (!countError) {

            countElement.textContent =
                formatNumber(count || 0);
        }


    } catch (error) {

        console.error(
            "Toggle like error:",
            error
        );

        alert(
            "Unable to update like."
        );

    } finally {

        action.style.pointerEvents =
            "";
    }
    }

/* =========================================================
   NUMBER FORMATTER
========================================================= */

function formatNumber(number) {

    number =
        Number(number) || 0;


    if (number >= 1000000000) {

        return (
            (number / 1000000000)
                .toFixed(1)
                .replace(".0", "")
            + "B"
        );
    }


    if (number >= 1000000) {

        return (
            (number / 1000000)
                .toFixed(1)
                .replace(".0", "")
            + "M"
        );
    }


    if (number >= 1000) {

        return (
            (number / 1000)
                .toFixed(1)
                .replace(".0", "")
            + "K"
        );
    }


    return number.toString();
}


/* =========================================================
   DATE FORMATTER
========================================================= */

function formatPostDate(date) {

    if (!date) {
        return "";
    }


    const d =
        new Date(date);


    if (isNaN(d.getTime())) {
        return "";
    }


    return d.toLocaleDateString(
        "en-NG",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );
}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   ATTRIBUTE SECURITY
========================================================= */

function escapeAttribute(value) {

    return String(value)
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );
}

/* =========================================================

function validateImage(
    file
) {

    if (!file) {
        return false;
    }


    if (!file.type.startsWith(
        "image/"
    )) {

        alert(
            "Please select an image."
        );

        return false;
    }


    const maxSize =
        5 * 1024 * 1024;


    if (
        file.size >

    ) {

        );

        return false;
    }


    return true;

<script>
/*
   Supabase tables used here:
   bookmarks(id, post_id, video_id, user_id, created_at)
   comments(id, post_id, user_id, content, created_at)
   reposts(id, post_id, user_id, created_at)

   Videos are read from:
   videos
   Expected at minimum: id, user_id, created_at
   The video URL can be stored in one of these common fields:
   video_url, url, file_url, video_path, file_path, storage_path.
*/

const BOOKMARKS_TABLE = "bookmarks";
const COMMENTS_TABLE = "comments";
const REPOSTS_TABLE = "reposts";
const VIDEOS_TABLE = "videos";
const VIDEO_BUCKET = "videos";

function sxEscape(v){ return escapeHTML(v ?? ""); }
function sxDate(v){ return formatPostDate(v); }

async function sxCount(table, postId){
    const {count, error} = await supabaseClient
        .from(table)
        .select("id", {count:"exact", head:true})
        .eq("post_id", postId);

    return error ? 0 : (count || 0);
}


/* =========================================================
   ONE IDENTITY BADGE
   Priority: Premium Plus > Premium > Verified
========================================================= */

function getIdentityBadge(user) {
    if (!user) return "";

    if (user.premium_plan === "plus") {
        return `<span class="studentx-badge premium-plus-badge"
                    title="StudentX Premium Plus"
                    aria-label="StudentX Premium Plus Verified">✓</span>`;
    }

    if (user.premium_plan === "standard") {
        return `<span class="studentx-badge premium-badge"
                    title="StudentX Premium"
                    aria-label="StudentX Premium Verified">✓</span>`;
    }

    if (user.verified === true) {
        return `<span class="studentx-badge premium-badge"
                    title="Verified StudentX account"
                    aria-label="Verified StudentX account">✓</span>`;
    }

    return "";
}


/* =========================================================
   POST META + BOOKMARK
========================================================= */

async function loadProfilePostMeta(postId){
    const [comments, reposts, bookmarked] = await Promise.all([
        sxCount(COMMENTS_TABLE, postId),
        sxCount(REPOSTS_TABLE, postId),
        currentUser
            ? supabaseClient.from(BOOKMARKS_TABLE)
                .select("id")
                .eq("post_id", postId)
                .eq("user_id", currentUser.id)
                .maybeSingle()
            : Promise.resolve({data:null})
    ]);

    const article = document.querySelector(
        `[data-post-id="${CSS.escape(String(postId))}"]`
    );

    if (!article) return;

    const acts = article.querySelectorAll(".p-acts .p-a");

    if (acts[1]?.querySelector("span")) {
        acts[1].querySelector("span").textContent = formatNumber(comments);
    }

    if (acts[2]?.querySelector("span")) {
        acts[2].querySelector("span").textContent = formatNumber(reposts);
    }

    const bookmarkButton = acts[3];

    if (bookmarkButton) {
        const isBookmarked = !!bookmarked?.data;

        bookmarkButton.classList.toggle(
            "sx-active",
            isBookmarked
        );

        const icon = bookmarkButton.querySelector("i");

        if (icon) {
            icon.className = isBookmarked
                ? "fas fa-bookmark"
                : "far fa-bookmark";
        }

        bookmarkButton.onclick = () =>
            toggleProfileBookmark(postId);
    }
}

async function toggleProfileBookmark(postId){
    if (!currentUser) {
        alert("Please login first.");
        return;
    }

    const {
        data: existing,
        error: checkError
    } = await supabaseClient
        .from(BOOKMARKS_TABLE)
        .select("id")
        .eq("post_id", postId)
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (checkError) {
        console.error(checkError);
        alert("Bookmarks are not available yet. Check the bookmarks table.");
        return;
    }

    if (existing) {
        const {error} = await supabaseClient
            .from(BOOKMARKS_TABLE)
            .delete()
            .eq("id", existing.id);

        if (error) {
            alert(error.message);
            return;
        }
    } else {
        const {error} = await supabaseClient
            .from(BOOKMARKS_TABLE)
            .insert({
                post_id: postId,
                user_id: currentUser.id
            });

        if (error) {
            alert(error.message);
            return;
        }
    }

    await loadProfilePostMeta(postId);

    if (document.getElementById("savedView")?.style.display !== "none") {
        loadSavedContent();
    }
}


/* =========================================================
   VIDEO URL HELPER
========================================================= */

function getVideoUrl(video) {
    const value =
        video?.video_url ||
        video?.url ||
        video?.file_url ||
        video?.video_path ||
        video?.file_path ||
        video?.storage_path ||
        "";

    if (!value) return "";

    if (/^https?:\/\//i.test(value)) {
        return value;
    }

    try {
        const {data} = supabaseClient
            .storage
            .from(VIDEO_BUCKET)
            .getPublicUrl(value);

        return data?.publicUrl || "";
    } catch (e) {
        return "";
    }
}

/* =========================================================
   CREATE VIDEO CARD
========================================================= */

function createProfileVideoCard(video) {
    const card = document.createElement("article");
    card.className = "sx-video-card";
    card.dataset.videoId = video.id || "";

    const profile = currentProfile || {};
    const name =
        profile.full_name ||
        "StudentX User";

    const username =
        profile.username
            ? "@" + profile.username
            : "@username";

    const avatar =
        profile.avatar_url || "";

    const videoUrl = getVideoUrl(video);

    let avatarHTML = "";

    if (avatar) {
        avatarHTML =
            `<img src="${escapeAttribute(avatar)}" alt="Profile">`;
    } else {
        avatarHTML =
            escapeHTML(
                name.charAt(0).toUpperCase()
            );
    }

    const caption =
        video.caption ||
        video.description ||
        "";

    const date =
        video.created_at ||
        video.Create_at ||
        "";

    card.innerHTML = `
        <div class="sx-video-head">
            <div class="sx-video-avatar">
                ${avatarHTML}
            </div>

            <div>
                <div class="sx-video-name">
                    ${escapeHTML(name)}
                    ${getIdentityBadge(profile)}
                </div>

                <div class="sx-video-meta">
                    ${escapeHTML(username)}
                    ·
                    ${escapeHTML(sxDate(date))}
                </div>
            </div>
        </div>

        ${
            videoUrl
                ? `<video
                        class="sx-video-player"
                        src="${escapeAttribute(videoUrl)}"
                        controls
                        playsinline
                        preload="metadata"
                    ></video>`
                : `<div class="sx-empty">Video file URL was not found.</div>`
        }

        ${
            caption
                ? `<div class="sx-video-caption">${escapeHTML(caption)}</div>`
                : ""
        }
    `;

    return card;
}


/* =========================================================
   SAVED CONTENT — POSTS + VIDEOS
========================================================= */

async function loadSavedContent(){
    const view = document.getElementById("savedView");

    if (!view || !currentUser) return;

    view.innerHTML =
        '<div class="sx-loading">Loading saved posts and videos...</div>';

    try {
        /*
         * Load the flexible bookmark rows first. Selecting * means this
         * works whether the table has post_id, video_id, or both.
         */
        const {
            data: marks,
            error: marksError
        } = await supabaseClient
            .from(BOOKMARKS_TABLE)
            .select("*")
            .eq("user_id", currentUser.id)
            .order("created_at", {ascending:false});

        if (marksError) throw marksError;

        if (!marks?.length) {
            view.innerHTML =
                '<div class="sx-empty"><i class="far fa-bookmark"></i><div>No saved posts or videos</div></div>';
            return;
        }

        const postIds = [
            ...new Set(
                marks
                    .map(x => x.post_id)
                    .filter(Boolean)
            )
        ];

        const videoIds = [
            ...new Set(
                marks
                    .map(x => x.video_id)
                    .filter(Boolean)
            )
        ];

        const postPromise = postIds.length
            ? supabaseClient
                .from(POSTS_TABLE)
                .select("id, User_id, content, image_url, Like, Create_at")
                .in("id", postIds)
            : Promise.resolve({data:[], error:null});

        const videoPromise = videoIds.length
            ? supabaseClient
                .from(VIDEOS_TABLE)
                .select("*")
                .in("id", videoIds)
            : Promise.resolve({data:[], error:null});

        const [
            {data:posts, error:postError},
            {data:videos, error:videoError}
        ] = await Promise.all([
            postPromise,
            videoPromise
        ]);

        if (postError) {
            console.error("Saved posts error:", postError);
        }

        if (videoError) {
            console.error("Saved videos error:", videoError);
        }

        const postMap =
            new Map(
                (posts || []).map(
                    p => [String(p.id), p]
                )
            );

        const videoMap =
            new Map(
                (videos || []).map(
                    v => [String(v.id), v]
                )
            );

        view.innerHTML = "";

        /*
         * Preserve the user's saved order from bookmarks.
         */
        marks.forEach(mark => {
            if (mark.post_id) {
                const post =
                    postMap.get(
                        String(mark.post_id)
                    );

                if (post) {
                    view.appendChild(
                        createProfilePost(post)
                    );
                }
            }

            if (mark.video_id) {
                const video =
                    videoMap.get(
                        String(mark.video_id)
                    );

                if (video) {
                    view.appendChild(
                        createProfileVideoCard(video)
                    );
                }
            }
        });

        if (!view.children.length) {
            view.innerHTML =
                '<div class="sx-empty">Saved content could not be found.</div>';
        }

    } catch (error) {
        console.error("Saved content error:", error);

        view.innerHTML =
            '<div class="sx-empty">Saved content is not available. Check the bookmarks table and its RLS policy.</div>';
    }
}

        .from(COMMENTS_TABLE)
        .select("id,user_id,content,created_at")
        .eq("post_id", postId)
        .order("created_at", {ascending:true});

    if (error) {
        list.innerHTML =
            '<div class="sx-empty">Comments are not available yet.</div>';
        return;
    }

    if (!data?.length) {
        list.innerHTML =
            '<div class="sx-empty">No comments yet.</div>';
        return;
    }

    const ids = [
        ...new Set(
            data
                .map(c => c.user_id)
                .filter(Boolean)
        )
    ];

    let profiles = [];

    if (ids.length) {
        const result =
            await supabaseClient
                .from(PROFILE_TABLE)
                .select("id,full_name,username,avatar_url,verified,premium_plan")
                .in("id", ids);

        profiles = result.data || [];
    }

    const profileMap =
        new Map(
            profiles.map(p => [p.id, p])
        );

    list.innerHTML =
        data.map(comment => {
            const p =
                profileMap.get(comment.user_id) || {};

            const name =
                p.full_name ||
                p.username ||
                "StudentX User";

            return `
                <div class="sx-comment">
                    <b>
                        ${sxEscape(name)}
                        ${getIdentityBadge(p)}
                    </b>

                    <small
                        style="color:#777;margin-left:6px"
                    >
                        ${sxEscape(
                            sxDate(comment.created_at)
                        )}
                    </small>

                    <p>
                        ${sxEscape(comment.content)}
                    </p>
                </div>
            `;
        }).join("");

    list.scrollTop = list.scrollHeight;
}


/* =========================================================
   REPOST
========================================================= */

async function repostProfilePost(postId){
    if (!currentUser) {
        alert("Please login first.");
        return;
    }

    const {
        data: existing,
        error: checkError
    } = await supabaseClient
        .from(REPOSTS_TABLE)
        .select("id")
        .eq("post_id", postId)
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (checkError) {
        console.error(checkError);
        alert("Reposts are not available yet.");
        return;
    }

    if (existing) {
        alert("You already reposted this post.");
        return;
    }

    const {error} =
        await supabaseClient
            .from(REPOSTS_TABLE)
            .insert({
                post_id: postId,
                user_id: currentUser.id
            });

    if (error) {
        alert(error.message);
        return;
    }

    await loadProfilePostMeta(postId);
    alert("Post reposted successfully.");
}


/* =========================================================
   RECEIVED LIKES
========================================================= */

async function loadReceivedLikesCount(){
    if (!currentUser) return;

    const {
        data: posts,
        error: postsError
    } = await supabaseClient
        .from(POSTS_TABLE)
        .select("id")
        .eq("User_id", currentUser.id);

    if (postsError) return;

    const ids =
        (posts || []).map(p => p.id);

    let count = 0;

    if (ids.length) {
        const result =
            await supabaseClient
                .from(LIKES_TABLE)
                .select("id", {
                    count:"exact",
                    head:true
                })
                .in("post_id", ids);

        if (!result.error) {
            count = result.count || 0;
        }
    }

    const el =
        document.getElementById("likesCount");

    if (el) {
        el.textContent =
            formatNumber(count);
    }
}


/* =========================================================
   HOOKS
========================================================= */

const _oldLoadProfileStats =
    loadProfileStats;

loadProfileStats = async function(){
    await _oldLoadProfileStats();
    await loadReceivedLikesCount();
};

const _oldCreateProfilePost =
    createProfilePost;

createProfilePost = function(post){
    const el =
        _oldCreateProfilePost(post);

    setTimeout(
        () => loadProfilePostMeta(post.id),
        0
    );

    return el;
};

function getPremiumBadge(user) {

    if (user.premium_plan === "plus") {

                    title="StudentX Premium Plus"

    if (user.premium_plan === "standard") {
        return `<span class="studentx-badge premium-badge"
                    title="StudentX Premium"
                    aria-label="StudentX Premium Verified">✓</span>`;
    }

    return "";
}
