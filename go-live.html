<body>

<!-- =========================
     GO LIVE PAGE
========================= -->

<div class="live-page">

    <!-- HEADER -->
    <header class="live-header">

        <button
            class="back-btn"
            onclick="goBack()">

            <i class="fas fa-arrow-left"></i>

        </button>

        <h1>Go Live</h1>

        <div class="header-space"></div>

    </header>


    <!-- CAMERA PREVIEW -->
    <section class="camera-section">

        <video
            id="cameraPreview"
            autoplay
            muted
            playsinline>
        </video>


        <div
            id="cameraPlaceholder"
            class="camera-placeholder">

            <i class="fas fa-video"></i>

            <span>
                Camera preview
            </span>

        </div>


        <!-- LIVE STATUS -->
        <div
            id="liveStatus"
            class="live-status">

            <span class="live-dot"></span>

            <span id="liveStatusText">
                Camera is off
            </span>

        </div>


        <!-- CAMERA CONTROLS -->
        <div class="camera-controls">

            <button
                id="cameraBtn"
                class="camera-control"
                onclick="toggleCamera()">

                <i class="fas fa-video-slash"></i>

            </button>


            <button
                id="micBtn"
                class="camera-control"
                onclick="toggleMicrophone()">

                <i class="fas fa-microphone"></i>

            </button>


            <button
                class="camera-control"
                onclick="switchCamera()">

                <i class="fas fa-camera-rotate"></i>

            </button>

        </div>

    </section>


    <!-- LIVE INFORMATION -->
    <section class="live-form">

        <label>
            Live Title
        </label>

        <input
            id="liveTitle"
            type="text"
            maxlength="100"
            placeholder="What are you going live about?">


        <label>
            Category
        </label>

        <select id="liveCategory">

            <option value="General">
                General
            </option>

            <option value="Education">
                Education
            </option>

            <option value="Gaming">
                Gaming
            </option>

            <option value="Music">
                Music
            </option>

            <option value="News">
                News
            </option>

            <option value="Business">
                Business
            </option>

            <option value="Technology">
                Technology
            </option>

            <option value="Sports">
                Sports
            </option>

        </select>


        <!-- START BUTTON -->

        <button
            id="startLiveBtn"
            class="start-live-btn"
            onclick="startLive()">

            <i class="fas fa-video"></i>

            Start Live

        </button>


        <!-- END BUTTON -->

        <button
            id="endLiveBtn"
            class="end-live-btn"
            onclick="endLive()"
            style="display:none;">

            <i class="fas fa-phone-slash"></i>

            End Live

        </button>

    </section>


    <!-- LIVE INFO -->

    <section
        id="liveInfo"
        class="live-info"
        style="display:none;">

        <div class="live-info-row">

            <span>
                Live status
            </span>

            <strong id="liveInfoStatus">
                LIVE
            </strong>

        </div>


        <div class="live-info-row">

            <span>
                Viewers
            </span>

            <strong id="viewerCount">
                0
            </strong>

        </div>

    </section>

</div>


<!-- =========================
     CSS
========================= -->

<style>

body{

    width:100%;

    background:#101014;

        Inter,

        sans-serif;

    min-height:100vh;

    padding-bottom:30px;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

/* =========================
   GLOBAL VARIABLES
========================= */

let currentUser = null;

let cameraStream = null;

let cameraEnabled = false;

let microphoneEnabled = false;

let currentFacingMode = "user";

let currentLiveSession = null;


/* =========================
   GO BACK
========================= */

function goBack(){

    if(
        cameraStream &&
        cameraStream.active
    ){

        const leave =
            confirm(
                "Leave Go Live?"
            );

        if(!leave){

            return;

        }

        stopCamera();

    }


    if(
        document.referrer &&
        document.referrer
        .includes(
            window.location.host
        )
    ){

        window.history.back();

    }else{

        window.location.href =
            "video.html";

    }

}


/* =========================
   LOAD USER
========================= */

async function loadCurrentUser(){

    const result =
        await supabaseClient
        .auth
        .getUser();


    if(result.error){

        console.error(
            result.error
        );

        return null;

    }


    currentUser =
        result.data.user;


    if(!currentUser){

        alert(
            "Please login first."
        );

        window.location.href =
            "login.html";

        return null;

    }


    return currentUser;

}


/* =========================
   START CAMERA
========================= */

async function startCamera(){

    try{

        if(cameraStream){

            stopCamera();

        }


        cameraStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:
                        currentFacingMode,

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:true

            });


        const preview =
            document.getElementById(
                "cameraPreview"
            );


        preview.srcObject =
            cameraStream;


        preview.style.display =
            "block";


        document.getElementById(
            "cameraPlaceholder"
        ).style.display =
            "none";


        cameraEnabled = true;

        microphoneEnabled = true;


        updateCameraUI();

    }catch(error){

        console.error(
            "CAMERA ERROR:",
            error
        );


        alert(
            "Camera and microphone permission is required."
        );

    }

}


/* =========================
   STOP CAMERA
========================= */

function stopCamera(){

    if(cameraStream){

        cameraStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );

    }


    cameraStream = null;

    cameraEnabled = false;

    microphoneEnabled = false;


    const preview =
        document.getElementById(
            "cameraPreview"
        );


    if(preview){

        preview.srcObject = null;

        preview.style.display =
            "none";

    }


    document.getElementById(
        "cameraPlaceholder"
    ).style.display =
        "flex";


    updateCameraUI();

}


/* =========================
   TOGGLE CAMERA
========================= */

function toggleCamera(){

    if(!cameraStream){

        startCamera();

        return;

    }


    const videoTrack =
        cameraStream
        .getVideoTracks()[0];


    if(!videoTrack){

        return;

    }


    videoTrack.enabled =
        !videoTrack.enabled;


    cameraEnabled =
        videoTrack.enabled;


    updateCameraUI();

}


/* =========================
   TOGGLE MICROPHONE
========================= */

function toggleMicrophone(){

    if(!cameraStream){

        startCamera();

        return;

    }


    const audioTrack =
        cameraStream
        .getAudioTracks()[0];


    if(!audioTrack){

        return;

    }


    audioTrack.enabled =
        !audioTrack.enabled;


    microphoneEnabled =
        audioTrack.enabled;


    updateCameraUI();

}


/* =========================
   SWITCH CAMERA
========================= */

async function switchCamera(){

    currentFacingMode =
        currentFacingMode ===
        "user"
            ? "environment"
            : "user";


    await startCamera();

}


/* =========================
   UPDATE CAMERA UI
========================= */

function updateCameraUI(){

    const cameraBtn =
        document.getElementById(
            "cameraBtn"
        );


    const micBtn =
        document.getElementById(
            "micBtn"
        );


    if(cameraEnabled){

        cameraBtn
        .querySelector("i")
        .className =
            "fas fa-video";

        cameraBtn
        .classList.remove(
            "off"
        );

    }else{

        cameraBtn
        .querySelector("i")
        .className =
            "fas fa-video-slash";

        cameraBtn
        .classList.add(
            "off"
        );

    }


    if(microphoneEnabled){

        micBtn
        .querySelector("i")
        .className =
            "fas fa-microphone";

        micBtn
        .classList.remove(
            "off"
        );

    }else{

        micBtn
        .querySelector("i")
        .className =
            "fas fa-microphone-slash";

        micBtn
        .classList.add(
            "off"
        );

    }


    const status =
        document.getElementById(
            "liveStatus"
        );


    const statusText =
        document.getElementById(
            "liveStatusText"
        );


    if(cameraStream){

        status.classList.add(
            "active"
        );

        statusText.textContent =
            "Camera ready";

    }else{

        status.classList.remove(
            "active"
        );

        statusText.textContent =
            "Camera is off";

    }

}


/* =========================
   START LIVE
========================= */

async function startLive(){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    if(!cameraStream){

        alert(
            "Please turn on your camera first."
        );

        await startCamera();

        return;

    }


    const title =
        document
        .getElementById(
            "liveTitle"
        )
        .value
        .trim();


    const category =
        document
        .getElementById(
            "liveCategory"
        )
        .value;


    if(!title){

        alert(
            "Please enter a live title."
        );

        return;

    }


    const startButton =
        document.getElementById(
            "startLiveBtn"
        );


    try{

        startButton.disabled =
            true;


        startButton.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Starting...';


        /* =====================
           CREATE ROOM ID
        ===================== */

        const roomId =
            "studentx-" +
            currentUser.id +
            "-" +
            Date.now();


        /* =====================
           CREATE LIVE SESSION
        ===================== */

        const result =
            await supabaseClient
            .from("live_sessions")
            .insert({

                user_id:
                    currentUser.id,

                title:
                    title,

                category:
                    category,

                status:
                    "live",

                room_id:
                    roomId,

                viewer_count:
                    0

            })
            .select()
            .single();


        if(result.error){

            throw result.error;

        }


        currentLiveSession =
            result.data;


        /* =====================
           UI
        ===================== */

        document.getElementById(
            "startLiveBtn"
        ).style.display =
            "none";


        document.getElementById(
            "endLiveBtn"
        ).style.display =
            "block";


        document.getElementById(
            "liveInfo"
        ).style.display =
            "block";


        document.getElementById(
            "liveInfoStatus"
        ).textContent =
            "LIVE";


        document.getElementById(
            "liveStatusText"
        ).textContent =
            "LIVE";


        document.getElementById(
            "liveStatus"
        ).classList.add(
            "active"
        );


        alert(
            "You are now LIVE."
        );


    }catch(error){

        console.error(
            "START LIVE ERROR:",
            error
        );


        alert(
            error.message ||
            "Unable to start live."
        );


    }finally{

        startButton.disabled =
            false;


        startButton.innerHTML =
            '<i class="fas fa-video"></i> Start Live';

    }

}


/* =========================
   END LIVE
========================= */

async function endLive(){

    if(!currentLiveSession){

        return;

    }


    const confirmEnd =
        confirm(
            "End this live stream?"
        );


    if(!confirmEnd){

        return;

    }


    try{

        const result =
            await supabaseClient
            .from("live_sessions")
            .update({

                status:
                    "ended",

                ended_at:
                    new Date()
                    .toISOString()

            })
            .eq(
                "id",
                currentLiveSession.id
            )
            .eq(
                "user_id",
                currentUser.id
            );


        if(result.error){

            throw result.error;

        }


        currentLiveSession = null;


        stopCamera();


        document.getElementById(
            "endLiveBtn"
        ).style.display =
            "none";


        document.getElementById(
            "startLiveBtn"
        ).style.display =
            "block";


        document.getElementById(
            "liveInfo"
        ).style.display =
            "none";


        alert(
            "Live stream ended."
        );


    }catch(error){

        console.error(
            "END LIVE ERROR:",
            error
        );


        alert(
            error.message ||
            "Unable to end live."
        );

    }

}


/* =========================
   PAGE INIT
========================= */

async function initGoLive(){

    const user =
        await loadCurrentUser();


    if(!user){

        return;

    }


    /*
       Camera permission will be requested
       when the user opens Go Live.
    */

    await startCamera();

}


/* =========================
   INIT
========================= */

initGoLive();


/* =========================
   CLEANUP
========================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(cameraStream){

            cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        }

    }
);

</script>

<script>

/* =========================================
   WEBRTC LIVE STREAM
========================================= */

const rtcConfig = {

    iceServers: [

        {
            urls:
            "stun:stun.l.google.com:19302"
        },

        {
            urls:
            "stun:stun1.l.google.com:19302"
        }

    ]

};


/*
   Each viewer gets a separate
   WebRTC connection.
*/

const viewerConnections = {};


/*
   ICE candidates that arrive before
   remote description is ready.
*/

const pendingCandidates = {};


/* =========================================
   START WEBRTC SIGNALING
========================================= */

function startLiveSignaling(){

    if(!currentUser){

        console.error(
            "No authenticated user."
        );

        return;

    }


    supabaseClient
    .channel(
        "studentx-live-signals-" +
        currentUser.id
    )
    .on(
        "postgres_changes",
        {
            event:"INSERT",
            schema:"public",
            table:"live_signals",
            filter:
            "receiver_id=eq." +
            currentUser.id
        },
        async function(payload){

            try{

                await handleLiveSignal(
                    payload.new
                );

            }catch(error){

                console.error(
                    "SIGNAL ERROR:",
                    error
                );

            }

        }
    )
    .subscribe(
        function(status){

            console.log(
                "Live signaling:",
                status
            );

        }
    );

}


/* =========================================
   HANDLE SIGNAL
========================================= */

async function handleLiveSignal(
    signal
){

    if(
        !signal ||
        !signal.sender_id
    ){

        return;

    }


    /*
       Only accept signals belonging
       to our current live room.
    */

    if(
        currentLiveSession &&
        signal.room_id !==
        currentLiveSession.room_id
    ){

        return;

    }


    const viewerId =
        signal.sender_id;


    /*
       VIEWER IS REQUESTING TO JOIN
    */

    if(
        signal.signal_type ===
        "join"
    ){

        await createOfferForViewer(
            viewerId
        );

        return;

    }


    /*
       ANSWER FROM VIEWER
    */

    if(
        signal.signal_type ===
        "answer"
    ){

        await handleViewerAnswer(
            viewerId,
            signal.payload
        );

        return;

    }


    /*
       ICE CANDIDATE FROM VIEWER
    */

    if(
        signal.signal_type ===
        "candidate"
    ){

        await handleViewerCandidate(
            viewerId,
            signal.payload
        );

        return;

    }


    /*
       VIEWER LEFT
    */

    if(
        signal.signal_type ===
        "leave"
    ){

        removeViewerConnection(
            viewerId
        );

    }

}


/* =========================================
   CREATE OFFER
========================================= */

async function createOfferForViewer(
    viewerId
){

    if(
        !currentLiveSession ||
        !currentUser
    ){

        return;

    }


    /*
       If connection already exists,
       don't create another one.
    */

    if(
        viewerConnections[viewerId]
    ){

        return;

    }


    const peer =
        new RTCPeerConnection(
            rtcConfig
        );


    viewerConnections[viewerId] =
        peer;


    pendingCandidates[viewerId] =
        [];


    /*
       Add camera + microphone tracks
    */

    if(cameraStream){

        cameraStream
        .getTracks()
        .forEach(
            function(track){

                peer.addTrack(
                    track,
                    cameraStream
                );

            }
        );

    }


    /*
       ICE candidates
    */

    peer.onicecandidate =
        async function(event){

            if(
                !event.candidate
            ){

                return;

            }


            await sendLiveSignal({

                room_id:
                    currentLiveSession.room_id,

                sender_id:
                    currentUser.id,

                receiver_id:
                    viewerId,

                signal_type:
                    "candidate",

                payload:
                    event.candidate.toJSON()

            });

        };


    /*
       Connection state
    */

    peer.onconnectionstatechange =
        function(){

            console.log(
                "Viewer:",
                viewerId,
                "Connection:",
                peer.connectionState
            );


            if(
                peer.connectionState ===
                "failed" ||
                peer.connectionState ===
                "closed" ||
                peer.connectionState ===
                "disconnected"
            ){

                removeViewerConnection(
                    viewerId
                );

            }

        };


    /*
       Create offer
    */

    const offer =
        await peer.createOffer({

            offerToReceiveAudio:false,

            offerToReceiveVideo:false

        });


    await peer.setLocalDescription(
        offer
    );


    /*
       Send offer to viewer
    */

    await sendLiveSignal({

        room_id:
            currentLiveSession.room_id,

        sender_id:
            currentUser.id,

        receiver_id:
            viewerId,

        signal_type:
            "offer",

        payload:
            {
                type:
                    offer.type,

                sdp:
                    offer.sdp
            }

    });


    console.log(
        "Offer sent to viewer:",
        viewerId
    );

}


/* =========================================
   HANDLE VIEWER ANSWER
========================================= */

async function handleViewerAnswer(
    viewerId,
    payload
){

    const peer =
        viewerConnections[
            viewerId
        ];


    if(
        !peer ||
        !payload
    ){

        return;

    }


    if(
        !peer.currentRemoteDescription
    ){

        await peer.setRemoteDescription({

            type:
                payload.type,

            sdp:
                payload.sdp

        });

    }


    await flushPendingCandidates(
        viewerId
    );


    console.log(
        "Answer received from:",
        viewerId
    );

}


/* =========================================
   HANDLE VIEWER ICE
========================================= */

async function handleViewerCandidate(
    viewerId,
    payload
){

    const peer =
        viewerConnections[
            viewerId
        ];


    if(
        !peer ||
        !payload
    ){

        return;

    }


    const candidate =
        new RTCIceCandidate(
            payload
        );


    /*
       Remote description may not yet
       be ready.
    */

    if(
        !peer.remoteDescription
    ){

        if(
            !pendingCandidates[
                viewerId
            ]
        ){

            pendingCandidates[
                viewerId
            ] = [];

        }


        pendingCandidates[
            viewerId
        ].push(
            candidate
        );


        return;

    }


    try{

        await peer.addIceCandidate(
            candidate
        );

    }catch(error){

        console.error(
            "ADD ICE ERROR:",
            error
        );

    }

}


/* =========================================
   FLUSH ICE QUEUE
========================================= */

async function flushPendingCandidates(
    viewerId
){

    const peer =
        viewerConnections[
            viewerId
        ];


    const queue =
        pendingCandidates[
            viewerId
        ] || [];


    if(!peer){

        return;

    }


    for(
        const candidate of queue
    ){

        try{

            await peer.addIceCandidate(
                candidate
            );

        }catch(error){

            console.error(
                "ICE QUEUE ERROR:",
                error
            );

        }

    }


    pendingCandidates[
        viewerId
    ] = [];

}


/* =========================================
   SEND SIGNAL
========================================= */

async function sendLiveSignal(
    data
){

    if(!data){

        return;

    }


    const result =
        await supabaseClient
        .from("live_signals")
        .insert({

            room_id:
                data.room_id,

            sender_id:
                data.sender_id,

            receiver_id:
                data.receiver_id || null,

            signal_type:
                data.signal_type,

            payload:
                data.payload || null

        });


    if(result.error){

        console.error(
            "SEND LIVE SIGNAL ERROR:",
            result.error
        );

    }

}


/* =========================================
   REMOVE VIEWER CONNECTION
========================================= */

function removeViewerConnection(
    viewerId
){

    const peer =
        viewerConnections[
            viewerId
        ];


    if(peer){

        try{

            peer.close();

        }catch(error){

            console.log(error);

        }

    }


    delete viewerConnections[
        viewerId
    ];


    delete pendingCandidates[
        viewerId
    ];


    console.log(
        "Viewer connection removed:",
        viewerId
    );

}


/* =========================================
   CLOSE ALL CONNECTIONS
========================================= */

function closeAllViewerConnections(){

    Object.keys(
        viewerConnections
    ).forEach(
        function(viewerId){

            removeViewerConnection(
                viewerId
            );

        }
    );

}


/* =========================================
   UPDATE VIEWER COUNT
========================================= */

async function updateLiveViewerCount(){

    if(
        !currentLiveSession
    ){

        return;

    }


    const result =
        await supabaseClient
        .from("live_viewers")
        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )
        .eq(
            "room_id",
            currentLiveSession.room_id
        )
        .is(
            "left_at",
            null
        );


    if(result.error){

        console.error(
            "VIEWER COUNT ERROR:",
            result.error
        );

        return;

    }


    const count =
        result.count || 0;


    const viewerCount =
        document.getElementById(
            "viewerCount"
        );


    if(viewerCount){

        viewerCount.textContent =
            formatLiveViewerCount(
                count
            );

    }


    /*
       Save count into live_sessions
    */

    await supabaseClient
    .from("live_sessions")
    .update({

        viewer_count:
            count

    })
    .eq(
        "id",
        currentLiveSession.id
    )
    .eq(
        "user_id",
        currentUser.id
    );

}


/* =========================================
   FORMAT VIEWERS
========================================= */

function formatLiveViewerCount(
    number
){

    number =
        Number(number || 0);


    if(
        number >= 1000000
    ){

        return (
            number / 1000000
        )
        .toFixed(1)
        .replace(
            ".0",
            ""
        ) + "M";

    }


    if(
        number >= 1000
    ){

        return (
            number / 1000
        )
        .toFixed(1)
        .replace(
            ".0",
            ""
        ) + "K";

    }


    return String(
        number
    );

}


/* =========================================
   REGISTER STREAMER
========================================= */

async function registerStreamerInLive(){

    if(
        !currentUser ||
        !currentLiveSession
    ){

        return;

    }


    /*
       Remove old presence for this room
    */

    await supabaseClient
    .from("live_viewers")
    .delete()
    .eq(
        "room_id",
        currentLiveSession.room_id
    )
    .eq(
        "user_id",
        currentUser.id
    );


    /*
       Streamer does not need to be counted
       as a viewer.
    */

}


/* =========================================
   START WEBRTC AFTER START LIVE
========================================= */

async function activateWebRTCLive(){

    if(
        !currentUser ||
        !currentLiveSession
    ){

        return;

    }


    startLiveSignaling();


    await registerStreamerInLive();


    await updateLiveViewerCount();


    console.log(
        "StudentX Direct Live is ready."
    );

}


/* =========================================
   MODIFY START LIVE
========================================= */

const originalStartLive =
    startLive;


startLive = async function(){

    await originalStartLive();


    /*
       Only activate WebRTC when
       a session was successfully created.
    */

    if(
        currentLiveSession
    ){

        await activateWebRTCLive();

    }

};


/* =========================================
   MODIFY END LIVE
========================================= */

const originalEndLive =
    endLive;


endLive = async function(){

    if(
        currentLiveSession
    ){

        closeAllViewerConnections();

    }


    await originalEndLive();

};


/* =========================================
   PERIODIC VIEWER COUNT
========================================= */

setInterval(
    async function(){

        if(
            currentLiveSession
        ){

            await updateLiveViewerCount();

        }

    },
    10000
);
