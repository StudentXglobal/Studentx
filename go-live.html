<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>StudentX Go Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050509;color:#fff;font-family:Poppins,Arial,sans-serif}body{min-height:100vh;padding-bottom:72px}.page{width:100%;max-width:500px;margin:auto;min-height:100vh;background:#0a0a0f}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;background:#0a0a0ff5;backdrop-filter:blur(12px);z-index:10}.top button{border:0;background:none;color:#fff;font-size:20px}.top h1{font-size:17px;margin:0}.wrap{padding:14px}.preview{position:relative;width:100%;aspect-ratio:9/16;background:#000;border-radius:18px;overflow:hidden}.preview video{width:100%;height:100%;object-fit:cover;background:#000}.badge{position:absolute;top:12px;left:12px;background:#e5093f;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:800;letter-spacing:.5px}.tools{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}.tools button{width:42px;height:42px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(0,0,0,.58);color:#fff;font-size:16px}.form{margin-top:14px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#a8a8b3;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;border:1px solid #242430;background:#111119;color:#fff;border-radius:12px;padding:12px;font:inherit;outline:none}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px}.actions button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:14px}.start{background:linear-gradient(135deg,#dc2743,#bc1888);color:#fff}.end{background:#24242d;color:#fff}.end:disabled{opacity:.45}.status{margin-top:12px;padding:11px 12px;border-radius:11px;background:#111119;color:#aaa;font-size:12px}.status.live{color:#fff;border:1px solid rgba(229,9,63,.45)}.hidden{display:none!important}.hint{font-size:11px;color:#777;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="page">
<header class="top"><button onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button><h1>Go Live</h1><span style="width:20px"></span></header>
<main class="wrap">
<div class="preview"><video id="preview" autoplay playsinline muted></video><div id="liveBadge" class="badge hidden">LIVE</div><div class="tools"><button id="switchBtn" title="Switch camera"><i class="fa-solid fa-camera-rotate"></i></button><button id="micBtn" title="Mute microphone"><i class="fa-solid fa-microphone"></i></button></div></div>
<div class="form">
<div class="field"><label>Live title</label><input id="title" maxlength="100" value="StudentX Live"></div>
<div class="field"><label>Category</label><select id="category"><option value="general">General</option><option value="education">Education</option><option value="gaming">Gaming</option><option value="music">Music</option><option value="sports">Sports</option><option value="technology">Technology</option></select></div>
<div class="field"><label>Description</label><textarea id="description" maxlength="500" placeholder="Tell viewers what this live is about"></textarea></div>
<div class="actions"><button id="startBtn" class="start">Start Live</button><button id="endBtn" class="end" disabled>End Live</button></div>
<div id="status" class="status">Camera and microphone are ready.</div><div class="hint">Allow camera and microphone access when your browser asks. Viewers connect using WebRTC.</div>
</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="nav.js"></script>
<script>
/* StudentX Supabase fallback: works even if supabase.js fails to load */
window.__SX_SUPABASE_URL = "https://acragelglvdnqhvbjcgx.supabase.co";
window.__SX_SUPABASE_KEY = "sb_publishable_O2kgVcz8CxPKghH7MJn7nw_R-l61YuH";
if (!window.supabaseClient && window.supabase && window.supabase.createClient) {
  window.supabaseClient = window.supabase.createClient(window.__SX_SUPABASE_URL, window.__SX_SUPABASE_KEY);
}
'use strict';
const $=id=>document.getElementById(id);
let user=null, stream=null, sessionId=null, signalChannel=null, sessionChannel=null, cameraFacing='user', micOn=true;
const peers=new Map();
const RTC_CONFIG={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function setStatus(t,live=false){$('status').textContent=t;$('status').classList.toggle('live',live)}
async function initUser(){const {data,error}=await supabaseClient.auth.getUser();if(error||!data.user){setStatus('Please log in before starting a live stream.');$('startBtn').disabled=true;return false}user=data.user;return true}
async function openCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFacing,width:{ideal:1080},height:{ideal:1920}},audio:true});$('preview').srcObject=stream;micOn=true;syncMic();setStatus('Camera and microphone are ready.');}catch(e){console.error(e);setStatus('Camera or microphone permission was denied.');}}
function syncMic(){if(!stream)return;stream.getAudioTracks().forEach(t=>t.enabled=micOn);$('micBtn').innerHTML=micOn?'<i class="fa-solid fa-microphone"></i>':'<i class="fa-solid fa-microphone-slash"></i>'}
async function sendSignal(receiver,type,payload){if(!sessionId||!user)return;const {error}=await supabaseClient.from('live_signals').insert({session_id:sessionId,sender_id:user.id,receiver_id:receiver,signal_type:type,payload});if(error)console.error('signal',error)}
async function createPeer(viewerId){if(peers.has(viewerId))return peers.get(viewerId);const pc=new RTCPeerConnection(RTC_CONFIG);peers.set(viewerId,pc);stream.getTracks().forEach(track=>pc.addTrack(track,stream));pc.onicecandidate=e=>{if(e.candidate)sendSignal(viewerId,'candidate',e.candidate.toJSON())};pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)&&peers.get(viewerId)===pc){pc.close();peers.delete(viewerId)}};return pc}
async function handleSignal(row){if(!user||row.receiver_id!==user.id||row.session_id!==sessionId)return;try{const viewerId=row.sender_id;if(row.signal_type==='join'){const pc=await createPeer(viewerId);const offer=await pc.createOffer();await pc.setLocalDescription(offer);await sendSignal(viewerId,'offer',pc.localDescription.toJSON());return}if(row.signal_type==='answer'){const pc=peers.get(viewerId);if(pc&&pc.signalingState!=='closed')await pc.setRemoteDescription(new RTCSessionDescription(row.payload));return}if(row.signal_type==='candidate'){const pc=peers.get(viewerId);if(pc&&row.payload)try{await pc.addIceCandidate(new RTCIceCandidate(row.payload))}catch(e){console.warn(e)}return}if(row.signal_type==='leave'){const pc=peers.get(viewerId);if(pc){pc.close();peers.delete(viewerId)}}}catch(e){console.error(e)}}
async function subscribeSignals(){signalChannel=supabaseClient.channel('live-signals-'+sessionId).on('postgres_changes',{event:'INSERT',schema:'public',table:'live_signals',filter:'session_id=eq.'+sessionId},payload=>handleSignal(payload.new)).subscribe()}
async function startLive(){if(sessionId)return;if(!stream){await openCamera();if(!stream)return}if(!user){const ok=await initUser();if(!ok)return}const row={user_id:user.id,broadcaster_id:user.id,title:$('title').value.trim()||'StudentX Live',description:$('description').value.trim()||null,category:$('category').value,status:'live',viewer_count:0,started_at:new Date().toISOString()};const {data,error}=await supabaseClient.from('live_sessions').insert(row).select('id').single();if(error){console.error(error);setStatus('Could not start live: '+error.message);return}sessionId=data.id;await subscribeSignals();sessionChannel=supabaseClient.channel('live-session-'+sessionId).on('postgres_changes',{event:'UPDATE',schema:'public',table:'live_sessions',filter:'id=eq.'+sessionId},p=>{if(p.new.status==='ended')endLive(false)}).subscribe();$('liveBadge').classList.remove('hidden');$('startBtn').disabled=true;$('endBtn').disabled=false;$('title').disabled=true;$('category').disabled=true;$('description').disabled=true;setStatus('LIVE is running. Waiting for viewers...',true);history.replaceState({},'',location.pathname+'?id='+sessionId)}
async function endLive(updateDb=true){if(updateDb&&sessionId)await supabaseClient.from('live_sessions').update({status:'ended',ended_at:new Date().toISOString()}).eq('id',sessionId);for(const [id,pc] of peers){pc.close();peers.delete(id)}if(signalChannel){await supabaseClient.removeChannel(signalChannel);signalChannel=null}if(sessionChannel){await supabaseClient.removeChannel(sessionChannel);sessionChannel=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('preview').srcObject=null;$('liveBadge').classList.add('hidden');$('startBtn').disabled=false;$('endBtn').disabled=true;$('title').disabled=false;$('category').disabled=false;$('description').disabled=false;const old=sessionId;sessionId=null;if(old)history.replaceState({},'',location.pathname);setStatus('Live ended.');}
$('switchBtn').onclick=async()=>{cameraFacing=cameraFacing==='user'?'environment':'user';if(!stream||!sessionId){await openCamera();return}await openCamera();for(const [viewerId,oldPc] of peers){oldPc.close();peers.delete(viewerId);const pc=await createPeer(viewerId);const offer=await pc.createOffer();await pc.setLocalDescription(offer);await sendSignal(viewerId,'offer',pc.localDescription.toJSON())}};
$('micBtn').onclick=()=>{micOn=!micOn;syncMic()};$('startBtn').onclick=startLive;$('endBtn').onclick=()=>endLive(true);
window.addEventListener('beforeunload',()=>{if(sessionId)navigator.sendBeacon&&navigator.sendBeacon('about:blank','');if(stream)stream.getTracks().forEach(t=>t.stop())});
(async()=>{if(!navigator.mediaDevices?.getUserMedia){setStatus('This browser does not support camera access.');$('startBtn').disabled=true;return}const ok=await initUser();if(ok)await openCamera()})();
</script>
</body>
</html>
