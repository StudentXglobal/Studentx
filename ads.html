<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ads Manager - StudentX</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase CDN (Tabbatar kana da shi ko kuma script ɗinka na gida) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            background-color: #121212;
            color: #fff;
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        .header {
            position: sticky;
            top: 0;
            background-color: #121212;
            padding: 40px 15px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2c2c2c;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
        }
        .header-title {
            font-size: 20px;
            font-weight: bold;
        }
        .create-ad-btn {
            background-color: #8A2BE2;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- MAIN CONTENT --- */
        .ads-container {
            padding: 20px 15px 80px;
        }

        /* Overall Stats Summary */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }
        .summary-card {
            background-color: #1e1e1e;
            border: 1px solid #2c2c2c;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
        }
        .summary-value {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }
        .summary-label {
            font-size: 11px;
            color: #888;
        }

        /* Section Title */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Modal Styles */
        #createAdModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #161622;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #2a2a3d;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* --- BOTTOM NAV BAR --- */
        .bnav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #000;
            border-top: 1px solid #222;
            z-index: 2000;
        }
        .nb {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            cursor: pointer;
            gap: 3px;
            text-decoration: none;
        }
        .nb.on {
            color: #fff;
        }
        .nb i {
            font-size: 20px;
        }
        .nb span {
            font-size: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <a href="profile.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="header-title">Ads Manager</div>
        </div>
        <button class="create-ad-btn" onclick="openCreateModal()">
            <i class="fas fa-plus"></i> Create Ad
        </button>
    </div>

    <div class="ads-container">

        <!-- OVERALL STATS SUMMARY -->
        <div class="stats-summary">
            <div class="summary-card">
                <div class="summary-value" id="totalViews">0</div>
                <div class="summary-label">Total Views</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="totalClicks">0</div>
                <div class="summary-label">Total Clicks</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="totalSpent" style="color: #ff4b4b;">$0.00</div>
                <div class="summary-label">Total Spent</div>
            </div>
        </div>

        <h3 class="section-title">Your Active & Recent Ads</h3>

        <!-- Ads Dynamic Container -->
        <div id="adsContainer">
            <p style="color: #888; text-align: center;">Loading your ads...</p>
        </div>

    </div>

    <!-- CREATE AD MODAL -->
    <div id="createAdModal">
        <div class="modal-content">
            <h3 style="color: #fff; margin-bottom: 15px;">Create New Ad</h3>
            <form id="createAdForm">
                <label style="color: #aaa; font-size: 12px;">Ad Title</label>
                <input type="text" id="adTitle" required style="width: 100%; padding: 10px; margin: 5px 0 15px; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 8px;">

                <label style="color: #aaa; font-size: 12px;">Ad Goal Type</label>
                <select id="adType" style="width: 100%; padding: 10px; margin: 5px 0 15px; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 8px;">
                    <option value="views">Views</option>
                    <option value="clicks">Clicks</option>
                    <option value="followers">Followers</option>
                    <option value="likes">Likes</option>
                </select>

                <label style="color: #aaa; font-size: 12px;">Target Audience Count</label>
                <input type="number" id="adTarget" required placeholder="e.g. 5000" style="width: 100%; padding: 10px; margin: 5px 0 15px; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 8px;">

                <label style="color: #aaa; font-size: 12px;">Duration (Days)</label>
                <input type="number" id="adDuration" required placeholder="e.g. 7" style="width: 100%; padding: 10px; margin: 5px 0 15px; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 8px;">

                <label style="color: #aaa; font-size: 12px;">Budget ($)</label>
                <input type="number" step="0.01" id="adBudget" required placeholder="e.g. 45.00" style="width: 100%; padding: 10px; margin: 5px 0 15px; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 8px;">

                <label style="color: #aaa; font-size: 12px;">Media URL (Image or Short Video Link)</label>
                <input type="text" id="adMedia" placeholder="https://..." style="width: 100%; padding: 10px; margin: 5px 0 15px; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 8px;">

                <div style="display: flex; gap: 10px;">
                    <button type="submit" style="flex: 1; background: #8A2BE2; color: #fff; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Submit Ad</button>
                    <button type="button" onclick="closeCreateModal()" style="flex: 1; background: #333; color: #fff; padding: 10px; border: none; border-radius: 8px; cursor: pointer;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bnav">
        <div class="nb" onclick="window.location.href='home.html'">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="nb" onclick="window.location.href='video.html'">
            <i class="fas fa-video"></i>
            <span>Video</span>
        </div>
        <div class="nb" onclick="window.location.href='chat.html'">
            <i class="fas fa-comment-dots"></i>
            <span>Chat</span>
        </div>
        <div class="nb" onclick="window.location.href='studyhub.html'">
            <i class="fas fa-book-open"></i>
            <span>StudyHub</span>
        </div>
        <div class="nb on" onclick="window.location.href='profile.html'">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </div>
    </nav>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        function openCreateModal() { 
            document.getElementById("createAdModal").style.display = "flex"; 
        }
        function closeCreateModal() { 
            document.getElementById("createAdModal").style.display = "none"; 
        }

        // Jawo da Nuna Ads daga Supabase
        async function loadAds() {
            try {
                const { data, error } = await supabaseClient
                    .from("ads")
                    .select("*")
                    .order("created_at", { ascending: false });

                if (error) throw error;

                let totalViews = 0;
                let totalClicks = 0;
                let totalSpent = 0;

                let container = document.getElementById("adsContainer");
                if (!container) return;

                if (!data || data.length === 0) {
                    container.innerHTML = `<p style="color: #888; text-align: center;">No ads found. Create one!</p>`;
                    return;
                }

                let html = "";
                data.forEach(ad => {
                    if(ad.status === 'active') {
                        totalViews += (ad.views || 0);
                        totalClicks += (ad.clicks || 0);
                        totalSpent += parseFloat(ad.spent || 0);
                    }

                    let statusColor = ad.status === 'active' ? '#2ecc71' : (ad.status === 'pending' ? '#f39c12' : '#e74c3c');
                    
                    html += `
                        <div style="background: #161622; border-radius: 16px; padding: 15px; margin-bottom: 15px; border: 1px solid #2a2a3d;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="color: #fff; margin: 0; font-size: 16px;">${ad.title}</h4>
                                <span style="background: ${statusColor}; color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 20px; text-transform: uppercase;">${ad.status}</span>
                            </div>
                            <p style="color: #aaa; font-size: 12px; margin-bottom: 12px;">Started: ${ad.started_date ? new Date(ad.started_date).toLocaleDateString() : 'Pending Approval'}</p>
                            
                            <div style="display: flex; justify-content: space-between; background: #12121c; padding: 10px; border-radius: 10px; margin-bottom: 12px; text-align: center;">
                                <div>
                                    <span style="color: #fff; font-weight: bold; display: block; font-size: 14px;">${ad.views || 0}</span>
                                    <span style="color: #777; font-size: 10px;">Views</span>
                                </div>
                                <div>
                                    <span style="color: #fff; font-weight: bold; display: block; font-size: 14px;">${ad.clicks || 0}</span>
                                    <span style="color: #777; font-size: 10px;">Clicks</span>
                                </div>
                                <div>
                                    <span style="color: #e74c3c; font-weight: bold; display: block; font-size: 14px;">$${parseFloat(ad.spent || 0).toFixed(2)}</span>
                                    <span style="color: #777; font-size: 10px;">Spent</span>
                                </div>
                            </div>

                            <div style="display: flex; gap: 8px;">
                                ${ad.status === 'active' ? 
                                    `<button onclick="toggleAdStatus('${ad.id}', 'paused')" style="flex: 1; background: #333; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 12px; cursor: pointer;">⏸ Pause Ad</button>` : 
                                    (ad.status === 'paused' ? `<button onclick="toggleAdStatus('${ad.id}', 'active')" style="flex: 1; background: #2ecc71; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 12px; cursor: pointer;">▶ Resume Ad</button>` : '')
                                }
                                <button onclick="deleteAd('${ad.id}')" style="background: rgba(231,76,60,0.2); color: #e74c3c; border: 1px solid rgba(231,76,60,0.4); padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;">🗑 Delete</button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                document.getElementById("totalViews").innerText = totalViews.toLocaleString();
                document.getElementById("totalClicks").innerText = totalClicks.toLocaleString();
                document.getElementById("totalSpent").innerText = "$" + totalSpent.toFixed(2);

            } catch (err) {
                console.error("Error loading ads:", err);
            }
        }

        // Ƙirƙirar sabon Ad
        document.getElementById("createAdForm")?.addEventListener("submit", async function(e) {
            e.preventDefault();
            const title = document.getElementById("adTitle").value;
            const ad_type = document.getElementById("adType").value;
            const target_amount = parseInt(document.getElementById("adTarget").value);
            const duration_days = parseInt(document.getElementById("adDuration").value);
            const budget = parseFloat(document.getElementById("adBudget").value);
            const media_url = document.getElementById("adMedia").value;

            const { error } = await supabaseClient.from("ads").insert({
                title,
                ad_type,
                target_amount,
                duration_days,
                budget,
                media_url,
                status: "pending"
            });

            if (error) {
                alert("Error creating ad: " + error.message);
            } else {
                alert("Ad submitted successfully! Waiting for Admin approval.");
                closeCreateModal();
                loadAds();
            }
        });

        // Canza Matsayi (Pause / Resume)
        async function toggleAdStatus(id, newStatus) {
            const updateData = { status: newStatus };
            if(newStatus === 'paused') updateData.paused_date = new Date();
            if(newStatus === 'active') updateData.started_date = new Date();

            const { error } = await supabaseClient.from("ads").update(updateData).eq("id", id);
            if(error) {
                alert("Error updating status");
            } else {
                await supabaseClient.from("notifications").insert({
                    title: "Ad Status Update",
                    message: `User updated an ad status to: ${newStatus}`,
                    target: "admin"
                });
                loadAds();
            }
        }

        // Share Ad
        async function deleteAd(id) {
            if(confirm("Are you sure you want to delete this ad?")) {
                const { error } = await supabaseClient.from("ads").delete().eq("id", id);
                if(error) alert("Error deleting ad");
                else loadAds();
            }
        }

        window.addEventListener("DOMContentLoaded", loadAds);
    </script>
    <script src="theme.js"></script>
</body>
</html>
