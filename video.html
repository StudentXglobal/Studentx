<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudentX Video</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
body{position:relative;}
.video-feed{position:absolute;top:0;left:0;right:0;bottom:62px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;}
.video-feed::-webkit-scrollbar{display:none;}
.video-item{position:relative;width:100%;height:calc(100vh - 62px);min-height:calc(100vh - 62px);scroll-snap-align:start;overflow:hidden;background:#111;}
.video-player{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#111;}
.video-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),transparent 35%,rgba(0,0,0,.12) 55%,rgba(0,0,0,.88) 100%);pointer-events:none;}
.video-top{position:fixed;top:0;left:0;right:0;height:58px;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);}
.video-tabs{display:flex;align-items:center;gap:28px;}
.video-tab{border:0;background:none;color:#aaa;font-size:15px;font-weight:600;padding:8px 2px;cursor:pointer;}
.video-tab.active{color:#fff;}
.video-tab.active::after{content:"";display:block;width:22px;height:2px;margin:5px auto 0;background:#fff;border-radius:2px;}
.video-upload{position:fixed;top:11px;right:14px;z-index:25;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.45);color:#fff;cursor:pointer;text-decoration:none;}
.video-upload i{font-size:18px;}
.video-info{position:absolute;left:14px;right:78px;bottom:22px;z-index:10;}
.video-user{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.video-avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#222;cursor:pointer;}
.video-user-details{min-width:0;cursor:pointer;}
.video-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.video-username{font-size:12px;color:#ccc;margin-top:3px;}
.video-follow{margin-left:5px;padding:6px 14px;border:1px solid rgba(255,255,255,.75);border-radius:7px;background:transparent;color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
.video-follow.following{background:#fff;color:#000;border-color:#fff;}
.sponsored-badge{display:inline-block;background:rgba(255,255,255,0.2);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:bold;margin-bottom:5px;letter-spacing:0.5px;}
.ad-cta-btn{display:inline-block;margin-top:10px;padding:8px 16px;background:#6d35ff;color:#fff;font-size:13px;font-weight:600;border-radius:8px;text-decoration:none;border:none;cursor:pointer;}
.video-caption{font-size:14px;line-height:1.45;color:#fff;word-break:break-word;}
.video-actions{position:absolute;right:10px;bottom:21px;z-index:15;display:flex;flex-direction:column;align-items:center;gap:18px;}
.video-action{width:50px;border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;}
.video-action i{font-size:24px;margin-bottom:5px;}
.video-action span{font-size:11px;color:#fff;}
.video-action.liked i{color:#ff315c;}
.video-action.saved i{color:#7d5cff;}
.bnav{position:fixed;bottom:0;left:0;right:0;height:62px;z-index:100;display:flex;align-items:center;justify-content:space-around;background:#09090d;border-top:1px solid rgba(255,255,255,.08);}
.nb{width:20%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#777;font-size:11px;cursor:pointer;user-select:none;}
.nb i{font-size:20px;}
.nb.on{color:#fff;}
.nb.on i{color:#fff;}
.video-message{height:100%;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px;}
.custom-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;align-items:flex-end;justify-content:center;}
.custom-sheet{width:100%;max-width:500px;background:#141419;border-top-left-radius:16px;border-top-right-radius:16px;padding:20px;border-top:1px solid rgba(255,255,255,0.1);animation:slideUp 0.3s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-option{display:flex;align-items:center;gap:15px;width:100%;padding:14px 0;background:none;border:none;color:#fff;font-size:15px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);text-align:left;}
.sheet-option i{font-size:18px;width:24px;text-align:center;color:#aaa;}
@media(min-width:700px){.video-feed, .video-top, .bnav, .custom-sheet{max-width:500px;margin:auto;}}
</style>
</head>
<body>
<div class="video-top">
<div class="video-tabs">
<button class="video-tab" id="followingTab" type="button">Following</button>
<button class="video-tab active" id="forYouTab" type="button">For You</button>
<button class="video-tab" id="liveTab" type="button">Live</button>
</div>
</div>
<button class="video-upload" id="uploadVideoBtn" type="button" aria-label="Upload video"><i class="fas fa-plus"></i></button>
<main class="video-feed" id="videoFeed"><div class="video-message">Loading videos...</div></main>
<nav class="bnav">
<div class="nb" onclick="window.location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></div>
<div class="nb on" onclick="window.location.href='video.html'"><i class="fas fa-video"></i><span>Video</span></div>
<div class="nb" onclick="window.location.href='chat.html'"><i class="fas fa-comment-dots"></i><span>Chat</span></div>
<div class="nb" onclick="window.location.href='studyhub.html'"><i class="fas fa-book-open"></i><span>StudyHub</span></div>
<div class="nb" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i><span>Profile</span></div>
</nav>

<input type="file" id="hiddenVideoInput" accept="video/*" style="display: none;">
<input type="file" id="cameraVideoInput" accept="video/*" capture="environment" style="display: none;">

<div id="uploadOptionsModal" class="custom-modal" onclick="closeModals(event)">
<div class="sheet-option" onclick="triggerDeviceUpload()" style="border:none; font-weight:bold; justify-content:center; color:#6d35ff;"><i class="fas fa-video" style="color:#6d35ff;"></i> Upload Video from Phone</div>
<div class="sheet-option" onclick="triggerCameraRecord()" style="border:none; font-weight:bold; justify-content:center; color:#fff;"><i class="fas fa-camera" style="color:#fff;"></i> Record Video</div>
</div>

<div id="uploadModal" class="custom-modal" style="align-items:center;">
<div style="width:90%; max-width:400px; background:#141419; padding:20px; border-radius:14px; border:1px solid rgba(255,255,255,0.1);">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
<h3 style="font-size:16px; font-weight:bold; color:#fff;">Upload New Video</h3>
<button onclick="closeUploadModal()" style="background:none; border:none; color:#aaa; font-size:18px; cursor:pointer;"><i class="fas fa-times"></i></button>
</div>
<video id="uploadPreview" style="width:100%; max-height:240px; object-fit:cover; border-radius:8px; margin-bottom:15px; background:#000;" controls></video>
<textarea id="uploadCaption" placeholder="Write a caption or add #hashtags..." style="width:100%; height:80px; background:#1f1f28; color:#fff; border:1px solid rgba(255,255,255,0.15); border-radius:8px; padding:10px; margin-bottom:15px; resize:none; font-size:14px; outline:none;"></textarea>
<div style="display:flex; gap:10px;">
<button id="publishBtn" onclick="publishVideo()" style="flex:1; background:#6d35ff; color:#fff; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:14px;">Post Now</button>
<button onclick="closeUploadModal()" style="flex:1; background:#222; color:#fff; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:14px;">Cancel</button>
</div></div></div>
<div id="optionsModal" class="custom-modal" onclick="closeModals(event)">
<div class="custom-sheet" id="optionsSheet">
<button class="sheet-option" onclick="handleOptionAction('interested')"><i class="fas fa-thumbs-up"></i> Interested (Show more like this)</button>
<button class="sheet-option" onclick="handleOptionAction('not_interested')"><i class="fas fa-thumbs-down"></i> Not Interested (Show less like this)</button>
<button class="sheet-option" onclick="handleOptionAction('copy_link')"><i class="fas fa-link"></i> Copy Link</button>
<button class="sheet-option" onclick="handleOptionAction('download')"><i class="fas fa-download"></i> Download Video</button>
</div>
</div>

<div id="shareModal" class="custom-modal" onclick="closeModals(event)">
<div class="custom-sheet">
<div style="font-size:15px; font-weight:bold; margin-bottom:15px; text-align:center;">Share to</div>
<div style="display:flex; justify-content:space-around; margin-bottom:20px;">
<div onclick="shareToSocial('whatsapp')" style="text-align:center; cursor:pointer;"><div style="width:50px; height:50px; background:#25D366; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 5px;"><i class="fab fa-whatsapp" style="font-size:24px; color:#fff;"></i></div><span style="font-size:12px; color:#aaa;">WhatsApp</span></div>
<div onclick="shareToSocial('facebook')" style="text-align:center; cursor:pointer;"><div style="width:50px; height:50px; background:#1877F2; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 5px;"><i class="fab fa-facebook-f" style="font-size:22px; color:#fff;"></i></div><span style="font-size:12px; color:#aaa;">Facebook</span></div>
<div onclick="shareToSocial('tiktok')" style="text-align:center; cursor:pointer;"><div style="width:50px; height:50px; background:#000; border:1px solid #fff; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 5px;"><i class="fab fa-tiktok" style="font-size:20px; color:#fff;"></i></div><span style="font-size:12px; color:#aaa;">TikTok</span></div>
<div onclick="shareToSocial('copy')" style="text-align:center; cursor:pointer;"><div style="width:50px; height:50px; background:#333; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 5px;"><i class="fas fa-copy" style="font-size:20px; color:#fff;"></i></div><span style="font-size:12px; color:#aaa;">Copy Link</span></div>
</div>
<button onclick="document.getElementById('shareModal').style.display='none'" style="width:100%; background:#222; border:none; padding:12px; border-radius:8px; color:#fff; font-weight:bold; cursor:pointer;">Cancel</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
let currentUser=null, currentProfile=null, videos=[], selectedVideoFile=null, activeVideoIdForMenu=null;
const sampleAds=[
    {id:'ad_tech_1',isAd:true,category:'tech',title:'StudentX Tech Store',username:'@studentx_store',avatar_url:'https://images.unsplash.com/photo-1531482615713-2afd69097998?w=100',caption:'Get durable student laptops and coding accessories with 20% discount! 💻✨ #Tech #StudentX',video_url:'https://assets.mixkit.co/videos/preview/mixkit-hands-typing-on-a-laptop-keyboard-42825-large.mp4',cta_text:'Shop Tech Deals',cta_url:'https://studentx.app/store'},
    {id:'ad_study_1',isAd:true,category:'study',title:'StudyHub Masterclass',username:'@studyhub_pro',avatar_url:'https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=100',caption:'Ace your semester exams with AI past questions and collaborative study rooms. 📚🚀 #StudyHub',video_url:'https://assets.mixkit.co/videos/preview/mixkit-student-girl-studying-at-the-library-41662-large.mp4',cta_text:'Join Masterclass',cta_url:'https://studentx.app/studyhub'},
    {id:'ad_lifestyle_1',isAd:true,category:'lifestyle',title:'Campus Eats Delivery',username:'@campuseats',avatar_url:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=100',caption:'Hungry during late-night studies? Fast hostel food delivery in 15 minutes! 🍔🛵 #HostelLife',video_url:'https://assets.mixkit.co/videos/preview/mixkit-delivery-guy-riding-a-scooter-in-the-city-41584-large.mp4',cta_text:'Order Food Now',cta_url:'https://studentx.app/food'}
];
function defaultAvatar(){return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="#171722"/><circle cx="50" cy="38" r="20" fill="#777"/><path d="M18 90c4-22 18-32 32-32s28 10 32 32" fill="#777"/></svg>`);}
function escapeHTML(v){if(v==null)return"";return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function openUserProfile(id){if(id)window.location.href=`profile.html?id=`+encodeURIComponent(id);}
async function loadCurrentUser(){
    const r=await supabaseClient.auth.getUser();
    if(r.error)return;
    currentUser=r.data.user||null;
    if(currentUser){
        const p=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
        if(!p.error&&p.data)currentProfile=p.data;
    }
}
async function loadVideos(){
    const f=document.getElementById("videoFeed");
    f.innerHTML=`<div class="video-message">Loading videos...</div>`;
    const res=await supabaseClient.from("videos").select("*").order("created_at",{ascending:false});
    if(res.error){f.innerHTML=`<div class="video-message">Unable to load videos.</div>`;return;}
    videos=res.data||[];
    await loadProfiles();
    videos=sortVideosByInterest(videos,currentProfile);
    if(!videos.length){f.innerHTML=`<div class="video-message">No videos yet.</div>`;return;}
    renderVideosWithAds();
}
async function loadProfiles(){
    const ids=[...new Set(videos.map(v=>v.user_id).filter(Boolean))];
    if(!ids.length)return;
    const res=await supabaseClient.from("profiles").select("id,full_name,username,avatar_url,university").in("id",ids);
    if(res.error)return;
    const profs=res.data||[];
    videos=videos.map(v=>({...v,profile:profs.find(p=>p.id===v.user_id)||null}));
}
function sortVideosByInterest(list,prof){
    if(!prof)return list;
    return list.sort((a,b)=>{
        let sa=0,sb=0;
        if(prof.university&&a.profile&&a.profile.university===prof.university)sa+=3;
        if(prof.university&&b.profile&&b.profile.university===prof.university)sb+=3;
        return sb-sa;
    });
}
function getTargetedAd(){return sampleAds[Math.floor(Math.random()*sampleAds.length)];}
function renderVideosWithAds(){
    const f=document.getElementById("videoFeed");
    let html="",c=0;
    videos.forEach(v=>{
        html+=renderVideoCard(v);
        c++;
        if(c%5===0)html+=renderAdCard(getTargetedAd());
    });
    f.innerHTML=html;
    setupVideoPlayback();
    loadVideoCounts();
}
function renderVideoCard(v){
    const prof=v.profile||{};
    const name=prof.full_name||prof.username||"StudentX User";
    const uname=prof.username?"@"+prof.username:"@studentx";
    const avatar=prof.avatar_url||defaultAvatar();
    const cap=v.caption||"";
    return `<section class="video-item" data-video-id="${escapeHTML(v.id)}" ondblclick="handleDoubleTap('${escapeHTML(v.id)}', this)">
    <video class="video-player" src="${escapeHTML(v.video_url)}" ${v.thumbnail_url?`poster="${escapeHTML(v.thumbnail_url)}"`:''} playsinline loop preload="metadata"></video>
    <div class="video-overlay"></div>
    <div class="video-info">
    <div class="video-user">
    <img class="video-avatar" src="${escapeHTML(avatar)}" onerror="this.src=defaultAvatar()" onclick="openUserProfile('${escapeHTML(v.user_id)}')">
    <div class="video-user-details" onclick="openUserProfile('${escapeHTML(v.user_id)}')">
    <div class="video-name">${escapeHTML(name)}</div>
    <div class="video-username">${escapeHTML(uname)}</div>
    </div>
    ${currentUser&&currentUser.id!==v.user_id?`<button class="video-follow" id="follow-btn-${escapeHTML(v.user_id)}" onclick="followVideo('${escapeHTML(v.user_id)}')">Follow</button>`:''}
    </div>
    ${cap?`<div class="video-caption">${escapeHTML(cap)}</div>`:''}
    </div>
    <div class="video-actions">
    <button class="video-action" onclick="likeVideo('${escapeHTML(v.id)}',this)"><i class="far fa-heart"></i><span>0</span></button>
    <button class="video-action" onclick="openVideoComments('${escapeHTML(v.id)}')"><i class="far fa-comment"></i><span>0</span></button>
    <button class="video-action" onclick="saveVideo('${escapeHTML(v.id)}',this)"><i class="far fa-bookmark"></i><span>Save</span></button>
    <button class="video-action" onclick="openShareModal('${escapeHTML(v.id)}')"><i class="fas fa-share"></i><span>Share</span></button>
    <button class="video-action" onclick="openVideoMenu('${escapeHTML(v.id)}')"><i class="fas fa-ellipsis-vertical"></i></button>
    </div></section>`;
}
function renderAdCard(ad){
    return `<section class="video-item" data-ad-id="${escapeHTML(ad.id)}">
    <video class="video-player" src="${escapeHTML(ad.video_url)}" playsinline loop preload="metadata" controls></video>
    <div class="video-overlay"></div>
    <div class="video-info">
    <span class="sponsored-badge">Sponsored Ad</span>
    <div class="video-user">
    <img class="video-avatar" src="${escapeHTML(ad.avatar_url)}">
    <div class="video-user-details">
    <div class="video-name">${escapeHTML(ad.title)}</div>
    <div class="video-username">${escapeHTML(ad.username)}</div>
    </div>
    </div>
    <div class="video-caption">${escapeHTML(ad.caption)}</div>
    <a href="${escapeHTML(ad.cta_url)}" target="_blank" class="ad-cta-btn">${escapeHTML(ad.cta_text)}</a>
    </div>
    <div class="video-actions">
    <button class="video-action" onclick="alert('Sponsored ad by StudentX partners.')"><i class="fas fa-bullhorn"></i><span>Ad</span></button>
    </div></section>`;
}
function setupVideoPlayback(){
    const ps=document.querySelectorAll(".video-player");
    const obs=new IntersectionObserver(es=>{
        es.forEach(e=>{
            const v=e.target;
            if(e.isIntersecting){ps.forEach(o=>{if(o!==v)o.pause();});v.play().catch(()=>{});}else{v.pause();}
        });
    },{threshold:0.65});
    ps.forEach(v=>obs.observe(v));
}
async function initVideo(){await loadCurrentUser();await loadVideos();}
initVideo();
document.getElementById("uploadVideoBtn").addEventListener("click",function(){
    if(!currentUser){alert("Please login first");window.location.href="login.html";return;}
    document.getElementById("uploadOptionsModal").style.display="flex";
});
function triggerDeviceUpload(){
    document.getElementById("uploadOptionsModal").style.display="none";
    document.getElementById("hiddenVideoInput").click();
}
function triggerCameraRecord(){
    document.getElementById("uploadOptionsModal").style.display="none";
    document.getElementById("cameraVideoInput").click();
}
document.getElementById("hiddenVideoInput").addEventListener("change",handleFileSelected);
document.getElementById("cameraVideoInput").addEventListener("change",handleFileSelected);

function handleFileSelected(e){
    const f=e.target.files[0];
    if(!f)return;
    if(!f.type.startsWith("video/")){alert("Please select a video file.");return;}
    selectedVideoFile=f;
    document.getElementById("uploadPreview").src=URL.createObjectURL(f);
    document.getElementById("uploadModal").style.display="flex";
}
function closeUploadModal(){
    document.getElementById("uploadModal").style.display="none";
    document.getElementById("hiddenVideoInput").value="";
    document.getElementById("cameraVideoInput").value="";
    document.getElementById("uploadCaption").value="";
    document.getElementById("uploadPreview").src="";
    selectedVideoFile=null;
}
async function publishVideo(){
    if(!selectedVideoFile||!currentUser)return;
    const cap=document.getElementById("uploadCaption").value.trim();
    const btn=document.getElementById("publishBtn");
    btn.textContent="Uploading...";btn.disabled=true;
    try{
        const ext=selectedVideoFile.name.split('.').pop();
        const fname=`${currentUser.id}_${Date.now()}.${ext}`;
        const {error:upErr}=await supabaseClient.storage.from("videos").upload(fname,selectedVideoFile);
        if(upErr)throw upErr;
        const {data:urlData}=supabaseClient.storage.from("videos").getPublicUrl(fname);
        const {error:insErr}=await supabaseClient.from("videos").insert({user_id:currentUser.id,video_url:urlData.publicUrl,caption:cap});
        if(insErr)throw insErr;
        alert("Video uploaded successfully!");
        closeUploadModal();
        await loadVideos();
    }catch(err){console.error(err);alert("Failed to upload video.");}
    finally{btn.textContent="Post Now";btn.disabled=false;}
}

function formatVideoCount(n){
    n=Number(n||0);
    if(n>=1000000)return(n/1000000).toFixed(1).replace(".0","")+"M";
    if(n>=1000)return(n/1000).toFixed(1).replace(".0","")+"K";
    return String(n);
}
async function loadVideoCounts(){
    for(const v of videos){
        const c=document.querySelector(`[data-video-id="${v.id}"]`);
        if(!c)continue;
        const bs=c.querySelectorAll(".video-action");
        const l=await supabaseClient.from("video_likes").select("id",{count:"exact",head:true}).eq("video_id",v.id);
        if(bs[0])bs[0].querySelector("span").textContent=formatVideoCount(l.count||0);
        const comm=await supabaseClient.from("video_comments").select("id",{count:"exact",head:true}).eq("video_id",v.id);
        if(bs[1])bs[1].querySelector("span").textContent=formatVideoCount(comm.count||0);
        if(currentUser){
            const sv=await supabaseClient.from("video_saves").select("id").eq("video_id",v.id).eq("user_id",currentUser.id).maybeSingle();
            if(sv.data&&bs[2]){bs[2].classList.add("saved");bs[2].querySelector("i").className="fas fa-bookmark";}
            const lk=await supabaseClient.from("video_likes").select("id").eq("video_id",v.id).eq("user_id",currentUser.id).maybeSingle();
            if(lk.data&&bs[0]){bs[0].classList.add("liked");bs[0].querySelector("i").className="fas fa-heart";}
            
            const fl=await supabaseClient.from("followers").select("id").eq("follower_id",currentUser.id).eq("following_id",v.user_id).maybeSingle();
            const fBtn=document.getElementById(`follow-btn-${v.user_id}`);
            if(fBtn && (fl.data || currentUser.id===v.user_id)){
                if(currentUser.id===v.user_id) fBtn.style.display='none';
                else{fBtn.textContent="Following";fBtn.classList.add("following");}
            }
        }
    }
}
async function likeVideo(id,btn){
    if(!currentUser){alert("Please login first");return;}
    try{
        const ex=await supabaseClient.from("video_likes").select("id").eq("video_id",id).eq("user_id",currentUser.id).maybeSingle();
        if(ex.data){
            await supabaseClient.from("video_likes").delete().eq("id",ex.data.id);

async function handleOptionAction(action){

        try{await navigator.clipboard.writeText(url);alert("Video link copied!");}catch(e){alert(url);}
    }else if(action==='download'){
        alert("Ana shirya bidiyon tare da StudentX Watermark...");
        try{
            const video = document.createElement('video');
            video.crossOrigin = 'anonymous';
            video.src = v.video_url;
            video.muted = false;
            
            await new Promise((resolve, reject) => {
                video.onloadedmetadata = () => resolve();
                video.onerror = () => reject(new Error("Video load failed"));
            });

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 720;
            canvas.height = video.videoHeight || 1280;
            const ctx = canvas.getContext('2d');

            const stream = canvas.captureStream(30);
            let recorder;
            try {
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            } catch(e) {
                try { recorder = new MediaRecorder(stream, { mimeType: 'video/webm' }); }
                catch(err) { recorder = new MediaRecorder(stream); }
            }

            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = `studentx_watermarked_${v.id}.webm`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
                alert("An sauke bidiyon da StudentX watermark cikin nasara!");
            };

            recorder.start();
            video.play();

            function drawFrame() {
                if (video.paused || video.ended) {
                    recorder.stop();
                    return;
                }
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Rubuta StudentX Watermark a saman bidiyo (Akwatin dama a sama)
                ctx.save();
                ctx.font = 'bold 32px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 6;
                ctx.fillText('⚡ StudentX', canvas.width - 220, 70);
                ctx.restore();

                requestAnimationFrame(drawFrame);
            }
            video.onplay = () => drawFrame();

        } catch(e) {
            console.error(e);
            // Fallback idan na'urar mai amfani bataso ba, zai sauko ta yadda yake a al'ada
            const response = await fetch(v.video_url);
            const blob = await response.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = `studentx_video_${v.id}.mp4`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(blobUrl);
            alert("An sauke bidiyon ba tare da watermark ba saboda matsalar na'ura.");
        }
    }
}

document.addEventListener("DOMContentLoaded", () => {

  videos.forEach(video => {

    video.defaultMuted = false;
    video.volume = 1.0;

      console.log("StudentX: Video playing with sound");
    }).catch(() => {
      console.log("Browser blocked autoplay with sound");

      // Da zarar user ya taɓa screen/video, kunna sound
      const enableSound = () => {
        video.muted = false;
        video.volume = 1.0;

        video.play().catch(() => {});

        document.removeEventListener("click", enableSound);
        document.removeEventListener("touchstart", enableSound);
      };

      document.addEventListener("click", enableSound, { once: true });
      document.addEventListener("touchstart", enableSound, { once: true });
    });

    // Idan wani code ya sake saka mute, cire shi
    video.addEventListener("volumechange", () => {
      if (video.muted) {
        video.muted = false;
        video.volume = 1.0;
      }
    });

  });

});
