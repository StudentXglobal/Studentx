<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudentX Video</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

.video-feed{
    width:100%;
    height:100vh;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
}

.video-feed::-webkit-scrollbar{
    display:none;
}

.video-item{
    position:relative;
    width:100%;
    height:100vh;
    min-height:100vh;
    scroll-snap-align:start;
    background:#111;
    overflow:hidden;
}

.video-player{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

.video-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.85),
        rgba(0,0,0,.15) 45%,
        rgba(0,0,0,.25)
    );
    pointer-events:none;
}

.top-tabs{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:62px;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.65),
        transparent
    );
}

.top-tabs button{
    border:0;
    background:none;
    color:#aaa;
    font-size:15px;
    font-weight:600;
}

.top-tabs button.active{
    color:#fff;
}

.upload-btn{
    position:fixed;
    right:15px;
    top:16px;
    z-index:25;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.45);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
}

.video-info{
    position:absolute;
    left:15px;
    right:85px;
    bottom:82px;
    z-index:10;
}

.user-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.profile-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #fff;
    background:#222;
}

.user-name{
    font-size:15px;
    font-weight:700;
}

.user-username{
    margin-top:3px;
    color:#ccc;
    font-size:12px;
}

.follow-btn{
    margin-left:5px;
    padding:6px 12px;
    border:1px solid rgba(255,255,255,.7);
    border-radius:7px;
    background:transparent;
    color:#fff;
    font-size:12px;
    font-weight:600;
}

.video-caption{
    font-size:14px;
    line-height:1.45;
    color:#fff;
    max-width:100%;
}

.action-column{
    position:absolute;
    right:12px;
    bottom:82px;
    z-index:15;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
}

.action-item{
    border:0;
    background:none;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    min-width:48px;
    cursor:pointer;
}

.action-item i{
    font-size:24px;
}

.action-count{
    font-size:11px;
    color:#fff;
}

.action-item.liked i{
    color:#ff315c;
}

.action-item.saved i{
    color:#7c5cff;
}

.more-btn{
    margin-top:2px;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:58px;
    z-index:30;
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:rgba(8,8,12,.92);
    border-top:1px solid rgba(255,255,255,.08);
}

.bottom-nav a{
    color:#888;
    text-decoration:none;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
}

.bottom-nav a.active{
    color:#fff;
}

.bottom-nav i{
    font-size:20px;
}

.empty-video{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
    font-size:14px;
}

.loading-video{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    color:#aaa;
    font-size:13px;
}

@media(min-width:700px){
    .video-item{
        max-width:500px;
        margin:auto;
    }

    .top-tabs,
    .bottom-nav{
        max-width:500px;
        margin:auto;
    }
}
</style>
</head>
</head>

<body>

<div class="top-tabs">
    <button class="active" id="followingTab">Following</button>
    <button id="forYouTab">For You</button>
    <button id="liveTab">Live</button>
</div>

<a href="upload.html" class="upload-btn">
    <i class="fa-solid fa-camera"></i>
</a>

<div id="videoFeed" class="video-feed">
    <div class="empty-video">
        Loading videos...
    </div>
</div>

<nav class="bottom-nav">

    <a href="home.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="explore.html">
        <i class="fa-solid fa-compass"></i>
        <span>Explore</span>
    </a>

    <a href="video.html" class="active">
        <i class="fa-solid fa-video"></i>
        <span>Video</span>
    </a>

    <a href="chat.html">
        <i class="fa-solid fa-message"></i>
        <span>Chat</span>
    </a>

    <a href="profile.html">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </a>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>

let currentUser = null;
let allVideos = [];
let currentFilter = "forYou";

function escapeHTML(text) {
    if (text === null || text === undefined) return "";

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function defaultAvatar() {
    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="100" height="100"
             viewBox="0 0 100 100">
            <rect width="100" height="100" fill="#171722"/>
            <circle cx="50" cy="38" r="20" fill="#777"/>
            <path d="M18 90c4-22 18-32 32-32s28 10 32 32"
                  fill="#777"/>
        </svg>
        `);
}

function timeAgo(dateString) {

    const date = new Date(dateString);
    const now = new Date();

    const seconds = Math.floor((now - date) / 1000);

    if (seconds < 60) {
        return "now";
    }

    const minutes = Math.floor(seconds / 60);

    if (minutes < 60) {
        return minutes + "m";
    }

    const hours = Math.floor(minutes / 60);

    if (hours < 24) {
        return hours + "h";
    }

    const days = Math.floor(hours / 24);

    if (days < 7) {
        return days + "d";
    }

    return date.toLocaleDateString();
}

async function loadCurrentUser() {

    const result =
        await supabaseClient.auth.getUser();

    if (result.error) {
        console.error(result.error);
        return;
    }

    currentUser = result.data.user || null;
}

async function loadVideos() {

    const feed = document.getElementById("videoFeed");

    feed.innerHTML = `
        <div class="loading-video">
            Loading videos...
        </div>
    `;

    try {

        const result = await supabaseClient
            .from("videos")
            .select("*")
            .order("created_at", {
                ascending: false
            });

        if (result.error) {
            throw result.error;
        }

        allVideos = result.data || [];

        if (!allVideos.length) {

            feed.innerHTML = `
                <div class="empty-video">
                    No videos available yet.
                </div>
            `;

            return;
        }

        await loadVideoProfiles();

        renderVideos();

    } catch (error) {

        console.error(
            "VIDEO LOAD ERROR:",
            error
        );

        feed.innerHTML = `
            <div class="empty-video">
                Unable to load videos.
            </div>
        `;
    }
}

async function loadVideoProfiles() {

    const userIds = [
        ...new Set(
            allVideos
                .map(video => video.user_id)
                .filter(Boolean)
        )
    ];

    if (!userIds.length) return;

    const result = await supabaseClient
        .from("profiles")
        .select(
            "id,full_name,username,avatar_url,university"
        )
        .in("id", userIds);

    if (result.error) {
        console.error(
            "PROFILE LOAD ERROR:",
            result.error
        );

        return;
    }

    const profiles = result.data || [];

    allVideos = allVideos.map(video => {

        const profile =
            profiles.find(
                p => p.id === video.user_id
            );

        return {
            ...video,
            profile: profile || null
        };
    });
}

function renderVideos() {

    const feed =
        document.getElementById("videoFeed");

    if (!allVideos.length) {

        feed.innerHTML = `
            <div class="empty-video">
                No videos available.
            </div>
        `;

        return;
    }

    feed.innerHTML = allVideos.map(video => {

        const profile = video.profile || {};

        const name =
            profile.full_name ||
            profile.username ||
            "StudentX User";

        const username =
            profile.username
            ? "@" + profile.username
            : "@studentx";

        const avatar =
            profile.avatar_url ||
            defaultAvatar();

        const caption =
            video.caption || "";

        return `
            <section
                class="video-item"
                data-video-id="${escapeHTML(video.id)}"
            >

                <video
                    class="video-player"
                    src="${escapeHTML(video.video_url)}"
                    ${video.thumbnail_url
                        ? `poster="${escapeHTML(video.thumbnail_url)}"`
                        : ""}
                    playsinline
                    loop
                    muted
                    preload="metadata"
                ></video>

                <div class="video-overlay"></div>

                <div class="video-info">

                    <div class="user-row">

                        <img
                            class="profile-avatar"
                            src="${escapeHTML(avatar)}"
                            onerror="this.src=defaultAvatar()"
                        >

                        <div>

                            <div class="user-name">
                                ${escapeHTML(name)}
                            </div>

                            <div class="user-username">
                                ${escapeHTML(username)}
                            </div>

                        </div>

                        ${
                            currentUser &&
                            currentUser.id !== video.user_id
                            ? `
                            <button
                                class="follow-btn"
                                onclick="followVideoUser('${escapeHTML(video.user_id)}')"
                            >
                                Follow
                            </button>
                            `
                            : ""
                        }

                    </div>

                    ${
                        caption
                        ? `
                        <div class="video-caption">
                            ${escapeHTML(caption)}
                        </div>
                        `
                        : ""
                    }

                </div>

                <div class="action-column">

                    <button
                        class="action-item"
                        onclick="toggleVideoLike('${escapeHTML(video.id)}', this)"
                    >
                        <i class="fa-regular fa-heart"></i>
                        <span class="action-count">0</span>
                    </button>

                    <button
                        class="action-item"
                        onclick="openVideoComments('${escapeHTML(video.id)}')"
                    >
                        <i class="fa-regular fa-comment"></i>
                        <span class="action-count">0</span>
                    </button>

                    <button
                        class="action-item"
                        onclick="toggleVideoSave('${escapeHTML(video.id)}', this)"
                    >
                        <i class="fa-regular fa-bookmark"></i>
                        <span class="action-count">Save</span>
                    </button>

                    <button
                        class="action-item"
                        onclick="shareVideo('${escapeHTML(video.id)}')"
                    >
                        <i class="fa-solid fa-share"></i>
                        <span class="action-count">Share</span>
                    </button>

                    <button
                        class="action-item more-btn"
                        onclick="openVideoMenu('${escapeHTML(video.id)}')"
                    >
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>

                </div>

            </section>
        `;

    }).join("");

    setupVideoObserver();
    loadVideoStats();
}

function setupVideoObserver() {

    const videos =
        document.querySelectorAll(
            ".video-player"
        );

    const observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    const video =
                        entry.target;

                    if (entry.isIntersecting) {

                        videos.forEach(other => {

                            if (other !== video) {
                                other.pause();
                            }

                        });

                        video.play().catch(() => {});

                    } else {

                        video.pause();

                    }

                });

            },
            {
                threshold: 0.65
            }
        );

    videos.forEach(video => {
        observer.observe(video);
    });
}
    async function loadVideoStats() {

    for (const video of allVideos) {

        const likeResult = await supabaseClient
            .from("video_likes")
            .select("id", { count: "exact", head: true })
            .eq("video_id", video.id);

        const saveResult = await supabaseClient
            .from("video_saves")
            .select("id", { count: "exact", head: true })
            .eq("video_id", video.id);

        const viewResult = await supabaseClient
            .from("video_views")
            .select("id", { count: "exact", head: true })
            .eq("video_id", video.id);

        const card = document.querySelector(
            `[data-video-id="${video.id}"]`
        );

        if (!card) continue;

        const buttons =
            card.querySelectorAll(".action-item");

        if (buttons[0]) {
            buttons[0]
                .querySelector(".action-count")
                .textContent =
                formatCount(likeResult.count || 0);
        }

        if (buttons[2]) {
            buttons[2]
                .querySelector(".action-count")
                .textContent =
                "Save";
        }

        if (buttons[1]) {
            buttons[1]
                .querySelector(".action-count")
                .textContent =
                formatCount(viewResult.count || 0);
        }

        await checkVideoLike(video.id, buttons[0]);
        await checkVideoSave(video.id, buttons[2]);

        await recordVideoView(video.id);
    }
}


function formatCount(number) {

    if (number >= 1000000) {
        return (number / 1000000)
            .toFixed(1)
            .replace(".0", "") + "M";
    }

    if (number >= 1000) {
        return (number / 1000)
            .toFixed(1)
            .replace(".0", "") + "K";
    }

    return String(number);
}


async function checkVideoLike(videoId, button) {

    if (!currentUser || !button) return;

    const result = await supabaseClient
        .from("video_likes")
        .select("id")
        .eq("video_id", videoId)
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (result.data) {

        button.classList.add("liked");

        button.querySelector("i").className =
            "fa-solid fa-heart";
    }
}


async function toggleVideoLike(videoId, button) {

    if (!currentUser) {
        alert("Please login first");
        return;
    }

    try {

        const existing = await supabaseClient
            .from("video_likes")
            .select("id")
            .eq("video_id", videoId)
            .eq("user_id", currentUser.id)
            .maybeSingle();

        if (existing.data) {

            const result = await supabaseClient
                .from("video_likes")
                .delete()
                .eq("id", existing.data.id);

            if (result.error) {
                throw result.error;
            }

            button.classList.remove("liked");

            button.querySelector("i").className =
                "fa-regular fa-heart";

        } else {

            const result = await supabaseClient
                .from("video_likes")
                .insert({
                    video_id: videoId,
                    user_id: currentUser.id
                });

            if (result.error) {
                throw result.error;
            }

            button.classList.add("liked");

            button.querySelector("i").className =
                "fa-solid fa-heart";
        }

        const countResult =
            await supabaseClient
            .from("video_likes")
            .select("id", {
                count: "exact",
                head: true
            })
            .eq("video_id", videoId);

        button.querySelector(".action-count")
            .textContent =
            formatCount(countResult.count || 0);

    } catch (error) {

        console.error(
            "VIDEO LIKE ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to like video"
        );
    }
}


async function checkVideoSave(videoId, button) {

    if (!currentUser || !button) return;

    const result = await supabaseClient
        .from("video_saves")
        .select("id")
        .eq("video_id", videoId)
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (result.data) {

        button.classList.add("saved");

        button.querySelector("i").className =
            "fa-solid fa-bookmark";
    }
}


async function toggleVideoSave(videoId, button) {

    if (!currentUser) {
        alert("Please login first");
        return;
    }

    try {

        const existing = await supabaseClient
            .from("video_saves")
            .select("id")
            .eq("video_id", videoId)
            .eq("user_id", currentUser.id)
            .maybeSingle();

        if (existing.data) {

            const result = await supabaseClient
                .from("video_saves")
                .delete()
                .eq("id", existing.data.id);

            if (result.error) {
                throw result.error;
            }

            button.classList.remove("saved");

            button.querySelector("i").className =
                "fa-regular fa-bookmark";

        } else {

            const result = await supabaseClient
                .from("video_saves")
                .insert({
                    video_id: videoId,
                    user_id: currentUser.id
                });

            if (result.error) {
                throw result.error;
            }

            button.classList.add("saved");

            button.querySelector("i").className =
                "fa-solid fa-bookmark";
        }

    } catch (error) {

        console.error(
            "VIDEO SAVE ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to save video"
        );
    }
}


async function recordVideoView(videoId) {

    if (!currentUser) return;

    const alreadyViewed =
        sessionStorage.getItem(
            "video_view_" + videoId
        );

    if (alreadyViewed) return;

    const result = await supabaseClient
        .from("video_views")
        .insert({
            video_id: videoId,
            user_id: currentUser.id
        });

    if (!result.error) {

        sessionStorage.setItem(
            "video_view_" + videoId,
            "1"
        );
    }
}


async function followVideoUser(userId) {

    if (!currentUser) {
        alert("Please login first");
        return;
    }

    if (currentUser.id === userId) return;

    const existing =
        await supabaseClient
        .from("followers")
        .select("id")
        .eq("follower_id", currentUser.id)
        .eq("following_id", userId)
        .maybeSingle();

    if (existing.data) {

        alert("Already following");

        return;
    }

    const result =
        await supabaseClient
        .from("followers")
        .insert({
            follower_id: currentUser.id,
            following_id: userId
        });

    if (result.error) {

        console.error(
            "FOLLOW ERROR:",
            result.error
        );

        alert(
            result.error.message ||
            "Unable to follow user"
        );

        return;
    }

    alert("Following");
}


function openVideoComments(videoId) {

    window.location.href =
        "comment.html?video=" +
        encodeURIComponent(videoId);
}


async function shareVideo(videoId) {

    const url =
        window.location.origin +
        "/video.html?video=" +
        encodeURIComponent(videoId);

    if (navigator.share) {

        try {

            await navigator.share({
                title: "StudentX Video",
                text: "Watch this video on StudentX",
                url: url
            });

        } catch (error) {

            console.log(
                "Share cancelled"
            );
        }

    } else {

        await navigator.clipboard.writeText(url);

        alert(
            "Video link copied"
        );
    }
}


function openVideoMenu(videoId) {

    const video =
        allVideos.find(
            item => item.id === videoId
        );

    if (!video) return;

    if (
        currentUser &&
        video.user_id === currentUser.id
    ) {

        const action =
            confirm(
                "Delete this video?"
            );

        if (action) {
            deleteVideo(videoId);
        }

    } else {

        alert(
            "Video options coming next"
        );
    }
}


async function deleteVideo(videoId) {

    if (!currentUser) return;

    const video =
        allVideos.find(
            item => item.id === videoId
        );

    if (!video) return;

    if (video.user_id !== currentUser.id) {

        alert(
            "You can only delete your own video"
        );

        return;
    }

    const result =
        await supabaseClient
        .from("videos")
        .delete()
        .eq("id", videoId)
        .eq("user_id", currentUser.id);

    if (result.error) {

        console.error(
            "DELETE VIDEO ERROR:",
            result.error
        );

        alert(
            result.error.message ||
            "Unable to delete video"
        );

        return;
    }

    await loadVideos();
}


document
    .getElementById("followingTab")
    .addEventListener("click", function () {

        currentFilter = "following";

        setActiveTab(this);

        loadVideos();
    });


document
    .getElementById("forYouTab")
    .addEventListener("click", function () {

        currentFilter = "forYou";

        setActiveTab(this);

        loadVideos();
    });


document
    .getElementById("liveTab")
    .addEventListener("click", function () {

        window.location.href =
            "live.html";
    });


function setActiveTab(button) {

    document
        .querySelectorAll(".top-tabs button")
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });

    button.classList.add("active");
}


async function initVideoPage() {

    await loadCurrentUser();

    await loadVideos();
}


initVideoPage();

</script>

</body>
</html>
