<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video - StudentX</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            background-color: #000;
            color: #fff;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* --- WURI ƊIN DA AKE SCROLL (FEED CONTAINER) --- */
        .feed-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            bottom: 60px; /* Ya bar wuri 60px domin Nav Bar */
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .feed-container::-webkit-scrollbar {
            display: none;
        }

        /* Kowane Video Ɗaya-ɗaya */
        .video-item {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background-color: #111;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
        }
        .video-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            pointer-events: none;
            z-index: 1;
        }

        /* --- SASHIN SAMA (TOP BAR) - FIXED --- */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 15px 15px;
            z-index: 1001; /* Mafi girma don ya kasance a kowanne lokaci */
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            pointer-events: none;
        }
        .top-tabs {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }
        .tab {
            color: #ccc;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            text-decoration: none;
        }
        .tab.active {
            color: #fff;
            font-weight: bold;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background-color: #fff;
            border-radius: 2px;
        }
        
        /* Alamar Upload */
        .upload-btn {
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 40px;
            height: 32px;
            pointer-events: auto;
        }
        .upload-btn .fa-camera {
            font-size: 26px;
        }
        .upload-btn .fa-plus {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            background-color: #8A2BE2;
            border-radius: 50%;
            padding: 2px 3px;
            border: 1px solid #fff;
        }

        /* --- SASHIN DAMA (RIGHT ACTION BAR) --- */
        .right-bar {
            position: absolute;
            right: 10px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 15;
        }
        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
        }
        .action-item i, .action-item svg {
            font-size: 30px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.2s;
        }
        .action-item:active i, .action-item:active svg {
            transform: scale(1.2);
        }
        .action-count {
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* Profile da Follow Button */
        .profile-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        .profile-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
        }
        .follow-btn {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 22px;
            background-color: #8A2BE2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #000;
            cursor: pointer;
            color: #fff;
            font-size: 12px;
        }
        .follow-btn.followed {
            display: none;
        }

        .like-btn.liked i {
            color: #ff4b4b;
            animation: pop 0.3s;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .save-btn.saved i {
            color: #fbbf24;
        }

        /* --- SASHIN KASA-HAGU (BOTTOM INFO) --- */
        .bottom-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 80px;
            z-index: 10;
        }
        .user-fullname {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .user-username {
            font-size: 14px;
            div: not(.bnav) {
                pointer-events: none;
            }
            color: #ddd;
            margin-bottom: 8px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .video-caption {
            font-size: 14px;
            color: #eee;
            line-height: 1.4;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* Tsarin Double Tap Like */
        .heart-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            color: #ff4b4b;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
        }
        .heart-animation i {
            font-size: 100px;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        .heart-animation.animate {
            animation: heartPop 0.8s ease;
        }
        @keyframes heartPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            30% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
        }

        /* --- SASHIN NAVIGATION ƊIN ƘASA (BOTTOM NAV BAR) - FIXED --- */
        /* An sa shi da tsarin da ka so (div da onclick) */
        .bnav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #000;
            border-top: 1px solid #222;
            z-index: 2000; /* An ɗaukaka shi sosai domin ya nuna koyaushe */
        }
        .nb {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            cursor: pointer;
            gap: 3px;
            text-decoration: none;
        }
        .nb.on {
            color: #fff;
        }
        .nb i {
            font-size: 20px;
        }
        .nb span {
            font-size: 10px;
            font-weight: 500;
        }

    </style>
</head>
<body>

                <!-- VIEWS ICON -->

    <!-- Navigation Bar (Ainihin tsarin da ka so) -->

    <script>
        const feedContainer = document.getElementById('feedContainer');

        feedContainer.addEventListener('click', function(event) {
            // Follow Button
            if (event.target.closest('.follow-btn')) {
                event.target.closest('.follow-btn').classList.add('followed');
            }

            // Like Button
            if (event.target.closest('.like-btn')) {
                const btn = event.target.closest('.like-btn');
                const countSpan = btn.querySelector('.action-count');
                if (btn.classList.contains('liked')) {
                    btn.classList.remove('liked');
                    countSpan.innerText = parseInt(countSpan.innerText.replace('K', '000').replace('.', '')) === 45200 ? "45.2K" : "12.5K";
                } else {
                    btn.classList.add('liked');
                    count-countSpan.innerText = parseInt(countSpan.innerText.replace('K', '000').replace('.', '')) === 45200 ? "45.3K" : "12.6K";
                }
            }

            // Save Button
            if (event.target.closest('.save-btn')) {
                event.target.closest('.save-btn').classList.toggle('saved');
            }

            // Double Tap Like
            const videoItem = event.target.closest('.video-item');
            if (videoItem && !event.target.closest('.right-bar') && !event.target.closest('.bnav')) {
                const heart = videoItem.querySelector('.heart-animation');
                const currentTime = new Date().getTime();
                
                if (videoItem.lastTap && (currentTime - videoItem.lastTap < 300)) {
                    const likeBtn = videoItem.querySelector('.like-btn');
                    if (!likeBtn.classList.contains('liked')) {
                        likeBtn.classList.add('liked');
                        const countSpan = likeBtn.querySelector('.action-count');
                        countSpan.innerText = "45.3K";
                    }
                    heart.classList.remove('animate');
                    void heart.offsetWidth;
                    heart.classList.add('animate');
                }
                videoItem.lastTap = currentTime;
            }
        });
    </script>
