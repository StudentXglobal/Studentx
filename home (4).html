<script>

let currentUser = null;
let videos = [];


/* DEFAULT AVATAR */

function defaultAvatar(){

    return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="100"
             height="100"
             viewBox="0 0 100 100">

            <rect
                width="100"
                height="100"
                fill="#171722"/>

            <circle
                cx="50"
                cy="38"
                r="20"
                fill="#777"/>

            <path
                d="M18 90c4-22 18-32 32-32s28 10 32 32"
                fill="#777"/>

        </svg>
    `);

}


/* SECURITY */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* TIME */

function timeAgo(date){

    const now = new Date();

    const old = new Date(date);

    const seconds =
        Math.floor(
            (now - old) / 1000
        );

    if(seconds < 60){

        return "now";

    }

    const minutes =
        Math.floor(
            seconds / 60
        );

    if(minutes < 60){

        return minutes + "m";

    }

    const hours =
        Math.floor(
            minutes / 60
        );

    if(hours < 24){

        return hours + "h";

    }

    const days =
        Math.floor(
            hours / 24
        );

    if(days < 7){

        return days + "d";

    }

    return old.toLocaleDateString();

}


/* CURRENT USER */

async function loadCurrentUser(){

    const result =
        await supabaseClient
        .auth
        .getUser();

    if(result.error){

        console.error(
            "USER ERROR:",
            result.error
        );

        return;

    }

    currentUser =
        result.data.user || null;

}


/* LOAD VIDEOS */

async function loadVideos(){

    const feed =
        document.getElementById(
            "videoFeed"
        );

    feed.innerHTML = `
        <div class="video-message">
            Loading videos...
        </div>
    `;


    const result =
        await supabaseClient
        .from("videos")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(result.error){

        console.error(
            "VIDEO ERROR:",
            result.error
        );

        feed.innerHTML = `
            <div class="video-message">
                Unable to load videos.
            </div>
        `;

        return;

    }


    videos =
        result.data || [];


    if(!videos.length){

        feed.innerHTML = `
            <div class="video-message">
                No videos yet.
            </div>
        `;

        return;

    }


    await loadProfiles();

    renderVideos();

}


/* LOAD PROFILES */

async function loadProfiles(){

    const userIds =
        [
            ...new Set(
                videos
                .map(video =>
                    video.user_id
                )
                .filter(Boolean)
            )
        ];


    if(!userIds.length){

        return;

    }


    const result =
        await supabaseClient
        .from("profiles")
        .select(
            "id,full_name,username,avatar_url,university"
        )
        .in(
            "id",
            userIds
        );


    if(result.error){

        console.error(
            "PROFILE ERROR:",
            result.error
        );

        return;

    }


    const profiles =
        result.data || [];


    videos =
        videos.map(video => {

            const profile =
                profiles.find(
                    item =>
                        item.id ===
                        video.user_id
                );


            return {
                ...video,
                profile:
                    profile || null
            };

        });

}


/* RENDER VIDEOS */

function renderVideos(){

    const feed =
        document.getElementById(
            "videoFeed"
        );


    feed.innerHTML =
        videos.map(video => {

            const profile =
                video.profile || {};


            const name =
                profile.full_name ||
                profile.username ||
                "StudentX User";


            const username =
                profile.username
                ? "@" +
                  profile.username
                : "@studentx";


            const avatar =
                profile.avatar_url ||
                defaultAvatar();


            const caption =
                video.caption || "";


            return `

            <section
                class="video-item"
                data-video-id="${escapeHTML(video.id)}"
            >


                <video

                    class="video-player"

                    src="${escapeHTML(
                        video.video_url
                    )}"

                    ${
                        video.thumbnail_url
                        ?
                        `poster="${escapeHTML(
                            video.thumbnail_url
                        )}"`
                        :
                        ""
                    }

                    playsinline

                    loop

                    muted

                    preload="metadata"

                ></video>


                <div class="video-overlay"></div>


                <div class="video-info">


                    <div class="video-user">


                        <img

                            class="video-avatar"

                            src="${escapeHTML(
                                avatar
                            )}"

                            onerror="
                                this.src=defaultAvatar()
                            "

                        >


                        <div
                            class="video-user-details"
                        >

                            <div
                                class="video-name"
                            >
                                ${escapeHTML(
                                    name
                                )}
                            </div>


                            <div
                                class="video-username"
                            >
                                ${escapeHTML(
                                    username
                                )}
                            </div>

                        </div>


                        ${
                            currentUser &&
                            currentUser.id !==
                            video.user_id
                            ?

                            `
                            <button
                                class="video-follow"
                                onclick="
                                    followVideo(
                                        '${escapeHTML(
                                            video.user_id
                                        )}'
                                    )
                                "
                            >
                                Follow
                            </button>
                            `

                            :

                            ""
                        }


                    </div>


                    ${
                        caption
                        ?

                        `
                        <div
                            class="video-caption"
                        >
                            ${escapeHTML(
                                caption
                            )}
                        </div>
                        `

                        :

                        ""
                    }


                </div>


                <div class="video-actions">


                    <button
                        class="video-action"
                        onclick="
                            likeVideo(
                                '${escapeHTML(
                                    video.id
                                )}',
                                this
                            )
                        "
                    >

                        <i
                            class="far fa-heart"
                        ></i>

                        <span>0</span>

                    </button>


                    <button
                        class="video-action"
                        onclick="
                            openVideoComments(
                                '${escapeHTML(
                                    video.id
                                )}'
                            )
                        "
                    >

                        <i
                            class="far fa-comment"
                        ></i>

                        <span>0</span>

                    </button>


                    <button
                        class="video-action"
                        onclick="
                            saveVideo(
                                '${escapeHTML(
                                    video.id
                                )}',
                                this
                            )
                        "
                    >

                        <i
                            class="far fa-bookmark"
                        ></i>

                        <span>Save</span>

                    </button>


                    <button
                        class="video-action"
                        onclick="
                            shareVideo(
                                '${escapeHTML(
                                    video.id
                                )}'
                            )
                        "
                    >

                        <i
                            class="fas fa-share"
                        ></i>

                        <span>Share</span>

                    </button>


                    <button
                        class="video-action"
                        onclick="
                            videoMenu(
                                '${escapeHTML(
                                    video.id
                                )}'
                            )
                        "
                    >

                        <i
                            class="fas fa-ellipsis-vertical"
                        ></i>

                    </button>


                </div>


            </section>

            `;

        }).join("");


    setupVideoPlayback();

    loadVideoCounts();

}


/* VIDEO PLAY / PAUSE */

function setupVideoPlayback(){

    const players =
        document.querySelectorAll(
            ".video-player"
        );


    const observer =
        new IntersectionObserver(

            entries => {

                entries.forEach(
                    entry => {

                        const video =
                            entry.target;


                        if(
                            entry.isIntersecting
                        ){

                            players.forEach(
                                other => {

                                    if(
                                        other !==
                                        video
                                    ){

                                        other.pause();

                                    }

                                }
                            );


                            video.play()
                            .catch(
                                () => {}
                            );

                        }
                        else{

                            video.pause();

                        }

                    }
                );

            },

            {
                threshold:0.65
            }

        );


    players.forEach(
        video =>
            observer.observe(video)
    );

}


/* START */

async function initVideo(){

    await loadCurrentUser();

    await loadVideos();

}


initVideo();

                                 </script>
                                 <script>

/* =========================
   FORMAT NUMBER
========================= */

function formatVideoCount(number){

    number = Number(number || 0);

    if(number >= 1000000){
        return (number / 1000000)
            .toFixed(1)
            .replace(".0","") + "M";
    }

    if(number >= 1000){
        return (number / 1000)
            .toFixed(1)
            .replace(".0","") + "K";
    }

    return String(number);
}


/* =========================
   LOAD COUNTS
========================= */

async function loadVideoCounts(){

    for(const video of videos){

        const card =
            document.querySelector(
                `[data-video-id="${video.id}"]`
            );

        if(!card) continue;


        const buttons =
            card.querySelectorAll(
                ".video-action"
            );


        /* LIKES */

        const likes =
            await supabaseClient
            .from("video_likes")
            .select("id",{
                count:"exact",
                head:true
            })
            .eq(
                "video_id",
                video.id
            );


        if(buttons[0]){

            buttons[0]
            .querySelector("span")
            .textContent =
                formatVideoCount(
                    likes.count || 0
                );

        }


        /* COMMENTS */

        const comments =
            await supabaseClient
            .from("video_comments")
            .select("id",{
                count:"exact",
                head:true
            })
            .eq(
                "video_id",
                video.id
            );


        if(buttons[1]){

            buttons[1]
            .querySelector("span")
            .textContent =
                formatVideoCount(
                    comments.count || 0
                );

        }


        /* VIEWS */

        const views =
            await supabaseClient
            .from("video_views")
            .select("id",{
                count:"exact",
                head:true
            })
            .eq(
                "video_id",
                video.id
            );


        /* SAVE STATUS */

        if(currentUser){

            const saved =
                await supabaseClient
                .from("video_saves")
                .select("id")
                .eq(
                    "video_id",
                    video.id
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();


            if(
                saved.data &&
                buttons[2]
            ){

                buttons[2]
                .classList.add("saved");

                buttons[2]
                .querySelector("i")
                .className =
                    "fas fa-bookmark";

            }


            /* LIKE STATUS */

            const liked =
                await supabaseClient
                .from("video_likes")
                .select("id")
                .eq(
                    "video_id",
                    video.id
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();


            if(
                liked.data &&
                buttons[0]
            ){

                buttons[0]
                .classList.add("liked");

                buttons[0]
                .querySelector("i")
                .className =
                    "fas fa-heart";

            }

        }

    }

}


/* =========================
   LIKE VIDEO
========================= */

async function likeVideo(
    videoId,
    button
){

    if(!currentUser){

        alert("Please login first");

        return;

    }


    try{

        const existing =
            await supabaseClient
            .from("video_likes")
            .select("id")
            .eq(
                "video_id",
                videoId
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


        if(existing.data){

            const result =
                await supabaseClient
                .from("video_likes")
                .delete()
                .eq(
                    "id",
                    existing.data.id
                );


            if(result.error)
                throw result.error;


            button.classList.remove(
                "liked"
            );

            button.querySelector("i")
                .className =
                "far fa-heart";


        }else{

            const result =
                await supabaseClient
                .from("video_likes")
                .insert({

                    video_id:
                        videoId,

                    user_id:
                        currentUser.id

                });


            if(result.error)
                throw result.error;


            button.classList.add(
                "liked"
            );

            button.querySelector("i")
                .className =
                "fas fa-heart";

        }


        const count =
            await supabaseClient
            .from("video_likes")
            .select("id",{
                count:"exact",
                head:true
            })
            .eq(
                "video_id",
                videoId
            );


        button.querySelector("span")
            .textContent =
            formatVideoCount(
                count.count || 0
            );


    }catch(error){

        console.error(
            "LIKE VIDEO ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to like video"
        );

    }

}

/* =========================
   RECORD VIEW
========================= */

async function recordVideoView(
    videoId
){

    if(!currentUser)
        return;


    const key =
        "studentx_video_view_" +
        videoId;


    if(
        sessionStorage.getItem(key)
    ){

        return;

    }


    const result =
        await supabaseClient
        .from("video_views")
        .insert({

            video_id:
                videoId,

            user_id:
                currentUser.id

        });


    if(result.error){

        console.error(
            "VIEW ERROR:",
            result.error
        );

        return;

    }


    sessionStorage.setItem(
        key,
        "1"
    );

}


/* =========================
   FOLLOW USER
========================= */

async function followVideo(
    userId
){

    if(!currentUser){

        alert("Please login first");

        return;

    }


    if(
        currentUser.id === userId
    ){

        return;

    }


    const existing =
        await supabaseClient
        .from("followers")
        .select("id")
        .eq(
            "follower_id",
            currentUser.id
        )
        .eq(
            "following_id",
            userId
        )
        .maybeSingle();


    if(existing.data){

        alert("Already following");

        return;

    }


    const result =
        await supabaseClient
        .from("followers")
        .insert({

            follower_id:
                currentUser.id,

            following_id:
                userId

        });


    if(result.error){

        console.error(
            "FOLLOW ERROR:",
            result.error
        );

        alert(
            result.error.message ||
            "Unable to follow"
        );

        return;

    }


    alert("Following");

}

/* =========================
   SHARE
========================= */

async function shareVideo(
    videoId
){

    const url =
        window.location.origin +
        "/video.html?video=" +
        encodeURIComponent(
            videoId
        );


    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:
                    "StudentX Video",

                text:
                    "Watch this video on StudentX",

                url:url

            });

        }catch(error){

            console.log(
                "Share cancelled"
            );

        }

        return;

    }


    try{

        await navigator.clipboard
            .writeText(url);

        alert(
            "Video link copied"
        );

    }catch(error){

        alert(url);

    }

}


/* =========================
   MORE
========================= */

function videoMenu(
    videoId
){

    const video =
        videos.find(
            item =>
                item.id ===
                videoId
        );


    if(!video) return;


    if(
        currentUser &&
        video.user_id ===
        currentUser.id
    ){

        const remove =
            confirm(
                "Delete this video?"
            );


        if(remove){

            deleteVideo(
                videoId
            );

        }

    }else{

        alert(
            "Video options will be added next."
        );

    }

}


/* =========================
   DELETE VIDEO
========================= */

async function deleteVideo(
    videoId
){

    if(!currentUser)
        return;


    const result =
        await supabaseClient
        .from("videos")
        .delete()
        .eq(
            "id",
            videoId
        )
        .eq(
            "user_id",
            currentUser.id
        );


    if(result.error){

        console.error(
            "DELETE VIDEO ERROR:",
            result.error
        );

        alert(
            result.error.message ||
            "Unable to delete video"
        );

        return;

    }


    await loadVideos();

}


/* =========================
   START VIEW TRACKING
========================= */

function setupVideoViews(){

    const items =
        document.querySelectorAll(
            ".video-item"
        );


    const observer =
        new IntersectionObserver(

            entries => {

                entries.forEach(
                    entry => {

                        if(
                            entry.isIntersecting
                        ){

                            const videoId =
                                entry.target
                                .dataset
                                .videoId;


                            if(videoId){

                                recordVideoView(
                                    videoId
                                );

                            }

                        }

                    }
                );

            },

            {
                threshold:0.7
            }

        );


    items.forEach(
        item =>
            observer.observe(item)
    );

}


/* =========================
   FOLLOWING FILTER
========================= */

async function loadFollowingVideos(){

    if(!currentUser){

        return [];

    }


    const result =
        await supabaseClient
        .from("followers")
        .select(
            "following_id"
        )
        .eq(
            "follower_id",
            currentUser.id
        );


    if(result.error){

        console.error(
            "FOLLOWING ERROR:",
            result.error
        );

        return [];

    }


    const ids =
        (result.data || [])
        .map(
            item =>
                item.following_id
        );


    if(!ids.length){

        return [];

    }


    return videos.filter(
        video =>
            ids.includes(
                video.user_id
            )
    );

}


/* =========================
   TAB FILTER
========================= */

async function showFollowing(){

    const following =
        await loadFollowingVideos();


    const original =
        videos;


    if(!following.length){

        document.getElementById(
            "videoFeed"
        ).innerHTML = `
            <div class="video-message">
                No videos from people you follow yet.
            </div>
        `;

        return;

    }


    videos = following;

    renderVideos();

    videos = original;

}

<script>

/* =========================
   UPLOAD VARIABLES
========================= */

let selectedVideoFile = null;

let selectedVideoUrl = null;


/* =========================
   OPEN UPLOAD
========================= */

function openVideoUpload(){

    const modal =
        document.getElementById(
            "uploadModal"
        );

    modal.classList.add("show");

    showUploadChooseArea();

}


/* =========================
   CLOSE UPLOAD
========================= */

function closeVideoUpload(){

    const modal =
        document.getElementById(
            "uploadModal"
        );

    modal.classList.remove("show");

    resetVideoUpload();

}


/* =========================
   CHOOSE AREA
========================= */

function showUploadChooseArea(){

    document.getElementById(
        "uploadChooseArea"
    ).style.display = "block";


    document.getElementById(
        "videoPreviewArea"
    ).style.display = "none";


    document.getElementById(
        "uploadProgress"
    ).style.display = "none";

}


/* =========================
   CAMERA
========================= */

function openVideoCamera(){

    const input =
        document.getElementById(
            "videoFileInput"
        );


    input.value = "";

    input.setAttribute(
        "capture",
        "environment"
    );


    input.click();

}


/* =========================
   PHONE FILE
========================= */

function chooseVideoFile(){

    const input =
        document.getElementById(
            "videoFileInput"
        );


    input.value = "";

    input.removeAttribute(
        "capture"
    );


    input.click();

}


/* =========================
   FILE SELECTED
========================= */

document
.getElementById("videoFileInput")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        if(
            !file.type.startsWith(
                "video/"
            )
        ){

            alert(
                "Please select a video file."
            );

            return;

        }


        selectedVideoFile = file;


        if(selectedVideoUrl){

            URL.revokeObjectURL(
                selectedVideoUrl
            );

        }


        selectedVideoUrl =
            URL.createObjectURL(
                file
            );


        const preview =
            document.getElementById(
                "uploadPreview"
            );


        preview.src =
            selectedVideoUrl;


        document.getElementById(
            "uploadChooseArea"
        ).style.display = "none";


        document.getElementById(
            "videoPreviewArea"
        ).style.display = "block";


        document.getElementById(
            "videoCaption"
        ).value = "";


        document.getElementById(
            "captionCount"
        ).textContent = "0";

    }
);


/* =========================
   CHANGE VIDEO
========================= */

function changeSelectedVideo(){

    selectedVideoFile = null;

    chooseVideoFile();

}


/* =========================
   CAPTION COUNTER
========================= */

document
.getElementById("videoCaption")
.addEventListener(
    "input",
    function(){

        document.getElementById(
            "captionCount"
        ).textContent =
            this.value.length;

    }
);


/* =========================
   RESET
========================= */

function resetVideoUpload(){

    selectedVideoFile = null;


    if(selectedVideoUrl){

        URL.revokeObjectURL(
            selectedVideoUrl
        );

        selectedVideoUrl = null;

    }


    const preview =
        document.getElementById(
            "uploadPreview"
        );


    if(preview){

        preview.pause();

        preview.removeAttribute(
            "src"
        );

        preview.load();

    }


    const input =
        document.getElementById(
            "videoFileInput"
        );


    if(input){

        input.value = "";

    }


    const caption =
        document.getElementById(
            "videoCaption"
        );


    if(caption){

        caption.value = "";

    }


    document.getElementById(
        "captionCount"
    ).textContent = "0";


    showUploadChooseArea();

}


/* =========================
   PUBLISH VIDEO
========================= */

async function publishVideo(){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    if(!selectedVideoFile){

        alert(
            "Please select a video."
        );

        return;

    }


    const button =
        document.getElementById(
            "postVideoBtn"
        );


    const progress =
        document.getElementById(
            "uploadProgress"
        );


    const progressBar =
        document.getElementById(
            "progressBar"
        );


    try{

        button.disabled = true;

        progress.style.display =
            "block";


        progressBar.style.width =
            "10%";


        const extension =
            getVideoExtension(
                selectedVideoFile
            );


        const filePath =
            currentUser.id +
            "/" +
            Date.now() +
            "." +
            extension;


        /* =====================
           UPLOAD TO STORAGE
        ===================== */

        const uploadResult =
            await supabaseClient
            .storage
            .from("videos")
            .upload(
                filePath,
                selectedVideoFile,
                {
                    cacheControl:"3600",

                    contentType:
                        selectedVideoFile.type ||
                        "video/mp4",

                    upsert:false
                }
            );


        if(uploadResult.error){

            throw uploadResult.error;

        }


        progressBar.style.width =
            "65%";


        /* =====================
           GET PUBLIC URL
        ===================== */

        const publicResult =
            supabaseClient
            .storage
            .from("videos")
            .getPublicUrl(
                filePath
            );


        const videoUrl =
            publicResult
            .data
            .publicUrl;


        if(!videoUrl){

            throw new Error(
                "Unable to create video URL."
            );

        }


        /* =====================
           INSERT DATABASE ROW
        ===================== */

        const caption =
            document
            .getElementById(
                "videoCaption"
            )
            .value
            .trim();


        const insertResult =
            await supabaseClient
            .from("videos")
            .insert({

                user_id:
                    currentUser.id,

                video_url:
                    videoUrl,

                thumbnail_url:
                    null,

                caption:
                    caption || null

            })
            .select()
            .single();


        if(insertResult.error){

            throw insertResult.error;

        }


        progressBar.style.width =
            "100%";


        /* =====================
           SUCCESS
        ===================== */

        setTimeout(
            async function(){

                closeVideoUpload();


                await loadVideos();


                window.scrollTo({

                    top:0,

                    behavior:"smooth"

                });

            },
            400
        );


    }catch(error){

        console.error(
            "VIDEO UPLOAD ERROR:",
            error
        );


        alert(
            error.message ||
            "Video upload failed."
        );


        progress.style.display =
            "none";


    }finally{

        button.disabled = false;

    }

}


/* =========================
   GET EXTENSION
========================= */

function getVideoExtension(file){

    const name =
        file.name || "";


    const parts =
        name.split(".");


    if(parts.length > 1){

        const ext =
            parts
            .pop()
            .toLowerCase();


        if(
            /^[a-z0-9]+$/.test(ext)
        ){

            return ext;

        }

    }


    if(
        file.type ===
        "video/webm"
    ){

        return "webm";

    }


    if(
        file.type ===
        "video/quicktime"
    ){

        return "mov";

    }


    return "mp4";

}

   REPLACE OLD UPLOAD BUTTON
========================= */

const uploadButton =
    document.getElementById(
        "uploadVideoBtn"
    );


if(uploadButton){

    uploadButton.onclick =

            event.preventDefault();

            openVideoUpload();

        };

}
