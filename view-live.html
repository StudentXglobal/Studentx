="price"><i class="fas fa-coins"></i>10,000</span></button><button class="giftitem" onclick="sendGift('Universe',20000,'◉')"><span class="gifticon" style="color:#e37cff">◉</span><span class="giftname">Universe</span><span class="price"><i class="fas fa-coins"></i>20,000</span></button></div></section>

<script>
(function(){"use strict";
const URL="https://acragelglvdnqhvbjcgx.supabase.co",KEY="sb_publishable_O2kgvCZ8CxPKghH7MJn7nw_R-l61YuH",$=id=>document.getElementById(id);
const video=$("remoteVideo"),loading=$("loading"),loadingText=$("loadingText"),error=$("error"),errorTitle=$("errorTitle"),errorMessage=$("errorMessage");
let db,user,live,room,viewerId,joined=false,leaving=false,muted=false,followed=false,countTimer,coins=2450;
function client(){if(window.supabaseClient?.from)return window.supabaseClient;if(window.supabase?.createClient)return window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});throw Error("StudentX Supabase client could not be initialized.")}
function setLoading(t){error.style.display="none";loading.style.display="flex";loadingText.textContent=t}function showError(t,m){loading.style.display="none";error.style.display="flex";errorTitle.textContent=t;errorMessage.textContent=m}

function sid(){const p=new URLSearchParams(location.search),v=(p.get("id")||p.get("session")||p.get("room")||"").trim();return !v||/^(null|undefined)$/i.test(v)?null:v}function uuid(v){return/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v)}
async function auth(){let r=await db.auth.getSession(),s=r.data?.session;if(!s){r=await db.auth.refreshSession();s=r.data?.session}if(!s){showError("Login required","Please login before watching this live.");return false}r=await db.auth.getUser();if(r.error||!r.data?.user){showError("Login required","Your StudentX login session has expired.");return false}user=r.data.user;return true}
async function loadLive(){const q=sid();let r;if(q){if(!uuid(q)){showError("Invalid live link","The live session ID is not a valid UUID.");return false}r=await db.from("live_sessions").select("*").eq("id",q).eq("status","live").maybeSingle()}else r=await db.from("live_sessions").select("*").eq("status","live").order("started_at",{ascending:false}).limit(1).maybeSingle();if(r.error){showError("Unable to load live",r.error.message);return false}if(!r.data){showError("No live stream","There is currently no active live stream.");return false}live=r.data;history.replaceState({},"",location.pathname+"?id="+encodeURIComponent(live.id));return true}
async function profile(){const id=live.broadcaster_id||live.user_id,r=await db.from("profiles").select("id,full_name,username,avatar_url,department,city,state").eq("id",id).maybeSingle();if(r.data){$("streamerName").textContent=r.data.full_name||"StudentX User";$("streamerUsername").textContent=r.data.username?"@"+r.data.username:"@studentx";$("streamerSub").textContent=[r.data.department,[r.data.city,r.data.state].filter(Boolean).join(", ")].filter(Boolean).join(" • ")||"StudentX Live";if(r.data.avatar_url)$("avatar").src=r.data.avatar_url}$("liveDescription").textContent=live.description||live.title||"Connect, Learn, Share.";return true}
async function viewers(){if(!live)return;const r=await db.from("live_viewers").select("id",{count:"exact",head:true}).eq("session_id",live.id).is("left_at",null);if(!r.error){const n=r.count||0;$("viewerCount").textContent=n>=1000?(n/1000).toFixed(1)+"K":n;$("viewerLabel").textContent=n+" viewer"+(n===1?"":"s")}}
async function viewerRow(){const r=await db.from("live_viewers").select("id").eq("session_id",live.id).eq("user_id",user.id).maybeSingle();if(r.data){viewerId=r.data.id;const u=await db.from("live_viewers").update({joined_at:new Date().toISOString(),left_at:null}).eq("id",viewerId);if(u.error)throw Error(u.error.message)}else{const i=await db.from("live_viewers").insert({session_id:live.id,user_id:user.id,joined_at:new Date().toISOString(),left_at:null}).select("id").single();if(i.error)throw Error(i.error.message);viewerId=i.data.id}joined=true;await viewers()}
async function token(){const r=await db.auth.getSession(),s=r.data?.session;if(!s?.access_token)throw Error("Your StudentX login session has expired.");const c=new AbortController(),tm=setTimeout(()=>c.abort(),15000);let x;try{x=await fetch("https://studentx-ew9e.vercel.app/api/livekit-token",{method:"POST",mode:"cors",headers:{"Content-Type":"application/json","Accept":"application/json","Authorization":"Bearer "+s.access_token},body:JSON.stringify({liveSessionId:live.id,role:"viewer"}),cache:"no-store",credentials:"omit",signal:c.signal})}catch(e){if(e.name==="AbortError")throw Error("Live server timed out after 15 seconds.");throw Error("Cannot reach StudentX Live API at studentx-ew9e.vercel.app. Check the current Vercel deployment/domain.")}finally{clearTimeout(tm)}const text=await x.text();let d={};try{d=text?JSON.parse(text):{}}catch(e){}if(!x.ok)throw Error(d.error||("Live server returned HTTP "+x.status+"."));if(!d.serverUrl||!d.participantToken||!d.roomName)throw Error("Live server returned an incomplete LiveKit response.");return d}
function addComment(name,text,avatar){if(!text)return;const box=$("comments"),row=document.createElement("div");row.className="comment";const img=document.createElement("img");img.className="cavatar";img.src=avatar||"https://ui-avatars.com/api/?name="+encodeURIComponent(name);const body=document.createElement("div");body.className="cbody";const n=document.createElement("div");n.className="cname";n.textContent=name;const t=document.createElement("div");t.className="ctext";t.textContent=text;body.append(n,t);row.append(img,body);box.append(row);while(box.children.length>7)box.removeChild(box.firstChild)}
async function data(o,reliable=true){if(!room?.localParticipant)return;try{await room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify(o)),{reliable})}catch(e){console.warn(e)}}
async function connect(){if(!window.LivekitClient)throw Error("LiveKit library did not load.");setLoading("Getting secure live connection...");const d=await token();setLoading("Connecting to streamer...");room=new LivekitClient.Room({adaptiveStream:true,dynacast:true,disconnectOnPageLeave:true});room.on(LivekitClient.RoomEvent.TrackSubscribed,(track,pub,p)=>attach(track,p));room.on(LivekitClient.RoomEvent.TrackUnsubscribed,remove);room.on(LivekitClient.RoomEvent.Reconnecting,()=>setLoading("Reconnecting to live..."));room.on(LivekitClient.RoomEvent.Reconnected,()=>{loading.style.display="none";video.play().catch(()=>{})});room.on(LivekitClient.RoomEvent.Disconnected,()=>{if(!leaving)showError("Live disconnected","The connection to the live stream was lost.")});room.on(LivekitClient.RoomEvent.ParticipantConnected,()=>pc());room.on(LivekitClient.RoomEvent.ParticipantDisconnected,()=>pc());room.on(LivekitClient.RoomEvent.DataReceived,(payload)=>{try{const d=JSON.parse(new TextDecoder().decode(payload));if(d.type==="comment")addComment(d.name,d.text,d.avatar);if(d.type==="reaction")heart();if(d.type==="gift")giftAnimation(d.giftName,d.giftIcon,d.name);if(d.type==="cohost_request")toast((d.name||"A user")+" requested to co-host.")}catch(e){}});try{if(room.prepareConnection)room.prepareConnection(d.serverUrl,d.participantToken);const p=room.connect(d.serverUrl,d.participantToken,{autoSubscribe:true,websocketTimeout:10000,peerConnectionTimeout:15000,maxRetries:2});await Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Error("LiveKit connection timed out after 20 seconds.")),20000))])}catch(e){try{await room.disconnect()}catch(x){}room=null;throw e}for(const p of room.remoteParticipants.values())for(const pub of p.trackPublications.values())if(pub.track)attach(pub.track,p);pc();if(!room.remoteParticipants.size)setLoading("Waiting for streamer video...")}
function attach(track,p){if(track.kind==="video"){const s=new MediaStream([track.mediaStreamTrack]);if(p&&room.remoteParticipants.size>1){$("cohostVideo").srcObject=s;$("cohostVideo").style.display="block";$("cohostPlaceholder").style.display="none";$("cohostName").textContent=p.identity||"Co-host"}else{video.srcObject=s;video.muted=muted;video.play().then(()=>loading.style.display="none").catch(()=>loading.style.display="none")}}else{let a=$("livekit-audio");if(!a){a=document.createElement("audio");a.id="livekit-audio";a.autoplay=true;a.style.display="none";document.body.append(a)}a.srcObject=new MediaStream([track.mediaStreamTrack]);a.muted=muted;a.play().catch(()=>{})}}
function remove(track){try{track.detach().forEach(e=>e.remove())}catch(e){}}
function pc(){$("participantCount").textContent=String(room?.remoteParticipants?.size||0)}
function heart(){const h=document.createElement("i");h.className="fas fa-heart heart";h.style.setProperty("--x",(Math.random()*50-25)+"px");$("reactions").append(h);setTimeout(()=>h.remove(),2600)}
async function sendQuickReaction(){heart();await data({type:"reaction"},false)}
async function comment(){const i=$("commentInput"),t=i.value.trim();if(!t)return;i.value="";const n=user.user_metadata?.full_name||user.email?.split("@")[0]||"StudentX User",a=user.user_metadata?.avatar_url||"";addComment(n,t,a);await data({type:"comment",name:n,text:t,avatar:a},true)}
$("commentInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();comment()}})
function giftAnimation(name,icon,sender){const e=document.createElement("div");e.style.cssText="position:absolute;left:18px;top:50%;z-index:90;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:17px;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.12)";e.innerHTML='<span style="font-size:32px;color:#ff3c67">'+icon+'</span><div><b style="font-size:12px">'+String(sender).replace(/[<>]/g,"")+'</b><div style="font-size:11px;color:#aaa;margin-top:3px">sent '+String(name).replace(/[<>]/g,"")+'</div></div>';$("live-page")?.append(e);setTimeout(()=>e.remove(),2300)}
async function sendGift(name,price,icon){if(coins<price){toast("Not enough coins.");return}coins-=price;$("coinBalance").textContent=coins.toLocaleString();closeDrawer();const n=user.user_metadata?.full_name||user.email?.split("@")[0]||"StudentX User";giftAnimation(name,icon,n);await data({type:"gift",giftName:name,giftIcon:icon,price,name:n},true)}
function toggleFollow(){followed=!followed;$("followBtn").textContent=followed?"Following":"Follow";$("followText").textContent=followed?"Unfollow streamer":"Follow streamer";toast(followed?"Following streamer":"Unfollowed streamer")}
async function shareLive(){try{if(navigator.share)await navigator.share({title:"StudentX Live",text:"Watch this live on StudentX",url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);toast("Live link copied.")}}catch(e){}}
function openDrawer(type){closeDrawer(false);$("backdrop").style.display="block";const d=$(type==="gift"?"giftDrawer":type==="cohost"?"cohostDrawer":"moreDrawer");requestAnimationFrame(()=>d.classList.add("open"))}function closeDrawer(hide=true){["giftDrawer","cohostDrawer","moreDrawer"].forEach(id=>$(id).classList.remove("open"));if(hide)setTimeout(()=>$("backdrop").style.display="none",220)}window.openDrawer=openDrawer;window.closeDrawer=closeDrawer;
async function requestCoHost(){closeDrawer();const n=user.user_metadata?.full_name||user.email?.split("@")[0]||"StudentX User";await data({type:"cohost_request",name:n},true);toast("Co-host request sent.")}
function toggleMute(){muted=!muted;video.muted=muted;video.volume=muted?0:1;const a=$("livekit-audio");if(a){a.muted=muted;a.volume=muted?0:1}$("muteIcon").className=muted?"fas fa-volume-xmark":"fas fa-volume-high";$("muteText").textContent=muted?"Unmute sound":"Mute sound";toast(muted?"Sound muted":"Sound on")}
window.toggleMute=toggleMute;
async function status(){const c=db.channel("live-status-"+live.id+"-"+user.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"live_sessions",filter:"id=eq."+live.id},p=>{live=p.new;if(p.new.status!=="live"){showError("Live has ended","The streamer has ended this live.");setTimeout(leaveLive,1500)}viewers()});c.subscribe();window.__liveStatus=c}
function leaveLive(){if(leaving)return;leaving=true;clearInterval(countTimer);if(joined&&viewerId)db.from("live_viewers").update({left_at:new Date().toISOString()}).eq("id",viewerId).catch(()=>{});try{room?.disconnect()}catch(e){}try{window.__liveStatus&&db.removeChannel(window.__liveStatus)}catch(e){}location.href="video.html"}window.leaveLive=leaveLive;
(async function(){try{setLoading("Checking StudentX account...");db=client();if(!(await auth()))return;setLoading("Finding live stream...");if(!(await loadLive()))return;if((live.broadcaster_id||live.user_id)===user.id){showError("You are the streamer","Use another account or browser to watch this live.");return}await profile();await viewerRow();countTimer=setInterval(viewers,5000);await status();await connect();if(room)loading.style.display="none"}catch(e){console.error(e);showError("Unable to connect",e.message||"Unable to connect to the live stream.")}})();
})();
</script>
</body>
