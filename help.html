<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Help & Support - StudentX</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{
            --bg:#0a0a0f;
            --card:rgba(255,255,255,.035);
            --card-2:rgba(255,255,255,.07);
            --border:rgba(255,255,255,.07);
            --text:#fff;
            --text-2:rgba(255,255,255,.75);
            --muted:rgba(255,255,255,.42);
            --accent:#dc2743;
            --grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
            --danger:#ef4444;
        }
        :root.sx-light{
            --bg:#f0f2f5;
            --card:#ffffff;
            --card-2:#f0f2f5;
            --border:#e4e6eb;
            --text:#050505;
            --text-2:#3a3b3c;
            --muted:#65676b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: Poppins, sans-serif; }
        html, body { background-color: var(--bg); color: var(--text); height: 100%; width: 100%; overflow-x: hidden; max-width: 500px; margin: 0 auto; }
        a { color: inherit; text-decoration: none; }
        button, input, select, textarea { font-family: inherit; }

        .header { position: sticky; top: 0; background-color: var(--bg); padding: 40px 15px 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); z-index: 100; }
        .back-btn { color: var(--text); font-size: 20px; cursor: pointer; }
        .header-title { font-size: 20px; font-weight: 800; }

        .content-container { padding: 20px 15px 40px; }

        .identity-card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 18px; }
        .identity-card img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--card-2); flex-shrink: 0; }
        .identity-name { font-size: 14px; font-weight: 700; }
        .identity-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

        .info-text { font-size: 13px; color: var(--text-2); margin-bottom: 20px; line-height: 1.55; }

        .form-group { margin-bottom: 16px; }
        label { display: block; color: var(--text-2); font-size: 12px; margin-bottom: 6px; font-weight: 600; }
        input, select, textarea {
            width: 100%; padding: 12px 14px; background: var(--card-2); border: 1px solid var(--border);
            color: var(--text); border-radius: 12px; font-size: 14px; outline: none; transition: border-color .2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        select option { color: #000; }
        textarea { resize: vertical; min-height: 120px; }

        .submit-btn {
            width: 100%; background: var(--grad); color: #fff; border: none; padding: 14px;
            border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px;
        }
        .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

        .section-title { font-size: 15px; font-weight: 800; margin: 28px 0 14px; }

        .report-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; }
        .report-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .report-cat { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: capitalize; }
        .report-status { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }
        .report-status.pending { background: rgba(251,191,36,.15); color: #fbbf24; }
        .report-status.in_progress { background: rgba(59,130,246,.15); color: #3b82f6; }
        .report-status.resolved { background: rgba(76,175,80,.15); color: #4caf50; }
        .report-msg { font-size: 12px; color: var(--text-2); line-height: 1.5; }
        .report-date { font-size: 10px; color: var(--muted); margin-top: 6px; }

        .empty-note { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0; }
        .skeleton { height: 60px; border-radius: 12px; background: var(--card); margin-bottom: 10px; animation: pulse 1.2s ease infinite; }
        @keyframes pulse { 50% { opacity: .5; } }

        .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 11px 20px; background: #1f1f2b; color: #fff; border-radius: 12px; font-size: 12px; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,.35); border-left: 3px solid var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <a href="menu.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="header-title">Help &amp; Support</div>
    </div>

    <div class="content-container">

        <div class="identity-card">
            <img id="idAvatar" src="" alt="">
            <div>
                <div class="identity-name" id="idName">Loading...</div>
                <div class="identity-sub">Reports are linked to your account</div>
            </div>
        </div>

        <p class="info-text">
            Have a complaint, feedback, or found a bug? Fill out the form below and our support team will review it. Your name is attached automatically from your account.
        </p>

        <form id="helpForm">
            <div class="form-group">
                <label>Category</label>
                <select id="category">
                    <option value="complaint">Complaint</option>
                    <option value="feedback">Feedback / Suggestion</option>
                    <option value="bug">Report a Bug</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Message / Description</label>
                <textarea id="message" maxlength="1000" placeholder="Describe your issue or feedback in detail..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit Report</button>
        </form>

        <h3 class="section-title">Your Recent Reports</h3>
        <div id="myReports"><div class="skeleton"></div></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        let currentUser = null;
        let myProfile = null;

        function $(id){ return document.getElementById(id); }
        function esc(v){
            if (v == null) return "";
            return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
        }
        function defaultAvatar(){
            return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" fill="#2c2c2c"/><circle cx="30" cy="23" r="12" fill="#777"/><path d="M10 54c3-14 11-19 20-19s17 5 20 19" fill="#777"/></svg>');
        }
        function toast(msg){
            const old = document.querySelector(".toast"); if (old) old.remove();
            const d = document.createElement("div");
            d.className = "toast"; d.textContent = msg;
            document.body.appendChild(d);
            setTimeout(() => { if (d.parentNode) d.remove(); }, 2600);
        }
        function statusLabel(s){
            if (s === "in_progress") return "In Progress";
            if (s === "resolved") return "Resolved";
            return "Pending";
        }

        async function init(){
            const auth = await supabaseClient.auth.getUser();
            currentUser = auth.data && auth.data.user;
            if (!currentUser){ window.location.href = "login.html"; return; }

            const p = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url").eq("id", currentUser.id).maybeSingle();
            myProfile = p.data || { id: currentUser.id };

            $("idAvatar").src = myProfile.avatar_url || defaultAvatar();
            $("idAvatar").onerror = function(){ this.onerror = null; this.src = defaultAvatar(); };
            $("idName").textContent = myProfile.full_name || myProfile.username || currentUser.email || "StudentX User";

            await loadMyReports();
        }

        async function loadMyReports(){
            const wrap = $("myReports");
            const r = await supabaseClient.from("support_messages").select("*").eq("user_id", currentUser.id).order("created_at", { ascending: false }).limit(10);

            if (r.error){
                console.error("Reports error:", r.error);
                wrap.innerHTML = '<div class="empty-note">Unable to load your reports.</div>';
                return;
            }

            const rows = r.data || [];
            if (!rows.length){
                wrap.innerHTML = '<div class="empty-note">You have not submitted any reports yet.</div>';
                return;
            }

            wrap.innerHTML = rows.map(row => {
                const date = new Date(row.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
                return `<div class="report-item">
                    <div class="report-top">
                        <span class="report-cat">${esc(row.category)}</span>
                        <span class="report-status ${esc(row.status)}">${esc(statusLabel(row.status))}</span>
                    </div>
                    <div class="report-msg">${esc(row.message)}</div>
                    <div class="report-date">${esc(date)}</div>
                </div>`;
            }).join("");
        }

        document.getElementById("helpForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");

            const category = document.getElementById("category").value;
            const message = document.getElementById("message").value.trim();

            if (!message){
                toast("Please describe your issue or feedback.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Submitting...";

            try {
                const { error } = await supabaseClient.from("support_messages").insert({
                    user_id: currentUser.id,
                    full_name: myProfile.full_name || null,
                    username: myProfile.username || null,
                    category,
                    message,
                    status: "pending"
                });

                if (error) throw error;

                toast("Your message has been submitted successfully!");
                document.getElementById("helpForm").reset();
                await loadMyReports();
            } catch (err) {
                console.error(err);
                toast(err.message || "Could not submit your report.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Submit Report";
            }
        });

        init();
    </script>
</body>
</html>
