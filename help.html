<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Help & Support - StudentX</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            background-color: #121212;
            color: #fff;
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        .header {
            position: sticky;
            top: 0;
            background-color: #121212;
            padding: 40px 15px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #2c2c2c;
            z-index: 100;
        }
        .back-btn {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
        }
        .header-title {
            font-size: 20px;
            font-weight: bold;
        }

        /* --- CONTENT --- */
        .content-container {
            padding: 20px 15px 40px;
        }
        .info-text {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            color: #ccc;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a2e;
            border: 1px solid #333;
            color: #fff;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #8A2BE2;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .submit-btn {
            width: 100%;
            background: #8A2BE2;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <a href="menu.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="header-title">Help & Support</div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content-container">
        <p class="info-text">
            Have a complaint, feedback, or need assistance? Fill out the form below and our support team will review it.
        </p>

        <form id="helpForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="category">
                    <option value="complaint">Complaint</option>
                    <option value="feedback">Feedback / Suggestion</option>
                    <option value="bug">Report a Bug</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Message / Description</label>
                <textarea id="message" required placeholder="Describe your issue or feedback in detail..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit Report</button>
        </form>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        document.getElementById("helpForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Submitting...";
            btn.disabled = true;

            const full_name = document.getElementById("fullName").value;
            const username = document.getElementById("username").value;
            const category = document.getElementById("category").value;
            const message = document.getElementById("message").value;

            try {
                // Tabbatar kana da table mai suna 'support_messages' a Supabase din ka
                const { error } = await supabaseClient.from("support_messages").insert({
                    full_name,
                    username,
                    category,
                    message,
                    status: "pending"
                });

                if (error) throw error;

                alert("Your message has been submitted successfully!");
                document.getElementById("helpForm").reset();
            } catch (err) {
                alert("Error submitting: " + err.message);
            } finally {
                btn.innerText = "Submit Report";
                btn.disabled = false;
            }
        });
    </script>
    <script src="theme.js"></script>
</body>
</html>
