<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudentX AI - StudentX</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            background-color: #121212;
            color: #fff;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* --- HEADER --- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #121212;
            padding: 35px 15px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2c2c2c;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .back-btn {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            display: flex;
            align-items: center;
        }
        .ai-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .model-badge {
            background-color: #2c1a40;
            color: #c29dff;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
            border: 1px solid #8A2BE2;
        }
        .menu-btn {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e1e1e;
            border: 1px solid #2c2c2c;
            border-radius: 6px;
            cursor: pointer;
        }

        /* --- CHAT AREA --- */
        .chat-container {
            padding: 90px 15px 160px;
            overflow-y: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message { display: flex; gap: 10px; max-width: 85%; }
        .message.ai { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background-color: #2c2c2c; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 14px; flex-shrink: 0;
        }
        .bubble {
            padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4;
            white-space: pre-wrap; /* Don sa rubutun AI ya fito daidai kamar yadda aka rubuta shi */
        }
        .message.ai .bubble { background-color: #1e1e1e; border: 1px solid #2c2c2c; border-top-left-radius: 4px; }
        .message.user .bubble { background-color: #8A2BE2; border-top-right-radius: 4px; }

        /* --- BOTTOM WRAPPER --- */
        .bottom-wrapper {
            position: fixed; bottom: 15px; left: 50%;
            transform: translateX(-50%); width: 95%; max-width: 600px; z-index: 100;
        }
        .tools-scroll {
            display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 0 5px 10px;
        }
        .tools-scroll::-webkit-scrollbar { display: none; }
        .tool-chip {
            display: flex; align-items: center; gap: 6px;
            background-color: #1e1e1e; border: 1px solid #2c2c2c; color: #ccc;
            padding: 8px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap;
            cursor: pointer; text-decoration: none; flex-shrink: 0;
        }
        .tool-chip i { color: #8A2BE2; }

        .input-area {
            background-color: #1e1e1e; border: 1px solid #2c2c2c; border-radius: 25px;
            padding: 5px; display: flex; align-items: center; gap: 5px;
        }
        .plus-btn {
            background-color: transparent; border: none; color: #fff; font-size: 20px;
            cursor: pointer; width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative;
        }
        .input-area input {
            flex-grow: 1; background-color: transparent; border: none; padding: 14px 5px;
            color: #fff; font-size: 15px; outline: none;
        }
        .send-btn {
            background-color: #8A2BE2; border: none; width: 40px; height: 40px; border-radius: 50%;
            color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0; margin-right: 5px;
        }

        /* Akwatin Upload */
        .upload-popup {
            display: none; position: absolute; bottom: 55px; left: 0; background-color: #1e1e1e;
            border: 1px solid #2c2c2c; border-radius: 12px; padding: 10px; flex-direction: column;
            gap: 5px; width: 180px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 200;
        }
        .upload-popup.active { display: flex; }
        .upload-item {
            display: flex; align-items: center; gap: 12px; padding: 10px; color: #fff;
            text-decoration: none; font-size: 14px; border-radius: 8px;
        }
        .upload-item i { color: #8A2BE2; width: 20px; text-align: center; }

        /* --- STUDENTX AI MENU (SIDEBAR / DRAWER) --- */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); z-index: 999; opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .drawer-overlay.active { opacity: 1; visibility: visible; }

        .side-drawer {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 320px; height: 100%;
            background-color: #1a1a1a; z-index: 1000; transition: right 0.3s ease-in-out;
            display: flex; flex-direction: column; box-shadow: -2px 0 10px rgba(0,0,0,0.5);
        }
        .side-drawer.active { right: 0; }

        .drawer-header {
            padding: 35px 15px 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #2c2c2c;
        }
        .close-drawer {
            color: #fff; font-size: 18px; cursor: pointer; width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%; background-color: #2c2c2c;
        }
        
        .drawer-content { flex-grow: 1; overflow-y: auto; padding: 15px; }
        .drawer-content::-webkit-scrollbar { display: none; }

        .new-chat-btn {
            display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 15px;
            background-color: #8A2BE2; color: #fff; border: none; border-radius: 10px;
            font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
        }

        .drawer-section { margin-bottom: 25px; }
        .section-label {
            font-size: 12px; color: #888; font-weight: bold; text-transform: uppercase;
            margin-bottom: 10px; padding-left: 5px;
        }
        
        .drawer-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 10px; color: #ccc;
            text-decoration: none; border-radius: 8px; margin-bottom: 5px; font-size: 14px;
        }
        .drawer-link:active { background-color: #2c2c2c; }
        .drawer-link i { width: 20px; text-align: center; color: #8A2BE2; }

        .chat-history-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 10px; color: #ccc;
            border-radius: 8px; margin-bottom: 5px; font-size: 14px; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-history-item:active { background-color: #2c2c2c; }
        .chat-history-item i { color: #888; }

        .drawer-footer {
            padding: 15px; border-top: 1px solid #2c2c2c;
        }
        .footer-link {
            display: flex; align-items: center; gap: 12px; color: #ccc; text-decoration: none; font-size: 14px;
        }
        .footer-link i { color: #888; }

    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <a href="menu.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="ai-title">StudentX AI <span class="model-badge">v1.1</span></div>
        </div>
        <div class="menu-btn" onclick="toggleDrawer()"><i class="fas fa-bars"></i></div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            <div class="msg-avatar"><i class="fas fa-robot"></i></div>
            <div class="bubble">Hello Yusuf! I am StudentX AI. How can I assist you today?</div>
        </div>
    </div>

    <!-- BOTTOM WRAPPER -->
    <div class="bottom-wrapper">
        <div class="tools-scroll">
            <a href="create-image.html" class="tool-chip"><i class="fas fa-wand-magic-sparkles"></i> Create Image</a>
            <a href="edit-image.html" class="tool-chip"><i class="fas fa-pen-fancy"></i> Edit Image</a>
            <a href="img-to-pdf.html" class="tool-chip"><i class="fas fa-file-pdf"></i> Image to PDF</a>
        </div>

        <div class="input-area">
            <button class="plus-btn" onclick="toggleUploadPopup()">
                <i class="fas fa-plus"></i>
                <div class="upload-popup" id="uploadPopup">
                    <a href="#" class="upload-item"><i class="fas fa-camera"></i> Camera</a>
                    <a href="#" class="upload-item"><i class="fas fa-image"></i> Upload Image</a>
                    <a href="#" class="upload-item"><i class="fas fa-folder-open"></i> Upload File</a>
                </div>
            </button>
            <input type="text" id="messageInput" placeholder="Message StudentX AI...">
            <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- STUDENTX AI MENU (SIDEBAR) -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="side-drawer" id="sideDrawer">
        
        <div class="drawer-header">
            <h3 style="font-size: 16px; font-weight: bold;">Menu</h3>
            <div class="close-drawer" onclick="toggleDrawer()"><i class="fas fa-xmark"></i></div>
        </div>

        <div class="drawer-content">
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fas fa-pen-to-square"></i> New Chat
            </button>

            <div class="drawer-section">
                <div class="section-label">Workspace</div>
                <a href="library.html" class="drawer-link"><i class="fas fa-book-bookmark"></i> Library</a>
                <a href="projects.html" class="drawer-link"><i class="fas fa-diagram-project"></i> Projects</a>
            </div>

            <div class="drawer-section">
                <div class="section-label">Pinned</div>
                <div class="chat-history-item"><i class="fas fa-thumbtack"></i> Thermodynamics 2nd Law</div>
                <div class="chat-history-item"><i class="fas fa-thumbtack"></i> Final Year Project Ideas</div>
            </div>

            <div class="drawer-section">
                <div class="section-label">Recent</div>
                <div class="chat-history-item"><i class="fas fa-message"></i> Machine Learning Basics</div>
                <div class="chat-history-item"><i class="fas fa-message"></i> Data Structures Notes</div>
                <div class="chat-history-item"><i class="fas fa-message"></i> Scholarship Essay Draft</div>
            </div>
        </div>

        <div class="drawer-footer">
            <a href="settings.html" class="footer-link"><i class="fas fa-gear"></i> Settings</a>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const uploadPopup = document.getElementById('uploadPopup');
        const sideDrawer = document.getElementById('sideDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');

        // ==========================================
        // SA API KEY DINKA NA GEMINI ANAN KASA
        const GEMINI_API_KEY = "AIzaSyDiK-9zRDfDXDNuCg428xtYMSJYdmHgVJg"; 
        // ==========================================

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            // 1. Nuna saƙon mai amfani
            const userMsg = `<div class="message user"><div class="msg-avatar"><i class="fas fa-user"></i></div><div class="bubble">${text}</div></div>`;
            chatContainer.insertAdjacentHTML('beforeend', userMsg);
            messageInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. Nuna "Typing..." yayin da AI ke aiki
            const typingId = 'typing-' + Date.now();
            const aiTypingMsg = `<div class="message ai" id="${typingId}"><div class="msg-avatar"><i class="fas fa-robot"></i></div><div class="bubble"><span style="color: #888;">Typing...</span></div></div>`;
            chatContainer.insertAdjacentHTML('beforeend', aiTypingMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // 3. Tura tambayar zuwa Google Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();

                // 4. Nuna amsar AI
                const typingBubble = document.getElementById(typingId).querySelector('.bubble');
                if (data.candidates && data.candidates.length > 0) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    typingBubble.innerText = aiReply;
                } else {
                    typingBubble.innerText = "Sorry, I couldn't get a response. Please check your API Key or internet connection.";
                }
                
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                document.getElementById(typingId).querySelector('.bubble').innerText = "Network error. Make sure your API Key is correct.";
                console.error("Error:", error);
            }
        }

        // Tura message idan an danna "Enter"
        messageInput.addEventListener('keypress', function(e) { 
            if (e.key === 'Enter') sendMessage(); 
        });

        function toggleUploadPopup() { uploadPopup.classList.toggle('active'); }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.plus-btn') && !e.target.closest('.upload-popup')) {
                uploadPopup.classList.remove('active');
            }
        });

        function toggleDrawer() {
            sideDrawer.classList.toggle('active');
            drawerOverlay.classList.toggle('active');
        }

        function startNewChat() {
            chatContainer.innerHTML = `<div class="message ai"><div class="msg-avatar"><i class="fas fa-robot"></i></div><div class="bubble">New chat started. How can I help?</div></div>`;
            messageInput.focus();
            toggleDrawer();
        }
    </script>
</body>
</html>
