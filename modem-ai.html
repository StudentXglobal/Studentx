<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudentX AI - StudentX</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root{
            --bg:#0a0a0f;
            --card:rgba(255,255,255,.035);
            --card-2:rgba(255,255,255,.07);
            --border:rgba(255,255,255,.08);
            --text:#fff;
            --text-2:rgba(255,255,255,.75);
            --muted:rgba(255,255,255,.4);
            --accent:#dc2743;
            --grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
        }
        :root.sx-light{
            --bg:#f0f2f5;
            --card:#ffffff;
            --card-2:#f0f2f5;
            --border:#e4e6eb;
            --text:#050505;
            --text-2:#3a3b3c;
            --muted:#65676b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: Poppins, sans-serif; }
        html, body { background-color: var(--bg); color: var(--text); height: 100%; width: 100%; overflow: hidden; max-width:500px; margin:0 auto; }
        button, input { font-family: inherit; }
        a{ color:inherit; text-decoration:none; }

        /* --- HEADER --- */
        .header {
            position: fixed; top: 0; left: 0; width: 100%; max-width:500px; margin:0 auto; right:0;
            background-color: var(--bg); padding: 35px 15px 15px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border); z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { color: var(--text); font-size: 20px; display: flex; align-items: center; cursor:pointer; }
        .ai-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .model-badge { background: var(--card-2); color: var(--accent); font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: bold; border: 1px solid var(--accent); }
        .menu-btn { color: var(--text); font-size: 14px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background-color: var(--card-2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }

        /* --- CHAT AREA --- */
        .chat-container { padding: 90px 15px 160px; overflow-y: auto; height: 100vh; display: flex; flex-direction: column; gap: 18px; }
        .message { display: flex; gap: 10px; max-width: 85%; }
        .message.ai { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background-color: var(--card-2); display: flex; align-items: center; justify-content: center;
            color: var(--text); font-size: 14px; flex-shrink: 0;
        }
        .message.ai .msg-avatar{ background:var(--grad); color:#fff; }
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .message.ai .bubble { background-color: var(--card); border: 1px solid var(--border); border-top-left-radius: 4px; color: var(--text); }
        .message.user .bubble { background: var(--grad); color: #fff; border-top-right-radius: 4px; }

        .empty-state{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--muted); padding:0 20px; }
        .empty-state i{ font-size:34px; margin-bottom:14px; color:var(--accent); }
        .empty-state p{ font-size:13px; line-height:1.5; }

        /* --- BOTTOM WRAPPER --- */
        .bottom-wrapper { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px; z-index: 100; }
        .input-area {
            background-color: var(--card-2); border: 1px solid var(--border); border-radius: 25px;
            padding: 5px; display: flex; align-items: center; gap: 5px;
        }
        .input-area input {
            flex-grow: 1; background-color: transparent; border: none; padding: 14px 5px 14px 16px;
            color: var(--text); font-size: 15px; outline: none;
        }
        .input-area input::placeholder{ color: var(--muted); }
        .send-btn {
            background: var(--grad); border: none; width: 40px; height: 40px; border-radius: 50%;
            color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0; margin-right: 5px;
        }
        .send-btn:disabled{ opacity:.5; }

        /* --- STUDENTX AI MENU (SIDEBAR / DRAWER) --- */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); z-index: 999; opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .drawer-overlay.active { opacity: 1; visibility: visible; }

        .side-drawer {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 320px; height: 100%;
            background-color: var(--bg); z-index: 1000; transition: right 0.3s ease-in-out;
            display: flex; flex-direction: column; box-shadow: -2px 0 10px rgba(0,0,0,0.5);
            border-left: 1px solid var(--border);
        }
        .side-drawer.active { right: 0; }

        .drawer-header {
            padding: 35px 15px 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .close-drawer {
            color: var(--text); font-size: 18px; cursor: pointer; width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%; background-color: var(--card-2);
        }

        .drawer-content { flex-grow: 1; overflow-y: auto; padding: 15px; }

        .new-chat-btn {
            display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 15px;
            background: var(--grad); color: #fff; border: none; border-radius: 10px;
            font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
        }

        .drawer-section { margin-bottom: 25px; }
        .section-label {
            font-size: 12px; color: var(--muted); font-weight: bold; text-transform: uppercase;
            margin-bottom: 10px; padding-left: 5px;
        }

        .chat-history-item {
            display: flex; align-items: center; gap: 10px; padding: 11px 10px; color: var(--text-2);
            border-radius: 8px; margin-bottom: 5px; font-size: 13px; cursor: pointer;
        }
        .chat-history-item:active { background-color: var(--card-2); }
        .chat-history-item i.main-ic { color: var(--muted); flex-shrink:0; }
        .chat-history-item .chi-title{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .chat-history-item .pin-ic{ color:var(--muted); font-size:12px; flex-shrink:0; cursor:pointer; }
        .chat-history-item .pin-ic.on{ color:var(--accent); }
        .chat-history-item.active{ background:var(--card-2); color:var(--text); }
        .empty-hist{ font-size:11px; color:var(--muted); padding:8px 10px; }

        .drawer-footer { padding: 15px; border-top: 1px solid var(--border); }
        .footer-link { display: flex; align-items: center; gap: 12px; color: var(--text-2); font-size: 14px; }
        .footer-link i { color: var(--muted); }

        .typing-dots{ display:flex; gap:4px; padding:4px 0; }
        .typing-dots span{ width:6px; height:6px; border-radius:50%; background:var(--muted); animation:td 1.2s infinite ease-in-out; }
        .typing-dots span:nth-child(2){ animation-delay:.2s; }
        .typing-dots span:nth-child(3){ animation-delay:.4s; }
        @keyframes td{ 0%,60%,100%{ transform:translateY(0); opacity:.4; } 30%{ transform:translateY(-4px); opacity:1; } }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <a href="menu.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="ai-title">StudentX AI <span class="model-badge">v1.2</span></div>
        </div>
        <div class="menu-btn" onclick="toggleDrawer()"><i class="fas fa-bars"></i></div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-container" id="chatContainer">
        <div class="empty-state" id="emptyState">
            <i class="fas fa-robot"></i>
            <p>Ask StudentX AI anything about your studies, assignments, or just say hello.</p>
        </div>
    </div>

    <!-- BOTTOM WRAPPER -->
    <div class="bottom-wrapper">
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Message StudentX AI...">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- STUDENTX AI MENU (SIDEBAR) -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="side-drawer" id="sideDrawer">

        <div class="drawer-header">
            <h3 style="font-size: 16px; font-weight: bold;">Chats</h3>
            <div class="close-drawer" onclick="toggleDrawer()"><i class="fas fa-xmark"></i></div>
        </div>

        <div class="drawer-content">
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fas fa-pen-to-square"></i> New Chat
            </button>

            <div class="drawer-section">
                <div class="section-label">Pinned</div>
                <div id="pinnedList"><div class="empty-hist">No pinned chats</div></div>
            </div>

            <div class="drawer-section">
                <div class="section-label">Recent</div>
                <div id="recentList"><div class="empty-hist">No chats yet</div></div>
            </div>
        </div>

        <div class="drawer-footer">
            <a href="settings.html" class="footer-link"><i class="fas fa-gear"></i> Settings</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        var currentUser = null;
        var currentChatId = null;
        var conversation = []; // [{role:'user'|'assistant', content:string}]
        var allChats = [];

        var chatContainer = document.getElementById('chatContainer');
        var messageInput = document.getElementById('messageInput');
        var sideDrawer = document.getElementById('sideDrawer');
        var drawerOverlay = document.getElementById('drawerOverlay');

        function esc(v){
            return String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
        }

        async function init(){
            var auth = await supabaseClient.auth.getUser();
            currentUser = auth.data && auth.data.user;
            if (!currentUser) { location.href = "login.html"; return; }

            await loadChatList();
        }

        async function loadChatList(){
            var r = await supabaseClient.from("ai_chats").select("*").eq("user_id", currentUser.id).order("updated_at", { ascending:false }).limit(50);
            if (r.error) { console.error("Chat list error:", r.error); return; }
            allChats = r.data || [];
            renderChatList();
        }

        function renderChatList(){
            var pinned = allChats.filter(function(c){ return c.pinned; });
            var recent = allChats.filter(function(c){ return !c.pinned; });

            document.getElementById("pinnedList").innerHTML = pinned.length
                ? pinned.map(chatItemHTML).join("")
                : '<div class="empty-hist">No pinned chats</div>';

            document.getElementById("recentList").innerHTML = recent.length
                ? recent.map(chatItemHTML).join("")
                : '<div class="empty-hist">No chats yet</div>';
        }

        function chatItemHTML(c){
            var active = c.id === currentChatId;
            return '<div class="chat-history-item ' + (active ? "active" : "") + '" onclick="openChat(\'' + c.id + '\')">' +
                '<i class="fas fa-message main-ic"></i>' +
                '<div class="chi-title">' + esc(c.title) + '</div>' +
                '<i class="fas fa-thumbtack pin-ic ' + (c.pinned ? "on" : "") + '" onclick="event.stopPropagation();togglePin(\'' + c.id + '\')"></i>' +
            '</div>';
        }

        async function togglePin(chatId){
            var chat = allChats.find(function(c){ return c.id === chatId; });
            if (!chat) return;
            var next = !chat.pinned;
            var r = await supabaseClient.from("ai_chats").update({ pinned: next }).eq("id", chatId);
            if (r.error) { console.error(r.error); return; }
            chat.pinned = next;
            renderChatList();
        }

        async function openChat(chatId){
            currentChatId = chatId;
            toggleDrawer();

            var r = await supabaseClient.from("ai_messages").select("role,content,created_at").eq("chat_id", chatId).order("created_at", { ascending:true });
            if (r.error) { console.error(r.error); return; }

            conversation = (r.data || []).map(function(m){ return { role: m.role, content: m.content }; });
            renderMessages();
            renderChatList();
        }

        function startNewChat(){
            currentChatId = null;
            conversation = [];
            renderMessages();
            toggleDrawer();
            renderChatList();
            messageInput.focus();
        }

        function renderMessages(){
            if (!conversation.length) {
                chatContainer.innerHTML = '<div class="empty-state" id="emptyState"><i class="fas fa-robot"></i><p>Ask StudentX AI anything about your studies, assignments, or just say hello.</p></div>';
                return;
            }

            chatContainer.innerHTML = conversation.map(function(m){
                var isUser = m.role === "user";
                return '<div class="message ' + (isUser ? "user" : "ai") + '">' +
                    '<div class="msg-avatar"><i class="fas ' + (isUser ? "fa-user" : "fa-robot") + '"></i></div>' +
                    '<div class="bubble">' + esc(m.content) + '</div>' +
                '</div>';
            }).join("");

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendTyping(){
            var id = "typing-" + Date.now();
            var html = '<div class="message ai" id="' + id + '"><div class="msg-avatar"><i class="fas fa-robot"></i></div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>';
            chatContainer.insertAdjacentHTML("beforeend", html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        async function ensureChat(firstMessageText){
            if (currentChatId) return currentChatId;

            var title = firstMessageText.trim().slice(0, 48) || "New chat";
            var r = await supabaseClient.from("ai_chats").insert({ user_id: currentUser.id, title: title }).select().single();
            if (r.error) { console.error("Create chat error:", r.error); return null; }

            currentChatId = r.data.id;
            allChats.unshift(r.data);
            renderChatList();
            return currentChatId;
        }

        async function saveMessage(chatId, role, content){
            var r = await supabaseClient.from("ai_messages").insert({ chat_id: chatId, user_id: currentUser.id, role: role, content: content });
            if (r.error) console.warn("Save message error:", r.error.message);

            supabaseClient.from("ai_chats").update({ updated_at: new Date().toISOString() }).eq("id", chatId).then(function(){});
        }

        async function sendMessage() {
            var text = messageInput.value.trim();
            if (text === '') return;

            var sendBtn = document.getElementById("sendBtn");
            sendBtn.disabled = true;
            messageInput.value = '';

            var chatId = await ensureChat(text);
            if (!chatId) { sendBtn.disabled = false; showErrorBubble("Could not start a chat. Please try again."); return; }

            conversation.push({ role: "user", content: text });
            renderMessages();
            await saveMessage(chatId, "user", text);

            var typingId = appendTyping();

            try {
                var response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: conversation })
                });

                var data = await response.json();
                document.getElementById(typingId).remove();

                var reply = data.reply || (data.error ? ("Error: " + data.error) : "Sorry, I could not generate a response.");

                conversation.push({ role: "assistant", content: reply });
                renderMessages();
                await saveMessage(chatId, "assistant", reply);

                // Update the sidebar title the first time we get a real exchange
                var chatRow = allChats.find(function(c){ return c.id === chatId; });
                if (chatRow) renderChatList();

            } catch (error) {
                var el = document.getElementById(typingId);
                if (el) el.remove();
                showErrorBubble("Network error. Please check your connection.");
                console.error("Error:", error);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function showErrorBubble(msg){
            conversation.push({ role: "assistant", content: msg });
            renderMessages();
        }

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        function toggleDrawer() {
            sideDrawer.classList.toggle('active');
            drawerOverlay.classList.toggle('active');
        }

        init();
    </script>
    <script src="theme.js"></script>
</body>
</html>
