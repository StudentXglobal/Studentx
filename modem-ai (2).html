<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>StudentX AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0a0a0f;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);--border:rgba(255,255,255,.1);--text:#fff;--muted:rgba(255,255,255,.55);--accent:#dc2743;--grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
:root.sx-light{--bg:#f0f2f5;--card:#fff;--card2:#f0f2f5;--border:#e4e6eb;--text:#050505;--muted:#65676b}
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:var(--bg);color:var(--text);max-width:500px;margin:auto;overflow:hidden}button,input{font:inherit}button{cursor:pointer}
.header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--bg);padding:34px 15px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);z-index:10}.header-left{display:flex;align-items:center;gap:15px}.back-btn{color:var(--text);font-size:20px;text-decoration:none}.ai-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}.badge{font-size:10px;color:var(--accent);border:1px solid var(--accent);padding:3px 8px;border-radius:10px}.menu-btn{width:34px;height:34px;border:1px solid var(--border);border-radius:9px;display:grid;place-items:center;background:var(--card2)}
.chat-container{height:100vh;overflow-y:auto;padding:95px 15px 175px;display:flex;flex-direction:column;gap:16px}.empty-state{flex:1;min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px}.empty-state i{font-size:38px;color:var(--accent);margin-bottom:15px}.empty-state p{font-size:13px;line-height:1.7;max-width:300px}
.message{display:flex;gap:9px;max-width:90%}.message.ai{align-self:flex-start}.message.user{align-self:flex-end;flex-direction:row-reverse}.msg-avatar{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-size:13px}.message.ai .msg-avatar{background:var(--grad);color:#fff}.bubble{padding:12px 15px;border-radius:17px;font-size:13px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}.message.ai .bubble{background:var(--card);border:1px solid var(--border);border-top-left-radius:4px}.message.user .bubble{background:var(--grad);color:white;border-top-right-radius:4px}.bubble img.generated{display:block;max-width:100%;width:100%;border-radius:10px;margin-top:9px}.bubble .download{display:inline-flex;margin-top:9px;padding:8px 11px;border-radius:9px;background:var(--card2);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:12px;gap:6px}.bubble pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card2);padding:9px;border-radius:8px}.bubble code{font-family:monospace}.typing{color:var(--muted);font-size:12px;padding:8px}
.bottom-wrapper{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:95%;max-width:500px;z-index:10}.ai-mode-bar{display:flex;gap:7px;overflow-x:auto;margin:0 0 8px 3px}.ai-mode-btn{flex-shrink:0;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:18px;padding:8px 12px;font-size:11px}.ai-mode-btn.active{background:var(--grad);color:white;border-color:transparent}.image-preview{display:none;align-items:center;gap:10px;padding:8px 10px;margin:0 4px 8px;border:1px solid var(--border);border-radius:13px;background:var(--card)}.image-preview.show{display:flex}.image-preview img{width:52px;height:52px;object-fit:cover;border-radius:8px}.preview-info{flex:1;min-width:0;overflow-wrap:anywhere;font-size:11px;color:var(--muted)}.remove-image{border:0;background:var(--card2);color:var(--text);width:30px;height:30px;border-radius:50%}.input-area{width:100%;display:flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:25px;padding:5px}.input-area input[type=text]{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:13px;padding:13px 4px}.input-area input::placeholder{color:var(--muted)}.attach-btn,.send-btn{width:40px;height:40px;flex-shrink:0;border:0;border-radius:50%;display:grid;place-items:center}.attach-btn{background:transparent;color:var(--muted)}.send-btn{background:var(--grad);color:#fff}.send-btn:disabled{opacity:.5}.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#0009;z-index:19;display:none}.overlay.active{display:block}.drawer{position:fixed;top:0;right:-100%;height:100%;width:85%;max-width:320px;background:var(--bg);z-index:20;border-left:1px solid var(--border);transition:right .25s;display:flex;flex-direction:column}.drawer.active{right:0}.drawer-head{padding:34px 16px 15px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}.drawer-content{padding:15px;overflow:auto}.new-chat{width:100%;padding:12px;border:0;border-radius:10px;background:var(--grad);color:#fff;font-weight:600;margin-bottom:20px}.section-label{font-size:11px;color:var(--muted);margin:12px 0 8px;text-transform:uppercase}.hist-item{padding:10px;border-radius:9px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.hist-item.active{background:var(--card2);color:var(--text)}.drawer-footer{padding:15px;border-top:1px solid var(--border);font-size:13px}.drawer-footer a{color:var(--text);text-decoration:none}
</style>
</head>
<body>
<header class="header"><div class="header-left"><a href="menu.html" class="back-btn" aria-label="Back"><i class="fas fa-arrow-left"></i></a><div class="ai-title">StudentX AI <span class="badge">v1.3</span></div></div><button class="menu-btn" onclick="toggleDrawer()" aria-label="Chat menu"><i class="fas fa-bars"></i></button></header>
<main class="chat-container" id="chatContainer"><div class="empty-state" id="emptyState"><i class="fas fa-robot"></i><p>Ask StudentX AI about your studies, assignments, ideas, or create images and videos.</p></div></main>
<div class="bottom-wrapper">
 <div class="ai-mode-bar">
  <button class="ai-mode-btn active" id="chatModeBtn" onclick="setAIMode('chat')"><i class="fas fa-comments"></i> Chat</button>
  <button class="ai-mode-btn" id="imageModeBtn" onclick="setAIMode('image')"><i class="fas fa-wand-magic-sparkles"></i> Create image</button>
  <button class="ai-mode-btn" id="videoModeBtn" onclick="setAIMode('video')"><i class="fas fa-video"></i> Create video</button>
 </div>
 <div class="image-preview" id="imagePreview"><img id="imagePreviewThumb" alt="Selected image"><div class="preview-info" id="imagePreviewName"></div><button class="remove-image" type="button" onclick="removeSelectedImage()" aria-label="Remove image"><i class="fas fa-xmark"></i></button></div>
 <div class="input-area"><input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden><button class="attach-btn" id="attachBtn" type="button" aria-label="Attach image"><i class="fas fa-paperclip"></i></button><input type="text" id="messageInput" placeholder="Message StudentX AI..." autocomplete="off"><button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send"><i class="fas fa-paper-plane"></i></button></div>
</div>
<div class="overlay" id="drawerOverlay" onclick="toggleDrawer()"></div><aside class="drawer" id="sideDrawer"><div class="drawer-head"><strong>Chats</strong><button class="menu-btn" onclick="toggleDrawer()"><i class="fas fa-xmark"></i></button></div><div class="drawer-content"><button class="new-chat" onclick="startNewChat()"><i class="fas fa-pen-to-square"></i> New Chat</button><div class="section-label">Recent chats</div><div id="recentList"><div class="hist-item">No chats yet</div></div></div><div class="drawer-footer"><a href="settings.html"><i class="fas fa-gear"></i> Settings</a></div></aside>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<script>
let currentUser=null,currentChatId=null,conversation=[],allChats=[],selectedImageData=null,selectedImageName="",aiMode="chat",busy=false;
const $=id=>document.getElementById(id),container=$("chatContainer"),input=$("messageInput");
function safeMarkdown(s){if(window.marked&&window.DOMPurify)return DOMPurify.sanitize(marked.parse(String(s),{breaks:true,gfm:true}));return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/\n/g,"<br>")}
function toggleDrawer(){ $("sideDrawer").classList.toggle("active");$("drawerOverlay").classList.toggle("active");}
function setAIMode(mode){aiMode=mode;["chat","image","video"].forEach(m=>$((m==="chat"?"chat":m)+"ModeBtn").classList.toggle("active",m===mode));input.placeholder=mode==="chat"?"Message StudentX AI...":mode==="image"?"Describe the image you want to create or edit...":"Describe a video, or attach an image to animate...";$("attachBtn").title=mode==="chat"?"Attach image":mode==="image"?"Attach image to edit":"Attach image to animate";}
function removeSelectedImage(){selectedImageData=null;selectedImageName="";$("imageInput").value="";$("imagePreview").classList.remove("show");$("imagePreviewThumb").removeAttribute("src");}
$("attachBtn").addEventListener("click",()=>$("imageInput").click());
$("imageInput").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!["image/png","image/jpeg","image/webp"].includes(f.type)){alert("Choose a PNG, JPEG, or WebP image.");e.target.value="";return;}if(f.size>2*1024*1024){alert("Please choose an image smaller than 2 MB.");e.target.value="";return;}const r=new FileReader();r.onload=()=>{selectedImageData=String(r.result);selectedImageName=f.name;$("imagePreviewThumb").src=selectedImageData;$("imagePreviewName").textContent=f.name;$("imagePreview").classList.add("show");};r.onerror=()=>alert("Could not read this image.");r.readAsDataURL(f);});
function renderMessages(){if(!conversation.length){container.innerHTML='<div class="empty-state" id="emptyState"><i class="fas fa-robot"></i><p>Ask StudentX AI about your studies, assignments, ideas, or create images and videos.</p></div>';return;}container.innerHTML=conversation.map(m=>'<div class="message '+(m.role==="user"?"user":"ai")+'"><div class="msg-avatar"><i class="fas '+(m.role==="user"?"fa-user":"fa-robot")+'"></i></div><div class="bubble">'+(m.role==="user"?safeMarkdown(m.content):safeMarkdown(m.content))+'</div></div>').join("");container.scrollTop=container.scrollHeight;}
function appendMessage(role,text,media){if($("emptyState"))$("emptyState").remove();const wrap=document.createElement("div");wrap.className="message "+(role==="user"?"user":"ai");const av=document.createElement("div");av.className="msg-avatar";av.innerHTML='<i class="fas '+(role==="user"?"fa-user":"fa-robot")+'"></i>';const bubble=document.createElement("div");bubble.className="bubble";bubble.innerHTML=role==="ai"?safeMarkdown(text):safeMarkdown(text);if(media){let el;if(media.kind==="video"){el=document.createElement("video");el.controls=true;el.playsInline=true;}else{el=document.createElement("img");el.className="generated";el.alt="StudentX AI generated image";}el.src=media.url;bubble.appendChild(el);const a=document.createElement("a");a.className="download";a.href=media.url;a.download=media.kind==="video"?"studentx-ai-video.mp4":"studentx-ai-image.png";a.innerHTML='<i class="fas fa-download"></i> Save '+(media.kind==="video"?"video":"image");bubble.appendChild(a);}wrap.append(av,bubble);container.appendChild(wrap);container.scrollTop=container.scrollHeight;}
async function init(){try{if(!window.supabaseClient)return;const a=await supabaseClient.auth.getUser();currentUser=a.data&&a.data.user;if(!currentUser)return;await loadChatList();}catch(e){console.warn("StudentX AI auth/history unavailable:",e)}}
async function loadChatList(){if(!currentUser)return;const r=await supabaseClient.from("ai_chats").select("*").eq("user_id",currentUser.id).order("updated_at",{ascending:false}).limit(30);if(r.error){console.warn(r.error.message);return;}allChats=r.data||[];$("recentList").innerHTML=allChats.length?allChats.map(c=>'<div class="hist-item '+(c.id===currentChatId?"active":"")+'" onclick="openChat(\''+c.id+'\')">'+String(c.title||"New chat").replace(/[&<>"]/g,"")+'</div>').join(""):'<div class="hist-item">No chats yet</div>';}
async function openChat(id){if(!currentUser)return;currentChatId=id;toggleDrawer();const r=await supabaseClient.from("ai_messages").select("role,content").eq("chat_id",id).order("created_at",{ascending:true});if(r.error){alert("Could not load chat history.");return;}conversation=(r.data||[]).map(m=>({role:m.role,content:m.content}));renderMessages();await loadChatList();}
function startNewChat(){currentChatId=null;conversation=[];renderMessages();toggleDrawer();input.focus();loadChatList();}
async function ensureChat(title){if(!currentUser||!window.supabaseClient)return null;if(currentChatId)return currentChatId;const r=await supabaseClient.from("ai_chats").insert({user_id:currentUser.id,title:title.slice(0,48)||"New chat"}).select().single();if(r.error){console.warn("Chat save error:",r.error.message);return null;}currentChatId=r.data.id;allChats.unshift(r.data);loadChatList();return currentChatId;}
async function saveMessage(id,role,content){if(!currentUser||!id)return;const r=await supabaseClient.from("ai_messages").insert({chat_id:id,user_id:currentUser.id,role,content});if(r.error)console.warn("Message history not saved:",r.error.message);supabaseClient.from("ai_chats").update({updated_at:new Date().toISOString()}).eq("id",id).then(()=>{});}
async function sendMessage(){if(busy)return;const prompt=input.value.trim(),image=selectedImageData,imageName=selectedImageName;if(!prompt&&!image)return;if(aiMode==="chat"&&image&&!prompt){/* allow image-only question */}if(aiMode!=="chat"&&!prompt){alert("Please describe what you want to create.");return;}busy=true;$("sendBtn").disabled=true;input.value="";removeSelectedImage();const userText=prompt||(aiMode==="chat"?"Please describe this image.":"");appendMessage("user",userText+(image?"\n[Image attached: "+imageName+"]":""));conversation.push({role:"user",content:userText+(image?"\n[Image attached: "+imageName+"]":"")});const chatId=await ensureChat(userText||"Image chat");if(chatId)await saveMessage(chatId,"user",userText+(image?"\n[Image attached: "+imageName+"]":""));const typing=document.createElement("div");typing.className="typing";typing.textContent=aiMode==="chat"?"StudentX AI is thinking…":"Creating your "+aiMode+"…";container.appendChild(typing);container.scrollTop=container.scrollHeight;
try{let endpoint=aiMode==="chat"?"/api/chat":aiMode==="image"?"/api/generate-image":"/api/generate-video";let payload=aiMode==="chat"?{text:userText,message:userText,history:conversation.slice(0,-1),image:image||null,imageName}: {prompt,image:image||undefined};const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||data.details||data.message||("Request failed: "+response.status));let reply,media=null;if(aiMode==="chat"){reply=data.reply||data.response||data.message;if(typeof reply!=="string"||!reply.trim())throw new Error("The AI returned an empty response.");}else{const url=aiMode==="image"?(data.image||data.url||data.image_url):(data.video||data.url||data.video_url);if(typeof url!=="string"||!url)throw new Error("The API did not return a media URL. Check the matching Vercel API route.");reply=aiMode==="image"?(image?"Image edited successfully.":"Image created successfully."):"Video created successfully.";media={kind:aiMode==="image"?"image":"video",url};}typing.remove();conversation.push({role:"assistant",content:reply});appendMessage("ai",reply,media);if(chatId)await saveMessage(chatId,"assistant",reply+(media?" [Generated media is displayed above.]":""));await loadChatList();}
catch(err){typing.remove();const message="Sorry, "+(err.message||"something went wrong")+"\nCheck that the matching /api route exists in Vercel and its required API key is configured.";conversation.push({role:"assistant",content:message});appendMessage("ai",message);}
finally{busy=false;$("sendBtn").disabled=false;}}
input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMessage();}});
init();
</script><script src="theme.js"></script>
</body></html>
