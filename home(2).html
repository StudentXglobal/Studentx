<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>StudentX - Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#12121a;--card2:#1a1a24;--border:rgba(255,255,255,.08);--text:#fff;--sub:rgba(255,255,255,.75);--muted:rgba(255,255,255,.48);--accent:#dc2743;--grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
:root.sx-light{--bg:#f0f2f5;--card:#fff;--card2:#f0f2f5;--border:#e0e2e7;--text:#050505;--sub:#3a3b3c;--muted:#65676b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:Poppins,Arial,sans-serif;background:var(--bg);color:var(--text);max-width:500px;margin:auto;min-height:100vh;padding-bottom:80px}button{font:inherit;cursor:pointer}a{text-decoration:none;color:inherit}
.header{height:60px;position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px}.hl,.hr{display:flex;align-items:center;gap:3px}.logo{font-size:20px;font-weight:900;margin-left:5px}.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.ib{width:38px;height:38px;border:0;background:transparent;color:var(--text);border-radius:11px;display:flex;align-items:center;justify-content:center}.ib:active{background:var(--card2)}.bell{position:relative}.badge{display:none;position:absolute;top:0;right:0;min-width:17px;height:17px;border-radius:10px;background:#ef4444;color:#fff;border:2px solid var(--bg);font-size:8px;font-weight:800;align-items:center;justify-content:center}
.new{display:none;position:fixed;top:65px;left:50%;transform:translateX(-50%);z-index:200;background:var(--grad);color:#fff;padding:8px 16px;border-radius:20px;font-size:11px;font-weight:800;box-shadow:0 5px 20px #0007}
.stories{display:flex;gap:13px;overflow-x:auto;padding:13px 14px 10px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{width:62px;flex:0 0 62px;text-align:center;cursor:pointer}.ring,.add{width:58px;height:58px;margin:auto;border-radius:50%}.ring{padding:2px;background:var(--grad)}.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg);background:var(--card2)}.add{border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent)}.sn{margin-top:5px;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.create{margin:0 14px 12px;padding:11px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:15px}.av{width:40px;height:40px;flex:0 0 40px;border-radius:50%;object-fit:cover;background:var(--card2);cursor:pointer}.create-main{flex:1;min-width:0}.create-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ph{font-size:11px;color:var(--muted);margin-top:2px}.tools{display:flex;gap:10px}.tools i{font-size:17px}.photo{color:#10b981}.vid{color:#ef4444}.poll{color:#f59e0b}
.post,.ad{margin:0 14px 12px;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}.head{display:flex;align-items:center;gap:10px;padding:12px 14px}.info{flex:1;min-width:0}.name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.meta{font-size:9px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.community{font-size:10px;font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.community span{font-weight:500;color:var(--muted)}.more{width:32px;height:32px;border:0;background:transparent;color:var(--muted);border-radius:9px}.more:active{background:var(--card2)}.body{padding:0 14px 10px;color:var(--sub);font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.body.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}.see{padding:0 14px 10px;color:var(--accent);font-size:11px;font-weight:800}.media{display:block;width:100%;max-height:620px;object-fit:contain;background:#000}.acts{display:flex;align-items:center;border-top:1px solid var(--border);padding:3px 6px 7px}.act{border:0;background:transparent;color:var(--muted);padding:8px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700}.act:active{background:var(--card2)}.act.like.on{color:#ef4444}.act.on{color:var(--accent)}.save{margin-left:auto}.pop{animation:pop .25s}.tag{display:inline-flex;align-items:center;gap:4px;background:var(--grad);color:#fff;border-radius:9px;padding:3px 8px;font-size:8px;font-weight:800}@keyframes pop{50%{transform:scale(1.3)}}
.ad-head{display:flex;align-items:center;gap:10px;padding:12px 14px}.ad-title{font-size:13px;font-weight:800}.ad-sub{font-size:9px;color:var(--muted);margin-top:2px}.ad-label{font-size:9px;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:10px}.ad-media{display:block;width:100%;max-height:600px;object-fit:cover;background:#000}.ad-cap{padding:10px 14px;color:var(--sub);font-size:13px;line-height:1.6;white-space:pre-wrap}.cta{display:inline-flex;padding:9px 17px;border:0;border-radius:11px;background:var(--grad);color:#fff;font-size:11px;font-weight:800}.cta-wrap{padding:5px 14px 13px}
.skeleton{height:180px;margin:0 14px 12px;border-radius:16px;background:var(--card);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.5}}.center{text-align:center;color:var(--muted);padding:45px 25px;font-size:11px}.center i{display:block;font-size:30px;color:var(--accent);margin-bottom:10px}.center b{display:block;color:var(--text);font-size:14px;margin-bottom:5px}.end{text-align:center;color:var(--muted);font-size:10px;padding:15px}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;background:#222230;color:#fff;padding:10px 17px;border-radius:11px;font-size:11px;font-weight:700}
.ov{position:fixed;inset:0;z-index:500;background:#0009;display:none;align-items:flex-end;justify-content:center}.ov.show{display:flex}.sheet{width:100%;max-width:500px;background:#151522;border-radius:20px 20px 0 0;padding:10px 0 25px}.handle{width:38px;height:4px;border-radius:4px;background:#7776;margin:2px auto 9px}.item{padding:14px 20px;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600}.item i{width:18px;text-align:center;color:var(--muted)}.item.danger,.item.danger i{color:#ef4444}
</style>
</head>
<body>
<header class="header"><div class="hl"><button class="ib" onclick="location.href='menu.html'"><i class="fas fa-bars"></i></button><div class="logo">Student<b>X</b></div></div><div class="hr"><button class="ib" onclick="location.href='groups.html'"><i class="fas fa-user-group"></i></button><button class="ib" onclick="location.href='search.html'"><i class="fas fa-search"></i></button><div class="bell"><button class="ib" onclick="location.href='notification.html'"><i class="fas fa-bell"></i></button><span class="badge" id="bellBadge">0</span></div></div></header>
<div class="new" id="newPill" onclick="refreshFeed()"></div>
<section class="stories" id="stories"></section>
<section class="create" onclick="location.href='create-post.html'"><img class="av" id="myAvatar" src="" alt=""><div class="create-main"><div class="create-name" id="myName">Loading...</div><div class="ph">What's on your mind?</div></div><div class="tools"><i class="fas fa-image photo" onclick="event.stopPropagation();location.href='create-post.html?type=photo'"></i><i class="fas fa-video vid" onclick="event.stopPropagation();location.href='create-post.html?type=video'"></i><i class="fas fa-poll poll" onclick="event.stopPropagation();toast('Polls are coming soon')"></i></div></section>
<main id="feed"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main>
<div class="ov" id="menuOv" onclick="if(event.target===this)closeMenu()"><div class="sheet"><div class="handle"></div><div id="menuItems"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="studentx-badges.js"></script>
<script>
var PAGE=15,me=null,profile=null,following=new Set(),groupIds=new Set(),posts={},liked=new Set(),saved=new Set(),reposted=new Set();
var likeCount={},commentCount={},repostCount={},ads=[],adIndex=0,videos=[],videoIndex=0,adSeen=new Set(),offset=0,loading=false,noMore=false,postCounter=0,newPosts=0;
var DEFAULT_AVATAR='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#202027"/><circle cx="100" cy="78" r="42" fill="#777"/><path d="M35 190c8-48 35-70 65-70s57 22 65 70" fill="#777"/></svg>');
function $(id){return document.getElementById(id)}
function esc(v){return v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function fmt(n){n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'K':String(n)}
function ago(v){if(!v)return'';var t=new Date(v).getTime();if(isNaN(t))return'';var s=Math.floor((Date.now()-t)/1000);if(s<60)return'Just now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<604800)return Math.floor(s/86400)+'d';return new Date(v).toLocaleDateString()}
function toast(m){var o=document.querySelector('.toast');if(o)o.remove();var x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(function(){x.remove()},2400)}
function badgeName(u){if(window.StudentXBadges&&u&&u.id){try{return StudentXBadges.nameHTML(u)}catch(e){}}return esc((u&&(u.full_name||u.username))||'StudentX User')}
function goProfile(id){if(id)location.href='profile.html?id='+encodeURIComponent(id)}
function postLink(id){return location.origin+location.pathname+'?post='+encodeURIComponent(id)}

async function init(){try{var a=await supabaseClient.auth.getUser();me=a.data&&a.data.user;if(!me){location.href='login.html';return}await loadProfile();await loadContext();await loadStories();await loadNotifications();await Promise.all([loadAds(),loadVideos()]);await loadFeed(true);subscribeRealtime();openRequestedPost()}catch(e){console.error(e);$('feed').innerHTML='<div class="center"><i class="fas fa-triangle-exclamation"></i><b>Something went wrong</b>Please refresh the page.</div>'}}
async function loadProfile(){var r=await supabaseClient.from('profiles').select('id,full_name,username,avatar_url,verified,premium_plan').eq('id',me.id).maybeSingle();profile=r.data||{id:me.id};$('myAvatar').src=profile.avatar_url||DEFAULT_AVATAR;$('myAvatar').onerror=function(){this.src=DEFAULT_AVATAR};$('myName').innerHTML=badgeName(profile)}
async function loadContext(){var f=await supabaseClient.from('followers').select('following_id').eq('follower_id',me.id);(f.data||[]).forEach(x=>following.add(String(x.following_id)));var g=await supabaseClient.from('group_members').select('group_id').eq('user_id',me.id).eq('status','active');if(!g.error)(g.data||[]).forEach(x=>groupIds.add(String(x.group_id)))}

/* Story ring opens the selected user's story, never their profile. */
async function loadStories(){var h='<div class="story" onclick="location.href=\'story.html?create=1\'"><div class="add"><i class="fas fa-plus"></i></div><div class="sn">Your Story</div></div>';var r=await supabaseClient.from('profiles').select('id,full_name,username,avatar_url').neq('id',me.id).order('created_at',{ascending:false}).limit(15);(r.data||[]).forEach(function(u){h+='<div class="story" onclick="openStory(\''+esc(u.id)+'\')"><div class="ring"><img src="'+esc(u.avatar_url||DEFAULT_AVATAR)+'" onerror="this.src=DEFAULT_AVATAR"></div><div class="sn">'+esc((u.full_name||u.username||'Student').split(' ')[0])+'</div></div>'});$('stories').innerHTML=h}
function openStory(id){location.href='story.html?user='+encodeURIComponent(id)}
async function loadNotifications(){var r=await supabaseClient.from('notifications').select('id',{count:'exact',head:true}).eq('recipient_id',me.id).eq('is_read',false);var b=$('bellBadge'),n=r.count||0;b.textContent=n>99?'99+':n;b.style.display=n?'flex':'none'}

async function fetchPosts(){var r=await supabaseClient.from('posts').select('*').order('Create_at',{ascending:false}).range(offset,offset+PAGE-1);if(r.error){console.error(r.error);return null}return r.data||[]}
function visiblePost(p){if(!p||!p.id||!p.User_id)return false;if(p.visibility==='private'&&p.User_id!==me.id)return false;if(p.visibility==='followers'&&p.User_id!==me.id&&!following.has(String(p.User_id)))return false;if(p.group_id&&groupIds.size&&!groupIds.has(String(p.group_id))&&p.User_id!==me.id)return false;return true}
async function enrich(rows){var ids=[...new Set(rows.map(p=>p.User_id).filter(Boolean))],users={};if(ids.length){var pr=await supabaseClient.from('profiles').select('id,full_name,username,avatar_url,verified,premium_plan,university').in('id',ids);(pr.data||[]).forEach(u=>users[u.id]=u)}var pids=rows.map(p=>p.id);var lr=await supabaseClient.from('likes').select('post_id,user_id').in('post_id',pids);var cr=await supabaseClient.from('comments').select('post_id').in('post_id',pids);var rr=await supabaseClient.from('reposts').select('post_id,user_id').in('post_id',pids);var br=await supabaseClient.from('bookmarks').select('post_id,user_id').in('post_id',pids);(lr.data||[]).forEach(x=>{likeCount[x.post_id]=(likeCount[x.post_id]||0)+1;if(x.user_id===me.id)liked.add(String(x.post_id))});(cr.data||[]).forEach(x=>commentCount[x.post_id]=(commentCount[x.post_id]||0)+1);(rr.data||[]).forEach(x=>{repostCount[x.post_id]=(repostCount[x.post_id]||0)+1;if(x.user_id===me.id)reposted.add(String(x.post_id))});(br.data||[]).forEach(x=>{if(x.user_id===me.id)saved.add(String(x.post_id))});rows.forEach(p=>{p.profile=users[p.User_id]||{};posts[String(p.id)]=p})}
async function loadFeed(reset){if(loading)return;loading=true;if(reset){offset=0;noMore=false;postCounter=0;$('feed').innerHTML='';$('newPill').style.display='none'}var rows=await fetchPosts();if(rows===null){$('feed').innerHTML='<div class="center"><i class="fas fa-triangle-exclamation"></i><b>Unable to load posts</b>Check your connection and try again.</div>';loading=false;return}offset+=rows.length;if(rows.length<PAGE)noMore=true;var v=rows.filter(visiblePost);if(v.length){await enrich(v);appendPosts(v)}if(reset&&!v.length)$('feed').innerHTML='<div class="center"><i class="fas fa-newspaper"></i><b>No posts yet</b>Posts from students will appear here.</div>';if(noMore)$('feed').insertAdjacentHTML('beforeend','<div class="end">You reached the end of your feed.</div>');loading=false}
function appendPosts(rows){var h='';rows.forEach(p=>{h+=renderPost(p);postCounter++;if(postCounter%6===0){var a=nextAd();if(a)h+=renderAd(a)}if(postCounter%8===0){var v=nextVideo();if(v)h+=renderVideo(v)}});$('feed').insertAdjacentHTML('beforeend',h);observeMedia()}
function renderPost(p){var id=String(p.id),u=p.profile||{},group=p.group_name||p.group_title||p.community_name||p.community_title||'';var c=group?'<div class="community">'+esc(group)+' <span>›</span></div>':'';var text=p.content?'<div class="body '+(String(p.content).length>500?'clamp':'')+'" id="body-'+id+'">'+esc(p.content)+'</div>':'';if(String(p.content||'').length>500)text+='<div class="see" onclick="expand(\''+id+'\',this)">See more</div>';var media='';if(p.image_url)media='<img class="media" src="'+esc(p.image_url)+'" loading="lazy">';else if(p.video_url)media='<video class="media" controls playsinline preload="metadata" src="'+esc(p.video_url)+'"></video>';return '<article class="post" id="post-'+esc(id)+'"><div class="head"><img class="av" src="'+esc(u.avatar_url||DEFAULT_AVATAR)+'" onclick="goProfile(\''+esc(p.User_id)+'\')" onerror="this.src=DEFAULT_AVATAR"><div class="info">'+c+'<div class="name" onclick="goProfile(\''+esc(p.User_id)+'\')">'+badgeName(u)+'</div><div class="meta">'+(u.username?'@'+esc(u.username)+' · ':'')+ago(p.Create_at)+'</div></div><button class="more" onclick="openPostMenu(\''+esc(id)+'\')"><i class="fas fa-ellipsis-h"></i></button></div>'+text+media+postActions(id)+'</article>'}
function postActions(id){var l=liked.has(id),r=reposted.has(id),s=saved.has(id);return '<div class="acts"><button class="act like '+(l?'on':'')+'" id="like-'+id+'" onclick="toggleLike(\''+id+'\')"><i class="'+(l?'fas':'far')+' fa-heart"></i><span>'+fmt(likeCount[id])+'</span></button><button class="act" onclick="location.href=\'comment.html?post='+encodeURIComponent(id)+'\'"><i class="far fa-comment"></i><span>'+fmt(commentCount[id])+'</span></button><button class="act '+(r?'on':'')+'" id="repost-'+id+'" onclick="toggleRepost(\''+id+'\')"><i class="fas fa-retweet"></i><span>'+fmt(repostCount[id])+'</span></button><button class="act" onclick="sharePost(\''+id+'\')"><i class="fas fa-share"></i><span>Share</span></button><button class="act save '+(s?'on':'')+'" id="save-'+id+'" onclick="toggleSave(\''+id+'\')"><i class="'+(s?'fas':'far')+' fa-bookmark"></i></button></div>'}
function expand(id,b){var x=$('body-'+id);if(x)x.classList.remove('clamp');if(b)b.remove()}

async function toggleLike(id){var b=$('like-'+id),on=liked.has(id);var r=on?await supabaseClient.from('likes').delete().eq('post_id',id).eq('user_id',me.id):await supabaseClient.from('likes').insert({post_id:id,user_id:me.id});if(r.error){toast('Could not update like');return}if(on){liked.delete(id);likeCount[id]=Math.max(0,(likeCount[id]||1)-1)}else{liked.add(id);likeCount[id]=(likeCount[id]||0)+1}if(b){b.classList.toggle('on',liked.has(id));b.classList.add('pop');b.innerHTML='<i class="'+(liked.has(id)?'fas':'far')+' fa-heart"></i><span>'+fmt(likeCount[id])+'</span>'}}
async function toggleRepost(id){var b=$('repost-'+id),on=reposted.has(id);var r=on?await supabaseClient.from('reposts').delete().eq('post_id',id).eq('user_id',me.id):await supabaseClient.from('reposts').insert({post_id:id,user_id:me.id});if(r.error){toast('Could not update repost');return}if(on){reposted.delete(id);repostCount[id]=Math.max(0,(repostCount[id]||1)-1)}else{reposted.add(id);repostCount[id]=(repostCount[id]||0)+1}if(b){b.classList.toggle('on',reposted.has(id));b.innerHTML='<i class="fas fa-retweet"></i><span>'+fmt(repostCount[id])+'</span>'}}
async function toggleSave(id){var b=$('save-'+id),on=saved.has(id);var r=on?await supabaseClient.from('bookmarks').delete().eq('post_id',id).eq('user_id',me.id):await supabaseClient.from('bookmarks').insert({post_id:id,user_id:me.id});if(r.error){toast('Could not save post');return}if(on)saved.delete(id);else saved.add(id);if(b){b.classList.toggle('on',saved.has(id));b.innerHTML='<i class="'+(saved.has(id)?'fas':'far')+' fa-bookmark"></i>'}toast(on?'Removed from saved':'Post saved')}
async function sharePost(id){try{if(navigator.share){await navigator.share({title:'StudentX post',url:postLink(id)});return}await navigator.clipboard.writeText(postLink(id));toast('Link copied')}catch(e){}}

async function loadAds(){var now=new Date().toISOString();var r=await supabaseClient.from('ads').select('id,title,username,avatar_url,video_url,thumbnail_url,image_url,caption,cta_text,cta_url,status,start_at,end_at,created_at').eq('status','active').lte('start_at',now).gte('end_at',now).order('created_at',{ascending:false});if(!r.error)ads=r.data||[]}
function nextAd(){if(!ads.length)return null;return ads[adIndex++%ads.length]}
function renderAd(a){var media=a.video_url?'<video class="ad-media" muted loop playsinline preload="metadata"'+(a.thumbnail_url?' poster="'+esc(a.thumbnail_url)+'"':'')+' src="'+esc(a.video_url)+'"></video>':(a.image_url||a.thumbnail_url)?'<img class="ad-media" src="'+esc(a.image_url||a.thumbnail_url)+'">':'';return '<article class="ad" data-ad-id="'+esc(a.id)+'"><div class="ad-head"><img class="av" src="'+esc(a.avatar_url||DEFAULT_AVATAR)+'" onerror="this.src=DEFAULT_AVATAR"><div class="info"><div class="ad-title">'+esc(a.title||'Sponsored')+'</div><div class="ad-sub">Sponsored'+(a.username?' · '+esc(a.username):'')+'</div></div><span class="ad-label">Ad</span></div>'+media+(a.caption?'<div class="ad-cap">'+esc(a.caption)+'</div>':'')+'<div class="acts"><button class="act" onclick="adEvent(\''+esc(a.id)+'\',\'like\')"><i class="far fa-heart"></i><span>Like</span></button><button class="act" onclick="adEvent(\''+esc(a.id)+'\',\'comment\')"><i class="far fa-comment"></i><span>Comment</span></button><button class="act" onclick="adShare(\''+esc(a.id)+'\')"><i class="fas fa-share"></i><span>Share</span></button><button class="act save" onclick="adEvent(\''+esc(a.id)+'\',\'save\')"><i class="far fa-bookmark"></i></button></div><div class="cta-wrap">'+(a.cta_url?'<a class="cta" href="'+esc(a.cta_url)+'" target="_blank" rel="noopener" onclick="trackAd(\''+esc(a.id)+'\',\'click\')">'+esc(a.cta_text||'Learn more')+'</a>':'<button class="cta" onclick="trackAd(\''+esc(a.id)+'\',\'click\')">'+esc(a.cta_text||'Learn more')+'</button>')+'</div></article>'}
function trackAd(id,type){if(!id||!me)return;if(type==='impression'){if(adSeen.has(id))return;adSeen.add(id)}supabaseClient.from('ad_events').insert({ad_id:id,user_id:me.id,event_type:type})}
function adEvent(id,type){trackAd(id,type);if(type==='comment')toast('Ad comments will open here');else toast(type==='like'?'Ad liked':'Ad saved')}
async function adShare(id){var a=ads.find(x=>String(x.id)===String(id)),url=a&&a.cta_url||location.href;try{if(navigator.share){await navigator.share({title:a&&a.title||'StudentX Ad',url:url})}else{await navigator.clipboard.writeText(url);toast('Link copied')}}catch(e){}}

async function loadVideos(){var r=await supabaseClient.from('videos').select('id,user_id,video_url,thumbnail_url,caption,created_at').order('created_at',{ascending:false}).limit(20);if(r.error)return;var rows=r.data||[],ids=[...new Set(rows.map(v=>v.user_id).filter(Boolean))],users={};if(ids.length){var p=await supabaseClient.from('profiles').select('id,full_name,username,avatar_url,verified,premium_plan').in('id',ids);(p.data||[]).forEach(u=>users[u.id]=u)}rows.forEach(v=>v.profile=users[v.user_id]||{});videos=rows}
function nextVideo(){if(!videos.length)return null;return videos[videoIndex++%videos.length]}
function renderVideo(v){var u=v.profile||{};return '<article class="post home-video" data-video-card><div class="head"><img class="av" src="'+esc(u.avatar_url||DEFAULT_AVATAR)+'" onclick="goProfile(\''+esc(v.user_id)+'\')"><div class="info"><div class="name" onclick="goProfile(\''+esc(v.user_id)+'\')">'+badgeName(u)+'</div><div class="meta">'+(u.username?'@'+esc(u.username)+' · ':'')+ago(v.created_at)+'</div></div><span class="tag"><i class="fas fa-video"></i> Video</span></div><video class="media" muted loop playsinline preload="metadata"'+(v.thumbnail_url?' poster="'+esc(v.thumbnail_url)+'"':'')+' src="'+esc(v.video_url)+'"></video>'+(v.caption?'<div class="body">'+esc(v.caption)+'</div>':'')+'<div class="acts"><button class="act like" onclick="videoLike(\''+esc(v.id)+'\',this)"><i class="far fa-heart"></i><span>Like</span></button><button class="act" onclick="location.href=\'video-comments.html?video='+encodeURIComponent(v.id)+'\'"><i class="far fa-comment"></i><span>Comment</span></button><button class="act" onclick="videoShare(\''+esc(v.id)+'\')"><i class="fas fa-share"></i><span>Share</span></button><button class="act save" onclick="videoSave(\''+esc(v.id)+'\',this)"><i class="far fa-bookmark"></i></button></div></article>'}
async function videoLike(id,b){var on=b.classList.contains('on'),r=on?await supabaseClient.from('video_likes').delete().eq('video_id',id).eq('user_id',me.id):await supabaseClient.from('video_likes').insert({video_id:id,user_id:me.id});if(r.error){toast('Could not update video like');return}b.classList.toggle('on',!on);b.innerHTML='<i class="'+(!on?'fas':'far')+' fa-heart"></i><span>Like</span>'}
async function videoSave(id,b){var on=b.classList.contains('on'),r=on?await supabaseClient.from('video_saves').delete().eq('video_id',id).eq('user_id',me.id):await supabaseClient.from('video_saves').insert({video_id:id,user_id:me.id});if(r.error){toast('Could not save video');return}b.classList.toggle('on',!on);b.innerHTML='<i class="'+(!on?'fas':'far')+' fa-bookmark"></i>';toast(on?'Video removed from saved':'Video saved')}
async function videoShare(id){var u=location.origin+'/video.html?video='+encodeURIComponent(id);try{if(navigator.share)await navigator.share({title:'StudentX video',url:u});else{await navigator.clipboard.writeText(u);toast('Link copied')}}catch(e){}}

function openPostMenu(id){var p=posts[id];if(!p)return;var h=p.User_id===me.id?'<div class="item danger" onclick="deletePost(\''+esc(id)+'\')"><i class="fas fa-trash"></i>Delete post</div>':'<div class="item" onclick="closeMenu();goProfile(\''+esc(p.User_id)+'\')"><i class="fas fa-user"></i>View profile</div>';h+='<div class="item" onclick="sharePost(\''+esc(id)+'\');closeMenu()"><i class="fas fa-share"></i>Share post</div><div class="item" onclick="copyPost(\''+esc(id)+'\')"><i class="fas fa-link"></i>Copy link</div>';$('menuItems').innerHTML=h;$('menuOv').classList.add('show')}
function closeMenu(){$('menuOv').classList.remove('show')}
async function copyPost(id){closeMenu();try{await navigator.clipboard.writeText(postLink(id));toast('Link copied')}catch(e){toast('Could not copy link')}}
async function deletePost(id){closeMenu();if(!confirm('Delete this post?'))return;var r=await supabaseClient.from('posts').delete().eq('id',id).eq('User_id',me.id).select('id');if(r.error||!r.data||!r.data.length){toast('Could not delete post');return}var e=$('post-'+id);if(e)e.remove();delete posts[id];toast('Post deleted')}

var observer=new IntersectionObserver(function(es){es.forEach(function(e){var el=e.target;if(el.matches('.ad')){var v=el.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>=.5){trackAd(el.dataset.adId,'impression');if(v){v.muted=true;v.play().catch(function(){})}}else if(v)v.pause()}else if(el.hasAttribute('data-video-card')){var v=el.querySelector('video');if(!v)return;if(e.isIntersecting&&e.intersectionRatio>=.6){v.muted=true;v.play().catch(function(){})}else v.pause()}})},{threshold:[0,.5,.6,1]});
function observeMedia(){document.querySelectorAll('.ad:not([data-observed]),[data-video-card]:not([data-observed])').forEach(function(e){e.dataset.observed='1';observer.observe(e)})}

function subscribeRealtime(){supabaseClient.channel('home-posts-'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},function(p){if(!p.new||p.new.User_id===me.id||!visiblePost(p.new))return;newPosts++;$('newPill').textContent='↑ '+newPosts+' new post'+(newPosts>1?'s':'');$('newPill').style.display='block'}).on('postgres_changes',{event:'DELETE',schema:'public',table:'posts'},function(p){if(p.old&&p.old.id){var e=$('post-'+p.old.id);if(e)e.remove()}}).subscribe();supabaseClient.channel('home-notifs-'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'recipient_id=eq.'+me.id},loadNotifications).subscribe()}
async function refreshFeed(){$('newPill').style.display='none';newPosts=0;await loadFeed(true)}
async function openRequestedPost(){var id=new URLSearchParams(location.search).get('post');if(!id)return;var e=$('post-'+id);if(!e){var r=await supabaseClient.from('posts').select('*').eq('id',id).maybeSingle();if(r.error||!r.data||!visiblePost(r.data)){toast('This post is not available');return}await enrich([r.data]);$('feed').insertAdjacentHTML('afterbegin',renderPost(r.data));e=$('post-'+id)}if(e)setTimeout(function(){e.scrollIntoView({behavior:'smooth',block:'center');e.style.boxShadow='0 0 0 2px var(--accent)';setTimeout(function(){e.style.boxShadow=''},1800)},300)}
window.addEventListener('scroll',function(){if(!loading&&!noMore&&window.innerHeight+window.scrollY>=document.body.offsetHeight-700)loadFeed(false)});
init();
</script>
