<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudentX Ads Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0b0b10;color:#fff;font-family:Arial,sans-serif;padding:18px}
.wrap{max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:20px}.card{background:#15151d;border:1px solid #282833;border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:#aaa;margin:12px 0 6px}
input,textarea,select{width:100%;background:#20202a;color:#fff;border:1px solid #343442;border-radius:8px;padding:11px;outline:none}
textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:8px;padding:11px 14px;background:#6d35ff;color:#fff;font-weight:700;cursor:pointer;margin-top:14px}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#25252e}.ad{border-top:1px solid #292933;padding:14px 0}.ad:first-child{border-top:0}
.status{font-size:11px;padding:4px 7px;border-radius:5px;background:#282833;color:#bbb}
.status.active{color:#72e6a5;background:rgba(114,230,165,.1)}
.status.paused{color:#ffd166;background:rgba(255,209,102,.1)}
.status.scheduled{color:#7cc4ff;background:rgba(124,196,255,.1)}
.status.expired{color:#888;background:rgba(255,255,255,.05)}
.ad-btns{display:flex;gap:8px;margin-top:8px}
.ad-btns button{margin-top:0}
small{color:#999}.danger{background:#b3263e}

/* AUTH MODAL */
#authModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(11,11,16,.96);z-index:9999;display:none;align-items:center;justify-content:center}
#authModal.show{display:flex}
.auth-card{background:#15151d;padding:30px;border-radius:15px;border:1px solid #282833;width:100%;max-width:380px;text-align:center}
.auth-card h2{margin-bottom:8px;font-size:20px}
.auth-card p{font-size:12px;color:#888;margin-bottom:18px}
.auth-card input{margin-bottom:14px}
.auth-card button{width:100%}
#deniedBox{display:none;text-align:center;margin-top:100px;color:#888}
</style>
</head>
<body>

<!-- ADMIN AUTH GATE -->
<div id="authModal">
  <div class="auth-card">
    <h2>Admin Authentication</h2>
    <p>Enter the admin password to access Ads Manager.</p>
    <input type="password" id="adminPasswordInput" placeholder="Enter Admin Password" onkeydown="if(event.key==='Enter')verifyAdminPassword()">
    <button onclick="verifyAdminPassword()">Unlock Ads Manager</button>
  </div>
</div>

<!-- SHOWN WHEN THE LOGGED-IN ACCOUNT IS NOT IN admin_users AT ALL -->
<div id="deniedBox">
  <i class="fas fa-lock" style="font-size:28px;display:block;margin-bottom:12px"></i>
  Admin access required for this account.
  <div><button class="secondary" style="margin-top:16px" onclick="location.href='home.html'">Back to Home</button></div>
</div>

<div class="wrap" id="mainWrap" style="display:none">
<div class="top"><h1><i class="fas fa-bullhorn"></i> StudentX Ads Manager</h1><button class="secondary" onclick="location.href='video.html'">Video Feed</button></div>

<div class="card">
<h2 style="font-size:16px">Create advertisement</h2>
<label>Ad title</label><input id="title" placeholder="Example: StudentX Laptop Store">
<label>Advert video</label><input id="videoFile" type="file" accept="video/*">
<label>Caption</label><textarea id="caption" placeholder="Write your advert caption..."></textarea>
<div class="row">
<div><label>CTA text</label><input id="ctaText" value="Learn More"></div>
<div><label>CTA URL</label><input id="ctaUrl" placeholder="https://example.com"></div>
</div>
<label>Interests / categories</label><input id="interests" placeholder="tech, education, football">
<div class="row">
<div><label>Start</label><input id="startAt" type="datetime-local"></div>
<div><label>End</label><input id="endAt" type="datetime-local"></div>
</div>
<button id="publishBtn" onclick="createAd()">Publish Ad</button>
<p id="msg" style="font-size:12px;color:#aaa;margin-top:10px"></p><p id="debug" style="font-size:11px;color:#777;margin-top:6px"></p>
</div>

<div class="card"><h2 style="font-size:16px;margin-bottom:10px">Your ads</h2><div id="ads">Loading...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
const ADMIN_PASSWORD = "adminpassword123";
let user = null;
let busyAdId = null;
const msg = x => document.getElementById("msg").textContent = x;

/* =========================================================
   GATE 1: must be logged in and listed in admin_users
   GATE 2: must know the admin password
========================================================= */
async function init(){
  const r = await supabaseClient.auth.getUser();
  user = r.data.user;
  if (!user){ location.href = "login.html"; return; }

  const email = (user.email || "").toLowerCase();

  const chk = await supabaseClient
    .from("admin_users")
    .select("id")
    .ilike("email", email)
    .maybeSingle();

  if (chk.error || !chk.data){
    document.getElementById("deniedBox").style.display = "block";
    return;
  }

  document.getElementById("authModal").classList.add("show");
  document.getElementById("adminPasswordInput").focus();
}

function verifyAdminPassword(){
  const pwd = document.getElementById("adminPasswordInput").value;

  if (pwd === ADMIN_PASSWORD){
    document.getElementById("authModal").classList.remove("show");
    document.getElementById("mainWrap").style.display = "block";
    loadAds();
  } else {
    alert("Incorrect Admin Password!");
    document.getElementById("adminPasswordInput").value = "";
    document.getElementById("adminPasswordInput").focus();
  }
}

/* =========================================================
   CREATE AD
========================================================= */
async function createAd(){
 const file=document.getElementById("videoFile").files[0];
 const title=document.getElementById("title").value.trim();
 if(!file||!title){msg("Title and video are required.");return}
 if(!file.type.startsWith("video/")){msg("Please choose a video file.");return}
 if(file.size > 100 * 1024 * 1024){msg("Video is too large. Use a video under 100 MB.");return}
 const btn=document.getElementById("publishBtn");
 btn.disabled=true;btn.textContent="Uploading...";
 document.getElementById("debug").textContent="Starting upload...";
 let uploadedPath=null;
 try{
   if(!user){
     const ur=await supabaseClient.auth.getUser();
     user=ur.data.user;
   }
   if(!user) throw new Error("Your login session has expired. Please login again.");

   const ext=(file.name.split(".").pop()||"mp4").toLowerCase();
   const safeExt=/^[a-z0-9]+$/.test(ext)?ext:"mp4";
   uploadedPath=`${user.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${safeExt}`;

   document.getElementById("debug").textContent="Uploading video to Supabase Storage...";
   const up=await supabaseClient.storage.from("ads").upload(uploadedPath,file,{
     cacheControl:"3600",
     contentType:file.type || "video/mp4",
     upsert:false
   });
   if(up.error) throw new Error("Storage upload failed: " + up.error.message);

   const pub=supabaseClient.storage.from("ads").getPublicUrl(uploadedPath);
   const publicUrl=pub?.data?.publicUrl;
   if(!publicUrl) throw new Error("Could not create the public video URL.");

   document.getElementById("debug").textContent="Saving advertisement details...";
   const startValue=document.getElementById("startAt").value;
   const endValue=document.getElementById("endAt").value;
   const start=startValue?new Date(startValue).toISOString():new Date().toISOString();
   const end=endValue?new Date(endValue).toISOString():new Date(Date.now()+30*86400000).toISOString();
   if(new Date(end) <= new Date(start)) throw new Error("End date must be after start date.");

   const r=await supabaseClient.from("ads").insert({
     created_by:user.id,
     title:title,
     video_url:publicUrl,
     caption:document.getElementById("caption").value.trim() || null,
     cta_text:document.getElementById("ctaText").value.trim() || "Learn More",
     cta_url:document.getElementById("ctaUrl").value.trim() || null,
     interests:document.getElementById("interests").value.trim() || null,
     status:"active",
     start_at:start,
     end_at:end
   });
   if(r.error) throw new Error("Ads database failed: " + r.error.message);

   msg("Ad published successfully.");
   document.getElementById("debug").textContent="";
   document.getElementById("videoFile").value="";
   document.getElementById("title").value="";
   document.getElementById("caption").value="";
   document.getElementById("ctaUrl").value="";
   document.getElementById("interests").value="";
   document.getElementById("startAt").value="";
   document.getElementById("endAt").value="";
   await loadAds();
 }catch(e){
   console.error("Ads publish error:",e);
   const detail=e?.message || String(e);
   msg(detail === "Failed to fetch" ? "Failed to fetch Supabase. Check Storage bucket/policy or network." : detail);
   document.getElementById("debug").textContent="Upload was not completed.";
   if(uploadedPath){
     try{ await supabaseClient.storage.from("ads").remove([uploadedPath]); }catch(cleanErr){ console.warn("Cleanup failed",cleanErr); }
   }
 }finally{
   btn.disabled=false;btn.textContent="Publish Ad";
 }
}

/* =========================================================
   LIVE STATUS LABEL (based on real dates, not just the raw
   status column, so the manager reflects what viewers see)
========================================================= */
function computeLiveStatus(ad){
  const now = new Date();
  const start = ad.start_at ? new Date(ad.start_at) : null;
  const end = ad.end_at ? new Date(ad.end_at) : null;

  if (ad.status === "paused") return { key: "paused", label: "Paused" };
  if (end && end < now) return { key: "expired", label: "Expired" };
  if (start && start > now) return { key: "scheduled", label: "Scheduled" };
  if (ad.status === "active") return { key: "active", label: "Active" };
  return { key: "paused", label: ad.status || "Unknown" };
}

/* =========================================================
   LOAD ADS
========================================================= */
async function loadAds(){
 const r=await supabaseClient.from("ads").select("*").order("created_at",{ascending:false});
 const el=document.getElementById("ads");
 if(r.error){el.textContent=r.error.message;return}

 const rows = r.data || [];
 if(!rows.length){ el.innerHTML = "<small>No ads yet.</small>"; return; }

 el.innerHTML = rows.map(a => {
   const live = computeLiveStatus(a);
   const toggleLabel = a.status === "active" ? "Pause" : "Activate";
   const toggleTarget = a.status === "active" ? "paused" : "active";

   return `<div class="ad" id="ad-${esc(a.id)}">
     <b>${esc(a.title)}</b> <span class="status ${live.key}">${esc(live.label)}</span>
     <div style="margin-top:5px"><small>${esc(a.interests||"No interests")} · ${new Date(a.created_at).toLocaleString()}</small></div>
     <div class="ad-btns">
       <button class="secondary" onclick="setStatus('${esc(a.id)}','${toggleTarget}')">${toggleLabel}</button>
       <button class="danger" onclick="deleteAd('${esc(a.id)}')">Delete</button>
     </div>
   </div>`;
 }).join("");
}

/* =========================================================
   TOGGLE STATUS (guarded against double-clicks)
========================================================= */
async function setStatus(id, status){
  if (busyAdId) return;
  busyAdId = id;

  const buttons = document.querySelectorAll(`#ad-${CSS.escape(id)} button`);
  buttons.forEach(b => b.disabled = true);

  const r = await supabaseClient.from("ads").update({ status }).eq("id", id);

  busyAdId = null;
  if (r.error){
    alert("Could not update ad status: " + r.error.message);
    buttons.forEach(b => b.disabled = false);
    return;
  }

  await loadAds();
}

/* =========================================================
   DELETE (guarded against double-clicks)
========================================================= */
async function deleteAd(id){
  if (busyAdId) return;
  if (!confirm("Delete this ad?")) return;

  busyAdId = id;
  const buttons = document.querySelectorAll(`#ad-${CSS.escape(id)} button`);
  buttons.forEach(b => b.disabled = true);

  const r = await supabaseClient.from("ads").delete().eq("id", id);

  busyAdId = null;
  if (r.error){
    alert("Could not delete ad: " + r.error.message);
    buttons.forEach(b => b.disabled = false);
    return;
  }

  await loadAds();
}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

init();
</script>
</body>
</html>
