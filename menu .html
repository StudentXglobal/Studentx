<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu - StudentX</title>

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #fff;
            --text-muted: #888;
            --border-color: #2c2c2c;
            --primary-color: #dc2743;
        }
        :root.light-mode {
            --bg-color: #f0f2f5;
            --card-bg: #fff;
            --text-color: #050505;
            --text-muted: #65676b;
            --border-color: #e4e6eb;
            --primary-color: #dc2743;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color) !important;
            padding: 40px 15px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        .back-btn {
            color: var(--text-color);
            text-decoration: none;
            font-size: 20px;
            margin-right: 15px;
            display: flex;
            align-items: center;
        }
        .header-title {
            font-size: 20px;
            font-weight: bold;
        }

        /* PROFILE SECTION */
        .menu-profile {
            display: flex;
            align-items: center;
            padding: 20px 15px;
            border-bottom: 8px solid var(--card-bg);
            text-decoration: none;
            color: var(--text-color);
        }
        .profile-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .profile-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--bg-color);
            object-fit: cover;
            background-color: var(--card-bg);
        }
        .menu-profile-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .menu-profile-info p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* MENU LIST */
        .menu-list {
            padding: 12px 15px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 12px;
            text-decoration: none;
            color: var(--text-color);
            border-radius: 8px;
            font-weight: 500;
            font-size: 15px;
            transition: background-color 0.2s;
        }
        .menu-item:hover, .menu-item:active {
            background-color: rgba(220, 39, 67, 0.1);
        }

        .menu-item svg {
            width: 22px;
            height: 22px;
            stroke: url(#igGradient);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .menu-text {
            flex-grow: 1;
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 15px 0;
        }

        .logout {
            color: #EF4444;
        }
        .logout svg {
            stroke: #EF4444;
        }
    </style>
</head>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        // Light mode: yi amfani da theme din da aka ajiye
        (function () {
            try {
                if (localStorage.getItem('studentx-theme') === 'light') {
                    document.documentElement.classList.add('light-mode');
                }
            } catch (e) {}
        })();

        // Hoton bai-daya idan babu avatar (baya bukatar intanet)
        const DEFAULT_AVATAR =
            "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">' +
                '<rect width="120" height="120" fill="#2c2c2c"/>' +
                '<circle cx="60" cy="46" r="22" fill="#777"/>' +
                '<path d="M18 110c5-26 22-38 42-38s37 12 42 38" fill="#777"/>' +
                '</svg>'
            );

        async function loadProfile() {
            const nameEl = document.getElementById('profile-name');
            const usernameEl = document.getElementById('profile-username');
            const imgEl = document.getElementById('profile-pic');

            imgEl.onerror = function () { this.onerror = null; this.src = DEFAULT_AVATAR; };
            imgEl.src = DEFAULT_AVATAR;

            try {
                const { data: { user }, error: userError } = await supabaseClient.auth.getUser();

                if (userError || !user) {
                    window.location.href = 'login.html';
                    return;
                }

                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('full_name, username, avatar_url')
                    .eq('id', user.id)
                    .maybeSingle();

                if (profileError) throw profileError;

                nameEl.textContent = (profile && profile.full_name) || 'StudentX User';
                usernameEl.textContent = (profile && profile.username) ? '@' + profile.username : '@studentx';

                if (profile && profile.avatar_url) {
                    imgEl.src = profile.avatar_url;
                }
            } catch (error) {
                console.error('Menu profile error:', error);
                nameEl.textContent = 'StudentX User';
                usernameEl.textContent = '@studentx';
            }
        }

        loadProfile();
    </script>
