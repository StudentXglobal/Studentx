    <style>
        /* CSS VARIABLES DON SAUYA LAUNUKA GABAƊAYA DA THEME.JS */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #fff;
            --text-muted: #888;
            --border-color: #2c2c2c;
            --primary-color: #8A2BE2; /* Launin Purple na StudentX */
        }
        :root.light-mode {
            --bg-color: #f0f2f5;
            --card-bg: #fff;
            --text-color: #050505;
            --text-muted: #65676b;
            --border-color: #e4e6eb;
            --primary-color: #8A2BE2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- HEADER --- */
        .header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 40px 15px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        .back-btn {
            color: var(--text-color);
            text-decoration: none;
            font-size: 20px;
            margin-right: 15px;
            display: flex;
            align-items: center;
        }
        .header-title {
            font-size: 20px;
            font-weight: bold;
        }

        /* --- PROFILE SECTION (DAUKE DA RING) --- */
        .menu-profile {
            display: flex;
            align-items: center;
            padding: 20px 15px;
            border-bottom: 8px solid var(--card-bg);
            text-decoration: none;
            color: var(--text-color);
        }
        .profile-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); /* Igiyar Instagram */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .profile-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--bg-color);
            object-fit: cover;
            background-color: var(--card-bg);
        }
        .menu-profile-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .menu-profile-info p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* --- MENU LIST --- */
        .menu-list {
            padding: 12px 15px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 12px;
            text-decoration: none;
            color: var(--text-color);
            border-radius: 8px;
            font-weight: 500;
            font-size: 15px;
            transition: background-color 0.2s;
        }
        .menu-item:hover, .menu-item:active {
            background-color: rgba(138, 43, 226, 0.1); /* Sauran inuwar purple idan aka danna */
        }
        
        /* CSS NA SVG ICONS DIN KAMAR YADDA KAKE SO */
        .menu-item svg {
            width: 22px;
            height: 22px;
            stroke: var(--primary-color); /* Launin Purple na StudentX */
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        
        .menu-text {
            flex-grow: 1;
        }
        
        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 15px 0;
        }

        .logout {
            color: #EF4444;
        }
        .logout svg {
            stroke: #EF4444;
        }
    </style>
</head>

    <!-- SUPABASE DA THEME SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://acragelglvdnqhvbjcgx.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_a5vNrQtwZdCguhDcDGPJE_i7GzSDIO'; 
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadProfile() {
            const { data: { user } } = await supabase.auth.getUser();
            
            if (user) {
                const { data: profile, error } = await supabase
                    .from('profiles')
                    .select('full_name, username, avatar_url')
                    .eq('id', user.id)
                    .single();

                if (profile) {
                    document.getElementById('profile-name').innerText = profile.full_name || 'StudentX User';
                    document.getElementById('profile-username').innerText = profile.username ? '@' + profile.username : '';
                    
                    const imgSrc = profile.avatar_url || 'https://via.placeholder.com/60/8A2BE2/ffffff?text=S';
                    document.getElementById('profile-pic').src = imgSrc;
                } else {
                    document.getElementById('profile-name').innerText = 'StudentX User';
                }
            } else {
                document.getElementById('profile-name').innerText = 'Guest User';
                document.getElementById('profile-username').innerText = '@guest';
            }
        }
        loadProfile();
    </script>
