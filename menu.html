<script>
  const SUPABASE_URL = 'https://acragelglvdnqhvbjcgx.supabase.co' // saka naka nan
  const SUPABASE_ANON_KEY = 'sb_publishable_a5vNrQtwZdCguhDcDGPJEg_i7GzSDIO' // saka naka nan
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  async function loadProfile() {
    const { data: { user } } = await supabase.auth.getUser()
    
    if (user) {
      const { data: profile } = await supabase
        .from('profiles') // suna table dinka
        .select('full_name, username, avatar_url')
        .eq('id', user.id)
        .single()

      if(profile) {
        document.getElementById('profile-name').innerText = profile.full_name
        document.getElementById('profile-username').innerText = '@' + profile.username
        document.getElementById('profile-pic').src = profile.avatar_url || 'default-avatar.png'
      }
    }
  }
  loadProfile()
</script>
