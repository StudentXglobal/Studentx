<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Search - StudentX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#ffffff;
    color:#111;
    min-height:100vh;
}

/* =========================
   SEARCH HEADER
========================= */

.search-header{
    width:100%;
    background:#fff;
    border-bottom:1px solid #e5e5e5;
    padding:12px 12px;
}

.search-row{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
}

.back-btn{
    width:42px;
    height:42px;
    border:none;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
}

.back-icon{
    width:13px;
    height:13px;
    border-left:4px solid #555;
    border-bottom:4px solid #555;
    transform:rotate(45deg);
    margin-left:6px;
}

.search-container{
    flex:1;
    height:48px;
    background:#f0f2f5;
    border-radius:25px;
    display:flex;
    align-items:center;
    padding:0 15px;
}

.search-container input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-size:17px;
    color:#111;
}

.search-container input::placeholder{
    color:#65676b;
}

.search-icon{
    width:22px;
    height:22px;
    border:3px solid #111;
    border-radius:50%;
    position:relative;
    flex-shrink:0;
}

.search-icon::after{
    content:"";
    position:absolute;
    width:10px;
    height:3px;
    background:#111;
    right:-7px;
    bottom:-4px;
    transform:rotate(45deg);
    border-radius:3px;
}

/* =========================
   SEARCH TABS
========================= */

.search-tabs{
    display:flex;
    gap:8px;
    padding:12px 4px 2px;
    overflow-x:auto;
}

.search-tabs::-webkit-scrollbar{
    display:none;
}

.search-tab{
    border:none;
    background:#f0f2f5;
    color:#111;
    padding:10px 20px;
    border-radius:22px;
    font-size:15px;
    cursor:pointer;
    white-space:nowrap;
}

.search-tab.active{
    background:#6c3df4;
    color:#fff;
}

/* =========================
   MAIN
========================= */

.main{
    width:100%;
    padding:18px 14px 30px;
}

.section-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:14px;
}

.results{
    display:flex;
    flex-direction:column;
    gap:4px;
}

/* =========================
   USER RESULT
========================= */

.user-card{
    width:100%;
    display:flex;
    align-items:center;
    padding:10px 4px;
    border-radius:12px;
    gap:12px;
}

.user-card:active{
    background:#f2f2f2;
}

.avatar-wrapper{
    width:56px;
    height:56px;
    flex-shrink:0;
    border-radius:50%;
    overflow:hidden;
    background:#e4e6eb;
    display:flex;
    align-items:center;
    justify-content:center;
}

.avatar{
    width:100%;
    height:100%;
    object-fit:cover;
}

.default-avatar{
    width:100%;
    height:100%;
    background:#e4e6eb;
    display:flex;
    align-items:center;
    justify-content:center;
}

.default-avatar svg{
    width:30px;
    height:30px;
    fill:#777;
}

.user-info{
    flex:1;
    min-width:0;
}

.name-row{
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
}

.name{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.verified{
    width:17px;
    height:17px;
    background:#1877f2;
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    flex-shrink:0;
}

.username{
    color:#65676b;
    font-size:14px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.school{
    color:#65676b;
    font-size:13px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   FOLLOW BUTTON
========================= */

.follow-btn{
    border:none;
    background:#6c3df4;
    color:#fff;
    font-size:13px;
    font-weight:600;
    padding:9px 15px;
    border-radius:20px;
    cursor:pointer;
    flex-shrink:0;
}

.follow-btn.following{
    background:#eeeeee;
    color:#222;
}

.follow-btn:disabled{
    opacity:.6;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{
    text-align:center;
    color:#777;
    padding:45px 10px;
    font-size:15px;
}

.loading{
    text-align:center;
    color:#777;
    padding:35px 10px;
    font-size:15px;
}

/* =========================
   SCHOOL CARD
========================= */

.school-card{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 5px;
    border-radius:12px;
}

.school-icon{
    width:56px;
    height:56px;
    border-radius:50%;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.school-icon svg{
    width:29px;
    height:29px;
    fill:#6c3df4;
}

.school-info{
    flex:1;
    min-width:0;
}

.school-name{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.school-label{
    font-size:13px;
    color:#65676b;
    margin-top:3px;
}

/* =========================
   DESKTOP
========================= */

@media (min-width:700px){

    .search-header{
        max-width:700px;
        margin:auto;
    }

    .main{
        max-width:700px;
        margin:auto;
    }

}

</style>
</head>

<body>

<!-- =========================
     SEARCH HEADER
========================= -->

<header class="search-header">

    <div class="search-row">

        <button
            class="back-btn"
            id="backButton"
            aria-label="Back"
        >
            <span class="back-icon"></span>
        </button>

        <div class="search-container">

            <input
                type="search"
                id="searchInput"
                placeholder="Search..."
                autocomplete="off"
                spellcheck="false"
            >

        </div>

        <div
            class="search-icon"
            aria-hidden="true"
        ></div>

    </div>

    <div class="search-tabs">

        <button
            class="search-tab active"
            data-tab="all"
        >
            All
        </button>

        <button
            class="search-tab"
            data-tab="people"
        >
            People
        </button>

        <button
            class="search-tab"
            data-tab="schools"
        >
            Schools
        </button>

    </div>

</header>


<!-- =========================
     MAIN RESULTS
========================= -->

<main class="main">

    <div
        id="results"
        class="results"
    ></div>

</main>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://acragelglvdnqhvbjcgx.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_O2kgvCZ8CxPKghH7MJn7nw_R-l61YuH";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let followingIds =
    new Set();

let currentTab = "all";


/* =========================
   DEFAULT AVATAR
========================= */

function defaultAvatar(){

    return `
        <div class="default-avatar">

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="
                    M12 12c2.76 0 5-2.24 5-5
                    s-2.24-5-5-5-5 2.24-5 5
                    2.24 5 5 5zm0 2
                    c-3.33 0-10 1.67-10 5v3h20v-3
                    c0-3.33-6.67-5-10-5z
                "/>
            </svg>

        </div>
    `;
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   INITIALIZE
========================= */

async function initSearch(){

    const result =
        await supabaseClient.auth.getUser();

    currentUser =
        result.data.user || null;

    await loadFollowing();

    await showSuggestions();
}


/* =========================
   LOAD FOLLOWING
========================= */

async function loadFollowing(){

    followingIds =
        new Set();

    if(!currentUser){
        return;
    }

    const { data, error } =
        await supabaseClient
        .from("followers")
        .select("following_id")
        .eq(
            "follower_id",
            currentUser.id
        );

    if(error){

        console.log(
            "Following error:",
            error
        );

        return;
    }

    (data || []).forEach(row => {

        followingIds.add(
            row.following_id
        );

    });
}
    /* =========================
   CREATE USER CARD
========================= */

function createUserCard(user){

    const avatarHTML =
        user.avatar_url
        ? `
            <img
                class="avatar"
                src="${escapeHTML(user.avatar_url)}"
                alt=""
            >
          `
        : defaultAvatar();

    const verifiedHTML =
        user.verified
        ? `
            <span class="verified">
                ✓
            </span>
          `
        : "";

    const username =
        user.username
        ? "@" + user.username
        : "";

    const university =
        user.university || "";

    const isFollowing =
        followingIds.has(user.id);

    return `
        <div class="user-card">

            <div class="avatar-wrapper">
                ${avatarHTML}
            </div>

            <div class="user-info">

                <div class="name-row">

                    <div class="name">
                        ${escapeHTML(
                            user.full_name || "Student"
                        )}
                    </div>

                    ${verifiedHTML}

                </div>

                ${
                    username
                    ? `
                        <div class="username">
                            ${escapeHTML(username)}
                        </div>
                      `
                    : ""
                }

                ${
                    university
                    ? `
                        <div class="school">
                            ${escapeHTML(university)}
                        </div>
                      `
                    : ""
                }

            </div>

            <button
                class="follow-btn ${
                    isFollowing ? "following" : ""
                }"
                onclick="
                    toggleFollow(
                        '${user.id}',
                        this
                    )
                "
            >
                ${
                    isFollowing
                    ? "Following"
                    : "Follow"
                }
            </button>

        </div>
    `;
}


/* =========================
   SUGGESTIONS
========================= */

async function showSuggestions(){

    const results =
        document.getElementById("results");

    results.innerHTML = `
        <div class="section-title">
            People you may know
        </div>

        <div
            class="results"
            id="userList"
        ></div>
    `;

    const list =
        document.getElementById("userList");

    let request =
        supabaseClient
        .from("profiles")
        .select(`
            id,
            full_name,
            username,
            avatar_url,
            university,
            verified
        `)
        .limit(50);

    if(currentUser){

        request =
            request.neq(
                "id",
                currentUser.id
            );
    }

    const { data, error } =
        await request;

    if(error){

        console.log(
            "Suggestion error:",
            error
        );

        list.innerHTML = `
            <div class="empty">
                Unable to load people.
            </div>
        `;

        return;
    }

    const users =
        (data || [])
        .filter(user =>
            !followingIds.has(user.id)
        )
        .slice(0,10);

    if(!users.length){

        list.innerHTML = `
            <div class="empty">
                No people to show.
            </div>
        `;

        return;
    }

    users.forEach(user => {

        list.insertAdjacentHTML(
            "beforeend",
            createUserCard(user)
        );

    });
}


/* =========================
   FOLLOW / UNFOLLOW
========================= */

async function toggleFollow(
    userId,
    button
){

    if(!currentUser){

        alert("Please login first.");

        return;
    }

    const isFollowing =
        followingIds.has(userId);

    button.disabled = true;

    if(isFollowing){

        const { error } =
            await supabaseClient
            .from("followers")
            .delete()
            .eq(
                "follower_id",
                currentUser.id
            )
            .eq(
                "following_id",
                userId
            );

        if(error){

            console.log(
                "Unfollow error:",
                error
            );

            alert(
                "Unable to unfollow user."
            );

            button.disabled = false;

            return;
        }

        followingIds.delete(userId);

        button.textContent =
            "Follow";

        button.classList.remove(
            "following"
        );

    }else{

        const { error } =
            await supabaseClient
            .from("followers")
            .insert({
                follower_id:
                    currentUser.id,

                following_id:
                    userId
            });

        if(error){

            console.log(
                "Follow error:",
                error
            );

            alert(
                "Unable to follow user."
            );

            button.disabled = false;

            return;
        }

        followingIds.add(userId);

        button.textContent =
            "Following";

        button.classList.add(
            "following"
        );
    }

    button.disabled = false;
}


/* =========================
   SEARCH PEOPLE
========================= */

async function searchUsers(query){

    const results =
        document.getElementById("results");

    if(!query.trim()){

        await showSuggestions();

        return;
    }

    results.innerHTML = `
        <div class="section-title">
            People
        </div>

        <div
            class="results"
            id="userList"
        ></div>
    `;

    const list =
        document.getElementById("userList");

    let request =
        supabaseClient
        .from("profiles")
        .select(`
            id,
            full_name,
            username,
            avatar_url,
            university,
            verified
        `)
        .or(
            `full_name.ilike.%${query}%,username.ilike.%${query}%,university.ilike.%${query}%`
        )
        .limit(30);

    if(currentUser){

        request =
            request.neq(
                "id",
                currentUser.id
            );
    }

    const { data, error } =
        await request;

    if(error){

        console.log(
            "Search error:",
            error
        );

        list.innerHTML = `
            <div class="empty">
                Search failed.
            </div>
        `;

        return;
    }

    if(!data || !data.length){

        list.innerHTML = `
            <div class="empty">
                No people found.
            </div>
        `;

        return;
    }

    data.forEach(user => {

        list.insertAdjacentHTML(
            "beforeend",
            createUserCard(user)
        );

    });
}


/* =========================
   LOAD SCHOOLS
========================= */

async function loadSchools(query = ""){

    const results =
        document.getElementById("results");

    results.innerHTML = `
        <div class="section-title">
            Schools
        </div>

        <div
            class="results"
            id="schoolList"
        ></div>
    `;

    const list =
        document.getElementById("schoolList");

    const { data, error } =
        await supabaseClient
        .from("profiles")
        .select("university")
        .not(
            "university",
            "is",
            null
        )
        .limit(100);

    if(error){

        console.log(
            "School error:",
            error
        );

        list.innerHTML = `
            <div class="empty">
                Unable to load schools.
            </div>
        `;

        return;
    }

    const schools = [];

    (data || []).forEach(row => {

        const school =
            String(
                row.university || ""
            ).trim();

        if(!school){
            return;
        }

        const exists =
            schools.some(
                item =>
                    item.toLowerCase() ===
                    school.toLowerCase()
            );

        if(!exists){

            schools.push(school);

        }

    });

    const filtered =
        query.trim()
        ? schools.filter(school =>
            school
            .toLowerCase()
            .includes(
                query.toLowerCase()
            )
          )
        : schools;

    if(!filtered.length){

        list.innerHTML = `
            <div class="empty">
                No schools found.
            </div>
        `;

        return;
    }

    filtered.forEach(school => {

        list.insertAdjacentHTML(
            "beforeend",
            `
            <div class="school-card">

                <div class="school-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="
                            M12 3 2 8l10 5
                            10-5-10-5zm0 7.2L6.2 7.3
                            12 4.4l5.8 2.9L12 10.2z
                            M5 10.5v5.8
                            c0 1.5 3.1 3.7 7 3.7
                            s7-2.2 7-3.7v-5.8
                            l-7 3.5-7-3.5z
                        "/>
                    </svg>

                </div>

                <div class="school-info">

                    <div class="school-name">
                        ${escapeHTML(school)}
                    </div>

                    <div class="school-label">
                        Students on StudentX
                    </div>

                </div>

            </div>
            `
        );

    });
}


/* =========================
   SEARCH INPUT
========================= */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    function(){

        const query =
            this.value.trim();

        if(currentTab === "schools"){

            loadSchools(query);

        }else{

            searchUsers(query);

        }

    }
);


/* =========================
   TABS
========================= */

document
.querySelectorAll(".search-tab")
.forEach(tab => {

    tab.addEventListener(
        "click",
        async function(){

            document
            .querySelectorAll(".search-tab")
            .forEach(item => {

                item.classList.remove(
                    "active"
                );

            });

            this.classList.add(
                "active"
            );

            currentTab =
                this.dataset.tab;

            const input =
                document.getElementById(
                    "searchInput"
                );

            const query =
                input.value.trim();

            if(
                currentTab ===
                "schools"
            ){

                await loadSchools(
                    query
                );

            }else if(query){

                await searchUsers(
                    query
                );

            }else{

                await showSuggestions();

            }

        }
    );

});


/* =========================
   BACK BUTTON
========================= */

document
.getElementById("backButton")
.addEventListener(
    "click",
    function(){

        if(
            window.history.length > 1
        ){

            window.history.back();

        }else{

            window.location.href =
                "home.html";

        }

    }
);


/* =========================
   START
========================= */

initSearch();

</script>

<script src="theme.js"></script></body>
</body>
</html>
