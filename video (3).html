<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StudentX Video</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
body{position:relative;}
button{font-family:inherit;}

/* FEED */
.video-feed{position:absolute;top:0;left:0;right:0;bottom:62px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;}
.video-feed::-webkit-scrollbar{display:none;}
.video-item{position:relative;width:100%;height:calc(100vh - 62px);height:calc(100dvh - 62px);min-height:calc(100vh - 62px);min-height:calc(100dvh - 62px);scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111;}
.video-player{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#111;display:block;}
.video-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),transparent 35%,rgba(0,0,0,.12) 55%,rgba(0,0,0,.88) 100%);pointer-events:none;}

/* TOP */
.video-top{position:fixed;top:0;left:0;right:0;height:58px;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);}
.video-tabs{display:flex;align-items:center;gap:28px;}
.video-tab{border:0;background:none;color:#aaa;font-size:15px;font-weight:600;padding:8px 2px;cursor:pointer;}
.video-tab.active{color:#fff;}
.video-tab.active::after{content:"";display:block;width:22px;height:2px;margin:5px auto 0;background:#fff;border-radius:2px;}
.video-upload{position:fixed;top:11px;right:14px;z-index:25;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.45);color:#fff;cursor:pointer;}
.video-upload i{font-size:18px;}

/* INFO */
.video-info{position:absolute;left:14px;right:78px;bottom:92px;z-index:30;max-height:38vh;overflow:hidden;text-shadow:0 2px 5px rgba(0,0,0,.8);}
.video-user{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.video-avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#222;cursor:pointer;flex-shrink:0;}
.video-user-details{min-width:0;cursor:pointer;}
.video-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.video-username{font-size:12px;color:#ccc;margin-top:3px;}
.video-follow{margin-left:5px;padding:6px 14px;border:1px solid rgba(255,255,255,.75);border-radius:7px;background:transparent;color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
.video-follow.following{background:#fff;color:#000;border-color:#fff;}
.sponsored-badge{display:inline-block;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:bold;margin-bottom:5px;letter-spacing:.5px;}
.ad-cta-btn{display:inline-block;margin-top:10px;padding:8px 16px;background:#6d35ff;color:#fff;font-size:13px;font-weight:600;border-radius:8px;text-decoration:none;border:none;cursor:pointer;}
.video-caption{font-size:14px;line-height:1.45;color:#fff;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;margin-top:6px;}

/* ACTIONS */
.video-actions{position:absolute;right:10px;bottom:92px;z-index:15;display:flex;flex-direction:column;align-items:center;gap:18px;}
.video-action{width:50px;border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;}
.video-action i{font-size:24px;margin-bottom:5px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));}
.video-action span{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.video-action.liked i{color:#ff315c;}
.video-action.saved i{color:#7d5cff;}

/* NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;height:62px;z-index:100;display:flex;align-items:center;justify-content:space-around;background:#09090d;border-top:1px solid rgba(255,255,255,.08);}
.nb{width:20%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#777;font-size:11px;cursor:pointer;user-select:none;}
.nb i{font-size:20px;}
.nb.on{color:#fff;}
.nb.on i{color:#fff;}

.video-message{height:100%;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px;text-align:center;padding:20px;}

/* MODALS */
.custom-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:1000;align-items:flex-end;justify-content:center;}
.custom-sheet{width:100%;max-width:500px;background:#141419;border-top-left-radius:16px;border-top-right-radius:16px;padding:20px;border-top:1px solid rgba(255,255,255,.1);animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-option{display:flex;align-items:center;gap:15px;width:100%;padding:14px 0;background:none;border:none;color:#fff;font-size:15px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);text-align:left;}
.sheet-option i{font-size:18px;width:24px;text-align:center;color:#aaa;}
.sheet-option.danger,.sheet-option.danger i{color:#ff4b4b;}
.sheet-cancel{width:100%;background:#222;border:none;padding:12px;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer;margin-top:12px;}

/* COMMENTS */
.cm-sheet{display:flex;flex-direction:column;max-height:75vh;padding:0;}
.cm-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:700;font-size:15px;}
.cm-head button{background:none;border:0;color:#aaa;font-size:18px;cursor:pointer;}
.cm-list{flex:1;overflow-y:auto;padding:8px 18px;min-height:120px;}
.cm-item{display:flex;gap:10px;padding:10px 0;}
.cm-item img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#222;flex-shrink:0;}
.cm-body{min-width:0;flex:1;}
.cm-name{font-size:12px;font-weight:700;color:#ddd;}
.cm-name small{font-weight:400;color:#777;margin-left:6px;}
.cm-text{font-size:14px;line-height:1.4;margin-top:3px;word-break:break-word;}
.cm-empty{text-align:center;color:#777;padding:30px 0;font-size:13px;}
.cm-form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);}
.cm-form input{flex:1;background:#1f1f28;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:11px 16px;color:#fff;font-size:14px;outline:none;}
.cm-form button{width:42px;height:42px;border:0;border-radius:50%;background:#6d35ff;color:#fff;cursor:pointer;}
.cm-form button:disabled{opacity:.5;}

/* LIVE LIST */
.live-wrap{height:100%;overflow-y:auto;padding:72px 14px 20px;background:#000;}
.live-title{font-size:16px;font-weight:700;margin-bottom:12px;}
.live-golive{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#6d35ff,#287cff);color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:16px;}
.live-card{display:flex;align-items:center;gap:12px;padding:12px;background:#141419;border:1px solid rgba(255,255,255,.08);border-radius:14px;margin-bottom:10px;cursor:pointer;}
.live-card img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#222;border:2px solid #ff304f;flex-shrink:0;}
.live-info{flex:1;min-width:0;}
.live-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.live-sub{font-size:12px;color:#aaa;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.live-badge{background:#ff304f;font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;flex-shrink:0;}

/* TOAST */
.vtoast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:3000;max-width:90%;padding:10px 18px;background:rgba(30,30,40,.95);color:#fff;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.4);}

@media(min-width:700px){.video-feed,.video-top,.bnav,.custom-sheet{max-width:500px;margin:auto;}}
</style>
</head>

<main class="video-feed" id="videoFeed"><div class="video-message">Loading videos...</div></main>

<nav class="bnav">

<!-- UPLOAD FORM -->

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
      <h3 style="font-size:16px;font-weight:bold;color:#fff;">Upload New Video</h3>

</div>

<!-- VIDEO OPTIONS -->
<div id="optionsModal" class="custom-modal" onclick="closeModals(event)">

<!-- SHARE -->
<div id="shareModal" class="custom-modal" onclick="closeModals(event)">

      <div onclick="shareToSocial('tiktok')" style="text-align:center;cursor:pointer;"><div style="width:50px;height:50px;background:#000;border:1px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 5px;"><i class="fab fa-tiktok" style="font-size:20px;color:#fff;"></i></div><span style="font-size:12px;color:#aaa;">TikTok</span></div>

<!-- COMMENTS -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="studentx-badges.js"></script>
<script>
/* =========================================================
   STATE
========================================================= */
let currentUser = null, currentProfile = null;
let videos = [], activeAds = [], userInterestScores = {};
let selectedVideoFile = null, activeVideoIdForMenu = null, activeShareUrl = "";
let currentTab = "foryou";
let soundOn = false;
let playbackObs = null, adObs = null;
let commentsVideoId = null;
let deepLinkDone = false;

const likeCounts = {}, commentCounts = {};
const likedSet = new Set(), savedSet = new Set(), followingSet = new Set();

const $ = id => document.getElementById(id);

/* =========================================================
   HELPERS
========================================================= */
function defaultAvatar(){
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="#171722"/><circle cx="50" cy="38" r="20" fill="#777"/><path d="M18 90c4-22 18-32 32-32s28 10 32 32" fill="#777"/></svg>');
}
function escapeHTML(v){
  if (v == null) return "";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function formatCount(n){
  n = Number(n || 0);
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(".0","") + "M";
  if (n >= 1000) return (n/1000).toFixed(1).replace(".0","") + "K";
  return String(n);
}
function timeAgo(date){
  if (!date) return "";
  const s = Math.floor((Date.now() - new Date(date).getTime()) / 1000);
  if (isNaN(s)) return "";
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s/60) + "m";
  if (s < 86400) return Math.floor(s/3600) + "h";
  if (s < 604800) return Math.floor(s/86400) + "d";
  return new Date(date).toLocaleDateString();
}
function toast(msg){
  const old = document.querySelector(".vtoast"); if (old) old.remove();
  const d = document.createElement("div");
  d.className = "vtoast"; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => { if (d.parentNode) d.remove(); }, 2200);
}
function openUserProfile(id){ if (id) window.location.href = "profile.html?id=" + encodeURIComponent(id); }
function requireLogin(){
  if (currentUser) return true;
  toast("Please login first");
  setTimeout(() => window.location.href = "login.html", 900);
  return false;
}
function closeModals(e){
  if (e.target.classList.contains("custom-modal")) e.target.style.display = "none";
}
const resolved = () => Promise.resolve({ data: [] });

/* =========================================================
   LOAD USER + DATA
========================================================= */
async function loadCurrentUser(){
  const r = await supabaseClient.auth.getUser();
  if (r.error) return;
  currentUser = r.data.user || null;
  if (currentUser){
    const p = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).maybeSingle();
    if (!p.error && p.data) currentProfile = p.data;
  }
}

async function loadVideosData(){
  const res = await supabaseClient.from("videos").select("*").order("created_at", { ascending: false });
  if (res.error){ console.error(res.error); return false; }
  videos = (res.data || []).filter(v => v.video_url);
  await Promise.all([loadProfiles(), loadActiveAds(), loadInterestScores()]);
  videos = sortVideosByInterest(videos, currentProfile);
  return true;
}

async function loadProfiles(){
  const ids = [...new Set(videos.map(v => v.user_id).filter(Boolean))];
  if (!ids.length) return;
  const res = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url,university,verified,premium_plan").in("id", ids);
  if (res.error) return;
  const map = {};
  (res.data || []).forEach(p => map[p.id] = p);
  videos = videos.map(v => ({ ...v, profile: map[v.user_id] || null }));
}

async function loadActiveAds(){
  const now = new Date().toISOString();
  const res = await supabaseClient.from("ads").select("*").eq("status","active").lte("start_at", now).gte("end_at", now).order("created_at", { ascending: false });
  if (res.error){ console.error("Ads load error:", res.error); activeAds = []; return; }
  activeAds = (res.data || []).filter(a => a.video_url);
}

async function loadInterestScores(){
  userInterestScores = {};
  if (!currentUser) return;
  const res = await supabaseClient.from("video_interest_events").select("interest,action").eq("user_id", currentUser.id);
  if (res.error){ console.error("Interest load error:", res.error); return; }
  const weights = { watch:1, like:5, save:6, interested:8, follow:4, not_interested:-10 };
  (res.data || []).forEach(e => {
    const key = String(e.interest || "").toLowerCase().trim();
    if (!key) return;
    userInterestScores[key] = (userInterestScores[key] || 0) + (weights[e.action] || 0);
  });
}

function videoTags(v){
  return String(v.hashtags || v.tags || v.category || "").toLowerCase().split(/[,#\s]+/).filter(Boolean);
}

function sortVideosByInterest(list, prof){
  const scores = userInterestScores || {};
  const score = v => {
    let s = 0;
    videoTags(v).forEach(t => { if (scores[t]) s += scores[t] * 4; });
    if (scores["creator:" + v.user_id]) s += scores["creator:" + v.user_id];
    if (prof && prof.university && v.profile && v.profile.university === prof.university) s += 2;
    if (currentUser && v.user_id === currentUser.id) s -= 1;
    return s;
  };
  const cache = new Map(list.map(v => [v.id, score(v)]));
  return [...list].sort((a, b) => (cache.get(b.id) - cache.get(a.id)) || (new Date(b.created_at || 0) - new Date(a.created_at || 0)));
}

/* =========================================================
   ADS
========================================================= */
function getTargetedAd(){
  if (!activeAds.length) return null;
  if (!currentProfile) return activeAds[Math.floor(Math.random() * activeAds.length)];
  const interests = String(currentProfile.interests || currentProfile.interest || currentProfile.category || "").toLowerCase().split(/[,#\s]+/).filter(Boolean);
  const ranked = activeAds.map(ad => {
    const tags = String(ad.interests || "").toLowerCase().split(/[,#\s]+/).filter(Boolean);
    return { ad, score: tags.reduce((n, t) => n + (interests.includes(t) ? 1 : 0), 0) };
  }).sort((a, b) => b.score - a.score);
  const top = ranked.filter(x => x.score > 0);
  const pool = top.length ? top : ranked;
  return pool[Math.floor(Math.random() * pool.length)].ad;
}

function renderAdCard(ad){
  const avatar = ad.avatar_url || defaultAvatar();
  const title = ad.title || "StudentX Advertiser";
  const uname = ad.username || "@advertiser";
  const cap = ad.caption || ad.description || "";
  const cta = ad.cta_text || "Learn More";
  const url = ad.cta_url || "#";
  const hasUrl = ad.cta_url && ad.cta_url !== "#";
  return `<section class="video-item ad-item" data-ad-id="${escapeHTML(ad.id)}">
    <video class="video-player ad-video" src="${escapeHTML(ad.video_url)}" ${ad.thumbnail_url ? `poster="${escapeHTML(ad.thumbnail_url)}"` : ""} playsinline loop preload="metadata"></video>
    <div class="video-overlay"></div>
    <div class="video-info">
      <span class="sponsored-badge">Sponsored</span>
      <div class="video-user">

function setupAdTracking(){

  adObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting && e.intersectionRatio >= 0.6){
        const el = e.target;
        if (el.dataset.tracked) return;
        el.dataset.tracked = "1";
        supabaseClient.from("ad_events").insert({ ad_id: el.dataset.adId, user_id: currentUser.id, event_type: "impression" }).then(() => {});
        adObs.unobserve(el);
      }
    });
  }, { threshold: [0.6] });
  document.querySelectorAll(".ad-item").forEach(el => adObs.observe(el));
}

/* =========================================================
   PLAYBACK (autoplay, sound stays on after first tap)
========================================================= */
function setupPlayback(){
  if (playbackObs) playbackObs.disconnect();
  const players = [...document.querySelectorAll(".video-player")];

  players.forEach(v => {
    v.setAttribute("playsinline", "");
    v.muted = !soundOn;
    v.defaultMuted = true;
  });

  playbackObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const v = e.target;
      if (e.isIntersecting && e.intersectionRatio >= 0.65){
        document.querySelectorAll(".video-player").forEach(o => { if (o !== v) o.pause(); });
        v.muted = !soundOn;
        v.play().catch(() => {
          // browser blocked sound: fall back to muted autoplay
          v.muted = true;
          v.play().catch(() => {});
        });
        const id = v.closest(".video-item") && v.closest(".video-item").dataset.videoId;
        if (id && !v.dataset.interestTracked){
          v.dataset.interestTracked = "1";
          trackVideoInterest(id, "watch");
        }
      } else if (!e.isIntersecting || e.intersectionRatio < 0.4){
        v.pause();
      }
    });
  }, { threshold: [0, 0.4, 0.65, 1] });

  players.forEach(v => playbackObs.observe(v));
}

// One click handler for the whole feed: tap video = sound on/off
$("videoFeed").addEventListener("click", function(ev){
  const v = ev.target.closest(".video-player");
  if (!v) return;
  soundOn = !soundOn;
  document.querySelectorAll(".video-player").forEach(p => { p.muted = !soundOn; });
  v.play().catch(() => {});
  toast(soundOn ? "Sound on" : "Sound off");
});

document.addEventListener("visibilitychange", () => {

/* =========================================================
   COUNTS + STATUS (batched: a few queries for all videos)
========================================================= */
async function loadVideoCounts(list){
  const ids = list.map(v => v.id);
  if (!ids.length) return;
  const authorIds = [...new Set(list.map(v => v.user_id).filter(Boolean))];

  const [likes, comments, saves, follows] = await Promise.all([
    supabaseClient.from("video_likes").select("video_id,user_id").in("video_id", ids),
    supabaseClient.from("video_comments").select("video_id").in("video_id", ids),
    currentUser ? supabaseClient.from("video_saves").select("video_id").eq("user_id", currentUser.id).in("video_id", ids) : resolved(),
    currentUser ? supabaseClient.from("followers").select("following_id").eq("follower_id", currentUser.id).in("following_id", authorIds) : resolved()
  ]);

  ids.forEach(id => { likeCounts[id] = 0; commentCounts[id] = 0; });
  (likes.data || []).forEach(l => {
    likeCounts[l.video_id] = (likeCounts[l.video_id] || 0) + 1;
    if (currentUser && l.user_id === currentUser.id) likedSet.add(String(l.video_id));
  });
  (comments.data || []).forEach(c => { commentCounts[c.video_id] = (commentCounts[c.video_id] || 0) + 1; });
  (saves.data || []).forEach(s => savedSet.add(String(s.video_id)));
  (follows.data || []).forEach(f => followingSet.add(f.following_id));

  ids.forEach(id => {
    const card = document.querySelector(`[data-video-id="${CSS.escape(String(id))}"]`);
    if (!card) return;
    const like = card.querySelector(".btn-like"), com = card.querySelector(".btn-comment"), sav = card.querySelector(".btn-save");
    if (like){
      like.querySelector("span").textContent = formatCount(likeCounts[id]);
      if (likedSet.has(String(id))){ like.classList.add("liked"); like.querySelector("i").className = "fas fa-heart"; }
    }
    if (com) com.querySelector("span").textContent = formatCount(commentCounts[id]);
    if (sav && savedSet.has(String(id))){ sav.classList.add("saved"); sav.querySelector("i").className = "fas fa-bookmark"; }
  });

  document.querySelectorAll(".video-follow").forEach(btn => {
    if (followingSet.has(btn.dataset.user)){ btn.textContent = "Following"; btn.classList.add("following"); }
  });
}

async function likeVideo(id, btn){
  if (!requireLogin()) return;
  id = String(id);
  try {
    const ex = await supabaseClient.from("video_likes").select("id").eq("video_id", id).eq("user_id", currentUser.id).maybeSingle();
    if (ex.data){
      const r = await supabaseClient.from("video_likes").delete().eq("id", ex.data.id);
      if (r.error) throw r.error;
      likedSet.delete(id);
      likeCounts[id] = Math.max(0, (likeCounts[id] || 1) - 1);
      btn.classList.remove("liked"); btn.querySelector("i").className = "far fa-heart";
    } else {
      const r = await supabaseClient.from("video_likes").insert({ video_id: id, user_id: currentUser.id });
      if (r.error) throw r.error;
      likedSet.add(id);
      likeCounts[id] = (likeCounts[id] || 0) + 1;
      btn.classList.add("liked"); btn.querySelector("i").className = "fas fa-heart";
      trackVideoInterest(id, "like");
    }
    btn.querySelector("span").textContent = formatCount(likeCounts[id]);
  } catch (e){
    console.error(e);
    toast("Could not update like");
  }
}

function handleDoubleTap(id, card){

async function loadVideoComments(){

  const r = await supabaseClient.from("video_comments").select("id,user_id,content,created_at").eq("video_id", commentsVideoId).order("created_at", { ascending: true }).limit(200);
  if (r.error){
    console.error(r.error);

    return;
  }

  const rows = r.data || [];
  commentCounts[commentsVideoId] = rows.length;
  updateCommentCount(commentsVideoId);
  $("cmTitle").textContent = "Comments (" + formatCount(rows.length) + ")";

  if (!rows.length){
    list.innerHTML = '<div class="cm-empty">No comments yet. Be the first!</div>';
    return;
  }

  const ids = [...new Set(rows.map(c => c.user_id).filter(Boolean))];
  const map = {};
  if (ids.length){
    const pr = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url").in("id", ids);
    (pr.data || []).forEach(p => map[p.id] = p);
  }

  list.innerHTML = rows.map(c => {
    const u = map[c.user_id] || {};
    return `<div class="cm-item">
      <img src="${escapeHTML(u.avatar_url || defaultAvatar())}" onerror="this.src=defaultAvatar()" onclick="openUserProfile('${escapeHTML(c.user_id)}')" alt="">

        <div class="cm-text">${escapeHTML(c.content || "")}</div>

  }).join("");
  list.scrollTop = list.scrollHeight;
}

async function handleOptionAction(action){
  $("optionsModal").style.display = "none";
  const v = videos.find(i => String(i.id) === String(activeVideoIdForMenu));
  if (!v) return;

  if (action === "interested"){
    if (!requireLogin()) return;
    await trackVideoInterest(v.id, "interested");
    toast("Showing more videos like this");
  } else if (action === "not_interested"){
    if (!requireLogin()) return;
    await trackVideoInterest(v.id, "not_interested");
    videos = videos.filter(i => String(i.id) !== String(v.id));
    toast("Showing fewer videos like this");
    renderCurrent();
  } else if (action === "copy_link"){
    const url = window.location.origin + "/video.html?video=" + encodeURIComponent(v.id);
    try { await navigator.clipboard.writeText(url); toast("Video link copied"); } catch (e){ prompt("Copy this link:", url); }
  } else if (action === "download"){
    toast("Starting download...");
    try {
      const response = await fetch(v.video_url);
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.style.display = "none";
      a.href = blobUrl;
      a.download = "studentx_video_" + v.id + ".mp4";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(blobUrl);
      toast("Video downloaded");
    } catch (e){
      window.open(v.video_url, "_blank");
    }
  } else if (action === "delete"){
    if (!currentUser || v.user_id !== currentUser.id) return;
    if (!confirm("Delete this video?")) return;
    const r = await supabaseClient.from("videos").delete().eq("id", v.id).eq("user_id", currentUser.id);
    if (r.error){ console.error(r.error); toast("Could not delete video"); return; }
    videos = videos.filter(i => String(i.id) !== String(v.id));
    toast("Video deleted");
    renderCurrent();
  }
}

}

/* =========================================================
   TABS
========================================================= */
function setActiveTab(name){
  ["following","foryou","live"].forEach(t => {
    const btn = $(t === "foryou" ? "forYouTab" : t + "Tab");
    btn.classList.toggle("active", t === name);
  });
}

async function showTab(name){
  currentTab = name;
  setActiveTab(name);
  if (playbackObs) playbackObs.disconnect();

  if (name === "live"){ await showLive(); return; }

  const feed = $("videoFeed");
  feed.innerHTML = '<div class="video-message">Loading videos...</div>';

  if (name === "foryou" || !videos.length){
    const ok = await loadVideosData();
    if (!ok){ feed.innerHTML = '<div class="video-message">Unable to load videos.</div>'; return; }
  }

  if (name === "following"){
    if (!currentUser){ feed.innerHTML = '<div class="video-message">Login to see videos from people you follow.</div>'; return; }
    const f = await supabaseClient.from("followers").select("following_id").eq("follower_id", currentUser.id);
    (f.data || []).forEach(i => followingSet.add(i.following_id));
    renderFeed(videos.filter(v => (f.data || []).some(i => i.following_id === v.user_id)), false);
  } else {
    renderFeed(videos, true);
  }
}

$("forYouTab").addEventListener("click", () => showTab("foryou"));
$("followingTab").addEventListener("click", () => showTab("following"));
$("liveTab").addEventListener("click", () => showTab("live"));

/* =========================================================
   START
========================================================= */
(async function initVideo(){
  await loadCurrentUser();
  await showTab("foryou");
})();
</script>
