<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>StudentX - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#0a0a0f;
  --card:rgba(255,255,255,.035);
  --card-2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.07);
  --text:#fff;
  --text-2:rgba(255,255,255,.75);
  --muted:rgba(255,255,255,.42);
  --accent:#dc2743;
  --grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  --danger:#ef4444;
}
:root.sx-light{
  --bg:#f0f2f5;
  --card:#ffffff;
  --card-2:#f0f2f5;
  --border:#e4e6eb;
  --text:#050505;
  --text-2:#3a3b3c;
  --muted:#65676b;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:500px;margin:0 auto;padding-bottom:80px}
button,input,textarea{font-family:Poppins,sans-serif}
a{color:inherit;text-decoration:none}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:4px}
.hdr-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:17px;position:relative;cursor:pointer;background:none;border:0}
.hdr-btn:active{background:var(--card-2)}
.hdr-logo{font-size:19px;font-weight:900;letter-spacing:-.5px;margin-left:6px}
.hdr-logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hdr-badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;border:2px solid var(--bg);box-sizing:content-box}

/* NEW POSTS PILL */
.new-pill{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:150;display:none;padding:9px 18px;border-radius:20px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}

/* STORIES */
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 14px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;cursor:pointer}
.st-ring{width:58px;height:58px;border-radius:50%;padding:2.5px;background:var(--grad)}
.st-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--bg);background:var(--card-2)}
.st-add{width:58px;height:58px;border-radius:50%;border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);background:var(--card)}
.st-nm{font-size:10px;color:var(--muted);max-width:62px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* CREATE POST BAR */
.cpb{display:flex;align-items:center;gap:10px;padding:12px;margin:0 14px 12px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer}
.cpb img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--card-2)}
.cpb-in{flex:1;min-width:0}
.cpb-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpb-ph{font-size:12px;color:var(--muted);margin-top:4px}
.cpb-tools{display:flex;gap:10px}
.cpb-t{font-size:16px}
.cpb-t.g{color:#10b981}.cpb-t.r{color:#ef4444}.cpb-t.y{color:#f59e0b}
.cpb-name .studentx-name{display:inline-flex;align-items:center;gap:4px}

/* POSTS */
.post{background:var(--card);border:1px solid var(--border);border-radius:16px;margin:0 14px 12px;overflow:hidden}
.p-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px}
.p-av{width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;background:var(--card-2)}
.p-info{flex:1;min-width:0}
.p-nm{font-size:13px;font-weight:700;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.p-meta{font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.p-meta a{color:var(--accent);font-weight:600}
.p-more{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;cursor:pointer;flex-shrink:0}
.p-more:active{background:var(--card-2)}
.p-body{padding:0 14px 10px;font-size:13px;line-height:1.65;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.p-body.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.see-more{display:block;padding:0 14px 10px;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer}
.p-media{display:block;width:100%;max-height:620px;object-fit:contain;background:#111}
.p-acts{display:flex;align-items:center;padding:4px 8px 10px;border-top:1px solid var(--border)}
.p-a{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;background:none;border:0}
.p-a:active{background:var(--card-2)}
.p-a.lk.on{color:var(--danger)}
.p-a.rp.on,.p-a.sv.on{color:var(--accent)}
.p-a-r{margin-left:auto}
.pop i{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.35)}}

/* ADS / VIDEO / EVENT CARDS */
.home-ad-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.home-ad-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--card-2)}
.home-ad-info{flex:1;min-width:0}
.home-ad-title{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-ad-sp{font-size:10px;color:var(--muted);margin-top:2px}
.home-ad-badge{font-size:10px;color:var(--muted);border:1px solid var(--border);padding:2px 8px;border-radius:10px}
.home-ad-video{display:block;width:100%;max-height:560px;background:#000;object-fit:cover}
.home-ad-cap{padding:10px 14px;font-size:13px;line-height:1.55;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.home-ad-foot{padding:6px 14px 14px}
.cta{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:12px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;border:0;cursor:pointer}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:10px;background:var(--grad);color:#fff;font-size:10px;font-weight:700}
.vid-card video{display:block;width:100%;max-height:520px;background:#000;object-fit:cover;cursor:pointer}
.vid-cap{padding:10px 14px 4px;font-size:13px;line-height:1.55;color:var(--text-2);word-break:break-word}
.vid-foot{padding:8px 14px 14px}

.ev-banner{display:block;width:100%;height:150px;object-fit:cover;background:var(--card-2)}
.ev-body{padding:14px}
.ev-date{font-size:11px;font-weight:700;color:var(--accent)}
.ev-title{margin-top:4px;font-size:15px;font-weight:700;line-height:1.35}
.ev-loc{margin-top:6px;font-size:12px;color:var(--muted)}
.ev-loc i{width:14px;color:var(--accent)}
.ev-count{margin-top:6px;font-size:11px;color:var(--muted)}
.ev-btns{display:flex;gap:8px;margin-top:12px}
.ev-btn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font-size:12px;font-weight:700;cursor:pointer}
.ev-btn.on{background:var(--grad);border-color:transparent;color:#fff}

/* STATES */
.skeleton{height:150px;border-radius:16px;background:var(--card);margin:0 14px 12px;animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{opacity:.5}}
.center{text-align:center;padding:45px 24px;color:var(--muted);font-size:12px;line-height:1.6}
.center i{display:block;font-size:34px;margin-bottom:12px;color:var(--accent)}
.center b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.more-btn{display:block;width:calc(100% - 28px);margin:0 14px 12px;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12px;font-weight:700;cursor:pointer}
.end-note{text-align:center;padding:16px;font-size:11px;color:var(--muted)}

/* MENU SHEET */
.ov{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.ov.show{display:flex}
.sheet{width:100%;max-width:500px;background:#14142d;color:#fff;border-radius:20px 20px 0 0;padding:12px 0 24px;animation:up .25s ease}
:root.sx-light .sheet{background:#fff;color:#050505}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:rgba(128,128,128,.4);border-radius:4px;margin:0 auto 10px}
.sheet-item{display:flex;align-items:center;gap:12px;padding:14px 20px;font-size:13px;font-weight:500;cursor:pointer}
.sheet-item:active{background:rgba(128,128,128,.15)}
.sheet-item i{width:18px;text-align:center;color:var(--muted)}
.sheet-item.dng,.sheet-item.dng i{color:var(--danger)}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;max-width:90%;padding:11px 20px;background:#1f1f2b;color:#fff;border-radius:12px;font-size:12px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.35);border-left:3px solid var(--accent)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <button class="hdr-btn" onclick="location.href='menu.html'" aria-label="Menu"><i class="fas fa-bars"></i></button>
    <div class="hdr-logo">Student<b>X</b></div>
  </div>
  <div class="hdr-r">
    <button class="hdr-btn" onclick="location.href='groups.html'" aria-label="Groups"><i class="fas fa-user-group"></i></button>
    <button class="hdr-btn" onclick="location.href='search.html'" aria-label="Search"><i class="fas fa-search"></i></button>
    <button class="hdr-btn" onclick="location.href='notification.html'" aria-label="Notifications">
      <i class="fas fa-bell"></i><span class="hdr-badge" id="bellBadge">0</span>
    </button>
  </div>
</header>

<div class="new-pill" id="newPill" onclick="refreshFeed()"></div>

<div class="stories" id="stories"></div>

<div class="cpb" onclick="location.href='create-post.html'">
  <img id="myAvatar" src="" alt="">
  <div class="cpb-in">
    <div class="cpb-name" id="myName">Loading...</div>
    <div class="cpb-ph">What's on your mind?</div>
  </div>
  <div class="cpb-tools">
    <div class="cpb-t g" onclick="event.stopPropagation();location.href='create-post.html?type=photo'"><i class="fas fa-image"></i></div>
    <div class="cpb-t r" onclick="event.stopPropagation();location.href='create-post.html?type=video'"><i class="fas fa-video"></i></div>
    <div class="cpb-t y" onclick="event.stopPropagation();toast('Polls are coming soon')"><i class="fas fa-poll"></i></div>
  </div>
</div>

<main id="feed"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main>
<div id="sentinel" style="height:1px"></div>
<div id="moreWrap"></div>

<div class="ov" id="menuOv" onclick="if(event.target===this)closeMenu()">
  <div class="sheet"><div class="sheet-handle"></div><div id="menuItems"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="studentx-badges.js"></script>
<script>
/* =========================================================
   STUDENTX HOME FEED
========================================================= */
var PAGE = 15;

var me = null, profile = null;
var followingSet = new Set(), myGroupSet = new Set(), myGroupIds = [];
var hiddenSet = new Set();

var postsById = {};
var feedOffset = 0, noMore = false, loading = false, postCounter = 0, newCount = 0;

var likedSet = new Set(), repostedSet = new Set(), savedSet = new Set();
var likeCounts = {}, commentCounts = {}, repostCounts = {};

var activeAds = [], adIndex = 0, trackedAds = new Set();
var videoQueue = [], eventQueue = [], eventMap = {};

var DEFAULT_AVATAR = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#202027"/>' +
  '<circle cx="100" cy="78" r="42" fill="#777"/><path d="M35 190c8-48 35-70 65-70s57 22 65 70" fill="#777"/></svg>');

function $(id){ return document.getElementById(id); }
function esc(v){
  if (v === null || v === undefined) return "";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function fmt(n){
  n = Number(n) || 0;
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(".0","") + "M";
  if (n >= 1000) return (n/1000).toFixed(1).replace(".0","") + "K";
  return String(n);
}
function timeAgo(date){
  if (!date) return "";
  var t = new Date(date).getTime();
  if (isNaN(t)) return "";
  var s = Math.floor((Date.now() - t) / 1000);
  if (s < 60) return "Just now";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  if (s < 604800) return Math.floor(s/86400) + "d ago";
  return new Date(date).toLocaleDateString();
}
function toast(msg){
  var old = document.querySelector(".toast"); if (old) old.remove();
  var d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.remove(); }, 2600);
}
function nameHTML(u){
  if (window.StudentXBadges && u && u.id) { try { return StudentXBadges.nameHTML(u); } catch(e){} }
  return esc((u && (u.full_name || u.username)) || "StudentX User");
}
function openUserProfile(id){ if (id) location.href = "profile.html?id=" + encodeURIComponent(id); }
function postUrl(id){ return location.origin + location.pathname + "?post=" + encodeURIComponent(id); }

try {
  JSON.parse(localStorage.getItem("sx_hidden_posts") || "[]").forEach(function(id){ hiddenSet.add(String(id)); });
} catch (e) {}

/* =========================================================
   INIT
========================================================= */
async function init(){
  try {
    var au = await supabaseClient.auth.getUser();
    me = au.data && au.data.user;
    if (!me) { location.href = "login.html"; return; }

    await loadMyProfile();
    await loadContext();

    loadStories();
    loadUnread();
    loadHomeAds();
    loadVideos();
    loadEvents();

    await loadFeed(true);
    subscribe();
    showRequestedPost();
  } catch (e) {
    console.error("Home init error:", e);
    $("feed").innerHTML = '<div class="center"><i class="fas fa-triangle-exclamation"></i><b>Something went wrong</b>Please refresh the page.</div>';
  }
}

async function loadMyProfile(){
  var r = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url,verified,premium_plan").eq("id", me.id).maybeSingle();
  if (r.error) console.error("Profile error:", r.error);
  profile = r.data || { id: me.id };
  $("myAvatar").src = profile.avatar_url || DEFAULT_AVATAR;
  $("myAvatar").onerror = function(){ this.onerror = null; this.src = DEFAULT_AVATAR; };
  $("myName").innerHTML = nameHTML(profile);
}

async function loadContext(){
  var res = await Promise.all([
    supabaseClient.from("followers").select("following_id").eq("follower_id", me.id),
    supabaseClient.from("group_members").select("group_id").eq("user_id", me.id).eq("status", "active")
  ]);
  (res[0].data || []).forEach(function(r){ followingSet.add(r.following_id); });
  (res[1].data || []).forEach(function(r){ myGroupSet.add(String(r.group_id)); });
  myGroupIds = Array.from(myGroupSet);
}

async function loadStories(){
  var el = $("stories");
  var html = '<div class="st" onclick="toast(\'Stories are coming soon\')"><div class="st-add"><i class="fas fa-plus"></i></div><div class="st-nm">Your Story</div></div>';
  var r = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url").neq("id", me.id).order("created_at", { ascending: false }).limit(12);
  (r.data || []).forEach(function(u){
    var name = u.full_name || u.username || "Student";
    html += '<div class="st" onclick="openUserProfile(\'' + esc(u.id) + '\')"><div class="st-ring"><img src="' + esc(u.avatar_url || DEFAULT_AVATAR) +
      '" alt="" onerror="this.src=DEFAULT_AVATAR"></div><div class="st-nm">' + esc(name.split(" ")[0]) + '</div></div>';
  });
  el.innerHTML = html;
}

/* Bell badge: only shows when there are unread notifications */
async function loadUnread(){
  var r = await supabaseClient.from("notifications").select("id", { count: "exact", head: true }).eq("recipient_id", me.id).eq("is_read", false);
  setBell(r.count || 0);
}
function setBell(n){
  var b = $("bellBadge");
  if (n > 0) { b.textContent = n > 99 ? "99+" : n; b.style.display = "flex"; } else { b.style.display = "none"; }
}

/* =========================================================
   FEED LOADING
========================================================= */
async function fetchPosts(from){
  function base(){
    return supabaseClient.from("posts").select("*").order("Create_at", { ascending: false }).range(from, from + PAGE - 1);
  }
  var q = base();
  q = myGroupIds.length ? q.or("group_id.is.null,group_id.in.(" + myGroupIds.join(",") + ")") : q.is("group_id", null);
  var r = await q;

  // If the group_id column does not exist yet, fall back to the plain query
  if (r.error && /group_id/i.test(r.error.message || "")) {
    console.warn("group_id column missing, loading all posts");
    r = await base();
  }
  if (r.error) { console.error("Posts error:", r.error); return null; }
  return r.data || [];
}

function canSee(p){
  if (hiddenSet.has(String(p.id))) return false;
  if (p.group_id && !myGroupSet.has(String(p.group_id))) return false;
  if (p.User_id === me.id) return true;
  if (p.visibility === "private") return false;
  if (p.visibility === "followers" && !followingSet.has(p.User_id)) return false;
  return true;
}

async function loadFeed(reset){
  if (loading) return;
  loading = true;

  var feed = $("feed");
  if (reset) {
    feedOffset = 0; noMore = false; postCounter = 0; newCount = 0;
    postsById = {}; adIndex = 0;
    $("newPill").style.display = "none";
    $("moreWrap").innerHTML = "";
  }

  var shown = 0, tries = 0, failed = false;
  while (tries < 3 && !noMore && shown === 0) {
    var rows = await fetchPosts(feedOffset);
    if (rows === null) { failed = true; break; }
    feedOffset += rows.length;
    if (rows.length < PAGE) noMore = true;

    var visible = rows.filter(canSee);
    if (visible.length) {
      await enrich(visible);
      if (reset && shown === 0) feed.innerHTML = "";
      appendPosts(visible);
      shown += visible.length;
    }
    tries++;
  }

  if (failed && reset) {
    feed.innerHTML = '<div class="center"><i class="fas fa-triangle-exclamation"></i><b>Unable to load posts</b>Check your connection and try again.<br><br><button class="cta" onclick="refreshFeed()">Try again</button></div>';
  } else if (reset && shown === 0) {
    feed.innerHTML = '<div class="center"><i class="far fa-newspaper"></i><b>No posts yet</b>Be the first to post, or follow people and join groups.<br><br><button class="cta" onclick="location.href=\'create-post.html\'">Create a post</button></div>';
  }

  if (reset && noMore) appendFillers();
  updateFooter();
  loading = false;
}

function updateFooter(){
  var w = $("moreWrap");
  if (noMore) { w.innerHTML = postCounter ? '<div class="end-note">You are all caught up</div>' : ""; return; }
  w.innerHTML = '<button class="more-btn" onclick="loadFeed(false)">Load more posts</button>';
}

/* Infinite scroll */
var sentinelObs = new IntersectionObserver(function(entries){
  if (entries[0].isIntersecting && !noMore && !loading && postCounter > 0) loadFeed(false);
}, { rootMargin: "500px" });
sentinelObs.observe($("sentinel"));

function refreshFeed(){
  window.scrollTo({ top: 0, behavior: "smooth" });
  loadContext().then(function(){ loadFeed(true); loadUnread(); });
}

/* =========================================================
   ENRICH: profiles, groups, likes, comments, reposts, saves
========================================================= */
async function enrich(rows){
  var userIds = Array.from(new Set(rows.map(function(p){ return p.User_id; }).filter(Boolean)));
  var groupIds = Array.from(new Set(rows.map(function(p){ return p.group_id; }).filter(Boolean)));
  var postIds = rows.map(function(p){ return p.id; });

  var res = await Promise.all([
    userIds.length ? supabaseClient.from("profiles").select("id,full_name,username,avatar_url,verified,premium_plan").in("id", userIds) : Promise.resolve({ data: [] }),
    groupIds.length ? supabaseClient.from("groups").select("id,name").in("id", groupIds) : Promise.resolve({ data: [] }),
    supabaseClient.from("likes").select("post_id,user_id").in("post_id", postIds),
    supabaseClient.from("comments").select("post_id").in("post_id", postIds),
    supabaseClient.from("reposts").select("post_id,user_id").in("post_id", postIds),
    supabaseClient.from("bookmarks").select("post_id").eq("user_id", me.id).in("post_id", postIds)
  ]);

  var pmap = {}, gmap = {};
  (res[0].data || []).forEach(function(u){ pmap[u.id] = u; });
  (res[1].data || []).forEach(function(g){ gmap[g.id] = g; });
  rows.forEach(function(p){ p.profile = pmap[p.User_id] || null; p.group = p.group_id ? (gmap[p.group_id] || null) : null; });

  postIds.forEach(function(id){ var k = String(id); likeCounts[k] = 0; commentCounts[k] = 0; repostCounts[k] = 0; });
  (res[2].data || []).forEach(function(l){ var k = String(l.post_id); likeCounts[k]++; if (l.user_id === me.id) likedSet.add(k); });
  (res[3].data || []).forEach(function(c){ commentCounts[String(c.post_id)]++; });
  (res[4].data || []).forEach(function(r){ var k = String(r.post_id); repostCounts[k]++; if (r.user_id === me.id) repostedSet.add(k); });
  (res[5].data || []).forEach(function(b){ savedSet.add(String(b.post_id)); });
}

/* =========================================================
   RENDER
========================================================= */
function normalizeMedia(value, bucket){
  if (!value) return "";
  var v = String(value).trim();
  if (!v) return "";
  if (/^(https?:|data:|blob:)/i.test(v)) return v;
  try { return supabaseClient.storage.from(bucket).getPublicUrl(v.replace(/^\/+/, "")).data.publicUrl; } catch (e) { return v; }
}

function renderPost(p){
  var id = String(p.id);
  var u = p.profile || {};
  var img = normalizeMedia(p.image_url, "photos");
  var vid = normalizeMedia(p.video_url, "videos");

  var text = p.content || "";
  var long = text.length > 280 || (text.match(/\n/g) || []).length > 5;
  var body = text ? '<div class="p-body' + (long ? " clamp" : "") + '" id="body-' + esc(id) + '">' + esc(text) + '</div>' +
    (long ? '<span class="see-more" onclick="expandPost(\'' + esc(id) + '\',this)">See more</span>' : "") : "";

  var groupLabel = p.group ? ' · in <a href="group.html?id=' + encodeURIComponent(p.group_id) + '">' + esc(p.group.name) + '</a>' : "";

  return '<article class="post" id="post-' + esc(id) + '">' +
    '<div class="p-hdr">' +
      '<img class="p-av" src="' + esc(u.avatar_url || DEFAULT_AVATAR) + '" alt="" onclick="openUserProfile(\'' + esc(p.User_id) + '\')" onerror="this.src=DEFAULT_AVATAR">' +
      '<div class="p-info">' +
        '<div class="p-nm" onclick="openUserProfile(\'' + esc(p.User_id) + '\')">' + nameHTML(u) + '</div>' +
        '<div class="p-meta">' + (u.username ? "@" + esc(u.username) + " · " : "") + timeAgo(p.Create_at) + groupLabel + '</div>' +
      '</div>' +
      '<div class="p-more" onclick="openMenu(\'' + esc(id) + '\')"><i class="fas fa-ellipsis-h"></i></div>' +
    '</div>' +
    body +
    (img ? '<img class="p-media" src="' + esc(img) + '" alt="Post image" loading="lazy" onerror="this.style.display=\'none\'">' : "") +
    (vid ? '<video class="p-media" controls playsinline preload="metadata" src="' + esc(vid) + '"></video>' : "") +
    '<div class="p-acts">' +
      '<button class="p-a lk ' + (likedSet.has(id) ? "on" : "") + '" id="lk-' + esc(id) + '" onclick="toggleLike(\'' + esc(id) + '\')">' +
        '<i class="' + (likedSet.has(id) ? "fas" : "far") + ' fa-heart"></i><span>' + fmt(likeCounts[id]) + '</span></button>' +
      '<button class="p-a" onclick="location.href=\'comment.html?post=' + encodeURIComponent(id) + '\'"><i class="far fa-comment"></i><span>' + fmt(commentCounts[id]) + '</span></button>' +
      '<button class="p-a rp ' + (repostedSet.has(id) ? "on" : "") + '" id="rp-' + esc(id) + '" onclick="toggleRepost(\'' + esc(id) + '\')">' +
        '<i class="fas fa-retweet"></i><span>' + fmt(repostCounts[id]) + '</span></button>' +
      '<button class="p-a p-a-r sv ' + (savedSet.has(id) ? "on" : "") + '" id="sv-' + esc(id) + '" onclick="toggleSave(\'' + esc(id) + '\')">' +
        '<i class="' + (savedSet.has(id) ? "fas" : "far") + ' fa-bookmark"></i></button>' +
    '</div>' +
  '</article>';
}

function expandPost(id, link){
  var b = $("body-" + id);
  if (b) b.classList.remove("clamp");
  if (link) link.remove();
}

/* Adds posts to the feed with ads / video / event cards in between (no full re-render) */
function appendPosts(rows){
  var html = "";
  rows.forEach(function(p){
    postsById[String(p.id)] = p;
    html += renderPost(p);
    postCounter++;
    if (postCounter % 5 === 0) { html += renderAd(nextAd()); }
    else if (postCounter % 7 === 0) { html += renderVideoCard(videoQueue.shift()); }
    else if (postCounter % 11 === 0) { html += renderEventCard(eventQueue.shift()); }
  });
  $("feed").insertAdjacentHTML("beforeend", html);
  observeNew();
}

/* Small feeds still get one ad / video / event at the end */
function appendFillers(){
  if (!postCounter) return;
  var html = "";
  if (postCounter < 5) html += renderAd(nextAd());
  if (postCounter < 7) html += renderVideoCard(videoQueue.shift());
  if (postCounter < 11) html += renderEventCard(eventQueue.shift());
  if (html) { $("feed").insertAdjacentHTML("beforeend", html); observeNew(); }
}

/* =========================================================
   LIKE / REPOST / SAVE (updated in place)
========================================================= */
async function toggleLike(id){
  var btn = $("lk-" + id);
  var was = likedSet.has(id);
  if (btn) btn.style.pointerEvents = "none";

  var r = was
    ? await supabaseClient.from("likes").delete().eq("post_id", id).eq("user_id", me.id)
    : await supabaseClient.from("likes").insert({ post_id: id, user_id: me.id });

  if (btn) btn.style.pointerEvents = "";
  if (r.error) { console.error(r.error); toast("Could not update like"); return; }

  if (was) { likedSet.delete(id); likeCounts[id] = Math.max(0, (likeCounts[id] || 1) - 1); }
  else { likedSet.add(id); likeCounts[id] = (likeCounts[id] || 0) + 1; }

  if (btn) {
    var on = likedSet.has(id);
    btn.classList.toggle("on", on);
    btn.classList.toggle("pop", on);
    btn.innerHTML = '<i class="' + (on ? "fas" : "far") + ' fa-heart"></i><span>' + fmt(likeCounts[id]) + '</span>';
  }
}

async function toggleRepost(id){
  var btn = $("rp-" + id);
  var was = repostedSet.has(id);
  if (btn) btn.style.pointerEvents = "none";

  var r = was
    ? await supabaseClient.from("reposts").delete().eq("post_id", id).eq("user_id", me.id)
    : await supabaseClient.from("reposts").insert({ post_id: id, user_id: me.id });

  if (btn) btn.style.pointerEvents = "";
  if (r.error) { console.error(r.error); toast("Could not update repost"); return; }

  if (was) { repostedSet.delete(id); repostCounts[id] = Math.max(0, (repostCounts[id] || 1) - 1); toast("Repost removed"); }
  else { repostedSet.add(id); repostCounts[id] = (repostCounts[id] || 0) + 1; toast("Post reposted"); }

  if (btn) {
    btn.classList.toggle("on", repostedSet.has(id));
    btn.innerHTML = '<i class="fas fa-retweet"></i><span>' + fmt(repostCounts[id]) + '</span>';
  }
}

async function toggleSave(id){
  var btn = $("sv-" + id);
  var was = savedSet.has(id);
  if (btn) btn.style.pointerEvents = "none";

  var r = was
    ? await supabaseClient.from("bookmarks").delete().eq("post_id", id).eq("user_id", me.id)
    : await supabaseClient.from("bookmarks").insert({ post_id: id, user_id: me.id });

  if (btn) btn.style.pointerEvents = "";
  if (r.error) { console.error(r.error); toast("Could not save post"); return; }

  if (was) { savedSet.delete(id); toast("Removed from saved"); } else { savedSet.add(id); toast("Post saved"); }
  if (btn) {
    var on = savedSet.has(id);
    btn.classList.toggle("on", on);
    btn.innerHTML = '<i class="' + (on ? "fas" : "far") + ' fa-bookmark"></i>';
  }
}

/* =========================================================
   POST MENU
========================================================= */
function openMenu(id){
  var p = postsById[id];
  if (!p) return;
  var mine = p.User_id === me.id;
  var h = "";

  if (mine) {
    h += '<div class="sheet-item dng" onclick="deletePost(\'' + esc(id) + '\')"><i class="fas fa-trash"></i>Delete post</div>';
  } else {
    h += '<div class="sheet-item" onclick="closeMenu();openUserProfile(\'' + esc(p.User_id) + '\')"><i class="fas fa-user"></i>View profile</div>';
    h += '<div class="sheet-item" onclick="hidePost(\'' + esc(id) + '\')"><i class="fas fa-eye-slash"></i>Hide post</div>';
  }
  h += '<div class="sheet-item" onclick="copyPostLink(\'' + esc(id) + '\')"><i class="fas fa-link"></i>Copy link</div>';
  h += '<div class="sheet-item" onclick="sharePost(\'' + esc(id) + '\')"><i class="fas fa-share"></i>Share post</div>';

  $("menuItems").innerHTML = h;
  $("menuOv").classList.add("show");
}
function closeMenu(){ $("menuOv").classList.remove("show"); }

function removePostElement(id){
  var el = $("post-" + id); if (el) el.remove();
  delete postsById[id];
}

async function deletePost(id){
  closeMenu();
  if (!confirm("Delete this post?")) return;
  var r = await supabaseClient.from("posts").delete().eq("id", id).eq("User_id", me.id).select("id");
  if (r.error || !(r.data && r.data.length)) { console.error(r.error); toast("Could not delete post"); return; }
  removePostElement(id);
  toast("Post deleted");
}

function hidePost(id){
  closeMenu();
  hiddenSet.add(String(id));
  try { localStorage.setItem("sx_hidden_posts", JSON.stringify(Array.from(hiddenSet))); } catch (e) {}
  removePostElement(id);
  toast("Post hidden");
}

async function copyPostLink(id){
  closeMenu();
  try { await navigator.clipboard.writeText(postUrl(id)); toast("Link copied"); } catch (e) { toast("Could not copy link"); }
}

async function sharePost(id){
  closeMenu();
  var p = postsById[id] || {};
  var name = p.profile && p.profile.full_name ? " by " + p.profile.full_name : "";
  try {
    if (navigator.share) { await navigator.share({ title: "StudentX post", text: (p.content || "Check out this post on StudentX").slice(0, 120) + name, url: postUrl(id) }); return; }
    await navigator.clipboard.writeText(postUrl(id));
    toast("Link copied");
  } catch (e) { if (e && e.name !== "AbortError") toast("Could not share"); }
}

/* =========================================================
   ADS
========================================================= */
async function loadHomeAds(){
  var now = new Date().toISOString();
  var r = await supabaseClient.from("ads")
    .select("id,title,username,avatar_url,video_url,thumbnail_url,caption,cta_text,cta_url,status,start_at,end_at,created_at")
    .eq("status", "active").lte("start_at", now).gte("end_at", now).order("created_at", { ascending: false });
  if (r.error) { console.error("Ads error:", r.error); activeAds = []; return; }
  activeAds = r.data || [];
}

function nextAd(){
  if (!activeAds.length) return null;
  var ad = activeAds[adIndex % activeAds.length];
  adIndex++;
  return ad;
}

function renderAd(ad){
  if (!ad) return "";
  var cta = ad.cta_text || "Learn more";
  return '<article class="post home-ad" data-ad-id="' + esc(ad.id) + '">' +
    '<div class="home-ad-head">' +
      '<img class="home-ad-avatar" src="' + esc(ad.avatar_url || DEFAULT_AVATAR) + '" alt="" onerror="this.src=DEFAULT_AVATAR">' +
      '<div class="home-ad-info"><div class="home-ad-title">' + esc(ad.title || "Sponsored") + '</div>' +
      '<div class="home-ad-sp">Sponsored' + (ad.username ? " · " + esc(ad.username) : "") + '</div></div>' +
      '<span class="home-ad-badge">Ad</span>' +
    '</div>' +
    (ad.video_url ? '<video class="home-ad-video" controls playsinline muted preload="metadata" poster="' + esc(ad.thumbnail_url || "") + '"><source src="' + esc(ad.video_url) + '" type="video/mp4"></video>' : "") +
    (ad.caption ? '<div class="home-ad-cap">' + esc(ad.caption) + '</div>' : "") +
    '<div class="home-ad-foot">' +
      (ad.cta_url
        ? '<a class="cta" href="' + esc(ad.cta_url) + '" target="_blank" rel="noopener" onclick="trackAd(\'' + esc(ad.id) + '\',\'click\')">' + esc(cta) + '</a>'
        : '<button class="cta" type="button" onclick="trackAd(\'' + esc(ad.id) + '\',\'click\')">' + esc(cta) + '</button>') +
    '</div></article>';
}

/* Each ad counts one impression per visit, only when at least half of it is on screen */
function trackAd(adId, type){
  if (!adId || !me) return;
  if (type === "impression") { if (trackedAds.has(adId)) return; trackedAds.add(adId); }
  supabaseClient.from("ad_events").insert({ ad_id: adId, user_id: me.id, event_type: type })
    .then(function(r){ if (r.error) console.warn("Ad event error:", r.error.message); });
}

/* =========================================================
   VIDEO CARDS
========================================================= */
async function loadVideos(){
  var r = await supabaseClient.from("videos").select("*").order("created_at", { ascending: false }).limit(12);
  if (r.error) { console.info("Videos not available:", r.error.message); return; }
  var rows = (r.data || []).filter(function(v){ return v.video_url; });
  var ids = Array.from(new Set(rows.map(function(v){ return v.user_id; }).filter(Boolean)));
  var map = {};
  if (ids.length) {
    var pr = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url,verified,premium_plan").in("id", ids);
    (pr.data || []).forEach(function(u){ map[u.id] = u; });
  }
  rows.forEach(function(v){ v.profile = map[v.user_id] || null; });
  videoQueue = rows;
}

function renderVideoCard(v){
  if (!v) return "";
  var u = v.profile || {};
  return '<article class="post vid-card">' +
    '<div class="p-hdr">' +
      '<img class="p-av" src="' + esc(u.avatar_url || DEFAULT_AVATAR) + '" alt="" onclick="openUserProfile(\'' + esc(v.user_id) + '\')" onerror="this.src=DEFAULT_AVATAR">' +
      '<div class="p-info"><div class="p-nm" onclick="openUserProfile(\'' + esc(v.user_id) + '\')">' + nameHTML(u) + '</div>' +
      '<div class="p-meta">' + timeAgo(v.created_at) + '</div></div>' +
      '<span class="tag"><i class="fas fa-video"></i> Video</span>' +
    '</div>' +
    '<video muted loop playsinline preload="metadata" src="' + esc(v.video_url) + '"' + (v.thumbnail_url ? ' poster="' + esc(v.thumbnail_url) + '"' : "") + ' onclick="location.href=\'video.html\'"></video>' +
    (v.caption ? '<div class="vid-cap">' + esc(v.caption) + '</div>' : "") +
    '<div class="vid-foot"><button class="cta" onclick="location.href=\'video.html\'"><i class="fas fa-play" style="margin-right:6px"></i>Watch more videos</button></div>' +
  '</article>';
}

/* =========================================================
   EVENT CARDS (needs the events + event_rsvps tables)
========================================================= */
async function loadEvents(){
  var r = await supabaseClient.from("events").select("*").gte("starts_at", new Date().toISOString()).order("starts_at", { ascending: true }).limit(6);
  if (r.error) { console.info("Events not available:", r.error.message); return; }
  var rows = r.data || [];
  if (!rows.length) return;

  var ids = rows.map(function(e){ return e.id; });
  var rs = await supabaseClient.from("event_rsvps").select("event_id,user_id,status").in("event_id", ids);

  rows.forEach(function(e){ eventMap[e.id] = { data: e, going: 0, interested: 0, mine: null }; });
  (rs.data || []).forEach(function(x){
    var s = eventMap[x.event_id]; if (!s) return;
    if (x.status === "going") s.going++; else if (x.status === "interested") s.interested++;
    if (x.user_id === me.id) s.mine = x.status;
  });
  eventQueue = rows.slice();
}

function eventDate(iso){
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) + " · " +
    d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function renderEventCard(e){
  if (!e) return "";
  var s = eventMap[e.id] || { going: 0, interested: 0, mine: null };
  var id = esc(e.id);
  return '<article class="post ev-card" id="ev-' + id + '">' +
    (e.banner_url ? '<img class="ev-banner" src="' + esc(e.banner_url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : "") +
    '<div class="ev-body">' +
      '<span class="tag" style="margin-bottom:8px"><i class="fas fa-calendar"></i> Event</span>' +
      '<div class="ev-date">' + esc(eventDate(e.starts_at)) + '</div>' +
      '<div class="ev-title">' + esc(e.title) + '</div>' +
      (e.location ? '<div class="ev-loc"><i class="fas fa-location-dot"></i>' + esc(e.location) + '</div>' : "") +
      '<div class="ev-count">' + fmt(s.going) + ' going · ' + fmt(s.interested) + ' interested</div>' +
      '<div class="ev-btns">' +
        '<button class="ev-btn ' + (s.mine === "going" ? "on" : "") + '" onclick="rsvp(\'' + id + '\',\'going\')">' + (s.mine === "going" ? "✓ Going" : "Going") + '</button>' +
        '<button class="ev-btn ' + (s.mine === "interested" ? "on" : "") + '" onclick="rsvp(\'' + id + '\',\'interested\')">' + (s.mine === "interested" ? "★ Interested" : "Interested") + '</button>' +
      '</div>' +
    '</div></article>';
}

async function rsvp(eventId, status){
  var s = eventMap[eventId]; if (!s) return;
  var same = s.mine === status;

  var r = same
    ? await supabaseClient.from("event_rsvps").delete().eq("event_id", eventId).eq("user_id", me.id)
    : await supabaseClient.from("event_rsvps").upsert({ event_id: eventId, user_id: me.id, status: status }, { onConflict: "event_id,user_id" });
  if (r.error) { console.error(r.error); toast("Could not save your response"); return; }

  if (s.mine === "going") s.going--; else if (s.mine === "interested") s.interested--;
  if (same) { s.mine = null; }
  else { s.mine = status; if (status === "going") s.going++; else s.interested++; }

  var el = $("ev-" + eventId);
  if (el) el.outerHTML = renderEventCard(s.data);
}

/* =========================================================
   VIEW OBSERVERS (ad impressions + video autoplay)
========================================================= */
var viewObs = new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    var el = en.target;
    if (el.classList.contains("home-ad")) {
      if (en.isIntersecting && en.intersectionRatio >= 0.5) { trackAd(el.getAttribute("data-ad-id"), "impression"); viewObs.unobserve(el); }
    } else if (el.classList.contains("vid-card")) {
      var v = el.querySelector("video"); if (!v) return;
      if (en.isIntersecting && en.intersectionRatio >= 0.6) v.play().catch(function(){});
      else v.pause();
    }
  });
}, { threshold: [0, 0.5, 0.6, 1] });

function observeNew(){
  document.querySelectorAll(".home-ad:not([data-obs]), .vid-card:not([data-obs])").forEach(function(el){
    el.setAttribute("data-obs", "1");
    viewObs.observe(el);
  });
}

/* =========================================================
   REALTIME (light: only a "new posts" pill, no feed reload)
========================================================= */
function subscribe(){
  supabaseClient.channel("home-posts-" + me.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "posts" }, function(payload){
      var p = payload.new;
      if (!p || p.User_id === me.id) return;
      if (p.group_id && !myGroupSet.has(String(p.group_id))) return;
      if (!canSee(p)) return;
      newCount++;
      var pill = $("newPill");
      pill.textContent = "↑ " + newCount + " new post" + (newCount > 1 ? "s" : "");
      pill.style.display = "block";
    })
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "posts" }, function(payload){
      if (payload.old && payload.old.id) removePostElement(String(payload.old.id));
    })
    .subscribe();

  supabaseClient.channel("home-notifs-" + me.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: "recipient_id=eq." + me.id }, function(){ loadUnread(); })
    .subscribe();
}

/* =========================================================
   OPEN A SPECIFIC POST (?post=ID from notifications / shared links)
========================================================= */
async function showRequestedPost(){
  var id = new URLSearchParams(location.search).get("post");
  if (!id) return;

  var el = $("post-" + id);
  if (!el) {
    var r = await supabaseClient.from("posts").select("*").eq("id", id).maybeSingle();
    if (r.error || !r.data || !canSee(r.data)) { toast("This post is not available"); return; }
    await enrich([r.data]);
    postsById[String(r.data.id)] = r.data;
    $("feed").insertAdjacentHTML("afterbegin", renderPost(r.data));
    el = $("post-" + id);
  }
  if (el) {
    setTimeout(function(){
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.style.boxShadow = "0 0 0 2px var(--accent)";
      setTimeout(function(){ el.style.boxShadow = ""; }, 1800);
    }, 300);
  }
}
