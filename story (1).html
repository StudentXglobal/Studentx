<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Story - StudentX</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#0a0a0f;
  --card:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.08);
  --text:#fff;
  --text-2:rgba(255,255,255,.75);
  --muted:rgba(255,255,255,.42);
  --accent:#dc2743;
  --grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow:hidden;position:fixed;inset:0;max-width:500px;margin:0 auto}

/* TOP BAR (list mode) */
.st-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;z-index:100;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(10,10,15,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.st-back{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:16px;flex-shrink:0;cursor:pointer}
.st-title{font-size:15px;font-weight:700;flex:1}

/* CIRCLES */
.st-circles{position:fixed;top:60px;left:50%;transform:translateX(-50%);width:100%;max-width:500px;display:flex;gap:12px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;z-index:90;height:calc(100% - 60px)}
.st-circles::-webkit-scrollbar{display:none}
.st-circles-inner{display:flex;flex-direction:column;gap:18px;width:100%}
.st-row-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.st-row{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.st-row::-webkit-scrollbar{display:none}
.st-c{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;cursor:pointer;position:relative}
.st-ring{width:64px;height:64px;border-radius:50%;padding:2.5px;background:var(--grad);transition:transform .2s}
.st-ring.seen{background:var(--card)}
.st-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--bg);background:#222}
.st-add{width:64px;height:64px;border-radius:50%;border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);background:rgba(220,39,67,.06)}
.st-plus{width:24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:absolute;right:0;bottom:16px;border:2px solid var(--bg)}
.st-nm{font-size:10px;color:var(--text-2);max-width:66px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-empty{color:var(--muted);font-size:13px;text-align:center;padding:60px 20px}
.st-empty i{display:block;font-size:34px;margin-bottom:12px}

/* STORY VIEWER */
.st-view{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;background:#000}
.st-view.show{display:flex}
.st-media{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
.st-media img{width:100%;height:100%;object-fit:contain}
.st-video{width:100%;height:100%;object-fit:contain;background:#000}
.st-progwrap{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:10}
.st-prog{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.st-prog-bar{height:100%;width:0%;background:#fff;border-radius:3px}
.st-prog.done .st-prog-bar{width:100%!important}

.st-top-info{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:9px;z-index:10}
.st-top-av{width:32px;height:32px;border-radius:50%;object-fit:cover;cursor:pointer;border:1px solid rgba(255,255,255,.3)}
.st-top-name{font-size:13px;font-weight:700}
.st-top-time{font-size:10px;color:rgba(255,255,255,.6)}
.st-top-acts{margin-left:auto;display:flex;align-items:center;gap:14px}
.st-top-acts i{font-size:16px;color:#fff;cursor:pointer}
.st-view-count{display:flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,.8);cursor:pointer}

.st-nav{position:absolute;inset:0;display:flex;z-index:5}
.st-nav-zone{flex:1}

/* ACTIONS */
.st-actions{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(10,10,15,.97);flex-shrink:0;z-index:10}
.st-cmt-input-wrap{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.08);border-radius:22px;padding:0 6px 0 16px}
.st-cmt-input-wrap input{flex:1;padding:11px 0;border:none;background:none;color:#fff;font-size:13px;outline:none;font-family:Poppins,sans-serif}
.st-cmt-input-wrap input::placeholder{color:rgba(255,255,255,.3)}
.st-cmt-send{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;flex-shrink:0}
.st-act{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(255,255,255,.75);cursor:pointer;flex-shrink:0}
.st-act.liked{color:#ef4444;animation:hp .3s ease}
@keyframes hp{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.st-act.dng{color:#ef4444}

/* REPLIES PANEL */
.st-comments{max-height:0;overflow:hidden;transition:max-height .3s ease;background:rgba(10,10,15,.97);flex-shrink:0}
.st-comments.show{max-height:220px;overflow-y:auto}
.st-cmt{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.st-cmt-av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0}
.st-cmt-body{flex:1;min-width:0}
.st-cmt-name{font-size:12px;font-weight:700}
.st-cmt-text{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.4;word-break:break-word}
.st-cmt-time{font-size:9px;color:var(--muted);margin-top:3px}
.st-cmt-empty{text-align:center;padding:16px;color:var(--muted);font-size:12px}

/* STORY END */
.st-end{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);flex-direction:column;gap:12px}
.st-end.show{display:flex}
.st-end-icon{width:64px;height:64px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted)}
.st-end-text{font-size:16px;font-weight:700;color:rgba(255,255,255,.6)}
.st-end-btn{margin-top:4px;padding:11px 28px;border-radius:20px;background:var(--grad);color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer}

/* VIEWERS SHEET (owner) */
.vw-ov{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.vw-ov.show{display:flex}
.vw-sheet{width:100%;max-width:500px;max-height:60vh;overflow-y:auto;background:#14142d;border-radius:20px 20px 0 0;padding:12px 0 24px}
.vw-handle{width:36px;height:4px;background:rgba(128,128,128,.4);border-radius:4px;margin:0 auto 10px}
.vw-title{padding:6px 20px 10px;font-size:14px;font-weight:700;color:#fff}
.vw-row{display:flex;align-items:center;gap:10px;padding:9px 20px}
.vw-row img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#222}
.vw-row div{flex:1;font-size:12px;color:#fff}
.vw-row span{font-size:10px;color:var(--muted)}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;padding:11px 20px;background:rgba(220,39,67,.92);backdrop-filter:blur(12px);color:#fff;border-radius:12px;font-size:12px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.3);animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<!-- LIST MODE -->
<div class="st-bar">
  <div class="st-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
  <div class="st-title">Stories</div>
</div>

<div class="st-circles" id="stCircles">
  <div class="st-empty"><i class="fas fa-spinner fa-spin"></i>Loading stories...</div>
</div>

<!-- STORY VIEWER -->
<div class="st-view" id="stView">
  <div class="st-media" id="stMedia">
    <div class="st-progwrap" id="stProgWrap"></div>
    <div class="st-top-info">
      <img class="st-top-av" id="stTopAv" src="" onclick="goToUserProfile()" alt="">
      <div>
        <div class="st-top-name" id="stTopName"></div>
        <div class="st-top-time" id="stTopTime"></div>
      </div>
      <div class="st-top-acts">
        <div class="st-view-count" id="stViewCount" onclick="openViewersSheet()" style="display:none"><i class="fas fa-eye"></i><span>0</span></div>
        <i class="fas fa-times" onclick="closeStory()"></i>
      </div>
    </div>
    <div class="st-nav">
      <div class="st-nav-zone" onclick="prevStory()"></div>
      <div class="st-nav-zone" onclick="nextStory()"></div>
    </div>
  </div>

  <div class="st-comments" id="stComments">
    <div class="st-cmt-list" id="stCmtList"></div>
  </div>

  <div class="st-actions">
    <div class="st-cmt-input-wrap">
      <input type="text" id="stCmtInput" placeholder="Reply to story..." onkeydown="if(event.key==='Enter')sendStoryReply()" onfocus="pauseStory()" onblur="resumeStory()">
      <div class="st-cmt-send" onclick="sendStoryReply()"><i class="fas fa-paper-plane"></i></div>
    </div>
    <div class="st-act" id="stLikeBtn" onclick="likeStory()"><i class="far fa-heart"></i></div>
    <div class="st-act" onclick="toggleComments()"><i class="far fa-comment"></i></div>
    <div class="st-act" onclick="shareStory()"><i class="fas fa-share"></i></div>
    <div class="st-act dng" id="stDeleteBtn" onclick="deleteCurrentStory()" style="display:none"><i class="fas fa-trash"></i></div>
  </div>
</div>

<!-- STORY END -->
<div class="st-end" id="stEnd">
  <div class="st-end-icon"><i class="fas fa-check-circle"></i></div>
  <div class="st-end-text">No more stories</div>
  <button class="st-end-btn" onclick="closeStory()">Back</button>
</div>

<!-- VIEWERS SHEET -->
<div class="vw-ov" id="vwOv" onclick="if(event.target===this)closeViewersSheet()">
  <div class="vw-sheet">
    <div class="vw-handle"></div>
    <div class="vw-title">Viewed by</div>
    <div id="vwList"></div>
  </div>
</div>

<input type="file" id="storyFileInput" accept="image/*,video/mp4,video/webm,video/3gpp" style="display:none" onchange="handleStoryFile(this)">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
/* =========================================================
   STUDENTX STORIES
========================================================= */
var currentUser = null;
var myProfile = null;

var usersWithStories = [];   // [{ id, profile, stories:[...], allSeen }]
var queue = [];              // current viewer queue (one user's stories)
var curIdx = 0;
var curStory = null;

var viewedStoryIds = new Set();
var progTimer = null, segTimers = [];
var isPaused = false;
var videoEl = null;

var DEFAULT_AVATAR = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#20202a"/><circle cx="50" cy="38" r="20" fill="#777"/><path d="M18 90c4-22 18-32 32-32s28 10 32 32" fill="#777"/></svg>'
);

function $(id){ return document.getElementById(id); }
function esc(v){
  if (v === null || v === undefined) return "";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function showMsg(t){
  var old = document.querySelector(".toast"); if (old) old.remove();
  var d = document.createElement("div"); d.className = "toast"; d.textContent = t;
  document.body.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.remove(); }, 2500);
}
function ta(t){
  var s = Math.floor((Date.now() - new Date(t).getTime()) / 1000);
  if (s < 60) return "Just now";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}
function goBack(){
  if (document.referrer && document.referrer.indexOf(location.host) !== -1 && history.length > 1) history.back();
  else location.href = "home.html";
}

/* =========================================================
   INIT
========================================================= */
async function init(){
  var auth = await supabaseClient.auth.getUser();
  currentUser = auth.data && auth.data.user;
  if (!currentUser) { location.href = "login.html"; return; }

  var p = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url").eq("id", currentUser.id).maybeSingle();
  myProfile = p.data || { id: currentUser.id };

  await loadStories();
  checkDeepLink();
}

async function loadStories(){
  var cutoff = new Date(Date.now() - 24*60*60*1000).toISOString();

  var r = await supabaseClient.from("stories").select("*").gte("created_at", cutoff).order("created_at", { ascending:true });
  if (r.error) { console.error("Stories load error:", r.error); renderCircles(); return; }

  var rows = r.data || [];

  if (!rows.length) { usersWithStories = []; renderCircles(); return; }

  var ids = rows.map(function(s){ return s.id; });
  var userIds = Array.from(new Set(rows.map(function(s){ return s.user_id; })));

  var pr = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url").in("id", userIds);
  var pmap = {}; (pr.data || []).forEach(function(u){ pmap[u.id] = u; });

  var vr = await supabaseClient.from("story_views").select("story_id").eq("viewer_id", currentUser.id).in("story_id", ids);
  viewedStoryIds = new Set((vr.data || []).map(function(v){ return v.story_id; }));

  var byUser = {};
  rows.forEach(function(s){
    if (!byUser[s.user_id]) byUser[s.user_id] = [];
    byUser[s.user_id].push(s);
  });

  usersWithStories = Object.keys(byUser).map(function(uid){
    var stories = byUser[uid];
    var allSeen = stories.every(function(s){ return viewedStoryIds.has(s.id); });
    return { id: uid, profile: pmap[uid] || null, stories: stories, allSeen: allSeen };
  });

  // Own story first, then unseen, then seen — most recent activity first within groups
  usersWithStories.sort(function(a, b){
    if (a.id === currentUser.id) return -1;
    if (b.id === currentUser.id) return 1;
    if (a.allSeen !== b.allSeen) return a.allSeen ? 1 : -1;
    var at = new Date(a.stories[a.stories.length-1].created_at).getTime();
    var bt = new Date(b.stories[b.stories.length-1].created_at).getTime();
    return bt - at;
  });

  renderCircles();
}

function renderCircles(){
  var el = $("stCircles");
  var mine = usersWithStories.find(function(u){ return u.id === currentUser.id; });
  var others = usersWithStories.filter(function(u){ return u.id !== currentUser.id; });

  var html = '<div class="st-circles-inner">';

  html += '<div><div class="st-row-label">Your Story</div><div class="st-row">';
  if (mine) {
    html += '<div class="st-c" onclick="openUserStory(\'' + esc(currentUser.id) + '\')">' +
      '<div class="st-ring ' + (mine.allSeen ? "seen" : "") + '"><img src="' + esc(myProfile.avatar_url || DEFAULT_AVATAR) + '" onerror="this.src=\'' + DEFAULT_AVATAR + '\'" alt=""></div>' +
      '<div class="st-plus" onclick="event.stopPropagation();openUpload()"><i class="fas fa-plus"></i></div>' +
      '<div class="st-nm">You</div>' +
    '</div>';
  } else {
    html += '<div class="st-c" onclick="openUpload()"><div class="st-add"><i class="fas fa-plus"></i></div><div class="st-nm">Add Story</div></div>';
  }
  html += '</div></div>';

  html += '<div><div class="st-row-label">Recent</div><div class="st-row">';
  if (!others.length) {
    html += '<div style="color:var(--muted);font-size:12px;padding:8px 0">No stories from others yet.</div>';
  } else {
    others.forEach(function(u){
      var prof = u.profile || {};
      var name = prof.full_name || prof.username || "Student";
      html += '<div class="st-c" onclick="openUserStory(\'' + esc(u.id) + '\')">' +
        '<div class="st-ring ' + (u.allSeen ? "seen" : "") + '"><img src="' + esc(prof.avatar_url || DEFAULT_AVATAR) + '" onerror="this.src=\'' + DEFAULT_AVATAR + '\'" alt=""></div>' +
        '<div class="st-nm">' + esc(name.split(" ")[0]) + '</div>' +
      '</div>';
    });
  }
  html += '</div></div>';

  html += '</div>';
  el.innerHTML = html;
}

/* =========================================================
   DEEP LINK ?story=ID
========================================================= */
function checkDeepLink(){
  var id = new URLSearchParams(location.search).get("story");
  if (!id) return;

  var owner = usersWithStories.find(function(u){ return u.stories.some(function(s){ return String(s.id) === String(id); }); });
  if (!owner) { showMsg("This story is no longer available"); return; }

  queue = owner.stories;
  curIdx = queue.findIndex(function(s){ return String(s.id) === String(id); });
  if (curIdx < 0) curIdx = 0;
  openViewer();
}

/* =========================================================
   UPLOAD
========================================================= */
function openUpload(){ $("storyFileInput").click(); }

async function handleStoryFile(input){
  var file = input.files[0];
  input.value = "";
  if (!file) return;

  var isVideo = file.type.startsWith("video/");
  var isImage = file.type.startsWith("image/");
  if (!isVideo && !isImage) { showMsg("Please choose an image or video"); return; }
  if (file.size > 25 * 1024 * 1024) { showMsg("File must be under 25 MB"); return; }

  showMsg("Uploading story...");

  try {
    var ext = (file.name.split(".").pop() || (isImage ? "jpg" : "mp4")).toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    var path = currentUser.id + "/" + Date.now() + "." + ext;

    var up = await supabaseClient.storage.from("stories").upload(path, file, { contentType: file.type, upsert: false });
    if (up.error) throw up.error;

    var url = supabaseClient.storage.from("stories").getPublicUrl(path).data.publicUrl;

    var ins = await supabaseClient.from("stories").insert({
      user_id: currentUser.id,
      media_type: isVideo ? "video" : "image",
      media_url: url
    }).select().single();
    if (ins.error) throw ins.error;

    showMsg("Story posted");
    await loadStories();

    var mine = usersWithStories.find(function(u){ return u.id === currentUser.id; });
    if (mine) {
      queue = mine.stories;
      curIdx = queue.length - 1;
      openViewer();
    }
  } catch (e) {
    console.error("Story upload error:", e);
    showMsg(e.message || "Could not upload story");
  }
}

/* =========================================================
   OPEN USER STORY QUEUE
========================================================= */
function openUserStory(userId){
  var u = usersWithStories.find(function(x){ return x.id === userId; });
  if (!u || !u.stories.length) return;

  queue = u.stories;
  curIdx = queue.findIndex(function(s){ return !viewedStoryIds.has(s.id); });
  if (curIdx < 0) curIdx = 0;

  openViewer();
}

/* =========================================================
   VIEWER
========================================================= */
function openViewer(){
  curStory = queue[curIdx];
  if (!curStory) { $("stEnd").classList.add("show"); $("stView").classList.remove("show"); return; }

  $("stEnd").classList.remove("show");
  $("stView").classList.add("show");

  renderProgressBars();
  renderViewer();
  recordView(curStory.id);
  startSegment();
}

function renderProgressBars(){
  var wrap = $("stProgWrap");
  wrap.innerHTML = queue.map(function(s, i){
    var state = i < curIdx ? "done" : "";
    return '<div class="st-prog ' + state + '" id="stProg' + i + '"><div class="st-prog-bar" id="stProgBar' + i + '"></div></div>';
  }).join("");
}

function renderViewer(){
  var s = curStory;
  var owner = usersWithStories.find(function(u){ return u.stories.some(function(x){ return x.id === s.id; }); });
  var prof = (owner && owner.profile) || {};
  var isOwner = s.user_id === currentUser.id;

  $("stTopAv").src = prof.avatar_url || DEFAULT_AVATAR;
  $("stTopName").textContent = isOwner ? "You" : (prof.full_name || prof.username || "StudentX User");
  $("stTopTime").textContent = ta(s.created_at);

  $("stDeleteBtn").style.display = isOwner ? "flex" : "none";
  $("stViewCount").style.display = isOwner ? "flex" : "none";

  var media = $("stMedia");
  var existingNav = media.querySelector(".st-nav");
  var existingInfo = media.querySelector(".st-top-info");
  var existingProg = media.querySelector(".st-progwrap");

  // clear only media content (keep overlay structural elements already in DOM via outer HTML, so rebuild safely)
  Array.from(media.querySelectorAll("img.media-el, video.media-el")).forEach(function(el){ el.remove(); });

  if (s.media_type === "video") {
    var v = document.createElement("video");
    v.className = "st-video media-el";
    v.src = s.media_url;
    v.playsInline = true;
    v.autoplay = true;
    v.muted = false;
    v.id = "stVideoEl";
    media.insertBefore(v, existingProg);
    videoEl = v;
  } else {
    var img = document.createElement("img");
    img.className = "media-el";
    img.src = s.media_url;
    img.alt = "";
    media.insertBefore(img, existingProg);
    videoEl = null;
  }

  updateLikeButton();
  loadReplies();
  fetchLikeState();
  if (isOwner) fetchViewCount();
}

function goToUserProfile(){
  if (!curStory) return;
  if (curStory.user_id === currentUser.id) { closeStory(); location.href = "profile.html"; return; }
  closeStory();
  location.href = "profile.html?id=" + encodeURIComponent(curStory.user_id);
}

/* =========================================================
   PROGRESS / TIMER
========================================================= */
function clearTimers(){
  if (progTimer) { clearInterval(progTimer); progTimer = null; }
}

function startSegment(){
  clearTimers();
  isPaused = false;

  var bar = $("stProgBar" + curIdx);
  if (!bar) return;
  bar.style.transition = "none";
  bar.style.width = "0%";

  if (curStory.media_type === "video" && videoEl) {

    videoEl.currentTime = 0;
    videoEl.play().catch(function(){});

    videoEl.onended = function(){ nextStory(); };

    progTimer = setInterval(function(){
      if (isPaused || !videoEl || !videoEl.duration) return;
      var pct = Math.min(100, (videoEl.currentTime / videoEl.duration) * 100);
      bar.style.width = pct + "%";
    }, 100);

  } else {

    var duration = 5000;
    var elapsed = 0;
    var step = 100;

    progTimer = setInterval(function(){
      if (isPaused) return;
      elapsed += step;
      var pct = Math.min(100, (elapsed / duration) * 100);
      bar.style.width = pct + "%";
      if (elapsed >= duration) { clearTimers(); nextStory(); }
    }, step);

  }
}

function pauseStory(){
  isPaused = true;
  if (videoEl) videoEl.pause();
}
function resumeStory(){
  isPaused = false;
  if (videoEl) videoEl.play().catch(function(){});
}

/* =========================================================
   NAV
========================================================= */
function prevStory(){
  clearTimers();
  if (videoEl) videoEl.pause();
  if (curIdx > 0) { curIdx--; openViewer(); }
  else { startSegment(); } // restart first story instead of exiting
}

function nextStory(){
  clearTimers();
  if (videoEl) videoEl.pause();
  curIdx++;
  if (curIdx >= queue.length) {
    $("stEnd").classList.add("show");
    $("stView").classList.remove("show");
    return;
  }
  openViewer();
}

function closeStory(){
  clearTimers();
  if (videoEl) { videoEl.pause(); videoEl = null; }
  $("stView").classList.remove("show");
  $("stEnd").classList.remove("show");
  loadStories();

  if (new URLSearchParams(location.search).get("story")) {
    location.href = "home.html";
  }
}

/* =========================================================
   VIEW TRACKING
========================================================= */
async function recordView(storyId){
  if (viewedStoryIds.has(storyId)) return;
  viewedStoryIds.add(storyId);

  var r = await supabaseClient.from("story_views").insert({ story_id: storyId, viewer_id: currentUser.id });
  if (r.error && r.error.code !== "23505") console.warn("View record error:", r.error.message);
}

async function fetchViewCount(){
  var r = await supabaseClient.from("story_views").select("id", { count:"exact", head:true }).eq("story_id", curStory.id);
  var el = $("stViewCount").querySelector("span");
  if (el) el.textContent = r.count || 0;
}

async function openViewersSheet(){
  if (curStory.user_id !== currentUser.id) return;

  $("vwOv").classList.add("show");
  pauseStory();

  var r = await supabaseClient.from("story_views").select("viewer_id,created_at").eq("story_id", curStory.id).order("created_at", { ascending:false });
  var rows = r.data || [];

  if (!rows.length) { $("vwList").innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">No views yet</div>'; return; }

  var ids = rows.map(function(x){ return x.viewer_id; });
  var pr = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url").in("id", ids);
  var map = {}; (pr.data || []).forEach(function(u){ map[u.id] = u; });

  $("vwList").innerHTML = rows.map(function(row){
    var u = map[row.viewer_id] || {};
    return '<div class="vw-row"><img src="' + esc(u.avatar_url || DEFAULT_AVATAR) + '" onerror="this.src=\'' + DEFAULT_AVATAR + '\'" alt=""><div>' + esc(u.full_name || u.username || "StudentX User") + '</div><span>' + ta(row.created_at) + '</span></div>';
  }).join("");
}
function closeViewersSheet(){ $("vwOv").classList.remove("show"); resumeStory(); }

/* =========================================================
   LIKE
========================================================= */
var likedStoryIds = new Set();

async function fetchLikeState(){
  var r = await supabaseClient.from("story_likes").select("id").eq("story_id", curStory.id).eq("user_id", currentUser.id).maybeSingle();
  if (r.data) likedStoryIds.add(curStory.id); else likedStoryIds.delete(curStory.id);
  updateLikeButton();
}
function updateLikeButton(){
  var liked = likedStoryIds.has(curStory.id);
  var btn = $("stLikeBtn");
  btn.className = "st-act" + (liked ? " liked" : "");
  btn.innerHTML = '<i class="' + (liked ? "fas" : "far") + ' fa-heart"></i>';
}

async function likeStory(){
  if (!curStory) return;
  var liked = likedStoryIds.has(curStory.id);

  if (liked) {
    var r = await supabaseClient.from("story_likes").delete().eq("story_id", curStory.id).eq("user_id", currentUser.id);
    if (r.error) { showMsg("Could not unlike"); return; }
    likedStoryIds.delete(curStory.id);
  } else {
    var r2 = await supabaseClient.from("story_likes").insert({ story_id: curStory.id, user_id: currentUser.id });
    if (r2.error) { showMsg("Could not like"); return; }
    likedStoryIds.add(curStory.id);

    if (curStory.user_id !== currentUser.id) {
      supabaseClient.from("notifications").insert({
        recipient_id: curStory.user_id,
        actor_id: currentUser.id,
        type: "story_like",
        story_id: curStory.id,
        message: "liked your story.",
        is_read: false
      }).then(function(r3){ if (r3.error) console.warn("Notify error:", r3.error.message); });
    }
  }

  updateLikeButton();
}

/* =========================================================
   REPLIES
========================================================= */
function toggleComments(){
  $("stComments").classList.toggle("show");
}

async function loadReplies(){
  var r = await supabaseClient.from("story_replies").select("id,user_id,content,created_at").eq("story_id", curStory.id).order("created_at", { ascending:true });
  var list = $("stCmtList");

  var rows = r.data || [];
  if (!rows.length) { list.innerHTML = '<div class="st-cmt-empty">No replies yet</div>'; return; }

  var ids = Array.from(new Set(rows.map(function(x){ return x.user_id; })));
  var pr = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url").in("id", ids);
  var map = {}; (pr.data || []).forEach(function(u){ map[u.id] = u; });

  list.innerHTML = rows.map(function(c){
    var u = map[c.user_id] || {};
    return '<div class="st-cmt"><img class="st-cmt-av" src="' + esc(u.avatar_url || DEFAULT_AVATAR) + '" onerror="this.src=\'' + DEFAULT_AVATAR + '\'"><div class="st-cmt-body"><div class="st-cmt-name">' + esc(u.full_name || u.username || "StudentX User") + '</div><div class="st-cmt-text">' + esc(c.content) + '</div><div class="st-cmt-time">' + ta(c.created_at) + '</div></div></div>';
  }).join("");
}

async function sendStoryReply(){
  var input = $("stCmtInput");
  var txt = input.value.trim();
  if (!txt || !curStory) return;

  var r = await supabaseClient.from("story_replies").insert({ story_id: curStory.id, user_id: currentUser.id, content: txt });
  if (r.error) { showMsg("Could not send reply"); return; }

  input.value = "";
  await loadReplies();
  if (!$("stComments").classList.contains("show")) $("stComments").classList.add("show");
  showMsg("Reply sent!");

  if (curStory.user_id !== currentUser.id) {
    supabaseClient.from("notifications").insert({
      recipient_id: curStory.user_id,
      actor_id: currentUser.id,
      type: "story_reply",
      story_id: curStory.id,
      message: "replied to your story: \"" + txt.slice(0,60) + "\"",
      is_read: false
    }).then(function(r2){ if (r2.error) console.warn("Notify error:", r2.error.message); });
  }
}

/* =========================================================
   SHARE / DELETE
========================================================= */
async function shareStory(){
  var url = location.origin + location.pathname + "?story=" + encodeURIComponent(curStory.id);
  try {
    if (navigator.share) { await navigator.share({ title: "StudentX Story", url: url }); return; }
    await navigator.clipboard.writeText(url);
    showMsg("Link copied");
  } catch (e) { if (e && e.name !== "AbortError") showMsg("Could not share"); }
}

async function deleteCurrentStory(){
  if (!curStory || curStory.user_id !== currentUser.id) return;
  if (!confirm("Delete this story?")) return;

  var r = await supabaseClient.from("stories").delete().eq("id", curStory.id).eq("user_id", currentUser.id);
  if (r.error) { showMsg("Could not delete story"); return; }

  showMsg("Story deleted");
  queue.splice(curIdx, 1);
  if (!queue.length) { closeStory(); return; }
  if (curIdx >= queue.length) curIdx = queue.length - 1;
  openViewer();
}

/* =========================================================
   START
========================================================= */
init();
</script>
