<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Story - StudentX</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            background-color: #000;
            color: #fff;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* --- STORY CONTAINER --- */
        .story-container {
            position: relative;
            height: 100vh;
            width: 100vw;
            background-color: #000;
        }

        .story-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 0;
            transition: opacity 0.3s;
        }

        /* --- PROGRESS BARS --- */
        .progress-bars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 10px 5px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }
        .bar {
            flex: 1;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .bar-fill {
            width: 0%;
            height: 100%;
            background-color: #fff;
            border-radius: 2px;
        }
        .bar.completed .bar-fill { width: 100%; }
        .bar.active .bar-fill { animation: fillBar 5s linear forwards; }
        
        @keyframes fillBar {
            from { width: 0%; }
            to { width: 100%; }
        }

        /* --- STORY HEADER --- */
        .story-header {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
        }
        .story-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #8A2BE2;
            object-fit: cover;
        }
        .story-user-info {
            flex-grow: 1;
        }
        .story-user-info h3 {
            font-size: 14px;
            font-weight: 600;
        }
        .story-user-info p {
            font-size: 12px;
            color: #ddd;
        }
        .close-btn {
            color: #fff;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
        }

        /* --- TAP ZONES (Gefe don wuce gaba da baya) --- */
        .tap-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 30%;
            z-index: 5;
        }
        .tap-left { left: 0; }
        .tap-right { right: 0; }

        /* --- REPLY BAR (An makala shi a kasan allo) --- */
        .reply-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }
        .reply-input {
            flex-grow: 1;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 12px 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(5px);
        }
        .reply-input::placeholder { color: #ccc; }
        
        .reply-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="story-container">
        <!-- Background Image -->
        <div class="story-background" id="storyBg"></div>

        <!-- Progress Bars -->
        <div class="progress-bars" id="progressBars"></div>

        <!-- Header -->
        <div class="story-header">
            <img id="storyAvatar" src="" class="story-avatar" alt="User">
            <div class="story-user-info">
                <h3 id="storyName">Loading...</h3>
                <p id="storyTime">5 minutes ago</p>
            </div>
            <a href="home.html" class="close-btn"><i class="fas fa-times"></i></a>
        </div>

        <!-- Tap Zones for Next/Prev -->
        <div class="tap-zone tap-left" onclick="prevStory()"></div>
        <div class="tap-zone tap-right" onclick="nextStory()"></div>

        <!-- Reply Bar (A Kasa) -->
        <div class="reply-bar">
            <input type="text" class="reply-input" placeholder="Reply to story...">
            <button class="reply-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // Fake Data for Stories
        const stories = [
            {
                name: "Fatima Muhammad",
                avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop",
                time: "5 minutes ago",
                bg: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=800&h=1400&fit=crop"
            },
            {
                name: "David Okafor",
                avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop",
                time: "10 minutes ago",
                bg: "https://images.unsplash.com/photo-1532012197267-84f1517387cf?w=800&h=1400&fit=crop"
            },
            {
                name: "Aisha Bello",
                avatar: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop",
                time: "1 hour ago",
                bg: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=800&h=1400&fit=crop"
            }
        ];

        let currentStory = 0;
        let storyTimer;

        // Elements
        const bgEl = document.getElementById('storyBg');
        const avatarEl = document.getElementById('storyAvatar');
        const nameEl = document.getElementById('storyName');
        const timeEl = document.getElementById('storyTime');
        const barsContainer = document.getElementById('progressBars');

        // Load Story Function
        function loadStory(index) {
            if (index < 0) {
                window.location.href = "home.html"; // Idan akwai baya, koma gida
                return;
            }
            if (index >= stories.length) {
                window.location.href = "home.html"; // Idan gama duka, koma gida
                return;
            }

            currentStory = index;
            const story = stories[index];

            // Fade effect
            bgEl.style.opacity = 0;
            setTimeout(() => {
                bgEl.style.backgroundImage = `url('${story.bg}')`;
                avatarEl.src = story.avatar;
                nameEl.innerText = story.name;
                timeEl.innerText = story.time;
                bgEl.style.opacity = 1;
            }, 100);

            // Update Progress Bars
            let barsHtml = '';
            for (let i = 0; i < stories.length; i++) {
                if (i < index) barsHtml += '<div class="bar completed"><div class="bar-fill"></div></div>';
                else if (i === index) barsHtml += '<div class="bar active"><div class="bar-fill"></div></div>';
                else barsHtml += '<div class="bar"><div class="bar-fill"></div></div>';
            }
            barsContainer.innerHTML = barsHtml;

            // Auto Next after 5 seconds
            clearInterval(storyTimer);
            storyTimer = setTimeout(() => {
                nextStory();
            }, 5000);
        }

        function nextStory() {
            loadStory(currentStory + 1);
        }

        function prevStory() {
            loadStory(currentStory - 1);
        }

        // Initialize First Story
        loadStory(0);

        // Pause on hold
        document.querySelector('.story-container').addEventListener('mousedown', () => {
            clearInterval(storyTimer);
            document.querySelectorAll('.bar.active .bar-fill').forEach(b => b.style.animationPlayState = 'paused');
        });
        document.querySelector('.story-container').addEventListener('mouseup', () => {
            document.querySelectorAll('.bar.active .bar-fill').forEach(b => b.style.animationPlayState = 'running');
            storyTimer = setTimeout(() => { nextStory(); }, 5000);
        });
    </script>
</body>
</html>
