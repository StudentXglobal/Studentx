<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>StudentX - Log In</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#0a0a0f;
  --card:rgba(255,255,255,.035);
  --card-2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.07);
  --text:#fff;
  --text-2:rgba(255,255,255,.75);
  --muted:rgba(255,255,255,.42);
  --accent:#dc2743;
  --grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  --danger:#ef4444;
}
:root.sx-light{
  --bg:#f0f2f5;
  --card:#ffffff;
  --card-2:#f0f2f5;
  --border:#e4e6eb;
  --text:#050505;
  --text-2:#3a3b3c;
  --muted:#65676b;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,sans-serif;background:var(--bg);min-height:100vh;position:relative;overflow-x:hidden}
button,input{font-family:Poppins,sans-serif}

.bg{position:fixed;top:-20%;left:-10%;width:140%;height:70%;background:radial-gradient(circle at 30% 20%,rgba(220,39,67,.16),transparent 55%),radial-gradient(circle at 80% 10%,rgba(240,148,51,.12),transparent 50%);pointer-events:none}

.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px}

.top{text-align:center;margin-bottom:28px}
.top .logo{font-size:34px;font-weight:900;color:var(--text);letter-spacing:-1px}
.top .logo b{font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top .sub{margin-top:6px;font-size:10px;font-weight:600;letter-spacing:3px;color:var(--muted)}
.top h2{color:var(--text);font-size:17px;font-weight:700;margin-top:16px}
.top p{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5;max-width:280px;margin-left:auto;margin-right:auto}

.card{width:100%;max-width:380px;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:26px 22px}

.tabs{display:flex;background:var(--card-2);border-radius:12px;padding:3px;margin-bottom:22px}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;border-radius:10px;color:var(--muted);cursor:pointer;transition:all .25s}
.tab.on{background:var(--grad);color:#fff}

.social{display:flex;gap:10px;margin-bottom:20px}
.social button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--border);background:var(--card-2);color:var(--text-2);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;cursor:pointer}
.social button:hover{border-color:rgba(220,39,67,.4);color:var(--text)}
.social button i{font-size:16px}
.social button .fa-google{color:#ea4335}
.social button .fa-facebook-f{color:#1877f2}
.social button .fa-apple{color:var(--text)}

.or{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--muted);font-size:11px}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--border)}

.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.fg-input{position:relative}
.fg-input i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.fg input{width:100%;padding:12px 14px 12px 38px;border-radius:12px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.fg input:focus{border-color:var(--accent)}
.fg input::placeholder{color:var(--muted)}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;cursor:pointer;background:none;border:0}

.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.row label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);cursor:pointer}
.row label input{width:14px;height:14px;accent-color:var(--accent)}
.row a{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}

.btn{width:100%;padding:13px;border-radius:12px;background:var(--grad);color:#fff;font-size:14px;font-weight:700;border:0;cursor:pointer;transition:transform .15s;box-shadow:0 4px 20px rgba(220,39,67,.25)}
.btn:hover{transform:scale(1.02)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.65;transform:none;cursor:not-allowed}

.foot{text-align:center;margin-top:18px;font-size:12px;color:var(--muted)}
.foot span{color:var(--accent);font-weight:700;cursor:pointer}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;padding:11px 20px;background:#1f1f2b;color:#fff;border-radius:12px;font-size:12px;font-weight:600;font-family:Poppins,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.35);border-left:3px solid var(--accent);animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<div class="top">
<div class="logo">Student<b>X</b></div>
<div class="sub"><span style="color:#f09433">CONNECT</span> · <span style="color:#dc2743">LEARN</span> · <span style="color:#bc1888">SHARE</span></div>
<h2>Welcome back</h2>
<p>Log in to connect with your campus, share knowledge, and grow together.</p>
</div>
<div class="card">
<div class="tabs">
<div class="tab on" id="tabLogin">Log In</div>
<div class="tab" id="tabSignup" onclick="goSignup()">Sign Up</div>
</div>
<div class="social">
<button onclick="googleLogin()"><i class="fab fa-google"></i> Google</button>
<button onclick="showMsg('Facebook login coming soon')"><i class="fab fa-facebook-f"></i> Facebook</button>
<button onclick="showMsg('Apple login coming soon')"><i class="fab fa-apple"></i> Apple</button>
</div>
<div class="or">OR</div>
<div class="fg">
<label>Email or Username</label>
<div class="fg-input">
<i class="fas fa-envelope"></i>
<input type="text" id="emailInput" placeholder="Enter your email or username" onkeydown="if(event.key==='Enter')document.getElementById('passInput').focus()">
</div>
</div>
<div class="fg">
<label>Password</label>
<div class="fg-input">
<i class="fas fa-lock"></i>
<input type="password" id="passInput" placeholder="Enter your password" onkeydown="if(event.key==='Enter')loginUser()">
<button type="button" class="pw-toggle" onclick="togglePassword()"><i class="far fa-eye" id="pwToggleIcon"></i></button>
</div>
</div>
<div class="row">
<label><input type="checkbox" id="rememberMe" checked> Remember me</label>
<a onclick="showMsg('Reset password link sent')">Forgot Password?</a>
</div>
<button class="btn" id="mainBtn" onclick="loginUser()">Log In</button>
<div class="foot" id="footText">Don't have an account? <span onclick="goSignup()">Sign Up</span></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="login.js"></script>
<script>
/* Keep the login screen in the theme the user last chose, if any */
(function(){
  try {
    var theme = localStorage.getItem("studentx-theme") || "dark";
    var light = theme === "light" || (theme === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
    document.documentElement.classList.toggle("sx-light", light);
  } catch (e) {}
})();

function goSignup(){
  window.location.href = "signup.html";
}

/* Real Google sign-in via Supabase OAuth (replaces the old GitHub redirect) */
async function googleLogin(){
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + "/home.html" }
    });
    if (error) {
      showMsg(error.message || "Google sign-in is not available right now");
    }
    // On success, Supabase redirects the browser to Google automatically.
  } catch (e) {
    showMsg("Google sign-in failed. Please try again.");
  }
}

function togglePassword(){
  const input = document.getElementById("passInput");
  const icon = document.getElementById("pwToggleIcon");
  const isHidden = input.type === "password";
  input.type = isHidden ? "text" : "password";
  icon.className = isHidden ? "far fa-eye-slash" : "far fa-eye";
}

function showMsg(t) {
  var old = document.querySelector(".toast");
  if (old) old.remove();
  var d = document.createElement('div');
  d.className = 'toast';
  d.textContent = t;
  document.body.appendChild(d);
  setTimeout(function() { d.remove(); }, 2500);
}
</script>
</body>
</html>
