<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>StudentX - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
 --bg:#0a0a0f;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.07);
 --border:rgba(255,255,255,.08);--text:#fff;--text2:rgba(255,255,255,.75);
 --muted:rgba(255,255,255,.45);--accent:#dc2743;
 --grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
 --danger:#ef4444;--success:#10b981
}
:root.sx-light{--bg:#f0f2f5;--card:#fff;--card2:#f0f2f5;--border:#e4e6eb;--text:#050505;--text2:#3a3b3c;--muted:#65676b}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Poppins,sans-serif;color:var(--text);min-height:100vh;max-width:500px;margin:auto;padding-bottom:82px}
button,input,textarea{font-family:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:4px}.hdr-btn{width:38px;height:38px;border:0;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:17px;background:none;position:relative}.hdr-btn:active{background:var(--card2)}
.hdr-logo{font-size:19px;font-weight:900;letter-spacing:-.5px;margin-left:6px}.hdr-logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hdr-badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;border:2px solid var(--bg)}
.new-pill{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:150;display:none;padding:9px 18px;border-radius:20px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;box-shadow:0 6px 20px #0006}
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 14px 10px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;cursor:pointer}.st-ring{width:58px;height:58px;border-radius:50%;padding:2.5px;background:var(--grad)}.st-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--bg);background:var(--card2)}.st-add{width:58px;height:58px;border-radius:50%;border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);background:var(--card)}.st-nm{font-size:10px;color:var(--muted);max-width:62px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpb{display:flex;align-items:center;gap:10px;padding:12px;margin:0 14px 12px;background:var(--card);border:1px solid var(--border);border-radius:14px}.cpb img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--card2)}.cpb-in{flex:1;min-width:0}.cpb-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cpb-ph{font-size:12px;color:var(--muted);margin-top:4px}.cpb-tools{display:flex;gap:10px}.cpb-t{font-size:16px}.cpb-t.g{color:#10b981}.cpb-t.r{color:#ef4444}.cpb-t.y{color:#f59e0b}
.post{background:var(--card);border:1px solid var(--border);border-radius:16px;margin:0 14px 12px;overflow:hidden}
.p-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px}.p-av{width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;background:var(--card2)}.p-info{flex:1;min-width:0}.p-nm{font-size:13px;font-weight:700;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.p-meta{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p-more{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;flex-shrink:0}.p-more:active{background:var(--card2)}
.p-body{padding:0 14px 10px;font-size:13px;line-height:1.65;color:var(--text2);white-space:pre-wrap;word-break:break-word}.p-body.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}.see-more{display:block;padding:0 14px 10px;font-size:12px;font-weight:700;color:var(--accent)}
.p-media{display:block;width:100%;max-height:620px;object-fit:contain;background:#111}.p-acts{display:flex;align-items:center;padding:4px 8px 10px;border-top:1px solid var(--border)}.p-a{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0}.p-a:active{background:var(--card2)}.p-a.lk.on{color:var(--danger)}.p-a.rp.on,.p-a.sv.on{color:var(--accent)}.p-a-r{margin-left:auto}
.group-line{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--muted);font-size:10px}.group-line img{width:18px;height:18px;border-radius:50%;object-fit:cover;background:var(--card2)}.group-line a{font-weight:700;color:var(--text2)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:10px;background:var(--grad);color:#fff;font-size:10px;font-weight:700}
.home-ad-head{display:flex;align-items:center;gap:10px;padding:12px 14px}.home-ad-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--card2)}.home-ad-info{flex:1;min-width:0}.home-ad-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home-ad-sp{font-size:10px;color:var(--muted);margin-top:2px}.home-ad-badge{font-size:10px;color:var(--muted);border:1px solid var(--border);padding:2px 8px;border-radius:10px}.home-ad-video{display:block;width:100%;max-height:560px;background:#000;object-fit:cover}.home-ad-cap{padding:10px 14px;font-size:13px;line-height:1.55;color:var(--text2);white-space:pre-wrap;word-break:break-word}.home-ad-foot{padding:6px 14px 14px}
.vid-card video{display:block;width:100%;max-height:520px;background:#000;object-fit:cover}.vid-cap{padding:10px 14px 4px;font-size:13px;line-height:1.55;color:var(--text2)}.vid-foot{padding:8px 14px 14px}
.ev-banner{display:block;width:100%;height:150px;object-fit:cover;background:var(--card2)}.ev-body{padding:14px}.ev-date{font-size:11px;font-weight:700;color:var(--accent)}.ev-title{margin-top:4px;font-size:15px;font-weight:700}.ev-loc,.ev-count{margin-top:6px;font-size:11px;color:var(--muted)}.ev-btns{display:flex;gap:8px;margin-top:12px}.ev-btn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:12px;font-weight:700}.ev-btn.on{background:var(--grad);border-color:transparent;color:#fff}
.skeleton{height:150px;border-radius:16px;background:var(--card);margin:0 14px 12px;animation:pulse 1.2s ease infinite}@keyframes pulse{50%{opacity:.5}}
.center{text-align:center;padding:45px 24px;color:var(--muted);font-size:12px;line-height:1.6}.center i{display:block;font-size:34px;margin-bottom:12px;color:var(--accent)}.center b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}.end-note{text-align:center;padding:16px;font-size:11px;color:var(--muted)}
.cta{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:12px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;border:0}
.ov{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center;background:#0009}.ov.show{display:flex}.sheet{width:100%;max-width:500px;background:#14142d;color:#fff;border-radius:20px 20px 0 0;padding:12px 0 24px}.sheet-handle{width:36px;height:4px;background:#8886;border-radius:4px;margin:0 auto 10px}.sheet-item{display:flex;align-items:center;gap:12px;padding:14px 20px;font-size:13px}.sheet-item i{width:18px;text-align:center;color:var(--muted)}.sheet-item.dng,.sheet-item.dng i{color:var(--danger)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;max-width:90%;padding:11px 20px;background:#1f1f2b;color:#fff;border-radius:12px;font-size:12px;font-weight:600;box-shadow:0 4px 20px #0006;border-left:3px solid var(--accent)}
</style>
</head>
<body>
<header class="hdr">
 <div class="hdr-l"><button class="hdr-btn" onclick="location.href='menu.html'"><i class="fas fa-bars"></i></button><div class="hdr-logo">Student<b>X</b></div></div>
 <div class="hdr-r"><button class="hdr-btn" onclick="location.href='groups.html'"><i class="fas fa-user-group"></i></button><button class="hdr-btn" onclick="location.href='search.html'"><i class="fas fa-search"></i></button><button class="hdr-btn" onclick="location.href='notification.html'"><i class="fas fa-bell"></i><span class="hdr-badge" id="bellBadge">0</span></button></div>
</header>
<div class="new-pill" id="newPill" onclick="refreshFeed()"></div>
<div class="stories" id="stories"></div>
<div class="cpb" onclick="location.href='create-post.html'">
 <img id="myAvatar" src="" alt="">
 <div class="cpb-in"><div class="cpb-name" id="myName">Loading...</div><div class="cpb-ph">What's on your mind?</div></div>
 <div class="cpb-tools"><div class="cpb-t g" onclick="event.stopPropagation();location.href='create-post.html?type=photo'"><i class="fas fa-image"></i></div><div class="cpb-t r" onclick="event.stopPropagation();location.href='create-post.html?type=video'"><i class="fas fa-video"></i></div><div class="cpb-t y" onclick="event.stopPropagation();toast('Polls are coming soon')"><i class="fas fa-poll"></i></div></div>
</div>
<main id="feed"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main>
<div id="sentinel" style="height:1px"></div><div id="moreWrap"></div>
<div class="ov" id="menuOv" onclick="if(event.target===this)closeMenu()"><div class="sheet"><div class="sheet-handle"></div><div id="menuItems"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="studentx-badges.js"></script>
<script>
"use strict";
var PAGE=15,me=null,profile=null,followingSet=new Set(),myGroupSet=new Set(),publicGroupSet=new Set(),myGroupIds=[],hiddenSet=new Set();
var postsById={},feedOffset=0,noMore=false,loading=false,postCounter=0,newCount=0;
var likedSet=new Set(),repostedSet=new Set(),savedSet=new Set(),likeCounts={},commentCounts={},repostCounts={};
var activeAds=[],adIndex=0,trackedAds=new Set(),videoQueue=[],eventQueue=[],eventMap={};
var DEFAULT_AVATAR="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#202027"/><circle cx="100" cy="78" r="42" fill="#777"/><path d="M35 190c8-48 35-70 65-70s57 22 65 70" fill="#777"/></svg>');
function $(id){return document.getElementById(id)}
function esc(v){if(v==null)return"";return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function fmt(n){n=Number(n)||0;if(n>=1e6)return(n/1e6).toFixed(1).replace(".0","")+"M";if(n>=1e3)return(n/1e3).toFixed(1).replace(".0","")+"K";return String(n)}
function timeAgo(d){if(!d)return"";var s=Math.floor((Date.now()-new Date(d).getTime())/1000);if(s<60)return"Just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";if(s<604800)return Math.floor(s/86400)+"d ago";return new Date(d).toLocaleDateString()}
function toast(msg){var o=document.querySelector(".toast");if(o)o.remove();var d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
function nameHTML(u){var f=esc((u&&(u.full_name||u.username))||"StudentX User");try{if(window.StudentXBadges&&u&&u.id&&typeof StudentXBadges.nameHTML==="function")return StudentXBadges.nameHTML(u)}catch(e){}return f}
function openUserProfile(id){if(id)location.href="profile.html?id="+encodeURIComponent(id)}
function postUrl(id){return location.origin+location.pathname+"?post="+encodeURIComponent(id)}
try{JSON.parse(localStorage.getItem("sx_hidden_posts")||"[]").forEach(function(x){hiddenSet.add(String(x))})}catch(e){}

async function init(){
 try{
  var au=await supabaseClient.auth.getUser();me=au.data&&au.data.user;if(!me){location.href="login.html";return}
  await loadMyProfile();await loadContext();
  await Promise.all([loadHomeAds(),loadVideos(),loadEvents()]);
  await loadFeed(true);
  loadStories();loadUnread();subscribe();setupInfiniteScroll();showRequestedPost();
 }catch(e){console.error("Home init:",e);$("feed").innerHTML='<div class="center"><i class="fas fa-triangle-exclamation"></i><b>Something went wrong</b>Please refresh the page.</div>'}
}
async function loadMyProfile(){
 var r=await supabaseClient.from("profiles").select("id,full_name,username,avatar_url,verified,premium_plan").eq("id",me.id).maybeSingle();
 profile=r.data||{id:me.id};$("myAvatar").src=profile.avatar_url||DEFAULT_AVATAR;$("myAvatar").onerror=function(){this.src=DEFAULT_AVATAR};$("myName").innerHTML=nameHTML(profile)
}
async function loadContext(){
 followingSet=new Set();myGroupSet=new Set();publicGroupSet=new Set();
 var f=await supabaseClient.from("followers").select("following_id").eq("follower_id",me.id);if(!f.error)(f.data||[]).forEach(function(x){followingSet.add(String(x.following_id))});
 var gm=await supabaseClient.from("group_members").select("group_id").eq("user_id",me.id).eq("status","active");if(!gm.error)(gm.data||[]).forEach(function(x){myGroupSet.add(String(x.group_id))});
 var g=await supabaseClient.from("groups").select("id").eq("privacy","public");if(!g.error)(g.data||[]).forEach(function(x){publicGroupSet.add(String(x.id))});
 myGroupIds=Array.from(myGroupSet)
}
async function loadStories(){
 var el=$("stories"),html='<div class="st" onclick="location.href=\'story.html\'"><div class="st-add"><i class="fas fa-plus"></i></div><div class="st-nm">Your Story</div></div>';
 var r=await supabaseClient.from("profiles").select("id,full_name,username,avatar_url").neq("id",me.id).order("created_at",{ascending:false}).limit(12);
 (r.data||[]).forEach(function(u){html+='<div class="st" onclick="openUserProfile(\''+esc(u.id)+'\')"><div class="st-ring"><img src="'+esc(u.avatar_url||DEFAULT_AVATAR)+'" onerror="this.src=DEFAULT_AVATAR"></div><div class="st-nm">'+esc((u.full_name||u.username||"Student").split(" ")[0])+"</div></div>"});
 el.innerHTML=html
}
async function loadUnread(){var r=await supabaseClient.from("notifications").select("id",{count:"exact",head:true}).eq("recipient_id",me.id).eq("is_read",false);var b=$("bellBadge");if(r.count){b.textContent=r.count>99?"99+":r.count;b.style.display="flex"}else b.style.display="none"}

async function fetchPosts(from){
 var q=supabaseClient.from("posts").select("*").order("Create_at",{ascending:false}).range(from,from+PAGE-1);
 var visibleGroups=Array.from(new Set(Array.from(myGroupSet).concat(Array.from(publicGroupSet))));
 if(visibleGroups.length)q=q.or("group_id.is.null,group_id.in.("+visibleGroups.join(",")+")");else q=q.is("group_id",null);
 var r=await q;
 if(r.error&&/group_id/i.test(r.error.message||""))r=await supabaseClient.from("posts").select("*").order("Create_at",{ascending:false}).range(from,from+PAGE-1);
 if(r.error){console.error(r.error);return null}return r.data||[]
}
function canSee(p){
 if(hiddenSet.has(String(p.id)))return false;
 if(String(p.User_id)===String(me.id))return true;
 if(p.group_id&&!myGroupSet.has(String(p.group_id))&&!publicGroupSet.has(String(p.group_id)))return false;
 if(p.visibility==="private")return false;
 if(p.visibility==="followers"&&!followingSet.has(String(p.User_id)))return false;
 return true
}
async function loadFeed(reset){
 if(loading)return;loading=true;var feed=$("feed");
 if(reset){feedOffset=0;noMore=false;postCounter=0;postsById={};adIndex=0;$("moreWrap").innerHTML="";$("newPill").style.display="none"}
 try{
  var rounds=0,shown=0;
  while(rounds<4&&!noMore&&shown===0){
   var rows=await fetchPosts(feedOffset);if(rows===null)throw Error("posts query failed");feedOffset+=rows.length;if(rows.length<PAGE)noMore=true;
   var visible=rows.filter(canSee);if(visible.length){await enrich(visible);if(reset&&shown===0)feed.innerHTML="";appendPosts(visible);shown+=visible.length}rounds++
  }
  if(reset&&shown===0)feed.innerHTML='<div class="center"><i class="fas fa-newspaper"></i><b>No posts yet</b>Posts from students will appear here.</div>';
  if(noMore)$("moreWrap").innerHTML='<div class="end-note">You have reached the end of the feed.</div>';
 }catch(e){console.error(e);if(reset)$("feed").innerHTML='<div class="center"><i class="fas fa-triangle-exclamation"></i><b>Unable to load posts</b><button class="cta" onclick="refreshFeed()">Try again</button></div>'}
 loading=false
}
async function refreshFeed(){$("feed").innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';await loadFeed(true)}
function setupInfiniteScroll(){if(!("IntersectionObserver"in window))return;new IntersectionObserver(function(es){if(es.some(function(e){return e.isIntersecting})&&!noMore&&!loading)loadFeed(false)},{rootMargin:"500px"}).observe($("sentinel"))}

async function enrich(rows){
 var uids=[...new Set(rows.map(function(p){return p.User_id}).filter(Boolean))],gids=[...new Set(rows.map(function(p){return p.group_id}).filter(Boolean))],pids=rows.map(function(p){return p.id});
 var pr=uids.length?await supabaseClient.from("profiles").select("id,full_name,username,avatar_url,verified,premium_plan").in("id",uids):{data:[],error:null};
 var gr=gids.length?await supabaseClient.from("groups").select("id,name,avatar_url,privacy").in("id",gids):{data:[],error:null};
 var lr=pids.length?await supabaseClient.from("likes").select("post_id,user_id").in("post_id",pids):{data:[],error:null};
 var cr=pids.length?await supabaseClient.from("comments").select("post_id").in("post_id",pids):{data:[],error:null};
 var rr=pids.length?await supabaseClient.from("reposts").select("post_id,user_id").in("post_id",pids):{data:[],error:null};
 var sr=pids.length?await supabaseClient.from("bookmarks").select("post_id").eq("user_id",me.id).in("post_id",pids):{data:[],error:null};
 var pm={},gm={};(pr.data||[]).forEach(function(x){pm[x.id]=x});(gr.data||[]).forEach(function(x){gm[x.id]=x});
 rows.forEach(function(p){p.profile=pm[p.User_id]||{id:p.User_id};p.group=p.group_id?(gm[p.group_id]||null):null;var k=String(p.id);likeCounts[k]=0;commentCounts[k]=0;repostCounts[k]=0});
 likedSet.clear();repostedSet.clear();savedSet.clear();
 (lr.data||[]).forEach(function(x){var k=String(x.post_id);likeCounts[k]++;if(String(x.user_id)===String(me.id))likedSet.add(k)});
 (cr.data||[]).forEach(function(x){var k=String(x.post_id);commentCounts[k]++});
 (rr.data||[]).forEach(function(x){var k=String(x.post_id);repostCounts[k]++;if(String(x.user_id)===String(me.id))repostedSet.add(k)});
 (sr.data||[]).forEach(function(x){savedSet.add(String(x.post_id))})
}

function renderPost(p){
 var id=String(p.id),u=p.profile||{},body="";
 if(p.content){var cl=p.content.length>500?" clamp":"";body='<div class="p-body'+cl+'" id="body-'+esc(id)+'">'+esc(p.content)+'</div>'+(cl?'<span class="see-more" onclick="expandPost(\''+esc(id)+'\',this)">See more</span>':"")}
 var media="";
 if(p.image_url)media+='<img class="p-media" src="'+esc(p.image_url)+'" loading="lazy" onerror="this.style.display=\'none\'">';
 if(p.video_url)media+='<video class="p-media" controls playsinline preload="metadata" src="'+esc(p.video_url)+'"></video>';
 var group="";
 if(p.group&&p.group.name)group='<div class="group-line">'+(p.group.avatar_url?'<img src="'+esc(p.group.avatar_url)+'">':'<i class="fas fa-users"></i>')+'<span>Posted in</span><a href="group.html?id='+encodeURIComponent(p.group.id)+'">'+esc(p.group.name)+'</a></div>';
 return '<article class="post" id="post-'+esc(id)+'"><div class="p-hdr"><img class="p-av" src="'+esc(u.avatar_url||DEFAULT_AVATAR)+'" onclick="openUserProfile(\''+esc(p.User_id)+'\')" onerror="this.src=DEFAULT_AVATAR"><div class="p-info"><div class="p-nm" onclick="openUserProfile(\''+esc(p.User_id)+'\')">'+nameHTML(u)+'</div><div class="p-meta">'+(u.username?"@"+esc(u.username)+" · ":"")+timeAgo(p.Create_at)+'</div>'+group+'</div><div class="p-more" onclick="openMenu(\''+esc(id)+'\')"><i class="fas fa-ellipsis-h"></i></div></div>'+body+media+'<div class="p-acts"><button class="p-a lk '+(likedSet.has(id)?"on":"")+'" id="lk-'+esc(id)+'" onclick="toggleLike(\''+esc(id)+'\')"><i class="'+(likedSet.has(id)?"fas":"far")+' fa-heart"></i><span>'+fmt(likeCounts[id])+'</span></button><button class="p-a" onclick="location.href=\'comment.html?post='+encodeURIComponent(id)+'\'"><i class="far fa-comment"></i><span>'+fmt(commentCounts[id])+'</span></button><button class="p-a rp '+(repostedSet.has(id)?"on":"")+'" id="rp-'+esc(id)+'" onclick="toggleRepost(\''+esc(id)+'\')"><i class="fas fa-retweet"></i><span>'+fmt(repostCounts[id])+'</span></button><button class="p-a p-a-r sv '+(savedSet.has(id)?"on":"")+'" id="sv-'+esc(id)+'" onclick="toggleSave(\''+esc(id)+'\')"><i class="'+(savedSet.has(id)?"fas":"far")+' fa-bookmark"></i></button></div></article>'
}
function appendPosts(rows){
 var h="";rows.forEach(function(p){postsById[String(p.id)]=p;h+=renderPost(p);postCounter++;if(postCounter%5===0)h+=renderAd(nextAd());else if(postCounter%7===0)h+=renderVideoCard(videoQueue.shift());else if(postCounter%11===0)h+=renderEventCard(eventQueue.shift())});
 $("feed").insertAdjacentHTML("beforeend",h);observeNew()
}
function appendFillers(){if(!postCounter)return;var h="";if(postCounter<5)h+=renderAd(nextAd());if(postCounter<7)h+=renderVideoCard(videoQueue.shift());if(postCounter<11)h+=renderEventCard(eventQueue.shift());if(h){$("feed").insertAdjacentHTML("beforeend",h);observeNew()}}
function expandPost(id,l){var b=$("body-"+id);if(b)b.classList.remove("clamp");if(l)l.remove()}

async function toggleLike(id){var b=$("lk-"+id),was=likedSet.has(id);var r=was?await supabaseClient.from("likes").delete().eq("post_id",id).eq("user_id",me.id):await supabaseClient.from("likes").insert({post_id:id,user_id:me.id});if(r.error){toast("Could not update like");return}was?(likedSet.delete(id),likeCounts[id]=Math.max(0,(likeCounts[id]||1)-1)):(likedSet.add(id),likeCounts[id]=(likeCounts[id]||0)+1);if(b){b.classList.toggle("on",likedSet.has(id));b.innerHTML='<i class="'+(likedSet.has(id)?"fas":"far")+' fa-heart"></i><span>'+fmt(likeCounts[id])+'</span>'}}
async function toggleRepost(id){var b=$("rp-"+id),was=repostedSet.has(id);var r=was?await supabaseClient.from("reposts").delete().eq("post_id",id).eq("user_id",me.id):await supabaseClient.from("reposts").insert({post_id:id,user_id:me.id});if(r.error){toast("Could not update repost");return}was?(repostedSet.delete(id),repostCounts[id]=Math.max(0,(repostCounts[id]||1)-1)):(repostedSet.add(id),repostCounts[id]=(repostCounts[id]||0)+1);if(b){b.classList.toggle("on",repostedSet.has(id));b.innerHTML='<i class="fas fa-retweet"></i><span>'+fmt(repostCounts[id])+'</span>'}}
async function toggleSave(id){var b=$("sv-"+id),was=savedSet.has(id);var r=was?await supabaseClient.from("bookmarks").delete().eq("post_id",id).eq("user_id",me.id):await supabaseClient.from("bookmarks").insert({post_id:id,user_id:me.id});if(r.error){toast("Could not save post");return}was?(savedSet.delete(id),toast("Removed from saved")):(savedSet.add(id),toast("Post saved"));if(b){b.classList.toggle("on",savedSet.has(id));b.innerHTML='<i class="'+(savedSet.has(id)?"fas":"far")+' fa-bookmark"></i>'}}

function openMenu(id){var p=postsById[id];if(!p)return;var h="";if(String(p.User_id)===String(me.id))h+='<div class="sheet-item dng" onclick="deletePost(\''+esc(id)+'\')"><i class="fas fa-trash"></i>Delete post</div>';else h+='<div class="sheet-item" onclick="closeMenu();openUserProfile(\''+esc(p.User_id)+'\')"><i class="fas fa-user"></i>View profile</div><div class="sheet-item" onclick="hidePost(\''+esc(id)+'\')"><i class="fas fa-eye-slash"></i>Hide post</div>';h+='<div class="sheet-item" onclick="copyPostLink(\''+esc(id)+'\')"><i class="fas fa-link"></i>Copy link</div><div class="sheet-item" onclick="sharePost(\''+esc(id)+'\')"><i class="fas fa-share"></i>Share post</div>';$("menuItems").innerHTML=h;$("menuOv").classList.add("show")}
function closeMenu(){$("menuOv").classList.remove("show")}
function removePostElement(id){var e=$("post-"+id);if(e)e.remove();delete postsById[id]}
async function deletePost(id){closeMenu();if(!confirm("Delete this post?"))return;var r=await supabaseClient.from("posts").delete().eq("id",id).eq("User_id",me.id).select("id");if(r.error||!r.data?.length){toast("Could not delete post");return}removePostElement(id);toast("Post deleted")}
function hidePost(id){closeMenu();hiddenSet.add(String(id));try{localStorage.setItem("sx_hidden_posts",JSON.stringify([...hiddenSet]))}catch(e){}removePostElement(id);toast("Post hidden")}
async function copyPostLink(id){closeMenu();try{await navigator.clipboard.writeText(postUrl(id));toast("Link copied")}catch(e){toast("Could not copy link")}}
async function sharePost(id){closeMenu();var p=postsById[id]||{};try{if(navigator.share){await navigator.share({title:"StudentX post",text:(p.content||"Check out this post on StudentX").slice(0,120),url:postUrl(id)});return}await navigator.clipboard.writeText(postUrl(id));toast("Link copied")}catch(e){}}

async function loadHomeAds(){
 var q=await supabaseClient.from("ads").select("id,title,username,avatar_url,video_url,thumbnail_url,caption,cta_text,cta_url,status,start_at,end_at,created_at").eq("status","active").order("created_at",{ascending:false});
 if(q.error){console.info("Ads unavailable:",q.error.message);activeAds=[];return}
 var now=Date.now();activeAds=(q.data||[]).filter(function(a){var s=a.start_at?new Date(a.start_at).getTime():0,e=a.end_at?new Date(a.end_at).getTime():Infinity;return (!s||now>=s)&&(!e||now<=e)});adIndex=0
}
function nextAd(){if(!activeAds.length)return null;return activeAds[adIndex++%activeAds.length]}
function renderAd(a){if(!a)return"";return '<article class="post home-ad" data-ad-id="'+esc(a.id)+'"><div class="home-ad-head"><img class="home-ad-avatar" src="'+esc(a.avatar_url||DEFAULT_AVATAR)+'"><div class="home-ad-info"><div class="home-ad-title">'+esc(a.title||"Sponsored")+'</div><div class="home-ad-sp">Sponsored'+(a.username?" · "+esc(a.username):"")+'</div></div><span class="home-ad-badge">Ad</span></div>'+(a.video_url?'<video class="home-ad-video" controls playsinline muted preload="metadata" poster="'+esc(a.thumbnail_url||"")+'"><source src="'+esc(a.video_url)+'"></video>':"")+(a.caption?'<div class="home-ad-cap">'+esc(a.caption)+'</div>':"")+'<div class="home-ad-foot">'+(a.cta_url?'<a class="cta" target="_blank" rel="noopener" href="'+esc(a.cta_url)+'" onclick="trackAd(\''+esc(a.id)+'\',\'click\')">'+esc(a.cta_text||"Learn more")+'</a>':'<button class="cta" onclick="trackAd(\''+esc(a.id)+'\',\'click\')">'+esc(a.cta_text||"Learn more")+"</button>")+'</div></article>'}
function trackAd(id,type){if(!id||!me)return;if(type==="impression"){if(trackedAds.has(id))return;trackedAds.add(id)}supabaseClient.from("ad_events").insert({ad_id:id,user_id:me.id,event_type:type}).then(function(r){if(r.error)console.info("Ad event:",r.error.message)})}

async function loadVideos(){
 var r=await supabaseClient.from("videos").select("*").order("created_at",{ascending:false}).limit(12);if(r.error){console.info("Videos unavailable:",r.error.message);return}
 var rows=(r.data||[]).filter(function(v){return v.video_url}),ids=[...new Set(rows.map(function(v){return v.user_id}).filter(Boolean))],pm={};
 if(ids.length){var p=await supabaseClient.from("profiles").select("id,full_name,username,avatar_url,verified,premium_plan").in("id",ids);(p.data||[]).forEach(function(x){pm[x.id]=x})}
 rows.forEach(function(v){v.profile=pm[v.user_id]||{id:v.user_id}});videoQueue=rows
}
function renderVideoCard(v){if(!v)return"";var u=v.profile||{};return '<article class="post vid-card"><div class="p-hdr"><img class="p-av" src="'+esc(u.avatar_url||DEFAULT_AVATAR)+'" onclick="openUserProfile(\''+esc(v.user_id)+'\')"><div class="p-info"><div class="p-nm" onclick="openUserProfile(\''+esc(v.user_id)+'\')">'+nameHTML(u)+'</div><div class="p-meta">'+timeAgo(v.created_at)+'</div></div><span class="tag"><i class="fas fa-video"></i> Video</span></div><video muted loop playsinline preload="metadata" src="'+esc(v.video_url)+'"'+(v.thumbnail_url?' poster="'+esc(v.thumbnail_url)+'"':"")+'></video>'+(v.caption?'<div class="vid-cap">'+esc(v.caption)+'</div>':"")+'<div class="vid-foot"><button class="cta" onclick="location.href=\'video.html\'">Watch more videos</button></div></article>'}

async function loadEvents(){
 var r=await supabaseClient.from("events").select("*").gte("starts_at",new Date().toISOString()).order("starts_at",{ascending:true}).limit(6);if(r.error){console.info("Events unavailable:",r.error.message);return}
 var rows=r.data||[];if(!rows.length)return;var ids=rows.map(function(x){return x.id}),rs=await supabaseClient.from("event_rsvps").select("event_id,user_id,status").in("event_id",ids);
 rows.forEach(function(e){eventMap[e.id]={data:e,going:0,interested:0,mine:null}});(rs.data||[]).forEach(function(x){var s=eventMap[x.event_id];if(!s)return;if(x.status==="going")s.going++;if(x.status==="interested")s.interested++;if(String(x.user_id)===String(me.id))s.mine=x.status});eventQueue=rows
}
function eventDate(d){var x=new Date(d);return isNaN(x)?"" : x.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})+" · "+x.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function renderEventCard(e){if(!e)return"";var s=eventMap[e.id]||{};return '<article class="post ev-card" id="ev-'+esc(e.id)+'">'+(e.banner_url?'<img class="ev-banner" src="'+esc(e.banner_url)+'">':"")+'<div class="ev-body"><span class="tag">Event</span><div class="ev-date">'+esc(eventDate(e.starts_at))+'</div><div class="ev-title">'+esc(e.title||"Event")+'</div>'+(e.location?'<div class="ev-loc"><i class="fas fa-location-dot"></i> '+esc(e.location)+'</div>':"")+'<div class="ev-count">'+fmt(s.going||0)+' going · '+fmt(s.interested||0)+' interested</div><div class="ev-btns"><button class="ev-btn '+(s.mine==="going"?"on":"")+'" onclick="rsvp(\''+esc(e.id)+'\',\'going\')">'+(s.mine==="going"?"Going":"Going")+'</button><button class="ev-btn '+(s.mine==="interested"?"on":"")+'" onclick="rsvp(\''+esc(e.id)+'\',\'interested\')">Interested</button></div></div></article>'}
async function rsvp(id,status){var s=eventMap[id];if(!s)return;var same=s.mine===status,r=same?await supabaseClient.from("event_rsvps").delete().eq("event_id",id).eq("user_id",me.id):await supabaseClient.from("event_rsvps").upsert({event_id:id,user_id:me.id,status:status},{onConflict:"event_id,user_id"});if(r.error){toast("Could not save response");return}if(s.mine==="going")s.going--;if(s.mine==="interested")s.interested--;if(same)s.mine=null;else{s.mine=status;if(status==="going")s.going++;else s.interested++}var e=$("ev-"+id);if(e)e.outerHTML=renderEventCard(s.data)}

var viewObs="IntersectionObserver"in window?new IntersectionObserver(function(es){es.forEach(function(x){var el=x.target;if(el.classList.contains("home-ad")&&x.isIntersecting&&x.intersectionRatio>=.5){trackAd(el.dataset.adId,"impression");viewObs.unobserve(el)}if(el.classList.contains("vid-card")){var v=el.querySelector("video");if(v){if(x.isIntersecting&&x.intersectionRatio>=.6)v.play().catch(function(){});else v.pause()}}})},{threshold:[0,.5,.6,1]}):null;
function observeNew(){if(!viewObs)return;document.querySelectorAll(".home-ad:not([data-observed]),.vid-card:not([data-observed])").forEach(function(e){e.dataset.observed="1";viewObs.observe(e)})}

function subscribe(){
 supabaseClient.channel("home-posts-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"posts"},function(p){var x=p.new;if(!x||String(x.User_id)===String(me.id)||!canSee(x))return;newCount++;$("newPill").textContent="↑ "+newCount+" new post"+(newCount>1?"s":"");$("newPill").style.display="block"}).on("postgres_changes",{event:"DELETE",schema:"public",table:"posts"},function(p){if(p.old?.id)removePostElement(String(p.old.id))}).subscribe();
 supabaseClient.channel("home-notifs-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"recipient_id=eq."+me.id},loadUnread).subscribe()
}
async function showRequestedPost(){var id=new URLSearchParams(location.search).get("post");if(!id)return;var el=$("post-"+id);if(!el){var r=await supabaseClient.from("posts").select("*").eq("id",id).maybeSingle();if(r.error||!r.data||!canSee(r.data)){toast("This post is not available");return}await enrich([r.data]);postsById[String(r.data.id)]=r.data;$("feed").insertAdjacentHTML("afterbegin",renderPost(r.data));el=$("post-"+id)}if(el)setTimeout(function(){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.boxShadow="0 0 0 2px var(--accent)";setTimeout(function(){el.style.boxShadow=""},1800)},300)}
window.addEventListener("error",function(e){console.error("StudentX Home error:",e.error||e.message)});window.addEventListener("unhandledrejection",function(e){console.error("StudentX Home promise:",e.reason)});
