<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>StudentX - Profile</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Poppins,sans-serif;
    background:#0a0a0f;
    color:#fff;
    padding-bottom:70px;
}


/* =========================
   HEADER
========================= */

.header{

    position:sticky;
    top:0;
    z-index:100;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(10,10,15,.96);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.header-title{

    font-size:24px;
    font-weight:800;
}

.menu-btn{

    width:42px;
    height:42px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.08);

    color:#aaa;

    font-size:18px;
}


/* =========================
   COVER
========================= */

.cover{

    width:100%;
    height:150px;

    background:
        linear-gradient(
            90deg,
            #008751 33.33%,
            #ffffff 33.33%,
            #ffffff 66.66%,
            #008751 66.66%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.cover span{

    color:#008751;

    font-size:30px;

    font-weight:800;

    letter-spacing:2px;
}


/* =========================
   PROFILE AREA
========================= */

.profile-info{

    padding:55px 20px 0;

    position:relative;
}


/* =========================
   AVATAR
========================= */

.avatar-box{

    position:absolute;

    top:-42px;
    left:20px;

    width:84px;
    height:84px;

    border-radius:50%;

    border:4px solid #0a0a0f;

    background:#181832;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;
}

.avatar-box img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.avatar-initials{

    color:#a855f7;

    font-size:28px;

    font-weight:800;
}


/* =========================
   PROFILE NAME
========================= */

.name-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

.profile-name{

    font-size:20px;

    font-weight:800;

    word-break:break-word;
}

.verified{

    color:#a855f7;

    font-size:14px;
}


/* =========================
   USERNAME
========================= */

.profile-username{

    margin-top:3px;

    color:rgba(255,255,255,.4);

    font-size:13px;
}


/* =========================
   BIO
========================= */

.profile-bio{

    margin-top:12px;

    color:rgba(255,255,255,.65);

    font-size:13px;

    line-height:1.6;
}


/* =========================
   STATS
========================= */

.stats{

    display:flex;

    margin-top:20px;

    padding:15px 0;

    border-top:
        1px solid rgba(255,255,255,.06);

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.stat{

    flex:1;

    text-align:center;
}

.stat:not(:last-child){

    border-right:
        1px solid rgba(255,255,255,.06);
}

.stat-number{

    font-size:17px;

    font-weight:800;
}

.stat-label{

    margin-top:2px;

    font-size:10px;

    color:rgba(255,255,255,.35);

    text-transform:uppercase;
}


/* =========================
   EDIT BUTTON
========================= */

.edit-btn{

    width:100%;

    margin-top:15px;

    padding:13px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7
        );

    color:#fff;

    font-family:Poppins,sans-serif;

    font-size:14px;

    font-weight:700;
}


/* =========================
   TABS
========================= */

.tabs{

    display:flex;

    margin-top:18px;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.tab{

    flex:1;

    padding:13px;

    text-align:center;

    color:rgba(255,255,255,.35);

    font-size:13px;

    font-weight:600;
}

.tab.active{

    color:#a855f7;

    border-bottom:
        2px solid #a855f7;
}


/* =========================
   POSTS
========================= */

.posts-container{

    padding:16px;
}

.loading{

    padding:40px 20px;

    text-align:center;

    color:rgba(255,255,255,.4);

    font-size:13px;
}

.empty-posts{

    padding:50px 20px;

    text-align:center;

    color:rgba(255,255,255,.3);
}

.empty-posts i{

    display:block;

    margin-bottom:10px;

    font-size:35px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

    position:fixed;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:100%;
    max-width:430px;

    height:62px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    background:rgba(10,10,15,.97);

    backdrop-filter:blur(18px);

    border-top:
        1px solid rgba(255,255,255,.06);

    z-index:200;
}

.nav-item{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:3px;

    color:rgba(255,255,255,.3);

    font-size:9px;

    font-weight:500;
}

.nav-item i{

    font-size:19px;
}

.nav-item.active{

    color:#a855f7;
}

</style>

</head>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://acragelglvdnqhvbjcgx.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_O2kgvCZ8CxPKghH7MJn7nw_R-l61YuH";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

</script>
<script>
/* ================================
   STUDENTX PROFILE
   REAL SUPABASE DATA
================================ */

let currentUser = null;
let currentProfile = null;
let currentPostId = null;


/* ================================
   GET LOGGED-IN USER
================================ */

async function getCurrentUser() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error) {
        console.error("Auth error:", error);
        return null;
    }

    if (!user) {
        window.location.href = "login.html";
        return null;
    }

    currentUser = user;

    return user;
}


/* ================================
   LOAD PROFILE
================================ */

async function loadMyProfile() {

    try {

        const user = await getCurrentUser();

        if (!user) return;


        const {
            data: profile,
            error
        } = await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .single();


        if (error) {

            console.error(
                "Profile error:",
                error
            );

            return;
        }


        if (!profile) {

            console.log(
                "Profile bai samu ba"
            );

            return;
        }


        currentProfile = profile;


        /* NAME */

        const nameElement =
            document.querySelector(".nm");

        if (nameElement) {

            nameElement.innerHTML = `
                ${escapeHTML(
                    profile.full_name ||
                    "StudentX User"
                )}

                <i class="fas fa-check-circle vd"></i>
            `;
        }


        /* USERNAME */

        const handleElement =
            document.querySelector(".handle");

        if (handleElement) {

            handleElement.textContent =
                "@" +
                (
                    profile.username ||
                    "username"
                );
        }


        /* AVATAR */

        const avatarContainer =
            document.getElementById(
                "avDisplay"
            );

        if (avatarContainer) {

            if (profile.avatar_url) {

                avatarContainer.innerHTML = `
                    <img
                        class="av"
                        src="${escapeAttribute(
                            profile.avatar_url
                        )}"
                        alt="Profile"
                    >
                `;

            } else {

                const initials =
                    getInitials(
                        profile.full_name
                    );

                avatarContainer.innerHTML = `
                    <div class="av">
                        ${initials}
                    </div>
                `;
            }
        }


        /* COURSE */

        const course =
            document.querySelector(
                ".course-label"
            );

        if (
            course &&
            profile.course
        ) {

            course.innerHTML = `
                <i class="fas fa-code"></i>
                ${escapeHTML(profile.course)}
            `;
        }


        /* BIO */

        const bio =
            document.querySelector(".bio");

        if (
            bio &&
            profile.bio
        ) {

            bio.textContent =
                profile.bio;
        }


        /* COVER PHOTO */

        const coverDisplay =
            document.getElementById(
                "coverDisplay"
            );

        if (
            coverDisplay &&
            profile.cover_url
        ) {

            coverDisplay.innerHTML = `
                <img
                    class="cover-img"
                    src="${escapeAttribute(
                        profile.cover_url
                    )}"
                    alt="Cover"
                >
            `;
        }


        console.log(
            "Real profile loaded:",
            profile
        );


        /* LOAD REAL STATS */

        await loadProfileStats(
            user.id
        );


        /* LOAD REAL POSTS */

        await loadMyPosts(
            user.id
        );


    } catch (error) {

        console.error(
            "Profile loading error:",
            error
        );
    }
}


/* ================================
   PROFILE STATS
================================ */

async function loadProfileStats(
    userId
) {

    try {

        /* POSTS */

        const {
            count: postsCount,
            error: postsError
        } = await supabaseClient
            .from("posts")
            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )
            .eq(
                "user_id",
                userId
            );


        if (postsError) {

            console.log(
                "Posts count:",
                postsError.message
            );
        }


        /* FOLLOWERS */

        const {
            count: followersCount,
            error: followersError
        } = await supabaseClient
            .from("followers")
            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )
            .eq(
                "following_id",
                userId
            );


        if (followersError) {

            console.log(
                "Followers count:",
                followersError.message
            );
        }


        /* FOLLOWING */

        const {
            count: followingCount,
            error: followingError
        } = await supabaseClient
            .from("followers")
            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )
            .eq(
                "follower_id",
                userId
            );


        if (followingError) {

            console.log(
                "Following count:",
                followingError.message
            );
        }


        const stats =
            document.querySelectorAll(
                ".stat-num"
            );


        if (stats[0]) {

            stats[0].textContent =
                postsCount || 0;
        }


        if (stats[1]) {

            stats[1].textContent =
                formatNumber(
                    followersCount || 0
                );
        }


        if (stats[2]) {

            stats[2].textContent =
                formatNumber(
                    followingCount || 0
                );
        }

    } catch (error) {

        console.error(
            "Stats error:",
            error
        );
    }
}


/* ================================
   LOAD REAL POSTS
================================ */

async function loadMyPosts(
    userId
) {

    const postsView =
        document.getElementById(
            "postsView"
        );

    if (!postsView) return;


    postsView.innerHTML = `
        <div class="loading">
            Loading posts...
        </div>
    `;


    try {

        const {
            data: posts,
            error
        } = await supabaseClient
            .from("posts")
            .select("*")
            .eq(
                "user_id",
                userId
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Posts error:",
                error
            );

            postsView.innerHTML = `
                <div class="loading">
                    Unable to load posts.
                </div>
            `;

            return;
        }


        if (!posts || posts.length === 0) {

            postsView.innerHTML = `
                <div class="saved-empty">
                    <i class="far fa-file-alt"></i>
                    <p>No posts yet</p>
                </div>
            `;

            return;
        }


        renderRealPosts(
            posts
        );


    } catch (error) {

        console.error(
            "Load posts error:",
            error
        );

        postsView.innerHTML = `
            <div class="loading">
                Something went wrong.
            </div>
        `;
    }
}


/* ================================
   RENDER REAL POSTS
================================ */

function renderRealPosts(
    posts
) {

    const postsView =
        document.getElementById(
            "postsView"
        );

    if (!postsView) return;


    postsView.innerHTML =
        posts.map(
            function(post) {

                return `
                    <div
                        class="post"
                        data-post-id="${escapeAttribute(
                            post.id
                        )}"
                    >

                        <div class="p-hdr">

                            ${
                                getPostAvatar()
                            }

                            <div class="p-inf">

                                <div class="p-nm">

                                    ${escapeHTML(
                                        currentProfile?.full_name ||
                                        "StudentX User"
                                    )}

                                    <i
                                        class="fas fa-check-circle vd"
                                    ></i>

                                </div>

                                <div class="p-meta">

                                    @${escapeHTML(
                                        currentProfile?.username ||
                                        "username"
                                    )}

                                    ·

                                    ${formatPostTime(
                                        post.created_at
                                    )}

                                </div>

                            </div>

                            <div
                                class="p-more"
                                onclick="openPostMenu('${escapeAttribute(
                                    post.id
                                )}')"
                            >
                                <i class="fas fa-ellipsis-h"></i>
                            </div>

                        </div>


                        <div class="p-body">

                            ${escapeHTML(
                                post.content ||
                                post.text ||
                                ""
                            )}

                        </div>


                        ${
                            post.image_url
                            ?
                            `
                            <img
                                src="${escapeAttribute(
                                    post.image_url
                                )}"
                                style="
                                    width:100%;
                                    max-height:400px;
                                    object-fit:cover;
                                    display:block;
                                "
                                alt="Post image"
                            >
                            `
                            :
                            ""
                        }


                        <div class="p-acts">

                            <div
                                class="p-a"
                                onclick="likePost('${escapeAttribute(
                                    post.id
                                )}')"
                            >
                                <i class="far fa-heart"></i>

                                <span>
                                    ${post.likes_count || 0}
                                </span>
                            </div>


                            <div
                                class="p-a"
                                onclick="openComments('${escapeAttribute(
                                    post.id
                                )}')"
                            >
                                <i class="far fa-comment"></i>

                                <span>
                                    ${post.comments_count || 0}
                                </span>
                            </div>


                            <div
                                class="p-a"
                                onclick="sharePost('${escapeAttribute(
                                    post.id
                                )}')"
                            >
                                <i class="fas fa-retweet"></i>

                                <span>
                                    ${post.shares_count || 0}
                                </span>
                            </div>


                            <div class="p-a p-a-r">

                                <i class="fas fa-chart-bar"></i>

                                <span>
                                    ${formatNumber(
                                        post.views_count || 0
                                    )}
                                </span>

                            </div>

                        </div>

                    </div>
                `;
            }
        )
        .join("");
}


/* ================================
   POST AVATAR
================================ */

function getPostAvatar() {

    if (
        currentProfile &&
        currentProfile.avatar_url
    ) {

        return `
            <img
                class="p-av"
                src="${escapeAttribute(
                    currentProfile.avatar_url
                )}"
                alt="Avatar"
            >
        `;

    }


    return `
        <div class="p-av">
            ${getInitials(
                currentProfile?.full_name
            )}
        </div>
    `;
}


/* ================================
   LIKE POST
================================ */

async function likePost(
    postId
) {

    if (!currentUser) return;


    try {

        const {
            data: existing,
            error: checkError
        } = await supabaseClient
            .from("post_likes")
            .select("id")
            .eq(
                "post_id",
                postId
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


        if (checkError) {

            console.error(
                checkError
            );

            return;
        }


        if (existing) {

            await supabaseClient
                .from("post_likes")
                .delete()
                .eq(
                    "id",
                    existing.id
                );

        } else {

            await supabaseClient
                .from("post_likes")
                .insert({

                    post_id: postId,

                    user_id:
                        currentUser.id

                });
        }


        await loadMyPosts(
            currentUser.id
        );

    } catch (error) {

        console.error(
            "Like error:",
            error
        );
    }
}

/* ================================
   PROFILE PICTURE
================================ */

function changePic() {

    const input =
        document.getElementById(
            "picInput"
        );

    if (input) {

        input.click();
    }
}


async function handlePic(
    input
) {

    const file =
        input.files[0];

    if (!file || !currentUser)
        return;


    try {

        showMsg(
            "Uploading picture..."
        );


        const extension =
            file.name
                .split(".")
                .pop();


        const filePath =
            currentUser.id +
            "/avatar." +
            extension;


        const {
            error: uploadError
        } = await supabaseClient
            .storage
            .from("avatars")
            .upload(
                filePath,
                file,
                {
                    upsert: true
                }
            );


        if (uploadError) {

            throw uploadError;
        }


        const {
            data: publicData
        } =
            supabaseClient
                .storage
                .from("avatars")
                .getPublicUrl(
                    filePath
                );


        const avatarUrl =
            publicData.publicUrl;


        const {
            error: updateError
        } = await supabaseClient
            .from("profiles")
            .update({

                avatar_url:
                    avatarUrl

            })
            .eq(
                "id",
                currentUser.id
            );


        if (updateError) {

            throw updateError;
        }


        currentProfile.avatar_url =
            avatarUrl;


        document.getElementById(
            "avDisplay"
        ).innerHTML = `
            <img
                class="av"
                src="${escapeAttribute(
                    avatarUrl
                )}"
                alt="Profile"
            >
        `;


        await loadMyPosts(
            currentUser.id
        );


        showMsg(
            "Profile picture updated!"
        );


    } catch (error) {

        console.error(
            "Avatar upload error:",
            error
        );

        showMsg(
            "Unable to update picture"
        );
    }


    input.value = "";
}

function switchTab(

    element
) {

    document
        .querySelectorAll(".tab")
        .forEach(
            function(item) {

                item.classList.remove(
                    "on"
                );

            }
        );

    element.classList.add(
        "on"
    );

    const posts =
        document.getElementById(
            "postsView"
        );

    const saved =
        document.getElementById(
            "savedView"
        );

    if (tab === "posts") {

        posts.style.display =
            "block";

        saved.style.display =
            "none";

    } else {

        posts.style.display =
            "none";

        saved.style.display =
            "block";
    }
}


/* ================================
   HELPERS
================================ */

function getInitials(name) {

    if (!name) return "U";

    return name
        .trim()
        .split(/\s+/)
        .map(function(word) {
            return word[0];
        })
        .join("")
        .substring(0, 2)
        .toUpperCase();
}


function formatNumber(number) {

    number =
        Number(number) || 0;

    if (number >= 1000000) {

        return (
            number / 1000000
        ).toFixed(1) + "M";
    }

    if (number >= 1000) {

        return (
            number / 1000
        ).toFixed(1) + "K";
    }

    return number.toString();
}


function formatPostTime(date) {

    if (!date) return "";

    const time =
        new Date(date).getTime();

    const seconds =
        Math.floor(
            (Date.now() - time) / 1000
        );

    if (seconds < 60)
        return "Just now";

    if (seconds < 3600)
        return Math.floor(
            seconds / 60
        ) + "m ago";

    if (seconds < 86400)
        return Math.floor(
            seconds / 3600
        ) + "h ago";

    return Math.floor(
        seconds / 86400
    ) + "d ago";
}


function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHTML(value);
}


function showMsg(message) {

    const toast =
        document.createElement(
            "div"
        );

    toast.className =
        "toast";

    toast.textContent =
        message;

    document.body.appendChild(
        toast
    );

    setTimeout(
        function() {
            toast.remove();
        },
        2500
    );
}
