<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>StudentX - Profile</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Poppins,sans-serif;
    background:#0a0a0f;
    color:#fff;
    padding-bottom:70px;
}


/* =========================
   HEADER
========================= */

.header{

    position:sticky;
    top:0;
    z-index:100;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(10,10,15,.96);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.header-title{

    font-size:24px;
    font-weight:800;
}

.menu-btn{

    width:42px;
    height:42px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.08);

    color:#aaa;

    font-size:18px;
}


/* =========================
   COVER
========================= */

.cover{

    width:100%;
    height:150px;

    background:
        linear-gradient(
            90deg,
            #008751 33.33%,
            #ffffff 33.33%,
            #ffffff 66.66%,
            #008751 66.66%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.cover span{

    color:#008751;

    font-size:30px;

    font-weight:800;

    letter-spacing:2px;
}


/* =========================
   PROFILE AREA
========================= */

.profile-info{

    padding:55px 20px 0;

    position:relative;
}


/* =========================
   AVATAR
========================= */

.avatar-box{

    position:absolute;

    top:-42px;
    left:20px;

    width:84px;
    height:84px;

    border-radius:50%;

    border:4px solid #0a0a0f;

    background:#181832;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;
}

.avatar-box img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.avatar-initials{

    color:#a855f7;

    font-size:28px;

    font-weight:800;
}


/* =========================
   PROFILE NAME
========================= */

.name-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

.profile-name{

    font-size:20px;

    font-weight:800;

    word-break:break-word;
}

.verified{

    color:#a855f7;

    font-size:14px;
}


/* =========================
   USERNAME
========================= */

.profile-username{

    margin-top:3px;

    color:rgba(255,255,255,.4);

    font-size:13px;
}


/* =========================
   BIO
========================= */

.profile-bio{

    margin-top:12px;

    color:rgba(255,255,255,.65);

    font-size:13px;

    line-height:1.6;
}


/* =========================
   STATS
========================= */

.stats{

    display:flex;

    margin-top:20px;

    padding:15px 0;

    border-top:
        1px solid rgba(255,255,255,.06);

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.stat{

    flex:1;

    text-align:center;
}

.stat:not(:last-child){

    border-right:
        1px solid rgba(255,255,255,.06);
}

.stat-number{

    font-size:17px;

    font-weight:800;
}

.stat-label{

    margin-top:2px;

    font-size:10px;

    color:rgba(255,255,255,.35);

    text-transform:uppercase;
}


/* =========================
   EDIT BUTTON
========================= */

.edit-btn{

    width:100%;

    margin-top:15px;

    padding:13px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7
        );

    color:#fff;

    font-family:Poppins,sans-serif;

    font-size:14px;

    font-weight:700;
}


/* =========================
   TABS
========================= */

.tabs{

    display:flex;

    margin-top:18px;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.tab{

    flex:1;

    padding:13px;

    text-align:center;

    color:rgba(255,255,255,.35);

    font-size:13px;

    font-weight:600;
}

.tab.active{

    color:#a855f7;

    border-bottom:
        2px solid #a855f7;
}


/* =========================
   POSTS
========================= */

.posts-container{

    padding:16px;
}

.loading{

    padding:40px 20px;

    text-align:center;

    color:rgba(255,255,255,.4);

    font-size:13px;
}

.empty-posts{

    padding:50px 20px;

    text-align:center;

    color:rgba(255,255,255,.3);
}

.empty-posts i{

    display:block;

    margin-bottom:10px;

    font-size:35px;
}


/* =========================
   BOTTOM NAVIGATION
========================= */

.bnav{

    position:fixed;

    bottom:0;
    left:0;

    width:100%;

    height:64px;

    display:flex;

    align-items:center;
    justify-content:space-around;

    background:rgba(10,10,15,.97);

    backdrop-filter:blur(18px);

    border-top:
        1px solid rgba(255,255,255,.06);

    z-index:200;
}

.nb{

    min-width:55px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    color:rgba(255,255,255,.35);

    font-size:9px;

    font-weight:500;
}

.nb i{

    font-size:19px;
}

.nb.on{

    color:#a855f7;
}


/* =========================
   POST UI
========================= */

.post{

    margin-bottom:16px;

    padding:14px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:16px;

    overflow:hidden;
}

.p-hdr{

    display:flex;

    align-items:center;

    gap:10px;
}

.p-av{

    width:42px;
    height:42px;

    flex:none;

    border-radius:50%;

    background:#181832;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    color:#a855f7;

    font-size:13px;

    font-weight:800;
}

.p-av img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.p-inf{

    min-width:0;
}

.p-nm{

    font-size:13px;

    font-weight:700;
}

.p-meta{

    margin-top:2px;

    color:rgba(255,255,255,.35);

    font-size:10px;
}

.p-body{

    margin-top:12px;

    color:rgba(255,255,255,.8);

    font-size:13px;

    line-height:1.6;

    white-space:pre-wrap;

    word-break:break-word;
}

.p-acts{

    display:flex;

    align-items:center;

    margin-top:12px;

    padding-top:10px;

    border-top:
        1px solid rgba(255,255,255,.05);
}

.p-a{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:rgba(255,255,255,.4);

    font-size:11px;
}

.p-a i{

    font-size:15px;
}

.profile-loading{

    padding:40px 20px;

    color:rgba(255,255,255,.4);

    font-size:13px;
}


/* =========================
   IMAGE VIEW
========================= */

.view-ov{

    position:fixed;

    inset:0;

    z-index:500;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.95);

    padding:20px;
}

.view-ov.show{

    display:flex;
}

.view-ov img{

    max-width:100%;
    max-height:90vh;

    object-fit:contain;

    border-radius:10px;

.view-close{

    position:absolute;

    top:20px;
    right:20px;

    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.1);

    color:#fff;

    z-index:2;
}


/* =========================

========================= */

@media(min-width:600px){

    body{

            1px solid rgba(255,255,255,.05);
    }

    .bnav{

        max-width:430px;

        left:50%;

        transform:
            translateX(-50%);
    }

}

</style>

<script>

const SUPABASE_URL =
    "https://acragelglvdnqhvbjcgx.supabase.co";

const SUPABASE_ANON_KEY =

<script>

/* =========================================================
   STUDENTX PROFILE — PART 3
   LOAD CURRENT USER PROFILE
========================================================= */

let currentUser = null;
let currentProfile = null;


/* =========================================================
   GET CURRENT USER
========================================================= */

async function getCurrentUser() {

    try {

        const {
            data: {
                user
            },
            error
        } = await supabaseClient.auth.getUser();

        if (error) {
            console.error("Auth error:", error);
            return null;
        }

        if (!user) {
            console.log("No logged-in user");
            return null;
        }

        currentUser = user;

        return user;

    } catch (error) {

        console.error(
            "Failed to get current user:",
            error
        );

        return null;
    }
}


/* =========================================================
   LOAD PROFILE FROM SUPABASE
========================================================= */

async function loadProfile() {

    try {

        const user = await getCurrentUser();

        if (!user) {

            setProfileLoadingState(
                "Please login first"
            );

            return;
        }


        /* -----------------------------------------
           GET PROFILE
        ----------------------------------------- */

        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select(`
                id,
                username,
                avatar_url,
                full_name,
                bio,
                university,
                department,
                verified,
                created_at,
                email,
                account_type,
                country,
                state,
                city,
                profile_visibility,
                premium_plan,
                cover_url,
                faculty,
                level,
                graduation_year
            `)
            .eq("id", user.id)
            .maybeSingle();


        /* -----------------------------------------
           ERROR
        ----------------------------------------- */

        if (error) {

            console.error(
                "Profile loading error:",
                error
            );

            setProfileLoadingState(
                "Unable to load profile"
            );

            return;
        }


        /* -----------------------------------------
           PROFILE NOT FOUND
        ----------------------------------------- */

        if (!data) {

            console.log(
                "Profile does not exist for this user."
            );

            setProfileLoadingState(
                "Profile not found"
            );

            return;
        }


        /* -----------------------------------------
           SAVE PROFILE
        ----------------------------------------- */

        currentProfile = data;


        /* -----------------------------------------
           UPDATE PROFILE UI
        ----------------------------------------- */

        updateProfileUI(data);


        console.log(
            "StudentX profile loaded:",
            data
        );

    } catch (error) {

        console.error(
            "Unexpected profile error:",
            error
        );

        setProfileLoadingState(
            "Something went wrong"
        );
    }
}


/* =========================================================
   UPDATE PROFILE UI
========================================================= */

function updateProfileUI(profile) {


    /* -----------------------------------------
       FULL NAME
    ----------------------------------------- */

    const nameElement =
        document.getElementById("profileName");

    if (nameElement) {

        nameElement.textContent =
            profile.full_name ||
            "StudentX User";
    }


    /* -----------------------------------------
       USERNAME
    ----------------------------------------- */

    const usernameElement =
        document.getElementById("profileUsername");

    if (usernameElement) {

        if (profile.username) {

            usernameElement.textContent =
                "@" + profile.username;

        } else {

            usernameElement.textContent =
                "@username";
        }
    }


    /* -----------------------------------------
       BIO
    ----------------------------------------- */

    const bioElement =
        document.getElementById("profileBio");

    if (bioElement) {

        bioElement.textContent =
            profile.bio ||
            "No bio yet.";
    }


    /* -----------------------------------------
       AVATAR
    ----------------------------------------- */

    updateAvatar(profile);


    /* -----------------------------------------
       COVER
    ----------------------------------------- */

    updateCover(profile);


    /* -----------------------------------------
       VERIFIED
    ----------------------------------------- */

    updateVerifiedBadge(profile);
}


/* =========================================================
   UPDATE AVATAR
========================================================= */

function updateAvatar(profile) {

    const avatarBox =
        document.getElementById("avatarBox");

    const initials =
        document.getElementById("avatarInitials");

    if (!avatarBox) {
        return;
    }


    /* -----------------------------------------
       IF AVATAR EXISTS
    ----------------------------------------- */

    if (profile.avatar_url) {

        avatarBox.style.backgroundImage =
            `url("${profile.avatar_url}")`;

        avatarBox.style.backgroundSize =
            "cover";

        avatarBox.style.backgroundPosition =
            "center";

        avatarBox.style.backgroundRepeat =
            "no-repeat";


        if (initials) {
            initials.style.display =
                "none";
        }

    } else {

        /* -------------------------------------
           NO AVATAR → INITIALS
        ------------------------------------- */

        avatarBox.style.backgroundImage =
            "none";

        if (initials) {

            initials.style.display =
                "flex";

            initials.textContent =
                getInitials(
                    profile.full_name
                );
        }
    }
}


/* =========================================================
   GET USER INITIALS
========================================================= */

function getInitials(name) {

    if (!name) {
        return "--";
    }

    const words =
        name
            .trim()
            .split(/\s+/)
            .filter(Boolean);

    if (words.length === 1) {

        return words[0]
            .substring(0, 2)
            .toUpperCase();
    }

    return (
        words[0].charAt(0) +
        words[words.length - 1].charAt(0)
    ).toUpperCase();
}


/* =========================================================
   UPDATE COVER
========================================================= */

function updateCover(profile) {

    const cover =
        document.getElementById("coverDisplay");

    const coverText =
        document.getElementById("coverText");

    if (!cover) {
        return;
    }


    if (profile.cover_url) {

        cover.style.backgroundImage =
            `url("${profile.cover_url}")`;

        cover.style.backgroundSize =
            "cover";

        cover.style.backgroundPosition =
            "center";

        cover.style.backgroundRepeat =
            "no-repeat";


        if (coverText) {
            coverText.style.display =
                "none";
        }

    } else {

        cover.style.backgroundImage =
            "none";

        if (coverText) {

            coverText.style.display =
                "block";

            coverText.textContent =
                profile.country ||
                "Nigeria";
        }
    }
}


/* =========================================================
   VERIFIED BADGE
========================================================= */

function updateVerifiedBadge(profile) {

    const nameRow =
        document.querySelector(".name-row");

    if (!nameRow) {
        return;
    }


    /* Remove old badge */

    const oldBadge =
        nameRow.querySelector(
            ".verified-badge"
        );

    if (oldBadge) {
        oldBadge.remove();
    }


    /* Add badge if verified */

    if (
        profile.verified === true
    ) {

        const badge =
            document.createElement("span");

        badge.className =
            "verified-badge";

        badge.innerHTML =
            '<i class="fas fa-check"></i>';

        nameRow.appendChild(badge);
    }
}


/* =========================================================
   LOADING / ERROR STATE
========================================================= */

function setProfileLoadingState(message) {

    const name =
        document.getElementById(
            "profileName"
        );

    const username =
        document.getElementById(
            "profileUsername"
        );

    const bio =
        document.getElementById(
            "profileBio"
        );


    if (name) {
        name.textContent = message;
    }

    if (username) {
        username.textContent = "";
    }

    if (bio) {
        bio.textContent = "";
    }
}


/* =========================================================
   START PROFILE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProfile();

    }
);

</script>

<script>

/* =========================================================
   PART 4 CONFIGURATION
========================================================= */

const PROFILE_TABLE = "profiles";
const POSTS_TABLE = "posts";
const FOLLOWERS_TABLE = "followers";
const LIKES_TABLE = "likes";


/* =========================================================
   LOAD PROFILE STATISTICS
========================================================= */

async function loadProfileStats() {

    if (!currentUser) {
        return;
    }

    const userId = currentUser.id;


    /* =====================================================
       POSTS COUNT
    ===================================================== */

    try {

        const {
            count,
            error
        } = await supabaseClient
            .from(POSTS_TABLE)
            .select("id", {
                count: "exact",
                head: true
            })
            .eq("user_id", userId);


        if (!error) {

            const postsCount =
                document.getElementById(
                    "postsCount"
                );

            if (postsCount) {

                postsCount.textContent =
                    formatNumber(count || 0);
            }
        }

    } catch (error) {

        console.error(
            "Posts count error:",
            error
        );
    }


    /* =====================================================
       FOLLOWERS COUNT
    ===================================================== */

    try {

        const {
            count,
            error
        } = await supabaseClient

/* =========================================================
   CREATE POST ELEMENT
========================================================= */

function createProfilePost(post) {

    const postElement =
        document.createElement("article");

    postElement.className =
        "profile-post";


    /* -----------------------------------------------------
       FIND POSSIBLE CONTENT COLUMNS
    ----------------------------------------------------- */

    const text =
        post.content ||
        post.text ||
        post.caption ||
        "";

    const image =
        post.image_url ||
        post.media_url ||
        post.photo_url ||
        "";


    /* -----------------------------------------------------
       POST HTML
    ----------------------------------------------------- */

    let html = "";


    if (text) {

        html += `
            <div class="profile-post-text">
                ${escapeHTML(text)}
            </div>
        `;
    }


    if (image) {

        html += `
            <img
                class="profile-post-image"
                src="${escapeAttribute(image)}"
                alt="Post"
                loading="lazy"
                onclick="openPostImage(this.src)"
            >
        `;
    }


    html += `

        <div class="profile-post-footer">

            <span>
                ${formatPostDate(
                    post.created_at
                )}
            </span>

        </div>

    `;


    postElement.innerHTML = html;

    return postElement;
}

/* =========================================================
   NUMBER FORMATTER
========================================================= */

function formatNumber(number) {

    number =
        Number(number) || 0;

    if (number >= 1000000000) {

        return (
            (number / 1000000000)
                .toFixed(1)
                .replace(".0", "")
            + "B"
        );
    }


    if (number >= 1000000) {

        return (
            (number / 1000000)
                .toFixed(1)
                .replace(".0", "")
            + "M"
        );
    }


    if (number >= 1000) {

        return (
            (number / 1000)
                .toFixed(1)
                .replace(".0", "")
            + "K"
        );
    }


    return number.toString();
}


/* =========================================================
   DATE FORMATTER
========================================================= */

function formatPostDate(date) {

    if (!date) {
        return "";
    }

    const d =
        new Date(date);

    if (isNaN(d.getTime())) {
        return "";
    }


    return d.toLocaleDateString(
        "en-NG",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );
}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   ATTRIBUTE SECURITY
========================================================= */

function escapeAttribute(value) {

    return String(value)
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );
}

    }

    )) {

        alert(
            "Please select an image."
        );

        );

        return false;
    }

        )
        ?.addEventListener(
            "click",
            function() {

                menu.remove();

                const input =
                    document.getElementById(
                        "coverInput"
                    );

                if (input) {
                    input.click();
                }

            }
        );


    /* =====================================================
       LOGOUT
    ===================================================== */

    document
        .getElementById(
            "menuLogout"
        )
        ?.addEventListener(
            "click",
            async function() {

                menu.remove();

                await logoutUser();

            }
        );
}


/* =========================================================
   LOGOUT USER
========================================================= */

async function logoutUser() {

    try {

        const {
            error
        } = await supabaseClient
            .auth
            .signOut();


        if (error) {

            console.error(
                "Logout error:",
                error
            );

            alert(
                error.message ||
                "Unable to logout."
            );

            return;
        }


        currentUser = null;

        currentProfile = null;


        window.location.href =
            "login.html";


    } catch (error) {

        console.error(
            "Logout error:",
            error
        );

        alert(
            "Unable to logout."
        );
    }
}


/* =========================================================
   CLOSE PROFILE MENU WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "profileMenu"
            );

        if (!menu) {
            return;
        }

        const button =
            document.getElementById(
                "profileMenuBtn"
            );

        if (
            !menu.contains(
                event.target
            ) &&
            !button?.contains(
                event.target
            )
        ) {

            menu.remove();
        }
    }
);
