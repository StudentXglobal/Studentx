<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Profile - StudentX</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: Arial, Helvetica, sans-serif; }
html, body { background: #070914; color: #fff; min-height: 100vh; }
.app { max-width: 700px; margin: auto; background: #090c19; min-height: 100vh; position: relative; padding-bottom: 60px; }

/* --- HEADER --- */
.header { height: 50px; display: flex; align-items: center; padding: 0 16px; position: sticky; top: 0; background: #090c19; z-index: 20; border-bottom: 1px solid #202438; }
.back-btn { width: 36px; height: 36px; border: 0; background: none; color: #fff; font-size: 18px; cursor: pointer; }
.header-title { font-size: 18px; font-weight: 700; margin-left: 10px; }

/* --- PROFILE BOX --- */
.profile-box { padding: 20px; border-bottom: 1px solid #202438; }
.top-section { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
.profile-info h2 { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
.profile-info p { color: #9298ad; font-size: 14px; margin-bottom: 3px; }
.profile-info .bio { color: #e9ebf5; font-size: 14px; margin-top: 10px; line-height: 1.4; }
.edit-btn { background: none; border: 1px solid #7357ff; color: #7357ff; padding: 8px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px; }

.profile-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #7357ff; background: #161a2b; margin-bottom: 15px; }

.stats-row { display: flex; gap: 20px; margin-top: 15px; }
.stat-box { text-align: center; cursor: pointer; }
.stat-box h4 { font-size: 18px; font-weight: 700; }
.stat-box p { font-size: 12px; color: #9298ad; }

/* --- TABS --- */
.tabs { display: flex; border-bottom: 1px solid #202438; position: sticky; top: 50px; background: #090c19; z-index: 10; }
.tab { flex: 1; text-align: center; padding: 15px 0; color: #9298ad; font-weight: 600; font-size: 14px; cursor: pointer; position: relative; }
.tab.active { color: #fff; }
.tab.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 50px; height: 3px; background: #7357ff; border-radius: 2px; }

/* --- POSTS AREA --- */
.posts-area { padding-bottom: 20px; }
.loading { text-align: center; padding: 40px; color: #858ba1; font-size: 14px; }

.post-card { border-bottom: 1px solid #171b2b; padding: 15px; }
.post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #161a2b; }
.post-user h4 { font-size: 15px; font-weight: 700; }
.post-user p { font-size: 12px; color: #8c92a8; }
.post-content { font-size: 14px; line-height: 1.5; color: #e9ebf5; margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
.post-media { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; background: #161a2b; }

.post-actions { display: flex; justify-content: space-between; max-width: 100%; }
.action-group { display: flex; align-items: center; gap: 6px; color: #858ba1; font-size: 13px; cursor: pointer; padding: 5px 0; }
.action-group i { font-size: 16px; }
.action-group.liked i { color: #ff5c73; }
.action-group.saved i { color: #fbbf24; }

/* --- NAV BAR (Ainihin HTML dinka) --- */
.bnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 700px; height: 55px; display: flex; justify-content: space-around; align-items: center; background-color: #0b0f1e; border-top: 1px solid #24283a; z-index: 2000; }
.nb { display: flex; flex-direction: column; align-items: center; color: #858ba1; cursor: pointer; gap: 2px; text-decoration: none; }
.nb.on { color: #7357ff; }
.nb i { font-size: 18px; }
.nb span { font-size: 10px; font-weight: 500; }
</style>
</head>
<body>

<div class="app">
    <!-- HEADER -->
    <div class="header">
        <button class="back-btn" onclick="window.location.href='home.html'"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="header-title">Profile</div>
    </div>

    <!-- PROFILE BOX -->
    <div class="profile-box" id="profileBox">
        <div class="loading">Loading profile...</div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('posts')">Posts</div>
        <div class="tab" onclick="switchTab('video')">Video</div>
        <div class="tab" onclick="switchTab('saved')">Saved</div>
    </div>

    <!-- POSTS AREA -->
    <div class="posts-area" id="postsArea">
        <div class="loading">Loading posts...</div>
    </div>
</div>

<!-- NAVIGATION BAR (Ainihin HTML dinka) -->
<nav class="bnav">
    <a href="home.html" class="nb"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="video.html" class="nb"><i class="fas fa-video"></i><span>Video</span></a>
    <a href="chat.html" class="nb"><i class="fas fa-comment-dots"></i><span>Chat</span></a>
    <a href="studyhub.html" class="nb"><i class="fas fa-book-open"></i><span>StudyHub</span></a>
    <a href="profile.html" class="nb on"><i class="fas fa-user"></i><span>Profile</span></a>
</nav>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
let currentUser = null;
let currentProfileId = null;
let activeTab = 'posts';

function defaultAvatar() {
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="#171c2d"/><circle cx="50" cy="38" r="18" fill="#777f98"/><path d="M20 88 C24 65 38 57 50 57 C62 57 76 65 80 88" fill="#777f98"/></svg>`);
}

function escapeHTML(value) {
    if (value === null || value === undefined) return "";
    return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// 1. LOAD PROFILE
async function loadProfile() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    
    // Get profile ID from URL or default to current user
    const params = new URLSearchParams(window.location.search);
    currentProfileId = params.get("id") || user.id;

    // Fetch Profile
    const { data: profile } = await supabaseClient
        .from("profiles")
        .select("full_name, username, avatar_url, bio, role, school")
        .eq("id", currentProfileId)
        .single();

    // Fetch Stats
    const [postsRes, followersRes, followingRes, likesRes] = await Promise.all([
        supabaseClient.from("posts").select("id", { count: 'exact', head: true }).eq("user_id", currentProfileId),
        supabaseClient.from("follows").select("follower_id", { count: 'exact', head: true }).eq("following_id", currentProfileId),
        supabaseClient.from("follows").select("following_id", { count: 'exact', head: true }).eq("follower_id", currentProfileId),
        // Fetch likes count for all posts by this user
        supabaseClient.from("post_likes").select("id", { count: 'exact', head: true }).eq("post_author_id", currentProfileId)
    ]);

    const avatar = profile?.avatar_url || defaultAvatar();
    const name = profile?.full_name || "StudentX User";
    const username = profile?.username ? "@" + profile.username : "@studentx";
    const bio = profile?.bio || "No bio yet";
    const role = profile?.role || "Student";
    const school = profile?.school || "";

    document.getElementById("profileBox").innerHTML = `
        <div class="top-section">
            <div class="profile-info">
                <h2>${escapeHTML(name)}</h2>
                <p style="color: #7357ff; font-weight: 600;">${escapeHTML(username)}</p>
                <p>${escapeHTML(role)} ${school ? " | " + escapeHTML(school) : ""}</p>
                <p class="bio">${escapeHTML(bio)}</p>
            </div>
            <img class="profile-avatar" src="${avatar}" onerror="this.src='${defaultAvatar()}'" alt="Profile">
        </div>
        ${currentProfileId === currentUser.id ? `<button class="edit-btn" onclick="window.location.href='edit-profile.html'">Edit Profile</button>` : `<button class="edit-btn">Follow</button>`}
        
        <div class="stats-row">
            <div class="stat-box"><h4>${postsRes.count || 0}</h4><p>Posts</p></div>
            <div class="stat-box"><h4>${followersRes.count || 0}</h4><p>Followers</p></div>
            <div class="stat-box"><h4>${followingRes.count || 0}</h4><p>Following</p></div>
            <div class="stat-box"><h4>${likesRes.count || 0}</h4><p>Likes</p></div>
        </div>
    `;

    loadPosts();
}

// 2. LOAD POSTS / VIDEOS / SAVED
async function loadPosts() {
    document.getElementById("postsArea").innerHTML = `<div class="loading">Loading ${activeTab}...</div>`;
    
    let query = supabaseClient.from("posts").select(`
        id, content, image_url, video_url, created_at, user_id,
        profiles:user_id (full_name, username, avatar_url)
    `);

    if (activeTab === 'posts') {
        query = query.eq("user_id", currentProfileId).order("created_at", { ascending: false });
    } else if (activeTab === 'video') {
        query = query.eq("user_id", currentProfileId).not("video_url", "is", null).order("created_at", { ascending: false });
    } else if (activeTab === 'saved') {
        // Fetch saved posts
        const { data: saved } = await supabaseClient.from("saved_posts").select("post_id").eq("user_id", currentUser.id);
        const savedIds = saved ? saved.map(s => s.post_id) : [];
        if (savedIds.length === 0) {
            document.getElementById("postsArea").innerHTML = `<div class="loading">No saved posts yet.</div>`;
            return;
        }
        query = query.in("id", savedIds).order("created_at", { ascending: false });
    }

    const { data: posts, error } = await query;
    if (error) {
        document.getElementById("postsArea").innerHTML = `<div class="loading">Error loading posts.</div>`;
        return;
    }

    if (!posts || posts.length === 0) {
        document.getElementById("postsArea").innerHTML = `<div class="loading">No ${activeTab} found.</div>`;
        return;
    }

    // Fetch interactions for all posts
    const postIds = posts.map(p => p.id);
    const [likesRes, commentsRes, savesRes, viewsRes] = await Promise.all([
        supabaseClient.from("post_likes").select("post_id").in("post_id", postIds),
        supabaseClient.from("comments").select("post_id").in("post_id", postIds),
        supabaseClient.from("saved_posts").select("post_id").in("post_id", postIds),
        supabaseClient.from("post_views").select("post_id").in("post_id", postIds) // Assuming you have a views table
    ]);

    const likesMap = {};
    likesRes.data?.forEach(l => likesMap[l.post_id] = (likesMap[l.post_id] || 0) + 1);
    
    const commentsMap = {};
    commentsRes.data?.forEach(c => commentsMap[c.post_id] = (commentsMap[c.post_id] || 0) + 1);
    
    const savesMap = {};
    savesRes.data?.forEach(s => savesMap[s.post_id] = (savesMap[s.post_id] || 0) + 1);
    
    const viewsMap = {};
    viewsRes.data?.forEach(v => viewsMap[v.post_id] = (viewsMap[v.post_id] || 0) + 1);

    // Check if current user liked/saved
    const myLikes = likesRes.data?.filter(l => l.user_id === currentUser.id).map(l => l.post_id) || [];
    const mySaves = savesRes.data?.filter(s => s.user_id === currentUser.id).map(s => s.post_id) || [];

    let html = "";
    posts.forEach(post => {
        const profile = post.profiles || {};
        const avatar = profile.avatar_url || defaultAvatar();
        const name = profile.full_name || "StudentX User";
        const username = profile.username ? "@" + profile.username : "@studentx";
        const isVideo = !!post.video_url;
        const mediaUrl = isVideo ? post.video_url : post.image_url;

        html += `
            <div class="post-card">
                <div class="post-header">
                    <img src="${avatar}" class="post-avatar" onerror="this.src='${defaultAvatar()}'" alt="">
                    <div class="post-user">
                        <h4>${escapeHTML(name)}</h4>
                        <p>${escapeHTML(username)}</p>
                    </div>
                </div>
                ${post.content ? `<div class="post-content">${escapeHTML(post.content)}</div>` : ""}
                ${mediaUrl ? `<${isVideo ? 'video controls' : 'img'} src="${mediaUrl}" class="post-media" onerror="this.style.display='none'">${isVideo ? '</video>' : ''}` : ""}
                
                <div class="post-actions">
                    <div class="action-group ${myLikes.includes(post.id) ? 'liked' : ''}" onclick="toggleLike('${post.id}', this)">
                        <i class="fa-solid fa-heart"></i> <span>${likesMap[post.id] || 0}</span>
                    </div>
                    <div class="action-group" onclick="window.location.href='comment.html?post=${post.id}'">
                        <i class="fa-solid fa-comment-dots"></i> <span>${commentsMap[post.id] || 0}</span>
                    </div>
                    <div class="action-group" onclick="repostPost('${post.id}')">
                        <i class="fa-solid fa-retweet"></i> <span>0</span>
                    </div>
                    <div class="action-group ${mySaves.includes(post.id) ? 'saved' : ''}" onclick="toggleSave('${post.id}', this)">
                        <i class="fa-solid fa-bookmark"></i> <span>${savesMap[post.id] || 0}</span>
                    </div>
                    <div class="action-group">
                        <i class="fa-solid fa-eye"></i> <span>${viewsMap[post.id] || 0}</span>
                    </div>
                </div>
            </div>
        `;
    });

    document.getElementById("postsArea").innerHTML = html;
}

// 3. TABS SWITCH
function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
    loadPosts();
}

// 4. INTERACTION FUNCTIONS (Mock)
async function toggleLike(postId, el) {
    const isLiked = el.classList.contains('liked');
    if (isLiked) {
        await supabaseClient.from("post_likes").delete().match({ post_id: postId, user_id: currentUser.id });
        el.classList.remove('liked');
        el.querySelector('span').innerText = parseInt(el.querySelector('span').innerText) - 1;
    } else {
        await supabaseClient.from("post_likes").insert({ post_id: postId, user_id: currentUser.id, post_author_id: currentProfileId });
        el.classList.add('liked');
        el.querySelector('span').innerText = parseInt(el.querySelector('span').innerText) + 1;
    }
}

async function toggleSave(postId, el) {
    const isSaved = el.classList.contains('saved');
    if (isSaved) {
        await supabaseClient.from("saved_posts").delete().match({ post_id: postId, user_id: currentUser.id });
        el.classList.remove('saved');
        el.querySelector('span').innerText = parseInt(el.querySelector('span').innerText) - 1;
    } else {
        await supabaseClient.from("saved_posts").insert({ post_id: postId, user_id: currentUser.id });
        el.classList.add('saved');
        el.querySelector('span').innerText = parseInt(el.querySelector('span').innerText) + 1;
    }
}

function repostPost(postId) {
    alert("Repost feature coming soon!");
}

// INIT
loadProfile();
</script>

</body>
</html>
