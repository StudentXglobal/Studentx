<script>

let currentUser = null;
let profile = null;

let chats = [];
let currentChat = null;
let messages = [];

let messageChannel = null;
let callChannel = null;

let pendingOffer = null;
let pendingCaller = null;
let pendingCallType = null;

let peerConnection = null;
let localStream = null;
let remoteStream = null;

let isMuted = false;
let cameraEnabled = true;


const defaultAvatar =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="200"
height="200">

<rect width="200"
height="200"
fill="#202027"/>

<circle
cx="100"
cy="75"
r="42"
fill="#777"/>

<path
d="M35 190c8-48 35-70 65-70s57 22 65 70"
fill="#777"/>

</svg>
`);


function escapeHTML(value){

if(value === null || value === undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function timeAgo(date){

const d =
new Date(date);

const seconds =
Math.floor(
(Date.now()-d.getTime())/1000
);

if(seconds < 60){
return "now";
}

if(seconds < 3600){
return Math.floor(seconds/60)+"m";
}

if(seconds < 86400){
return Math.floor(seconds/3600)+"h";
}

if(seconds < 604800){
return Math.floor(seconds/86400)+"d";
}

return d.toLocaleDateString();

}


async function initChat(){

const result =
await supabaseClient.auth.getUser();

if(result.error ||
!result.data.user){

window.location.href="login.html";

return;

}

currentUser =
result.data.user;

await loadMyProfile();

await loadChats();

subscribeMessages();

subscribeCalls();

checkRequestedUser();

}


async function loadMyProfile(){

const result =
await supabaseClient
.from("profiles")
.select(
"id,full_name,username,avatar_url"
)
.eq("id",currentUser.id)
.maybeSingle();

if(result.error){

console.error(result.error);
return;

}

profile =
result.data;

}


async function loadChats(){

const result =
await supabaseClient
.from("messages")
.select(`
id,
sender_id,
receiver_id,
content,
message_type,
file_url,
file_name,
created_at,
read_at
`)
.or(
"sender_id.eq."+currentUser.id+
",receiver_id.eq."+currentUser.id
)
.order(
"created_at",
{ascending:false}
)
.limit(200);

if(result.error){

console.error(
"Chat loading error:",
result.error
);

renderNoChats(
result.error.message
);

return;

}

const rows =
result.data || [];

const userIds = [
...new Set(
rows.map(function(row){

return row.sender_id === currentUser.id
? row.receiver_id
: row.sender_id;

})
)
];

if(!userIds.length){

chats=[];
renderChats();
return;

}

const usersResult =
await supabaseClient
.from("profiles")
.select(
"id,full_name,username,avatar_url"
)
.in("id",userIds);

if(usersResult.error){

console.error(
usersResult.error
);

return;

}

const users =
usersResult.data || [];

const userMap = {};

users.forEach(function(user){

userMap[user.id]=user;

});

const map = {};

rows.forEach(function(row){

const otherId =
row.sender_id === currentUser.id
? row.receiver_id
: row.sender_id;

if(!map[otherId]){

map[otherId]={
id:otherId,
user:userMap[otherId] || null,
lastMessage:row,
unread:0
};

}

if(
row.receiver_id === currentUser.id &&
!row.read_at
){

map[otherId].unread++;

}

});

chats =
Object.values(map)
.sort(function(a,b){

return new Date(
b.lastMessage.created_at
) -
new Date(
a.lastMessage.created_at
);

});

renderChats();

}


function renderChats(){

const list =
document.getElementById("cList");

if(!chats.length){

list.innerHTML=`

<div class="no-c">

<i class="far fa-comment-dots"></i>

<p>No conversations found</p>

</div>

`;

return;

}

list.innerHTML =
chats.map(function(chat){

const user =
chat.user || {};

const name =
user.full_name ||
user.username ||

function searchList(value){

String(value || "")
.toLowerCase()
.trim();

renderChats();

chats.filter(function(chat){

const user =
chat.user || {};

const name =
(user.full_name || "").toLowerCase();

const username =
(user.username || "").toLowerCase();

const last =
(chat.lastMessage.content || "")
.toLowerCase();

return (
name.includes(q) ||
username.includes(q) ||
last.includes(q)
);

});

const old =
chats;

renderChats();

chats=old;

}

async function loadMessages(){

if(!currentChat){
return;
}

const result =
await supabaseClient
.from("messages")
.select(`
id,
sender_id,
receiver_id,
content,
message_type,
file_url,
file_name,
created_at,
read_at
`)
.or(
"and(sender_id.eq."+currentUser.id+
",receiver_id.eq."+currentChat.id+
"),and(sender_id.eq."+currentChat.id+
",receiver_id.eq."+currentUser.id+")"
)
.order(
"created_at",
{ascending:true}
);

if(result.error){

"Messages error:",
result.error
);

"Unable to load messages"
);

result.data || [];

String(message.sender_id) ===
String(currentUser.id);

escapeHTML(
message.content || ""
);

){

src="${escapeHTML(message.file_url)}"
style="
max-width:100%;
border-radius:10px;
display:block;
">

message.file_name ||
"File"
)}

return `

<div
class="msg ${outgoing ? "out":"in"}">

${
!outgoing
? `
<img
class="msg-av"
src="${escapeHTML(
currentChat.user.avatar_url ||
defaultAvatar
)}"
onerror="this.src=defaultAvatar">
`

}

   async function createPeerConnection(){

peerConnection =
new RTCPeerConnection({

iceServers:[

{
urls:"stun:stun.l.google.com:19302"
},

{
urls:"stun:stun1.l.google.com:19302"
}

]

});


remoteStream =
new MediaStream();

document.getElementById(
"remoteVideo"
).srcObject =
remoteStream;


peerConnection.ontrack =
function(event){

event.streams[0]
.getTracks()
.forEach(function(track){

remoteStream.addTrack(track);

});

};


peerConnection.onicecandidate =
async function(event){

if(!event.candidate){
return;
}

await sendCallSignal(
"ice",
event.candidate
);

};


peerConnection.onconnectionstatechange =
function(){

const state =
peerConnection.connectionState;

if(state === "connected"){

document.getElementById(
"callStatus"
).textContent =
"Connected";

}

if(
state === "failed" ||
state === "disconnected"
){

document.getElementById(
"callStatus"
).textContent =
"Connection lost";

}

};

}

async function startCall(type){

try{

const constraints =
type === "video"

? {
audio:true,
video:true
}

: {
audio:true,
video:false
};

localStream =
await navigator.mediaDevices
.getUserMedia(
constraints
);

await createPeerConnection();

localStream
.getTracks()
.forEach(function(track){

peerConnection.addTrack(
track,
localStream
);

});


showCallScreen(type);

const offer =
await peerConnection
.createOffer();

await peerConnection
.setLocalDescription(
offer
);

await sendCallSignal(
"offer",
{
type:offer.type,
sdp:offer.sdp
}
);

document.getElementById(
"callStatus"
).textContent =
"Calling...";

}catch(error){

console.error(
"Start call error:",
error
);

showMsg(
"Camera or microphone permission is required"
);

cleanupCall();

}

}


async function sendCallSignal(
signalType,
payload
){

if(!currentChat){

return;

}

const result =
await supabaseClient
.from("call_signals")
.insert({

caller_id:
currentUser.id,

receiver_id:
currentChat.id,

call_type:
window.activeCallType || "voice",

signal_type:
signalType,

payload:payload

});

if(result.error){

console.error(
"Call signal error:",
result.error
);

}

}


function subscribeCalls(){

callChannel =

)

{

schema:"public",
table:"call_signals",
filter:
"receiver_id=eq."+currentUser.id
},
async function(payload){

await handleIncomingSignal(
payload.new
);

}
)
.subscribe();

}


async function handleIncomingSignal(signal){

if(
signal.signal_type === "offer"
){

if(peerConnection){

return;

}

pendingOffer =
signal.payload;

pendingCaller =
signal.caller_id;

pendingCallType =
signal.call_type;

const result =
await supabaseClient
.from("profiles")
.select(
"id,full_name,username,avatar_url"
)
.eq(
"id",
pendingCaller
)
.maybeSingle();

if(result.error ||
!result.data){

return;

}

showIncomingCall(
result.data,
pendingCallType
);

}

else if(
signal.signal_type === "answer"
){

if(!peerConnection){

return;

}

await peerConnection
.setRemoteDescription(
new RTCSessionDescription(
signal.payload
)
);

}

else if(
signal.signal_type === "ice"
){

if(
peerConnection &&
peerConnection.remoteDescription
){

try{

await peerConnection
.addIceCandidate(
new RTCIceCandidate(
signal.payload
)
);

}catch(error){

console.error(error);

}

}

}

else if(
signal.signal_type === "hangup"
){

cleanupCall();

}

}

async function switchCamera(){

if(!localStream){
return;
}

const tracks =
localStream.getVideoTracks();

if(!tracks.length){
return;
}

const current =
tracks[0];

const facing =
current.getSettings().facingMode;

const nextFacing =
facing === "environment"
? "user"
: "environment";

try{

const newStream =
await navigator.mediaDevices
.getUserMedia({

audio:false,

video:{
facingMode:{
ideal:nextFacing
}
}

});

const newTrack =
newStream.getVideoTracks()[0];

const sender =
peerConnection
.getSenders()
.find(function(s){

return s.track &&
s.track.kind === "video";

});

if(sender){

await sender.replaceTrack(
newTrack
);

}

localStream
.removeTrack(current);

current.stop();

localStream
.addTrack(newTrack);

document.getElementById(
"localVideo"
).srcObject =
localStream;

}catch(error){

console.error(
"Switch camera error:",
error
);

}

}
