<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>StudentX - Notifications</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

body{
  font-family:Poppins,sans-serif;
  background:#0a0a0f;
  color:#fff;
  min-height:100vh;
  padding-bottom:70px
}

.hdr{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  background:rgba(10,10,15,.95);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.06)
}

.hdr-l{
  display:flex;
  align-items:center;
  gap:12px
}

.hdr-back{
  width:36px;
  height:36px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.5);
  font-size:17px;
  cursor:pointer
}

.hdr-title{
  font-size:18px;
  font-weight:800
}

.hdr-actions{
  display:flex;
  align-items:center;
  gap:6px
}

.hdr-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.5);
  font-size:15px;
  transition:all .15s;
  cursor:pointer
}

.hdr-btn:hover{
  background:rgba(124,58,237,.1);
  color:#a855f7
}

.tabs{
  display:flex;
  gap:8px;
  padding:14px 14px 6px;
  overflow-x:auto;
  scrollbar-width:none
}

.tabs::-webkit-scrollbar{
  display:none
}

.tab{
  padding:7px 16px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  color:rgba(255,255,255,.35);
  white-space:nowrap;
  border:1px solid rgba(255,255,255,.06);
  transition:all .2s;
  cursor:pointer
}

.tab.on{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  border-color:transparent;
  color:#fff
}

.tab .badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:18px;
  border-radius:50%;
  background:#ef4444;
  font-size:10px;
  font-weight:700;
  color:#fff;
  margin-left:5px;
  padding:0 4px
}

.sect{
  padding:0 14px;
  margin-bottom:20px
}

.sect-title{
  font-size:12px;
  font-weight:700;
  color:rgba(255,255,255,.3);
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.notif{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
  cursor:pointer;
  transition:background .12s
}

.notif:active{
  background:rgba(124,58,237,.06);
  margin:0 -14px;
  padding:14px;
  border-radius:12px
}

.notif.unread{
  background:rgba(124,58,237,.04);
  margin:0 -14px;
  padding:14px;
  border-radius:12px;
  border-bottom-color:rgba(124,58,237,.08)
}

.notif-av{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0
}

.notif-ic{
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0
}

.notif-body{
  flex:1;
  min-width:0
}

.notif-text{
  font-size:13px;
  line-height:1.5;
  color:rgba(255,255,255,.7)
}

.notif-text strong{
  color:#fff;
  font-weight:700
}

.notif-time{
  font-size:10px;
  color:rgba(255,255,255,.25);
  margin-top:3px
}

.notif-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#a855f7;
  flex-shrink:0;
  margin-top:6px
}

.notif-act{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.3);
  font-size:14px;
  flex-shrink:0;
  transition:all .12s;
  margin-top:2px
}

.notif-act:hover{
  background:rgba(124,58,237,.1);
  color:#a855f7
}

.follow-btn{
  margin-top:8px;
  padding:7px 18px;
  border-radius:20px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;
  font-size:11px;
  font-weight:700;
  border:none;
  cursor:pointer;
  transition:transform .15s
}

.follow-btn:hover{
  transform:scale(1.03)
}

.follow-btn.done{
  background:rgba(255,255,255,.06);
  color:rgba(255,255,255,.4);
  border:1px solid rgba(255,255,255,.08)
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:rgba(255,255,255,.15)
}

.empty i{
  font-size:36px;
  display:block;
  margin-bottom:12px
}

.empty p{
  font-size:13px
}

.loading{
  text-align:center;
  padding:60px 20px;
  color:rgba(255,255,255,.3)
}

.search-box{
  display:none;
  padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,.06)
}

.search-box.show{
  display:block
}

.search-inner{
  height:38px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  border-radius:20px;
  background:rgba(255,255,255,.06)
}

.search-inner i{
  color:rgba(255,255,255,.35)
}

.search-inner input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  color:#fff;
  font-family:Poppins,sans-serif;
  font-size:12px
}

.search-inner input::placeholder{
  color:rgba(255,255,255,.25)
}

.bnav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(10,10,15,.95);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,.06);
  z-index:200
}

.nb{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  font-size:9px;
  font-weight:500;
  color:rgba(255,255,255,.3);
  transition:color .2s;
  cursor:pointer
}

.nb i{
  font-size:19px
}

.nb.on{
  color:#a855f7
}

.toast{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  padding:11px 20px;
  background:rgba(124,58,237,.92);
  backdrop-filter:blur(12px);
  color:#fff;
  border-radius:12px;
  font-size:12px;
  font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  animation:fi .3s ease
}

@keyframes fi{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(-10px)
  }
  to{
    opacity:1;
    transform:translateX(-50%) translateY(0)
  }
}
</style>
</head>

<body>

<header class="hdr">

  <div class="hdr-l">

    <div class="hdr-back" onclick="goBack()">
      <i class="fas fa-arrow-left"></i>
    </div>

    <div class="hdr-title">
      Notifications
    </div>

  </div>

  <div class="hdr-actions">

    <div class="hdr-btn" onclick="toggleSearch()">
      <i class="fas fa-search"></i>
    </div>

    <div class="hdr-btn" onclick="markAllRead()">
      <i class="fas fa-check-double"></i>
    </div>

  </div>

</header>

<div class="search-box" id="searchBox">

  <div class="search-inner">

    <i class="fas fa-search"></i>

    <input
      type="text"
      id="searchInput"
      placeholder="Search notifications..."
      autocomplete="off"
    >

  </div>

</div>

<div class="tabs" id="tabBar"></div>

<div id="notifList">
  <div class="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Loading notifications...</p>
  </div>
</div>

<nav class="bnav">

  <div class="nb" onclick="window.location.href='home.html'">
    <i class="fas fa-home"></i>
    <span>Home</span>
  </div>

  <div class="nb" onclick="window.location.href='explore.html'">
    <i class="fas fa-compass"></i>
    <span>Explore</span>
  </div>

  <div class="nb" onclick="window.location.href='chat.html'">
    <i class="fas fa-comment-dots"></i>
    <span>Chat</span>
  </div>

  <div class="nb" onclick="window.location.href='studyhub.html'">
    <i class="fas fa-book-open"></i>
    <span>StudyHub</span>
  </div>

  <div class="nb" onclick="window.location.href='profile.html'">
    <i class="fas fa-user"></i>
    <span>Profile</span>
  </div>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
var currentUser = null;
var notifications = [];
var followingIds = new Set();
var currentTab = "all";
var searchQuery = "";

var tabData = [
  {k:"all",l:"All",count:0},
  {k:"likes",l:"Likes",count:0},
  {k:"comments",l:"Comments",count:0},
  {k:"follows",l:"Follows",count:0},
  {k:"system",l:"System",count:0}
];

function escapeHTML(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function defaultAvatar(){
  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">' +
      '<rect width="100" height="100" fill="#20202a"/>' +
      '<circle cx="50" cy="38" r="20" fill="#777"/>' +
      '<path d="M18 90c4-22 18-32 32-32s28 10 32 32" fill="#777"/>' +
      '</svg>'
    );
}

function goBack(){
  if(document.referrer){
    window.history.back();
  }else{
    window.location.href="home.html";
  }
}

function toggleSearch(){
  var box = document.getElementById("searchBox");
  box.classList.toggle("show");

  if(box.classList.contains("show")){
    setTimeout(function(){
      document.getElementById("searchInput").focus();
    },100);
  }else{
    document.getElementById("searchInput").value="";
    searchQuery="";
    renderTabs();
    renderNotifications();
  }
}

function timeAgo(date){
  var d = new Date(date);
  var seconds = Math.floor((Date.now() - d.getTime()) / 1000);

  if(seconds < 60) return "Just now";
  if(seconds < 3600) return Math.floor(seconds/60) + "m ago";
  if(seconds < 86400) return Math.floor(seconds/3600) + "h ago";
  if(seconds < 604800) return Math.floor(seconds/86400) + "d ago";
  if(seconds < 2592000) return Math.floor(seconds/604800) + "w ago";
  if(seconds < 31536000) return Math.floor(seconds/2592000) + "mo ago";

  return Math.floor(seconds/31536000) + "y ago";
}

function notificationType(type){
  if(type === "like") return "likes";
  if(type === "comment") return "comments";
  if(type === "follow") return "follows";
  if(type === "system") return "system";
  if(type === "story_like") return "likes";

  return "system";
}

function getNotificationIcon(type){
  if(type === "follow"){
    return {
      icon:"fa-user-plus",
      color:"#3b82f6"
    };
  }

  if(type === "like"){
    return {
      icon:"fa-heart",
      color:"#ef4444"
    };
  }

  if(type === "comment"){
    return {
      icon:"fa-comment",
      color:"#10b981"
    };
  }

  if(type === "story_like"){
    return {
      icon:"fa-heart",
      color:"#ec4899"
    };
  }

  if(type === "post"){
    return {
      icon:"fa-file-circle-plus",
      color:"#8b5cf6"
    };
  }

  if(type === "unfollow"){
    return {
      icon:"fa-user-minus",
      color:"#f59e0b"
    };
  }

  return {
    icon:"fa-bullhorn",
    color:"#7c3aed"
  };
}

async function initNotifications(){

  try{

    var result = await supabaseClient.auth.getUser();

    if(result.error){
      throw result.error;
    }

    currentUser = result.data.user;

    if(!currentUser){
      window.location.href="login.html";
      return;
    }

    await loadFollowing();
    await loadNotifications();

    renderTabs();
    renderNotifications();

    subscribeToNotifications();

  }catch(error){

    console.error("Notification initialization error:",error);

    document.getElementById("notifList").innerHTML =
      '<div class="empty">' +
      '<i class="fas fa-triangle-exclamation"></i>' +
      '<p>Unable to load notifications</p>' +
      '</div>';
  }

}

async function loadFollowing(){

  if(!currentUser) return;

  var result = await supabaseClient
    .from("followers")
    .select("following_id")
    .eq("follower_id",currentUser.id);

  if(result.error){
    console.error("Following load error:",result.error);
    return;
  }

  followingIds = new Set(
    (result.data || []).map(function(row){
      return row.following_id;
    })
  );
}

async function loadNotifications(){

  var result = await supabaseClient
    .from("notifications")
    .select("*")
    .eq("recipient_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(result.error){
    console.error("Notifications load error:",result.error);
    throw result.error;
  }

  notifications = result.data || [];

  var actorIds = notifications
    .map(function(n){
      return n.actor_id;
    })
    .filter(Boolean);

  if(!actorIds.length){
    return;
  }

  var profilesResult = await supabaseClient
    .from("profiles")
    .select("id,full_name,username,avatar_url,verified")
    .in("id",actorIds);

  if(profilesResult.error){
    console.error("Actor profiles error:",profilesResult.error);
    return;
  }

  var profileMap = {};

  (profilesResult.data || []).forEach(function(profile){
    profileMap[profile.id] = profile;
  });

  notifications = notifications.map(function(n){

    var actor = profileMap[n.actor_id] || null;

    n.actor = actor;

    return n;
  });

}

function countTabs(){

  tabData.forEach(function(tab){

    if(tab.k === "all"){

      tab.count = notifications.filter(function(n){
        return !n.is_read;
      }).length;

    }else{

      tab.count = notifications.filter(function(n){

        return notificationType(n.type) === tab.k &&
               !n.is_read;

      }).length;

    }

  });

}

function renderTabs(){

  countTabs();

  document.getElementById("tabBar").innerHTML =
    tabData.map(function(tab){

      return '<div class="tab ' +
        (currentTab === tab.k ? "on" : "") +
        '" onclick="switchTab(\'' +
        tab.k +
        '\')">' +
        tab.l +
        (tab.count > 0
          ? '<span class="badge">' + tab.count + '</span>'
          : "") +
        '</div>';

    }).join("");

}

function getFilteredNotifications(){

  var list = notifications.slice();

  if(currentTab !== "all"){

    list = list.filter(function(n){

      return notificationType(n.type) === currentTab;

    });

  }

  if(searchQuery){

    var q = searchQuery.toLowerCase();

    list = list.filter(function(n){

      var actorName = n.actor
        ? (n.actor.full_name || "") + " " +
          (n.actor.username || "")
        : "";

      var text = (n.message || "") + " " + actorName;

      return text.toLowerCase().includes(q);

    });

  }

  return list;

}

function getNotificationMessage(n){

  if(n.message){
    return escapeHTML(n.message);
  }

  var actorName = n.actor
    ? (n.actor.full_name || n.actor.username || "Someone")
    : "StudentX";

  if(n.type === "follow"){
    return "followed you.";
  }

  if(n.type === "like"){
    return "liked your post.";
  }

  if(n.type === "story_like"){
    return "liked your story.";
  }

  if(n.type === "comment"){
    return "commented on your post.";
  }

  if(n.type === "unfollow"){
    return "unfollowed you.";
  }

  if(n.type === "post"){
    return "created a new post.";
  }

  if(n.type === "premium"){
    return "StudentX Premium Plus is available.";
  }

  return "sent you a notification.";
}
  /* ==========================================
   PART 2 — NOTIFICATION FUNCTIONS
   ========================================== */

function timeAgo(date){

    if(!date) return "";

    var seconds =
        Math.floor(
            (Date.now() - new Date(date).getTime()) / 1000
        );

    if(seconds < 60)
        return "Just now";

    if(seconds < 3600)
        return Math.floor(seconds / 60) + "m ago";

    if(seconds < 86400)
        return Math.floor(seconds / 3600) + "h ago";

    if(seconds < 604800)
        return Math.floor(seconds / 86400) + "d ago";

    if(seconds < 2592000)
        return Math.floor(seconds / 604800) + "w ago";

    return Math.floor(seconds / 2592000) + "mo ago";
}


/* ==========================================
   ICON FOR NOTIFICATION
   ========================================== */

function notificationIcon(type){

    if(type === "like")
        return '<i class="fas fa-heart"></i>';

    if(type === "comment")
        return '<i class="fas fa-comment"></i>';

    if(type === "follow")
        return '<i class="fas fa-user-plus"></i>';

    if(type === "repost")
        return '<i class="fas fa-retweet"></i>';

    if(type === "story")
        return '<i class="fas fa-circle-play"></i>';

    if(type === "system")
        return '<i class="fas fa-bell"></i>';

    return '<i class="fas fa-bell"></i>';
}


/* ==========================================
   SEARCH NOTIFICATIONS
   ========================================== */

var notificationSearch = "";


function searchNotifications(){

    var input =
        document.getElementById("notificationSearch");

    if(!input){
        return;
    }

    notificationSearch =
        input.value.trim().toLowerCase();

    renderNotifications();
}


/* ==========================================
   FILTER NOTIFICATIONS
   ========================================== */

function getNotificationList(){

    var list = notifications || [];

    if(!notificationSearch){
        return list;
    }

    return list.filter(function(n){

        var text =
            (
                (n.actor_name || "") +
                " " +
                (n.message || "") +
                " " +
                (n.type || "")
            ).toLowerCase();

        return text.includes(notificationSearch);

    });
}


/* ==========================================
   RENDER NOTIFICATIONS
   ========================================== */

function renderNotifications(){

    var container =
        document.getElementById("notifList");

    if(!container){
        return;
    }

    var list =
        getNotificationList();

    if(!list.length){

        container.innerHTML = `
            <div style="
                text-align:center;
                padding:70px 20px;
                color:rgba(255,255,255,.3);
            ">

                <i
                    class="far fa-bell-slash"
                    style="
                        font-size:38px;
                        margin-bottom:15px;
                        display:block;
                    ">
                </i>

                <div style="
                    font-size:13px;
                    font-weight:600;
                ">
                    No notifications found
                </div>

            </div>
        `;

        return;
    }


    var html = "";


    list.forEach(function(n){

        var unread =
            !n.is_read;

        var actorName =
            n.actor_name ||
            n.user_name ||
            "StudentX User";

        var avatar =
            n.actor_avatar ||
            n.avatar_url ||
            "https://via.placeholder.com/100";


        var type =
            n.type || "system";


        var message =
            n.message || "";


        /*
         * DESTINATION
         */

        var destination = "#";


        if(type === "follow"){

            if(n.actor_id){

                destination =
                    "profile.html?id=" +
                    encodeURIComponent(n.actor_id);

            }

        }else if(
            type === "like" ||
            type === "comment" ||
            type === "repost"
        ){

            if(n.post_id){

                destination =
                    "home.html?post=" +
                    encodeURIComponent(n.post_id);

            }

        }else if(type === "story"){

            if(n.story_id){

                destination =
                    "home.html?story=" +
                    encodeURIComponent(n.story_id);

            }

        }


        html += `

        <div
            class="notif ${unread ? "unread" : ""}"
            onclick="openNotification('${n.id}')"
            data-search="${escapeHTML(actorName + ' ' + message)}"
        >

            <div
                class="notif-avatar"
                onclick="event.stopPropagation();openNotification('${n.id}')"
            >

                <img
                    src="${escapeHTML(avatar)}"
                    onerror="this.src='https://via.placeholder.com/100'"
                    alt=""
                >

                <span class="notif-type-icon ${type}">
                    ${notificationIcon(type)}
                </span>

            </div>


            <div class="notif-body">

                <div class="notif-text">

                    <strong>
                        ${escapeHTML(actorName)}
                    </strong>

                    ${escapeHTML(message)}

                </div>


                <div class="notif-time">

                    ${timeAgo(n.created_at)}

                </div>


                ${
                    type === "follow"
                    ?
                    `
                    <button
                        class="follow-btn"
                        id="followBack-${n.id}"
                        onclick="
                            event.stopPropagation();
                            followBack('${n.id}','${n.actor_id || ""}')
                        "
                    >
                        Follow Back
                    </button>
                    `
                    :
                    ""
                }

            </div>


            ${
                unread
                ?
                `
                <div
                    class="notif-dot"
                    title="Unread"
                ></div>
                `
                :
                ""
            }

        </div>

        `;

    });


    container.innerHTML = html;
}


/* ==========================================
   OPEN NOTIFICATION
   ========================================== */

async function openNotification(id){

    var n =
        notifications.find(function(item){

            return String(item.id) === String(id);

        });


    if(!n){
        return;
    }


    /* Mark as seen */

    if(!n.is_read){

        await markNotificationRead(id);

        n.is_read = true;
    }


    /*
     * FOLLOW
     * → USER PROFILE
     */

    if(n.type === "follow"){

        if(n.actor_id){

            window.location.href =
                "profile.html?id=" +
                encodeURIComponent(n.actor_id);

            return;
        }
    }


    /*
     * LIKE / COMMENT / REPOST
     * → POST
     */

    if(
        n.type === "like" ||
        n.type === "comment" ||
        n.type === "repost"
    ){

        if(n.post_id){

            window.location.href =
                "home.html?post=" +
                encodeURIComponent(n.post_id);

            return;
        }
    }


    /*
     * STORY
     */

    if(n.type === "story"){

        if(n.story_id){

            window.location.href =
                "home.html?story=" +
                encodeURIComponent(n.story_id);

            return;
        }
    }


    renderNotifications();

}


/* ==========================================
   MARK ONE AS READ
   ========================================== */

async function markNotificationRead(id){

    if(!supabaseClient){
        return;
    }


    var { error } =
        await supabaseClient
        .from("notifications")
        .update({
            is_read: true
        })
        .eq("id", id);


    if(error){

        console.log(
            "Mark notification read error:",
            error
        );

    }

}


/* ==========================================
   MARK ALL AS SEEN
   ========================================== */

async function markAllAsSeen(){

    if(!currentUser){

        showMsg("Please login first");

        return;
    }


    var { error } =
        await supabaseClient
        .from("notifications")
        .update({
            is_read: true
        })
        .eq(
            "recipient_id",
            currentUser.id
        )
        .eq(
            "is_read",
            false
        );


    if(error){

        console.log(
            "Mark all notifications error:",
            error
        );

        showMsg(
            "Unable to mark notifications as seen"
        );

        return;
    }


    notifications.forEach(function(n){

        n.is_read = true;

    });


    renderNotifications();

    updateNotificationBadge();

    showMsg(
        "All notifications marked as seen"
    );
}


/* ==========================================
   FOLLOW BACK
   ========================================== */

async function followBack(
    notificationId,
    userId
){

    if(!currentUser){

        showMsg("Please login first");

        return;
    }


    if(!userId){

        showMsg("User not found");

        return;
    }


    if(
        String(currentUser.id) ===
        String(userId)
    ){

        return;
    }


    var button =
        document.getElementById(
            "followBack-" + notificationId
        );


    if(button){

        button.disabled = true;

        button.textContent =
            "Following...";
    }


    var { error } =
        await supabaseClient
        .from("followers")
        .insert({

            follower_id:
                currentUser.id,

            following_id:
                userId

        });


    /*
     * If already following,
     * don't show false error.
     */

    if(error){

        if(
            error.code === "23505"
        ){

            if(button){

                button.textContent =
                    "Following";

                button.classList.add(
                    "done"
                );

            }

            showMsg(
                "Already following"
            );

            return;
        }


        console.log(
            "Follow back error:",
            error
        );


        if(button){

            button.disabled = false;

            button.textContent =
                "Follow Back";
        }


        showMsg(
            "Unable to follow user"
        );

        return;
    }


    if(button){

        button.disabled = true;

        button.textContent =
            "Following";

        button.classList.add(
            "done"
        );
    }


    showMsg(
        "Following " +
        (
            notifications.find(
                function(x){
                    return String(x.id) ===
                           String(notificationId);
                }
            )?.actor_name ||
            "user"
        )
    );
}


/* ==========================================
   NOTIFICATION BADGE
   ========================================== */

function updateNotificationBadge(){

    var unread =
        (notifications || []).filter(
            function(n){

                return !n.is_read;

            }
        ).length;


    var badges =
        document.querySelectorAll(
            ".notification-badge"
        );


    badges.forEach(function(badge){

        if(unread > 0){

            badge.textContent =
                unread > 99
                ? "99+"
                : unread;

            badge.style.display =
                "flex";

        }else{

            badge.style.display =
                "none";

        }

    });
}


/* ==========================================
   LOAD NOTIFICATIONS FROM SUPABASE
   ========================================== */

async function loadNotifications(){

    if(!currentUser){

        console.log(
            "No logged in user"
        );

        return;
    }


    var { data, error } =
        await supabaseClient
        .from("notifications")
        .select(`
            id,
            recipient_id,
            actor_id,
            post_id,
            story_id,
            type,
            message,
            is_read,
            created_at
        `)
        .eq(
            "recipient_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        )
        .limit(100);


    if(error){

        console.log(
            "Notification loading error:",
            error
        );

        showMsg(
            "Unable to load notifications"
        );

        return;
    }


    notifications = data || [];


    /*
     * Load actor profile information
     */

    var actorIds =
        notifications
        .map(function(n){

            return n.actor_id;

        })
        .filter(Boolean);


    actorIds =
        [...new Set(actorIds)];


    if(actorIds.length){

        var profileResult =
            await supabaseClient
            .from("profiles")
            .select(`
                id,
                full_name,
                username,
                avatar_url
            `)
            .in(
                "id",
                actorIds
            );


        if(!profileResult.error){

            var profiles =
                profileResult.data || [];


            notifications.forEach(
                function(n){

                    var profile =
                        profiles.find(
                            function(p){

                                return String(p.id) ===
                                       String(n.actor_id);

                            }
                        );


                    if(profile){

                        n.actor_name =
                            profile.full_name ||
                            profile.username ||
                            "StudentX User";

                        n.actor_avatar =
                            profile.avatar_url ||
                            "https://via.placeholder.com/100";
                    }

                }
            );

        }

    }


    renderNotifications();

    updateNotificationBadge();
}


/* ==========================================
   REALTIME NOTIFICATIONS
   ========================================== */

function subscribeNotifications(){

    if(!currentUser){
        return;
    }


    supabaseClient
    .channel(
        "studentx-notifications-" +
        currentUser.id
    )
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"notifications",
            filter:
                "recipient_id=eq." +
                currentUser.id
        },
        function(){

            loadNotifications();

        }
    )
    .subscribe();
}

    }else{

/* ==========================================
   INITIALIZE
   ========================================== */

async function initNotifications(){

    try{

        var sessionResult =
            await supabaseClient
            .auth
            .getSession();


        currentUser =
            sessionResult.data.session
            ?.user || null;


        if(!currentUser){

            showMsg(
                "Please login first"
            );

            return;
        }


        await loadNotifications();

        subscribeNotifications();


    }catch(error){

        console.log(
            "Notification initialization error:",
            error
        );

    }

}


initNotifications();
