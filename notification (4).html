<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,user-scalable=no"
>

<title>StudentX - Notifications</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

:root{
  --bg:#0a0a0f;
  --card:rgba(255,255,255,.035);
  --card-2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.07);
  --text:#fff;
  --text-2:rgba(255,255,255,.75);
  --muted:rgba(255,255,255,.42);
  --accent:#dc2743;
  --grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  --danger:#ef4444;
}

:root.sx-light{
  --bg:#f0f2f5;
  --card:#ffffff;
  --card-2:#f0f2f5;
  --border:#e4e6eb;
  --text:#050505;
  --text-2:#3a3b3c;
  --muted:#65676b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Poppins,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  max-width:500px;
  margin:0 auto;
  padding-bottom:80px;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   HEADER
========================= */

.hdr{
  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px 14px;

  background:var(--bg);

  border-bottom:1px solid var(--border);
}

.hdr-l{
  display:flex;
  align-items:center;
  gap:12px;
}

.hdr-back,
.hdr-btn{

  width:38px;
  height:38px;

  border-radius:11px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--text-2);

  cursor:pointer;

  background:none;
  border:0;

  transition:.2s;
}

.hdr-back{
  font-size:17px;
}

.hdr-btn{
  font-size:15px;
}

.hdr-back:active,
.hdr-btn:active{
  background:var(--card-2);
}

.hdr-title{
  font-size:18px;
  font-weight:800;
}

.hdr-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

/* =========================
   SEARCH
========================= */

.search-box{
  display:none;

  padding:10px 14px;

  border-bottom:1px solid var(--border);
}

.search-box.show{
  display:block;
}

.search-inner{

  height:40px;

  display:flex;
  align-items:center;

  gap:9px;

  padding:0 13px;

  border-radius:22px;

  background:var(--card-2);

  border:1px solid var(--border);
}

.search-inner i{
  color:var(--muted);
  font-size:13px;
}

.search-inner input{

  flex:1;

  border:none;
  outline:none;

  background:transparent;

  color:var(--text);

  font-family:Poppins,sans-serif;

  font-size:12px;
}

.search-inner input::placeholder{
  color:var(--muted);
}

/* =========================
   TABS
========================= */

.tabs{

  display:flex;

  gap:8px;

  padding:14px 14px 8px;

  overflow-x:auto;

  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{

  padding:7px 16px;

  border-radius:20px;

  font-size:12px;

  font-weight:600;

  color:var(--muted);

  white-space:nowrap;

  border:1px solid var(--border);

  background:var(--card);

  cursor:pointer;

  transition:.2s;
}

.tab.on{

  background:var(--grad);

  border-color:transparent;

  color:#fff;
}

.tab .badge{

  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-width:18px;
  height:18px;

  margin-left:5px;

  padding:0 4px;

  border-radius:50%;

  background:var(--danger);

  color:#fff;

  font-size:10px;

  font-weight:700;
}

/* =========================
   SECTION
========================= */

.sect{

  padding:0 14px;

  margin-bottom:20px;
}

.sect-title{

  display:flex;

  align-items:center;
  justify-content:space-between;

  margin:14px 0 8px;

  font-size:11px;

  font-weight:700;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:1px;
}

/* =========================
   NOTIFICATION
========================= */

.notif{

  display:flex;

  align-items:flex-start;

  gap:12px;

  padding:14px 0;

  border-bottom:1px solid var(--border);

  cursor:pointer;

  transition:.15s;
}

.notif:active{

  background:var(--card-2);

  margin:0 -14px;

  padding:14px;

  border-radius:12px;
}

.notif.unread{

  background:var(--card);

  margin:0 -14px;

  padding:14px;

  border-radius:12px;

  border-bottom-color:transparent;
}

/* =========================
   AVATAR
========================= */

.notif-avatar{

  position:relative;

  width:44px;
  height:44px;

  flex-shrink:0;
}

.notif-avatar img{

  width:44px;
  height:44px;

  border-radius:50%;

  object-fit:cover;

  background:var(--card-2);
}

/* =========================
   TYPE ICON
========================= */

.notif-type-icon{

  position:absolute;

  right:-3px;
  bottom:-3px;

  width:19px;
  height:19px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  border:2px solid var(--bg);

  font-size:8px;
}

.notif-type-icon.like{
  background:#ef4444;
}

.notif-type-icon.comment{
  background:#10b981;
}

.notif-type-icon.follow{
  background:#3b82f6;
}

.notif-type-icon.repost{
  background:#8b5cf6;
}

.notif-type-icon.story,
.notif-type-icon.story_like,
.notif-type-icon.story_reply{
  background:#ec4899;
}

/* system/premium/broadcast get the brand gradient instead of a flat color */
.notif-type-icon-lg{

  width:44px;
  height:44px;
  position:relative;
  right:auto;
  bottom:auto;
  border:none;
  font-size:17px;

  background:var(--grad);
}

/* =========================
   BODY
========================= */

.notif-body{

  flex:1;

  min-width:0;
}

.notif-text{

  font-size:13px;

  line-height:1.5;

  color:var(--text-2);
}

.notif-text strong{

  color:var(--text);

  font-weight:700;
}

.notif-title{

  display:block;

  color:var(--text);

  font-weight:700;

  margin-bottom:2px;
}

.notif-time{

  margin-top:3px;

  font-size:10px;

  color:var(--muted);
}

/* =========================
   UNREAD DOT
========================= */

.notif-dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:var(--accent);

  flex-shrink:0;

  margin-top:6px;
}

/* =========================
   FOLLOW BUTTON
========================= */

.follow-btn{

  margin-top:8px;

  padding:7px 18px;

  border:none;

  border-radius:20px;

  background:var(--grad);

  color:#fff;

  font-family:Poppins,sans-serif;

  font-size:11px;

  font-weight:700;

  cursor:pointer;
}

.follow-btn:disabled{
  opacity:.7;
}

.follow-btn.done{

  background:var(--card-2);

  color:var(--muted);

  border:1px solid var(--border);
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{

  text-align:center;

  padding:70px 20px;

  color:var(--muted);
}

.empty i{

  display:block;

  margin-bottom:14px;

  font-size:38px;

  color:var(--accent);
}

.empty p{
  font-size:13px;
}

.loading{

  text-align:center;

  padding:70px 20px;

  color:var(--muted);
}

.loading i{

  display:block;

  margin-bottom:12px;

  font-size:24px;

  color:var(--accent);
}

/* =========================
   TOAST
========================= */

.toast{

  position:fixed;

  top:16px;
  left:50%;

  transform:translateX(-50%);

  z-index:9999;

  max-width:90%;

  padding:11px 20px;

  background:#1f1f2b;

  color:#fff;

  border-radius:12px;

  font-size:12px;

  font-weight:600;

  box-shadow:
    0 4px 20px rgba(0,0,0,.35);

  border-left:3px solid var(--accent);

  animation:toastIn .25s ease;
}

@keyframes toastIn{

  from{
    opacity:0;
    transform:
      translateX(-50%)
      translateY(-10px);
  }

  to{
    opacity:1;
    transform:
      translateX(-50%)
      translateY(0);
  }
}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="hdr">

  <div class="hdr-l">

    <div
      class="hdr-back"
      onclick="goBack()"
      aria-label="Back"
    >
      <i class="fas fa-arrow-left"></i>
    </div>

    <div class="hdr-title">
      Notifications
    </div>

  </div>


  <div class="hdr-actions">

    <div
      class="hdr-btn"
      onclick="toggleSearch()"
      aria-label="Search"
    >
      <i class="fas fa-search"></i>
    </div>

    <div
      class="hdr-btn"
      onclick="markAllRead()"
      aria-label="Mark all as read"
    >
      <i class="fas fa-check-double"></i>
    </div>

  </div>

</header>


<!-- =========================
     SEARCH BOX
========================= -->

<div
  class="search-box"
  id="searchBox"
>

  <div class="search-inner">

    <i class="fas fa-search"></i>

    <input
      type="text"
      id="searchInput"
      placeholder="Search notifications..."
      autocomplete="off"
    >

  </div>

</div>


<!-- =========================
     TABS
========================= -->

<div
  class="tabs"
  id="tabBar"
></div>


<!-- =========================
     NOTIFICATIONS
========================= -->

<div id="notifList">

  <div class="loading">

    <i class="fas fa-spinner fa-spin"></i>

    <p>
      Loading notifications...
    </p>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

/* ==========================================
   STUDENTX NOTIFICATIONS
   PART 1
========================================== */


/* =========================
   GLOBAL VARIABLES
========================= */

var currentUser = null;

var notifications = [];

var followingIds = new Set();

var currentTab = "all";

var searchQuery = "";

var notificationChannel = null;


/* =========================
   TABS
========================= */

var tabData = [

  {
    k:"all",
    l:"All",
    count:0
  },

  {
    k:"likes",
    l:"Likes",
    count:0
  },

  {
    k:"comments",
    l:"Comments",
    count:0
  },

  {
    k:"follows",
    l:"Follows",
    count:0
  },

  {
    k:"system",
    l:"System",
    count:0
  }

];


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");
}


/* =========================
   DEFAULT AVATAR
========================= */

function defaultAvatar(){

  return "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(

      '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">' +

      '<rect width="100" height="100" fill="#20202a"/>' +

      '<circle cx="50" cy="38" r="20" fill="#777"/>' +

      '<path d="M18 90c4-22 18-32 32-32s28 10 32 32" fill="#777"/>' +

      '</svg>'

    );
}


/* =========================
   BACK BUTTON
========================= */

function goBack(){

  if(
    document.referrer &&
    document.referrer !==
    window.location.href
  ){

    window.history.back();

  }else{

    window.location.href =
      "home.html";

  }

}


/* =========================
   SEARCH TOGGLE
========================= */

function toggleSearch(){

  var box =
    document.getElementById(
      "searchBox"
    );

  if(!box){
    return;
  }

  box.classList.toggle("show");


  if(
    box.classList.contains("show")
  ){

    setTimeout(function(){

      var input =
        document.getElementById(
          "searchInput"
        );

      if(input){
        input.focus();
      }

    },100);

  }else{

    var input =
      document.getElementById(
        "searchInput"
      );

    if(input){
      input.value = "";
    }

    searchQuery = "";

    renderTabs();

    renderNotifications();

  }

}


/* =========================
   TIME AGO
========================= */

function timeAgo(date){

  if(!date){
    return "";
  }

  var time =
    new Date(date).getTime();

  if(isNaN(time)){
    return "";
  }

  var seconds =
    Math.floor(
      (Date.now() - time) / 1000
    );


  if(seconds < 60){

    return "Just now";

  }


  if(seconds < 3600){

    return (
      Math.floor(seconds / 60) +
      "m ago"
    );

  }


  if(seconds < 86400){

    return (
      Math.floor(seconds / 3600) +
      "h ago"
    );

  }


  if(seconds < 604800){

    return (
      Math.floor(seconds / 86400) +
      "d ago"
    );

  }


  if(seconds < 2592000){

    return (
      Math.floor(seconds / 604800) +
      "w ago"
    );

  }


  if(seconds < 31536000){

    return (
      Math.floor(seconds / 2592000) +
      "mo ago"
    );

  }


  return (
    Math.floor(seconds / 31536000) +
    "y ago"
  );

}


/* =========================
   NOTIFICATION CATEGORY
========================= */

function notificationType(type){

  if(type === "like"){
    return "likes";
  }

  if(type === "story_like"){
    return "likes";
  }

  if(type === "comment"){
    return "comments";
  }

  if(type === "comment_reply"){
    return "comments";
  }

  if(type === "story_reply"){
    return "comments";
  }

  if(type === "follow"){
    return "follows";
  }

  if(type === "system"){
    return "system";
  }

  if(type === "broadcast"){
    return "system";
  }

  if(type === "premium"){
    return "system";
  }

  if(type === "post"){
    return "system";
  }

  if(type === "unfollow"){
    return "follows";
  }

  return "system";
}


/* =========================
   NOTIFICATION ICON
========================= */

function getNotificationIcon(type){

  if(type === "follow"){

    return {
      icon:"fa-user-plus",
      color:"#3b82f6"
    };

  }


  if(type === "like"){

    return {
      icon:"fa-heart",
      color:"#ef4444"
    };

  }


  if(type === "story_like"){

    return {
      icon:"fa-heart",
      color:"#ec4899"
    };

  }


  if(type === "comment" || type === "comment_reply"){

    return {
      icon:"fa-comment",
      color:"#10b981"
    };

  }


  if(type === "story_reply"){

    return {
      icon:"fa-reply",
      color:"#ec4899"
    };

  }


  if(type === "repost"){

    return {
      icon:"fa-retweet",
      color:"#8b5cf6"
    };

  }


  if(type === "post"){

    return {
      icon:"fa-file-circle-plus",
      color:"#8b5cf6"
    };

  }


  if(type === "unfollow"){

    return {
      icon:"fa-user-minus",
      color:"#f59e0b"
    };

  }


  if(type === "premium"){

    return {
      icon:"fa-crown"
    };

  }


  if(type === "broadcast"){

    return {
      icon:"fa-bullhorn"
    };

  }


  return {

    icon:"fa-bell"

  };

}


/* =========================
   NOTIFICATION MESSAGE
========================= */

function getNotificationMessage(n){

  if(n && n.message){

    return escapeHTML(
      n.message
    );

  }


  if(!n){
    return "";
  }


  if(n.type === "follow"){

    return "followed you.";

  }


  if(n.type === "like"){

    return "liked your post.";

  }


  if(n.type === "story_like"){

    return "liked your story.";

  }


  if(n.type === "comment" || n.type === "comment_reply"){

    return "commented on your post.";

  }


  if(n.type === "story_reply"){

    return "replied to your story.";

  }


  if(n.type === "repost"){

    return "reposted your post.";

  }


  if(n.type === "unfollow"){

    return "unfollowed you.";

  }


  if(n.type === "post"){

    return "created a new post.";

  }


  if(n.type === "premium"){

    return "StudentX Premium Plus is available.";

  }


  return "sent you a notification.";

}


/* =========================
   GET ACTOR NAME
========================= */

function getActorName(n){

  if(!n){
    return "StudentX";
  }

  if(n.actor){

    return (
      n.actor.full_name ||
      n.actor.username ||
      "StudentX User"
    );

  }

  return (
    n.actor_name ||
    n.user_name ||
    "StudentX User"
  );

}


/* =========================
   GET ACTOR AVATAR
========================= */

function getActorAvatar(n){

  if(!n){
    return defaultAvatar();
  }

  if(n.actor){

    return (
      n.actor.avatar_url ||
      defaultAvatar()
    );

  }

  return (
    n.actor_avatar ||
    n.avatar_url ||
    defaultAvatar()
  );

}


/* =========================
   INITIAL SUPABASE CHECK
========================= */

async function getCurrentUser(){

  var result =
    await supabaseClient
    .auth
    .getUser();


  if(result.error){

    console.error(
      "Auth error:",
      result.error
    );

    return null;
  }


  return result.data.user || null;

}


/* =========================
   LOAD FOLLOWING IDS
========================= */

async function loadFollowing(){

  if(!currentUser){
    return;
  }


  var result =
    await supabaseClient
    .from("followers")
    .select("following_id")
    .eq(
      "follower_id",
      currentUser.id
    );


  if(result.error){

    console.error(
      "Following load error:",
      result.error
    );

    return;
  }


  followingIds =
    new Set(

      (result.data || [])

      .map(function(row){

        return row.following_id;

      })

    );

}


/* =========================
   TAB COUNTS
========================= */

function countTabs(){

  tabData.forEach(
    function(tab){

      if(tab.k === "all"){

        tab.count =
          notifications.filter(
            function(n){

              return !n.is_read;

            }
          ).length;

      }else{

        tab.count =
          notifications.filter(
            function(n){

              return (
                notificationType(n.type) ===
                tab.k
              ) &&
              !n.is_read;

            }
          ).length;

      }

    }
  );

}


/* =========================
   RENDER TABS
========================= */

function renderTabs(){

  var tabBar =
    document.getElementById(
      "tabBar"
    );

  if(!tabBar){
    return;
  }


  countTabs();


  tabBar.innerHTML =
    tabData.map(
      function(tab){

        return (

          '<div class="tab ' +

          (
            currentTab === tab.k
              ? "on"
              : ""
          ) +

          '" onclick="switchTab(\'' +

          tab.k +

          '\')">' +

          escapeHTML(tab.l) +

          (
            tab.count > 0

              ? '<span class="badge">' +
                (
                  tab.count > 99
                    ? "99+"
                    : tab.count
                ) +
                '</span>'

              : ""
          ) +

          '</div>'

        );

      }
    ).join("");

}


/* =========================
   END OF PART 1
========================= */
/* =========================
   FILTER NOTIFICATIONS
========================= */

function getFilteredNotifications(){

  var list = notifications.slice();


  /* TAB FILTER */

  if(currentTab !== "all"){

    list =
      list.filter(function(n){

        return (
          notificationType(n.type) ===
          currentTab
        );

      });

  }


  /* SEARCH FILTER */

  if(searchQuery){

    var q =
      searchQuery.toLowerCase();


    list =
      list.filter(function(n){

        var actorName =
          getActorName(n);

        var message =
          n.message || "";

        var title =
          n.title || "";

        var type =
          n.type || "";


        var text =
          (
            actorName +
            " " +
            title +
            " " +
            message +
            " " +
            type
          ).toLowerCase();


        return text.includes(q);

      });

  }


  return list;

}


/* =========================
   SWITCH TAB
========================= */

function switchTab(tab){

  currentTab = tab;

  renderTabs();

  renderNotifications();

}


/* =========================
   MARK ONE AS READ
========================= */

async function markNotificationRead(id){

  if(!currentUser){
    return false;
  }


  var result =
    await supabaseClient
    .from("notifications")
    .update({
      is_read:true
    })
    .eq(
      "id",
      id
    )
    .eq(
      "recipient_id",
      currentUser.id
    );


  if(result.error){

    console.error(
      "Mark notification read error:",
      result.error
    );

    return false;
  }


  return true;

}


/* =========================
   MARK ALL AS READ
========================= */

async function markAllRead(){

  if(!currentUser){

    showMsg(
      "Please login first"
    );

    return;
  }


  var unread =
    notifications.filter(
      function(n){

        return !n.is_read;

      }
    );


  if(!unread.length){

    showMsg(
      "All notifications are already seen"
    );

    return;
  }


  var result =
    await supabaseClient
    .from("notifications")
    .update({
      is_read:true
    })
    .eq(
      "recipient_id",
      currentUser.id
    )
    .eq(
      "is_read",
      false
    );


  if(result.error){

    console.error(
      "Mark all read error:",
      result.error
    );

    showMsg(
      "Unable to mark notifications as seen"
    );

    return;
  }


  notifications.forEach(
    function(n){

      n.is_read = true;

    }
  );


  renderTabs();

  renderNotifications();

  updateNotificationBadge();


  showMsg(
    "All notifications marked as seen"
  );

}


/* =========================
   SHOW MESSAGE
========================= */

function showMsg(text){

  var old =
    document.querySelector(
      ".toast"
    );


  if(old){
    old.remove();
  }


  var toast =
    document.createElement(
      "div"
    );


  toast.className =
    "toast";


  toast.textContent =
    text;


  document.body.appendChild(
    toast
  );


  setTimeout(
    function(){

      if(toast){
        toast.remove();
      }

    },
    2500
  );

}


/* =========================
   UPDATE NOTIFICATION BADGE
========================= */

function updateNotificationBadge(){

  var unread =
    notifications.filter(
      function(n){

        return !n.is_read;

      }
    ).length;


  var badges =
    document.querySelectorAll(
      ".notification-badge"
    );


  badges.forEach(
    function(badge){

      if(unread > 0){

        badge.textContent =
          unread > 99
            ? "99+"
            : unread;

        badge.style.display =
          "flex";

      }else{

        badge.style.display =
          "none";

      }

    }
  );

}


/* =========================
   RENDER NOTIFICATIONS
========================= */

function renderNotifications(){

  var container =
    document.getElementById(
      "notifList"
    );


  if(!container){
    return;
  }


  var list =
    getFilteredNotifications();


  if(!list.length){

    container.innerHTML =

      '<div class="empty">' +

        '<i class="far fa-bell-slash"></i>' +

        '<p>No notifications found</p>' +

      '</div>';

    return;

  }


  /*
   * Divide into:
   * NEW
   * EARLIER
   */

  var now =
    Date.now();


  var newList = [];

  var earlierList = [];


  list.forEach(
    function(n){

      var created =
        new Date(
          n.created_at
        ).getTime();


      if(
        !isNaN(created) &&
        now - created <=
        86400000
      ){

        newList.push(n);

      }else{

        earlierList.push(n);

      }

    }
  );


  var html = "";


  /* =========================
     NEW
  ========================= */

  if(newList.length){

    html +=
      '<section class="sect">' +

        '<div class="sect-title">' +
          'New' +
        '</div>';


    newList.forEach(
      function(n){

        html +=
          createNotificationHTML(n);

      }
    );


    html +=
      '</section>';

  }


  /* =========================
     EARLIER
  ========================= */

  if(earlierList.length){

    html +=
      '<section class="sect">' +

        '<div class="sect-title">' +
          'Earlier' +
        '</div>';


    earlierList.forEach(
      function(n){

        html +=
          createNotificationHTML(n);

      }
    );


    html +=
      '</section>';

  }


  container.innerHTML =
    html;

}


/* =========================
   CREATE NOTIFICATION HTML
========================= */

function createNotificationHTML(n){

  var unread =
    !n.is_read;


  var actorName =
    getActorName(n);


  var avatar =
    getActorAvatar(n);


  var type =
    n.type || "system";


  var icon =
    getNotificationIcon(type);


  var message =
    getNotificationMessage(n);


  var isSystem =
    (
      type === "system" ||
      type === "premium" ||
      type === "broadcast"
    );


  var avatarHTML;


  if(isSystem){

    /* system/premium/broadcast share the brand gradient box */

    avatarHTML =

      '<div class="notif-type-icon notif-type-icon-lg">' +

        '<i class="fas ' +
        icon.icon +
        '"></i>' +

      '</div>';

  }else{

    avatarHTML =

      '<div class="notif-avatar">' +

        '<img ' +
          'src="' +
          escapeHTML(avatar) +
          '" ' +
          'alt="" ' +
          'onerror="this.src=\'' +
          defaultAvatar() +
          '\'"' +
        '>' +

        '<span class="notif-type-icon ' +
          escapeHTML(type) +
          '" ' +
          'style="background:' +
          icon.color +
          ';">' +

          '<i class="fas ' +
          icon.icon +
          '"></i>' +

        '</span>' +

      '</div>';

  }


  var followHTML = "";


  /*
   * FOLLOW BACK
   */

  if(
    type === "follow" &&
    n.actor_id &&
    String(n.actor_id) !==
    String(currentUser ? currentUser.id : "")
  ){

    var alreadyFollowing =
      followingIds.has(
        n.actor_id
      );


    followHTML =

      '<button ' +

        'class="follow-btn ' +
        (
          alreadyFollowing
            ? "done"
            : ""
        ) +
        '" ' +

        'id="followBack-' +
        escapeHTML(n.id) +
        '" ' +

        'onclick="' +
        'event.stopPropagation();' +
        'followBack(\'' +
        escapeHTML(n.id) +
        '\',\'' +
        escapeHTML(n.actor_id) +
        '\')"' +

      '>' +

        (
          alreadyFollowing
            ? "Following"
            : "Follow Back"
        ) +

      '</button>';

  }


  /*
   * SYSTEM / BROADCAST NOTIFICATION
   */

  var titleHTML =
    n.title
    ? '<span class="notif-title">' +
      escapeHTML(n.title) +
      '</span>'
    : "";


  var textHTML;


  if(isSystem){

    textHTML =

      '<div class="notif-text">' +

        titleHTML +

        message +

      '</div>';

  }else{

    textHTML =

      '<div class="notif-text">' +

        titleHTML +

        '<strong>' +
          escapeHTML(actorName) +
        '</strong> ' +

        message +

      '</div>';

  }


  return `

    <div
      class="notif ${unread ? "unread" : ""}"
      onclick="openNotification('${escapeHTML(n.id)}')"
    >

      ${avatarHTML}


      <div class="notif-body">

        ${textHTML}


        <div class="notif-time">

          ${escapeHTML(
            timeAgo(n.created_at)
          )}

        </div>


        ${followHTML}

      </div>


      ${
        unread

        ? `
          <div
            class="notif-dot"
            title="Unread"
          ></div>
        `

        : ""
      }

    </div>

  `;

}


/* =========================
   OPEN NOTIFICATION
========================= */

async function openNotification(id){

  var n =
    notifications.find(
      function(item){

        return String(item.id) ===
               String(id);

      }
    );


  if(!n){
    return;
  }


  /*
   * MARK AS READ
   */

  if(!n.is_read){

    var success =
      await markNotificationRead(
        n.id
      );


    if(success){

      n.is_read = true;

    }

  }


  renderTabs();

  updateNotificationBadge();


  /*
   * FOLLOW
   * → PROFILE
   */

  if(
    n.type === "follow" &&
    n.actor_id
  ){

    window.location.href =
      "profile.html?id=" +
      encodeURIComponent(
        n.actor_id
      );

    return;

  }


  /*
   * LIKE / COMMENT / REPOST
   * → POST
   */

  if(
    (
      n.type === "like" ||
      n.type === "comment" ||
      n.type === "comment_reply" ||
      n.type === "repost"
    ) &&
    n.post_id
  ){

    window.location.href =
      "home.html?post=" +
      encodeURIComponent(
        n.post_id
      );

    return;

  }


  /*
   * STORY LIKE / STORY REPLY
   * → STORY VIEWER
   */

  if(
    (
      n.type === "story_like" ||
      n.type === "story_reply"
    ) &&
    n.story_id
  ){

    window.location.href =
      "story.html?story=" +
      encodeURIComponent(
        n.story_id
      );

    return;

  }


  /*
   * POST NOTIFICATION
   */

  if(
    n.type === "post" &&
    n.post_id
  ){

    window.location.href =
      "home.html?post=" +
      encodeURIComponent(
        n.post_id
      );

    return;

  }


  renderNotifications();

}


/* =========================
   FOLLOW BACK
========================= */

async function followBack(
  notificationId,
  userId
){

  if(!currentUser){

    showMsg(
      "Please login first"
    );

    return;

  }


  if(!userId){

    showMsg(
      "User not found"
    );

    return;

  }


  if(
    String(currentUser.id) ===
    String(userId)
  ){

    return;

  }


  var button =
    document.getElementById(
      "followBack-" +
      notificationId
    );


  if(button){

    button.disabled =
      true;

    button.textContent =
      "Following...";

  }


  /*
   * FIRST CHECK
   * whether already following
   */

  var check =
    await supabaseClient
    .from("followers")
    .select("id")
    .eq(
      "follower_id",
      currentUser.id
    )
    .eq(
      "following_id",
      userId
    )
    .limit(1);


  if(check.error){

    console.error(
      "Follow check error:",
      check.error
    );

    if(button){

      button.disabled =
        false;

      button.textContent =
        "Follow Back";

    }

    showMsg(
      "Unable to check follow status"
    );

    return;

  }


  if(
    check.data &&
    check.data.length > 0
  ){

    followingIds.add(
      userId
    );


    if(button){

      button.disabled =
        true;

      button.textContent =
        "Following";

      button.classList.add(
        "done"
      );

    }


    showMsg(
      "Already following"
    );

    return;

  }


  /*
   * INSERT FOLLOW
   */

  var result =
    await supabaseClient
    .from("followers")
    .insert({

      follower_id:
        currentUser.id,

      following_id:
        userId

    });


  if(result.error){

    console.error(
      "Follow back error:",
      result.error
    );


    if(button){

      button.disabled =
        false;

      button.textContent =
        "Follow Back";

    }


    showMsg(
      "Unable to follow user"
    );

    return;

  }


  /*
   * UPDATE LOCAL STATE
   */

  followingIds.add(
    userId
  );


  if(button){

    button.disabled =
      true;

    button.textContent =
      "Following";

    button.classList.add(
      "done"
    );

  }


  var notification =
    notifications.find(
      function(n){

        return String(n.id) ===
               String(notificationId);

      }
    );


  var name =
    notification
      ? getActorName(notification)
      : "user";


  showMsg(
    "Following " +
    name
  );

}

========================================== */


/* =========================
   LOAD NOTIFICATIONS
========================= */

async function loadNotifications(){

  if(!currentUser){

    console.log(
      "No logged in user."
    );

    return;

  }


  /*
   * Get notifications belonging
   * to the currently logged-in user only.
   */

  var result =
    await supabaseClient
    .from("notifications")
    .select(`
      id,
      recipient_id,
      actor_id,
      type,
      title,
      post_id,
      story_id,
      comment_id,
      message,
      is_read,
      created_at
    `)
    .eq(
      "recipient_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(100);


  if(result.error){

    console.error(
      "Notifications loading error:",
      result.error
    );

    throw result.error;

  }


  notifications =
    result.data || [];


  /*
   * Get actor IDs
   */

  var actorIds =
    notifications

      .map(function(n){

        return n.actor_id;

      })

      .filter(Boolean);


  /*
   * Remove duplicate IDs
   */

  actorIds =
    [...new Set(actorIds)];


  /*
   * Load actor profiles
   */

  if(actorIds.length){

    var profileResult =
      await supabaseClient
      .from("profiles")
      .select(`
        id,
        full_name,
        username,
        avatar_url,
        verified
      `)
      .in(
        "id",
        actorIds
      );


    if(profileResult.error){

      console.error(
        "Actor profile loading error:",
        profileResult.error
      );

    }else{

      var profiles =
        profileResult.data || [];


      /*
       * Attach actor profile
       * to each notification.
       */

      notifications =
        notifications.map(
          function(n){

            var actor =
              profiles.find(
                function(profile){

                  return String(
                    profile.id
                  ) === String(
                    n.actor_id
                  );

                }
              );


            n.actor =
              actor || null;


            /*
             * Compatibility fields
             */

            if(actor){

              n.actor_name =
                actor.full_name ||
                actor.username ||
                "StudentX User";


              n.actor_avatar =
                actor.avatar_url ||
                defaultAvatar();

            }


            return n;

          }
        );

    }

  }


  /*
   * Render immediately
   */

  renderTabs();

  renderNotifications();

  updateNotificationBadge();

}


/* =========================
   REALTIME SUBSCRIPTION
========================= */

function subscribeToNotifications(){

  if(!currentUser){

    return;

  }


  /*
   * Remove old channel if
   * initialization happened again.
   */

  if(notificationChannel){

    try{

      supabaseClient.removeChannel(
        notificationChannel
      );

    }catch(error){

      console.log(
        "Old channel remove error:",
        error
      );

    }

  }


  notificationChannel =
    supabaseClient

      .channel(
        "studentx-notifications-" +
        currentUser.id
      )

      .on(

        "postgres_changes",

        {
          event:"INSERT",

          schema:"public",

          table:"notifications",

          filter:
            "recipient_id=eq." +
            currentUser.id
        },

        async function(payload){

          console.log(
            "New StudentX notification:",
            payload
          );


          /*
           * Reload notifications so
           * actor name + avatar are also loaded.
           */

          try{

            await loadNotifications();

          }catch(error){

            console.error(
              "Realtime reload error:",
              error
            );

          }

        }

      )

      .subscribe(
        function(status){

          console.log(
            "Notification realtime:",
            status
          );

        }
      );

}

   REFRESH WHEN PAGE

document.addEventListener(

  async function(){

    if(
      document.visibilityState ===
      "visible"
    ){

      if(currentUser){

        try{

          await loadNotifications();

        }catch(error){

          console.error(
            "Visibility refresh error:",
            error
          );

        }

      }

    }

  }
);


/* =========================
   INITIALIZE PAGE
========================= */

async function initNotifications(){

  var container =
    document.getElementById(
      "notifList"
    );


  try{

    /*
     * Make sure Supabase client
     * exists.
     */

    if(
      typeof supabaseClient ===
      "undefined" ||
      !supabaseClient
    ){

      throw new Error(
        "Supabase client is not available. Check supabase.js"
      );

    }


    /*
     * Get logged-in user.
     */

    var authResult =
      await supabaseClient
      .auth
      .getUser();


    if(authResult.error){

      throw authResult.error;

    }


    currentUser =
      authResult.data.user || null;


    /*
     * No logged-in user
     */

    if(!currentUser){

      if(container){

        container.innerHTML =

          '<div class="empty">' +

            '<i class="fas fa-lock"></i>' +

            '<p>Please login to see your notifications.</p>' +

          '</div>';

      }


      setTimeout(
        function(){

          window.location.href =
            "login.html";

        },
        1200
      );

      return;

    }


    /*
     * Load following status
     */

    await loadFollowing();


    /*
     * Load notifications
     */

    await loadNotifications();


    /*
     * Start realtime
     */

    subscribeToNotifications();


  }catch(error){

    console.error(
      "StudentX notifications error:",
      error
    );


    if(container){

      container.innerHTML =

        '<div class="empty">' +

          '<i class="fas fa-triangle-exclamation"></i>' +

          '<p>Unable to load notifications.</p>' +

          '<div style="' +
            'font-size:10px;' +
            'margin-top:8px;' +
            'color:var(--muted);' +
          '">' +

            escapeHTML(
              error.message ||
              "Unknown error"
            ) +

          '</div>' +

        '</div>';

    }

  }

}


/* =========================
   START
========================= */

initNotifications();
